l_simp_chinese:
 concept_albanian_piracy: "阿尔巴尼亚海盗"
 concept_albanian_piracy_desc: "自罗马时代以来，海盗就经常出没于亚得里亚海沿岸。自从奥斯曼人到来后，几支海盗团伙在阿尔巴尼亚水域扎根。只要他们不被肃清，该地区就会遭遇#bold 海盗事件#!。"
 concept_bedouin_tribes: "贝都因部落"
 concept_bedouin_tribes_desc: "#bold [GetCulture('bedouin').GetName]部落#!以游牧群体的形式散布在[GetStateRegion('STATE_LIBYAN_DESERT').GetName]和[GetStateRegion('STATE_EGYPTIAN_DESERT').GetName]。他们通常对$gbbf_great_powers$的博弈漠不关心，一旦被强加直接统治，他们往往会做出负面甚至暴力的反应。"
 concept_beylik: "贝伊国"
 concept_beylik_desc: "#bold 贝伊国#!是指由贝伊统治的公国或小王国。随着拜占庭帝国和罗姆苏丹国的衰落，贝伊国在被奥斯曼帝国吞并之前曾主导安纳托利亚。尽管如此，#italic 贝伊#!的头衔依然存在，且经常被用来宣示对君士坦丁堡的独立。"
 concept_concert_of_europe: "欧洲协调"
 concept_concert_of_europe_desc: "欧洲协调是一种非正式的政治结构和权力平衡，它赋予每个国家一个[concept_rank]，为每个[concept_great_power]提供势力范围，并在避免重蹈引发$FRA_ADJ$大革命战争和拿破仑战争覆辙的方面迈出了重要一步。"
 concept_eastern_question: "东方问题"
 concept_eastern_question_desc: "东方问题是由奥斯曼帝国衰落引起的不稳定政治局势。随着帝国从内部缓慢崩溃，$gbbf_great_powers$努力寻找战略和政治上的解决方案，以在不破坏[concept_concert_of_europe]的情况下扩大其影响力。"
 concept_eyalet: "行省"
 concept_eyalet_desc: "#bold 行省#!，也称为#italic 贝勒贝伊辖区#!或#italic 帕夏辖区#!，是奥斯曼帝国的主要行政区划。行省制度起源于君士坦丁堡陷落后的数年，它兼具税收和军事管理职能，每个行省都由一位贝伊领导。虽然这种制度有利于帝国的去中心化治理，但同时也常常成为中央集权的绊脚石。"
 concept_kurdish_tribe: "库尔德部落"
 concept_kurdish_tribe_desc: "一个$concept_kurdish_tribe$（[concept_subject]）是一个享有高度自治的[concept_subject_type]，能够自行发起$gbbf_diplomatic_plays$。"
 concept_nile_floods: "尼罗河泛滥"
 concept_nile_floods_desc: "#bold 尼罗河泛滥#!是季风降雨在[GetGeographicRegion('geographic_region_lower_nile').GetName]沿线引发的自然泛滥周期。每隔数年，尼罗河就会经历一次[GetHarvestConditionType('flood').GetName]这一[concept_harvest_condition]。这一现象可通过修筑[GetBuildingType('gbbf_building_nile_barrage').GetName]$gbbf_buildings$来抵消。\n\n这些洪水将根据不同的阶段，施加以下#tooltippable;tooltip:[GetRawTextTooltipTag(GetStaticModifier('modifier_mgrbfm_widespread_nile_floods').GetDesc)] [GetStaticModifier('modifier_mgrbfm_widespread_nile_floods').GetName][concept_modifier]#!：\n•#bold #blue 轻微（1-2）#!#!\n•#bold #green 温和（3-4）#!#!\n•#bold #yellow 严重（5-6）#!#!\n•#bold #orange 极重（7-8）#!#!\n•#bold #red 灾难（9-10）#!#!"