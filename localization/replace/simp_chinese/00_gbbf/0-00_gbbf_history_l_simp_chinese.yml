l_simp_chinese:
 gbbf_bio_macedon_alexandros: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_macedon_alexandros_desc')] $Alexander$大帝#!#!"
 gbbf_bio_macedon_alexandros_desc: "#bold $Alexander$大帝#!$gbbf_linebreak_normal$生于约#v 公元前356年7月#!于马其顿佩拉\n卒于约#v 公元前323年6月#!于马其顿帝国巴比伦\n\n"
 gbbf_bio_aristotles: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_aristotles_desc')] $Aristotle$#!#!"
 gbbf_bio_aristotles_desc: "#bold $Aristotle$#!$gbbf_linebreak_normal$生于约#v 公元前384年#!于斯塔吉拉，哈尔基季基\n卒于约#v 公元前322年#!于优卑亚岛，卡尔基斯\n\n$Aristotle$是一位古希腊哲学家。"
 gbbf_bio_belisarius: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_kapodistrias_ioannis_desc')] $Belisarius$#!#!"
 gbbf_bio_belisarius_desc: "#bold $Belisarius$#!$gbbf_linebreak_normal$生于约#v 公元500年#!于莫西亚，日耳曼尼亚\n卒于约#v 公元565年3月#!于比提尼亚，迦克墩\n\n$Belisarius$是东罗马帝国的军事指挥官，曾效力于查士丁尼一世麾下。尽管早期职业生涯屡遭败绩，但他逐渐建立起纪律严明指挥官的名声，即便面对数倍于己的敌军亦能确保胜利。在收复罗马后，$Belisarius$于559年被召回，击退了匈人的入侵。\n\n他与皇帝查士丁尼一世的合作开启了东罗马帝国在东方的主导时代。"
 gbbf_bio_kapodistrias_ioannis: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_kapodistrias_ioannis_desc')] $Ioannis$·$Kapodistrias$#!#!"
 gbbf_bio_kapodistrias_ioannis_desc: "#bold $Ioannis$·$Kapodistrias$#!$gbbf_linebreak_normal$生于#v 1776年2月10日#!于爱奥尼亚群岛科孚\n卒于#v 1831年9月21日#! 于希腊纳夫普利翁\n\n$Ioannis$·$Kapodistrias$是独立希腊国家的首任元首。他的职业生涯漫长，从七岛共和国的大臣职位到成为俄罗斯帝国的外交部长，$Kapodistrias$是19世纪早期最杰出的外交官之一。他的统治因对部落首领和既得利益精英阶层的公开蔑视而著称，他试图以此统一这个年轻的国家。\n\n他在1831年的遇刺标志着长达六个月的混乱政治时期的开始，直至$Otto$·$von_Wittelsbach$被任命为止。"
 gbbf_bio_pericles: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_pericles_desc')] $Pericles$#!#!"
 gbbf_bio_pericles_desc: "#bold $Pericles$#!$gbbf_linebreak_normal$生于约#v 公元前495年#!于古希腊雅典\n卒于约#v 公元前429年#!于古希腊雅典\n\n$Pericles$，绰号“雅典第一公民”，是古希腊雅典的政治家和将军，在波斯战争后领导雅典转型为帝国强权。\n\n他的雄心壮志和演说技巧被视为开启了被称为“伯里克利时代”的雅典霸权时期。"
 gbbf_bio_theodosius_ii: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_theodosius_ii_desc')] $Theodosius$二世#!#!"
 gbbf_bio_theodosius_ii_desc: "#bold $Theodosius$二世#!$gbbf_linebreak_normal$\n生于#v 401 年4月10日#!于君士坦丁堡\n卒于#v 450 年7月28日#!于君士坦丁堡\n\n作为皇帝阿卡狄乌斯唯一的儿子，$Theodosius$被其父宣布为“共治皇帝”并培养统治东罗马。他的统治以修建狄奥多西城墙和首次尝试整理所有已知的罗马法律编纂成《狄奥多西法典》为标志。\n\n他最具影响力的行动之一是召开了以弗所第一次大公会议，会上修士聂斯脱里及其“基督一性论”主张被谴责为异端。"
 gbbf_bio_selim_iii: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_selim_iii_desc')] 塞利姆三世#!#!"
 gbbf_bio_selim_iii_desc: "#bold 塞利姆三世·奥斯曼奥卢#!$gbbf_linebreak_normal$生于#v 1761年12月24日#! 于君士坦丁堡\n卒于#v 1808年7月28日#! 于君士坦丁堡\n\n塞利姆三世在其具有改革思想的父亲穆斯塔法三世苏丹去世后继位。他最显著的举措是组建现代化的军事单位“新秩序军”。这一举动招致了耶尼切里的愤怒，他们废黜了他，改立其叔父。\n\n他在囚禁期间被刺客杀害，但他的改革尝试预示了后来的坦齐马特时代。"
 gbbf_bio_simeon_veliki: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_simeon_veliki_desc')] $Simeon$一世#!#!"
 gbbf_bio_simeon_veliki_desc: "#bold $Simeon$一世#!$gbbf_linebreak_normal$生于约#v 864年#!于保加利亚\n卒于#v 927年5月27日#!于保加利亚帝国普雷斯拉夫\n\n"
 gbbf_bio_temp: "@gbbf_character!#o #tooltip:[GetRawTextTooltipTag('gbbf_bio_temp_desc')] ‑#!#!"
 gbbf_bio_temp_desc: "#bold ‑#!$gbbf_linebreak_normal$生于#v ‑#!于‑\n卒于#v ‑#!于‑\n\n"