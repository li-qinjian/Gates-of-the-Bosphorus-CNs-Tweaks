l_simp_chinese:
 dlc_grefm: "博斯普鲁斯之门"
 dlc_grefm_desc: "步入奥斯曼帝国政治、军事及地区影响力衰落时期的巴尔干与东地中海局势。指引蹒跚学步的巴尔干各国在挣扎中步入工业化世界，或是掌管摇摇欲坠的奥斯曼帝国及其附庸，在民族主义与殖民主义的汹涌浪潮中寻求生存之道。$gbbf_linebreak_normal$#bold 博斯普鲁斯之门#!包含以下内容：\n•$grefm$\n•$balkfm$\n•$turkfm$\n•$mgrbfm$\n•$haykfm$\n•$eqfm$$gbbf_linebreak_normal$#bold 博斯普鲁斯之门#!依赖以下模组：\n•$gbbf_cmf$\n•$gbbf_csf$\n\n$gbbf_integrates_ip3$\n$gbbf_integrates_atr$\n$gbbf_compatibility_mgr$"
 gbbf_delimiter_small: "@divider_start!@divider_mid!@divider_end!"
 gbbf_delimiter_normal: "@divider_start!@divider_mid!@divider_mid!@divider_mid!@divider_end!"
 gbbf_delimiter_large: "@divider_start!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_end!"
 je_group_gbbf_hidden: "超级秘制酸奶黄瓜酱"
 je_group_gbbf_greek_monarchism: "希腊君主制"
 je_group_gbbf_sick_man: "欧洲病夫"
 je_group_gbbf_tanzimat: "坦齐马特"
 gbbf_linebreak_small: "\n$gbbf_delimiter_small$\n"
 gbbf_linebreak_normal: "\n$gbbf_delimiter_normal$\n"
 gbbf_linebreak_large: "\n$gbbf_delimiter_large$\n"
