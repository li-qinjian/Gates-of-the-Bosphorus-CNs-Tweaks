l_simp_chinese:
 je_grefm_intro: "欢迎来到希腊、拜占庭与巴尔干风味模组！"
 je_grefm_intro_reason: "该日志条目将自行关闭，任其自行处理即可。"
 objective_grefm: "@gbbf_gotb_icon!希腊人之国"
 objective_grefm_desc: "希腊独立给奥斯曼帝国统治下的其余地区希腊人民带来冲击，各地希腊人运动此起彼伏，是引导希腊人登上世界舞台，再现昔日#greece 希腊帝国#!荣光？还是领导受奥斯曼帝国控制的罗马人，战胜列强，#purple 光复罗马帝国？#!"
 objective_grefm_idle_header: "#filler [objective_grefm_idle_header]"
 objective_grefm_idle_hint: "#filler [objective_grefm_idle_hint]"
 objective_grefm_name_GRE: "#v $GRE$#!"
 objective_grefm_desc_GRE: "#lore #bold 君士坦丁堡沦陷#!结束了希腊对近东地区3000多年的统治。如今的希腊刚刚独立，但落后且不稳定，经历奥斯曼帝国几个世纪剥削使希腊政府效率低下，人口以农民为主。\n\n是走专制道路，亦或是要倾听人民对自由的呼声？#!"
 objective_grefm_name_ION: "#v $ION$#!"
 objective_grefm_desc_ION: "#lore #bold 《巴黎条约》#!规定伊奥尼亚群岛为$GBR_ADJ$的保护领地。在殖民政府的影响下，英国人试图将群岛发展成为一个模范“殖民地”。尽管如此，岛上的希腊人仍渴望与大陆上的希腊表亲团聚。\n\n这些岛屿会与希腊国家实现#italic 统一#!吗？还是七岛会寻求自己的未来？#!"
 objective_grefm_name_GRE_SAM: "#v $GRE_SAM$#!"
 objective_grefm_desc_GRE_SAM: "#lore 尽管萨摩斯岛对奥斯曼帝国和埃及都进行了激烈的抵抗，但在希腊国家成立后，萨摩斯岛还是独自反抗奥斯曼帝国。不过在列强的压迫下，岛民还是迫接受奥斯曼帝国的宗主权，与希腊国分离，但#italic 联合意识#!早已根植人们心中。\n\n你会带领萨摩斯岛与希腊结盟吗？还是单独会继续反抗奥斯曼帝国？#!$gbbf_difficulty_warning$"
 objective_grefm_name_GBBF_CAP: "#v $GBBF_CAP$#!"
 objective_grefm_desc_GBBF_CAP: "#lore 在安纳托利亚腹地深处，随着软弱与偏执横行于奥斯曼帝国，卡帕多基亚的希腊人正面临日益加剧的压迫。卡帕多基亚会迎来更光明的未来吗？"
 objective_grefm_name_GBBF_THE: "#v $GBBF_THE$#!"
 objective_grefm_desc_GBBF_THE: "#lore 狄奥多罗！罗马帝国的最后堡垒！但在$RUS_ADJ$的统治下，人们早已忘却曾经的辉煌。狄奥多罗会引导乌鲁姆人决定自己的未来吗？#!$gbbf_difficulty_warning$"
 objective_grefm_name_GBBF_TRB: "#v $GBBF_TRB$#!"
 objective_grefm_desc_GBBF_TRB: "#lore 数千年来，本都一直是希腊人的家园。随着奥斯曼帝国对其臣民的控制日渐艰难，罗迈奥斯人开始质疑自己作为高门臣民的地位。特拉比松会引领本都希腊人走向自由吗？"
 objective_turkfm: "@gbbf_gotb_icon!欧洲病夫"
 objective_turkfm_desc: "奥斯曼帝国正在衰落。数十年的官僚主义和经济停滞，加上席卷巴尔干半岛的[GetTechnology('nationalism').GetName]浪潮使得帝国陷入瘫痪。掌控#red 奥斯曼崇高国#!击退看似势不可挡的西方帝国主义浪潮！"
 objective_turkfm_idle_header: "#filler [objective_turkfm_idle_header]"
 objective_turkfm_idle_hint: "#filler [objective_turkfm_idle_hint]"
 objective_turkfm_name_TUR: "#v $dyn_c_ottoman_empire$#!"
 objective_turkfm_desc_TUR: "#lore 奥斯曼帝国正饱受内外交困的煎熬，衰败的国家机器使帝国无力应对分裂主义和西方列强的威胁。帝国究竟会遵循奥斯曼主义信条进行自我改革，还是会被狂热的民族主义所吞没？#!"
 objective_turkfm_name_EGY: "#v $EGY$#!"
 objective_turkfm_desc_EGY: "#lore 受到穆罕默德·阿里的雄心所激励，埃及赫迪夫领宣称从奥斯曼帝国获得了更大的自治权。这种自由尚未得到君士坦丁堡的承认，两者再次爆发冲突只是时间问题。埃及是否能够摆脱外国统治，走上独立自主的道路？#!"
 objective_turkfm_name_TRI: "#v $TRI$#!"
 objective_turkfm_desc_TRI: "#lore 的黎波里地处奥斯曼帝国版图的边缘。尽管帝国重新确立了权威，但该国腹地仍处于无政府状态。与此同时，塞努西运动呼吁对苏丹统治进行有组织的抵抗。利比亚会宣称自己的地位吗？#!"
 objective_turkfm_name_TUN: "#v $TUN$#!"
 objective_turkfm_desc_TUN: "#lore 突尼斯贝伊国与君士坦丁堡远隔重洋大漠，历来只在名义上服从苏丹。随着君士坦丁堡的影响力日渐衰微，突尼斯逐渐受到$FRA_ADJ$向北非扩张的威胁。贝伊能否击退列强入侵，重现突尼斯昔日的繁荣？#!"
 objective_turkfm_name_KUR_SOR: "#v $KUR_SOR$#!"
 objective_turkfm_desc_KUR_SOR: "#lore 穆罕默德·阿里帕夏宣称其要将库尔德斯坦的土地统一于他的统治之下。然而，这一计划与君士坦丁堡苏丹的目标正面冲突，后者试图最终征服库尔德边疆。索兰能否在坦齐马特的浪潮中幸存？#!$gbbf_difficulty_warning$"
 objective_balkfm: "@gbbf_gotb_icon!民族觉醒"
 objective_balkfm_desc: "觉醒吧！反抗吧！巴尔干半岛上每个国家都寻求摆脱奥斯曼帝国的束缚，建立自己的民族认同。在奥地利边境，民族主义滋生了分离主义；而在奥斯曼帝国内部，昔日的“#bold 保加利亚#!”、“#bold 波斯尼亚#!”和“#bold 阿尔巴尼亚#!”仍为帝国行省，惨遭剥削。"
 objective_balkfm_idle_header: "#filler [objective_balkfm_idle_header]"
 objective_balkfm_idle_hint: "#filler [objective_balkfm_idle_hint]"
 objective_balkfm_name_MON: "#v $MON$#!"
 objective_balkfm_desc_MON: "#lore 黑山作为欧洲封建时代的残留，这个小国是采邑主教制度，缺乏中央集权，其崎岖的地形是抵御奥斯曼帝国入侵的天然工事。由于边界划分不清，与邻国冲突不断，黑山将摆脱陈旧的根基，还是注定停滞不前？#!\n\n#red 警告：这是一个难度很高的国家。#!"
 objective_balkfm_name_SER: "#v $SER$#!"
 objective_balkfm_desc_SER: "#lore 在战争英雄米洛什·奥布雷诺维奇的领导下，塞尔维亚打破了数百年的和平臣服，凭借两次起义成功建立了一个独立于奥斯曼帝国的新政权。随着民族主义席卷整个欧洲，许多塞尔维亚人期待着有一天能够打破束缚他们与苏丹的枷锁，统一塞尔维亚人民。塞尔维亚会找到独立之路吗？还是塞尔维亚人民将继续分裂于两个大帝国之间？#!"
 objective_balkfm_name_MOL: "#v $MOL$#!"
 objective_balkfm_desc_MOL: "#lore 摩尔多瓦公国地处德涅斯特河与喀尔巴阡山脉之间，远离苏丹的势力范围。这个由奥斯曼帝国所认可大公统治的小公国，只是罗马尼亚民族共同体中的微小碎片，且经常受到北方强邻$RUS_ADJ$的影响。摩尔多瓦能够团结罗马尼亚人民吗，还是会在多瑙河的斗争中迷失方向？#!"
 objective_balkfm_name_WAL: "#v $WAL$#!"
 objective_balkfm_desc_WAL: "#lore 作为罗马尼亚两公国之一，瓦拉几亚长期相对游离于奥斯曼宫廷的掌控之外。深受欧洲思潮影响的瓦拉几亚罗马尼亚人，始终视自己为更广大的罗马尼亚民族的一部分。他们是会推翻奥斯曼指派的大公、实现罗马尼亚的统一，还是将在哈布斯堡与奥斯曼的冲突中遭到践踏？#!"
 objective_balkfm_name_GBBF_SIL: "#v $GBBF_SIL$#!"
 objective_balkfm_desc_GBBF_SIL: "#lore 作为曾经挑战过拜占庭帝国的伟大帝国之一，保加利亚民族在奥斯曼帝国几个世纪的统治下被征服和粉碎。然而，随着复兴思想家的到来，保加利亚人民再次开始寻求独立于帝国之外的共同生存。保加利亚人民会崛起重拾他们的民族认同吗？\n\n#greece 你将作为锡利斯特拉省开局，这是未来保加利亚国家的核心。#!"
 objective_balkfm_name_GBBF_ALB: "#v $GBBF_ALB$#!"
 objective_balkfm_desc_GBBF_ALB: "#lore 阿尔巴尼亚人自前罗马时代起就将亚得里亚海东海岸称为家园。然而，苏丹几个世纪以来不断增加的压力逐渐侵蚀了阿尔巴尼亚文化，他们发现自己遭受着日益严重的伊斯兰化。阿尔巴尼亚人能坚持自己的身份并确保独立于苏丹的未来吗？\n\n#greece 你将作为雅尼亚桑贾克开局，这是未来阿尔巴尼亚国家的核心。#!"
 objective_balkfm_name_BOS: "#v $BOS_HER$#!"
 objective_balkfm_desc_BOS: "#lore 长期在基督教和穆斯林社区间分裂的波斯尼亚和黑塞哥维那土地组成巴尔干大熔炉。随着高门权威似乎日益遥远，知识分子们试图复兴波斯尼亚，波斯尼亚人民能否确立民族认同，甚至超越分裂的宗教？"
 gbbf_difficulty_warning: "\n\n#red 警告：这是一个难度很高的国家。#!"
 objective_balkfm_name_TRS: "#v $TRS$#!"
 objective_balkfm_desc_TRS: "#lore 被喀尔巴阡山脉环绕的特兰西瓦尼亚罗马尼亚人在匈牙利的统治下苦苦挣扎。尽管过去的努力失败了，但由于人民在农奴制下饱受煎熬，改革的动力依然强劲。特兰西瓦尼亚能摆脱奴役吗？#!"
 objective_turkfm_name_FZN: "#v $FZN$#!"
 objective_turkfm_desc_FZN: "#lore 几个世纪以来，费赞一直是横跨撒哈拉贸易的枢纽，部落首领长期以来一直从其土地上的贸易中榨取财富。随着坦齐马特的临近，这个时代可能即将结束。费赞的部落能击退欧洲人和苏丹吗？#!$gbbf_difficulty_warning$"
 objective_turkfm_name_GBBF_ERZ: "#v $ARM$#!"
 objective_turkfm_desc_GBBF_ERZ: "#lore 自前罗马时代以来，亚美尼亚高原一直是亚美尼亚民族的家园。夹在土耳其和俄罗斯的领土野心之间，一些亚美尼亚人已经开始谈论建立自己的国家——一个不受外国帝国图谋影响的国家。亚美尼亚人民会掌控自己的命运吗？#!\n\n#greece 你将作为$ARM_ERZ$开局，这是亚美尼亚文化的中心之一。#!"
 objective_turkfm_name_ASS: "#v $ASS$#!"
 objective_turkfm_desc_ASS: "#lore ——#!"