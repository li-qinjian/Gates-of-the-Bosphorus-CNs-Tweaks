 grefm_literary_tradition: "@gbbf_literary_tradition!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_literary_tradition_desc 文学传统#!#!"
 grefm_literary_tradition_desc: "#bold 文学传统#!代表了一个国家的文学成就与底蕴。\n有多种方式可以获得#bold 文学传统#!。拥有至少一座$building_art_academy$、拥有一名或多名#bold 当地作家#!、一名#bold 民族作家#!以及拥有特定的#bold 艺术中心#!，都将为您的国家被动增加#bold 文学传统#!。\n您的国家获得的#bold 文学传统#!越多，您获得的威望加成也就越高。"
 grefm_musical_tradition: "@grefm_musical_tradition!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_musical_tradition_desc 音乐传统#!#!"
 grefm_musical_tradition_desc: "#bold 音乐传统#!代表了一个国家的音乐成就与底蕴。\n有多种方式可以获得#bold 音乐传统#!。如果您拥有至少一座#bold 歌剧院#!，您将获得被动的#bold 音乐传统#!加成。您拥有的#bold 歌剧院#!越多，获得的加成越高。您还可以从音乐和艺术科技中获得更多的#bold 音乐传统#!，每项科技提供不同的加成。您也可以通过事件获得#bold 音乐传统#!，特别是在您拥有一位#bold 作曲家#!时。\n您的国家获得的#bold 音乐传统#!越多，您获得的威望加成也就越高。"
 grefm_painting_tradition: "@grefm_painting_tradition!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_painting_tradition_desc 绘画传统#!#!"
 grefm_painting_tradition_desc: "#bold 绘画传统#!代表了一个国家的绘画成就与底蕴。它可以通过拥有#bold 艺术学院#!、一名#bold [concept_klimt_painter]#!、特定的$gbbf_technologies$或通过事件来获得。"