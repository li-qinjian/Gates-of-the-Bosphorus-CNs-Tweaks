l_simp_chinese:
 ideology_gbbf_bavarocrat: "巴伐利亚专制主义者"
 ideology_gbbf_bavarocrat_desc: "#lore 该角色凭借维特尔斯巴赫王朝的宠信，力图通过专制君主制维持其对国家的影响力。#!"
 ideology_gbbf_constitutionalist: "立宪主义者"
 ideology_gbbf_constitutionalist_desc: "#lore 该角色受西方思想启发，致力于将宪政带到这个国家。#!"
 ideology_gbbf_dacianist: "达契亚主义者"
 ideology_gbbf_dacianist_desc: "#lore 该角色受达契亚运动影响，坚信罗马尼亚历史的开创性叙事，并致力于带领罗马尼亚人民步入工业时代。#!"
 ideology_gbbf_islamist_leader: "伊斯兰主义者"
 ideology_gbbf_islamist_leader_desc: "#lore 该角色认为，推广伊斯兰法学和传统是维系奥斯曼帝国团结的途经。#!"
 ideology_gbbf_junimist: "茹尼米亚主义者"
 ideology_gbbf_junimist_desc: "#lore 该角色受茹尼米亚文学团体的影响，试图遏制罗马尼亚社会为自由主义而自由主义的鲁莽冒进。#!"
 ideology_gbbf_kogalnitchanism: "科格尔尼恰努主义者"
