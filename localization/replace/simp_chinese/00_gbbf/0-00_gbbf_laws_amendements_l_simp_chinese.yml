l_simp_chinese:
 amendment_gbbf_elifba: "土耳其语字母"
 amendment_gbbf_elifba_desc: "一种专门用于土耳其语文件和通信的阿拉伯字母变体，已经使用了将近六个世纪。它虽然难以学习，但为高门的出版物增添了庄重感。"
 law_imperial_divan: "帝国迪万"
 law_imperial_divan_desc: "国家元首的权力是绝对的，不受任何世俗权力的制约。"
 law_ministerial_council: "大臣会议"
 law_ministerial_council_desc: "国家元首与一小群未经选举的实权人物分享权力和责任。"
 law_scribal_bureaucrats: "文书官僚"
 law_scribal_bureaucrats_desc: "文书阶级控制着国家行政。猖獗的裙带关系和腐败导致了一个臃肿且错综复杂的机构，无法采取有效行动。"
 amendment_gbbf_cizye_tax: "吉兹亚税"
 amendment_gbbf_cizye_tax_desc: "对非穆斯林臣民征收的一种宗教税，适用于受伊斯兰法律治理的国家。该税在《古兰经》中被提及，由非穆斯林男性支付，以换取保护、免服兵役以及自由信仰自身宗教的权利。"
 amendment_gbbf_chiftlik: "契夫里克"
 amendment_gbbf_chiftlik_desc: "奥斯曼帝国普遍使用的土地管理制度。这一制度源于向实权军官提供临时土地的恩赐，是帝国土地继承的主要方式。"
 amendment_gbbf_esir_pazari: "埃西尔集市"
 amendment_gbbf_esir_pazari_desc: "与大西洋奴隶贸易不同，奥斯曼帝国的奴隶制更倾向于将妇女卖作奴隶，从事妾侍和家政工作。许多奴隶来自帝国边缘地区的人口。"