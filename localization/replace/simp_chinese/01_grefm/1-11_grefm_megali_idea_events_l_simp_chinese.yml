l_simp_chinese:
 grefm_megali_idea.001.t: "色萨利之地"
 grefm_megali_idea.001.d: "随着希腊的独立，他们要求与奥斯曼帝国相关势力统治下的各希腊人实现统一。一些人开始呼吁在收复肥沃的[SCOPE.sState('grefm_thessaly_scope').GetName]平原，而《伦敦议定书》却不公平地剥夺了希腊人的土地。"
 grefm_megali_idea.001.f: "“森林之神、牧神的钟爱之地——坦佩；祂们在内玩耍，和古老的潘神一起，一同合唱”\n——马克·阿肯塞德，1744年，《想象的乐趣》"
 grefm_megali_idea.001.a: "我们将解放我们的希腊同胞。"
 grefm_megali_idea.002.t: "伟大理想"
 grefm_megali_idea.002.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting]的扩张导致一些最狂热的民族主义者提出了一个更雄心勃勃的计划：征服[ROOT.GetCountry.GetAdjectiveNoFormatting]，重建希腊帝国。"
 grefm_megali_idea.002.f: "“我们摆脱了奥斯曼几个世纪的统治，建立了希腊国。但这还不够。我们的许多同胞仍然生活在外国统治的压迫下，梦想着能有一个他们自己的国家。这一梦想只能通过吞并所有的希腊土地来实现，无论占领者同意与否，我们都想实现这一梦想。”"
 grefm_megali_idea.002.a: "我们对这片土地的宣称毋庸置疑。"
 grefm_megali_idea.002.b: "扩张并不是现在的首要任务。"
 grefm_megali_idea.003.t: "[ROOT.GetCountry.GetName]的未来"
 grefm_megali_idea.003.d: "随着收复博斯普鲁斯海峡和达达尼尔海峡两岸的土地，伟大理想已经实现。我们的公民现在期待国家带领他们进入新的时代。"
 grefm_megali_idea.003.f: "“随着岁月和时间的流逝， 它们将再次成为我们。”\n——希腊民族主义诗歌\n"
 grefm_megali_idea.003.a: "我们的军队将再次重振[GetCulture('greek').GetName]荣光！"
 grefm_megali_idea.003.b: "帝国已死。我们将开辟一条新路！"
 grefm_megali_idea.004.t: "希腊人的帝国"
 grefm_megali_idea.004.d: "希腊的扩张导致一些最狂热的民族主义者提出了一个更雄心勃勃的计划：征服[GetStrategicRegion('region_balkans').GetName]和[GetGeographicRegion('region_anatolia_old').GetName]，重建$grefm_greek_empire$。"
 grefm_megali_idea.004.f: "“昨天看起来还是个荒谬的白日梦，今天就已经指日可待了。紫凤凰将会重生！”"
 grefm_megali_idea.004.a: "$grefm_greek_empire$将会重建。"
 grefm_megali_idea.004.b: "我们不应该推进这项雄心勃勃的议程。"
 grefm_megali_idea.005.t: "失去的希腊领土"
 grefm_megali_idea.005.d: "$grefm_megali_idea$的激进追求如今已难以为继。"
 grefm_megali_idea.005.f: "会议室内气氛紧张。政客与顾问们就继续追求伟大理想的可行性激烈争论。众人纷纷要求追责，找出是谁误用了[ROOT.GetCountry.GetAdjectiveNoFormatting]资源，投入这场终以失败告终的领土收复计划。"
 grefm_megali_idea.005.a: "我们的失败是个耻辱。"
 grefm_megali_idea.010.t: "[GetCulture('rhomaios').GetName]之地"
 grefm_megali_idea.010.d: "希腊国家的独立引发了一股支持与奥斯曼帝国治下的希腊各人口统一的浪潮。他们开始收回我们同胞为中心的土地。"
 grefm_megali_idea.010.f: "“语言是我们永远无法移居的故乡”——伊琳娜·格里维娜"
 grefm_megali_idea.010.a: "这片土地是我们的家园。"
 grefm_megali_idea.011.t: "罗马尼亚的遗产"
 grefm_megali_idea.011.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting]的扩张导致一些最狂热的民族主义者提出了一个更雄心勃勃的计划：征服[ROOT.GetCountry.GetAdjectiveNoFormatting]，重建希腊帝国。"
 grefm_megali_idea.011.f: "“我们摆脱了奥斯曼几个世纪的统治，建立了希腊国。但这还不够。我们的许多同胞仍然生活在外国统治的压迫下，梦想着能有一个他们自己的国家。这一梦想只能通过吞并所有的希腊土地来实现，无论占领者同意与否，我们都想实现这一梦想。”"
 grefm_megali_idea.011.a: "我们对这片土地的宣称毋庸置疑。"
 grefm_megali_idea.011.b: "扩张并不是现在的首要任务。"
 grefm_megali_idea.012.t: "东方宝座"
 grefm_megali_idea.012.d: "随着收复博斯普鲁斯海峡和达达尼尔海峡两岸的土地，伟大理想已经实现。我们的公民现在期待国家带领他们进入新的时代。"
 grefm_megali_idea.012.f: "“随着岁月和时间的流逝， 它们将再次成为我们。”\n——希腊民族主义诗歌\n"
 grefm_megali_idea.012.a: "我们的军队将再次举起[GetCulture('rhomaios').GetName]帝国的旗帜！"
 grefm_megali_idea.012.b: "帝国已死。我们将开辟一条新路！"
 grefm_megali_idea.020.t: "最后的罗马人"
 grefm_megali_idea.020.d: "四个世纪前，[ROOT.GetCountry.GetName]是罗马帝国权威最后的堡垒，抵挡着崛起的奥斯曼帝国。自那时起，[ROOT.GetCountry.GetCapital.GetName]便成为了逃离安纳托利亚压迫的希腊人的避难所。随着希腊国家的独立，知识分子们呼吁实现希腊人的的重新统一，或称“合一”（enosis）。"
 grefm_megali_idea.020.f: "“语言是我们永远无法移居的故乡”——伊琳娜·格里维娜"
 grefm_megali_idea.020.a: "这片土地是我们的家园。"
 grefm_megali_idea.100.t: "《[SCOPE.sState('ionian_overlord_capital').GetCityHubName]条约》"
 grefm_megali_idea.100.d: "经过谨慎的谈判，[SCOPE.sCountry('ionian_overlord').GetName]已同意将[SCOPE.sCountry('ionian_country').GetName]让与[ROOT.GetCountry.GetName]。"
 grefm_megali_idea.100.f: "“为了促进我们两国间的友好关系，以及振奋[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的精神，[SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle]大度地割让了伊奥尼亚群岛。群岛在我国的友好保护国政权治下，受益于我们真诚而公正的帮助，并且我们相信，在我们值得信赖的朋友的悉心关爱下，群岛的人民将走向繁荣。”"
 grefm_megali_idea.100.a: "最令人满意的解决方案。"
 grefm_megali_idea.101.t: "《[SCOPE.sState('epirus_capital').GetCityHubName]条约》"
 grefm_megali_idea.101.d: "在迅速的磋商后，[SCOPE.sCountry('epirus_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.101.f: "伊庇鲁斯希腊人为自由而战，反抗奥斯曼帝国，重新加入希腊大家庭是理所当然的。"
 grefm_megali_idea.101.a: "最令人满意的解决方案。"
 grefm_megali_idea.102.t: "《[SCOPE.sState('cyprus_capital').GetCityHubName]条约》"
 grefm_megali_idea.102.d: "在迅速的磋商后，[SCOPE.sCountry('cyprus_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.102.f: "塞浦路斯希腊人用自己的血汗赢得了自由。如果他们愿意，随时随地可以加入希腊大家庭。"
 grefm_megali_idea.102.a: "最令人满意的解决方案。"
 grefm_megali_idea.103.t: "《[SCOPE.sState('crete_capital').GetCityHubName]条约》"
 grefm_megali_idea.103.d: "在迅速的磋商后，[SCOPE.sCountry('crete_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.103.f: "在遭受几代人的系统性压迫后，克里特岛的希腊人终于赢得了自由。现在是他们与希腊兄弟姐妹团聚的历史性时刻。"
 grefm_megali_idea.103.a: "最令人满意的解决方案。"
 grefm_megali_idea.104.t: "《[SCOPE.sState('macedonia_capital').GetCityHubName]条约》"
 grefm_megali_idea.104.d: "在迅速的磋商后，[SCOPE.sCountry('macedonia_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.104.f: "马其顿希腊人终于赢得了自由。人们在街头欢呼雀跃，庆祝他们重归希腊大家庭。"
 grefm_megali_idea.104.a: "最令人满意的解决方案。"
 grefm_megali_idea.106.t: "《[SCOPE.sState('samos_capital').GetCityHubName]条约》"
 grefm_megali_idea.106.d: "在迅速的磋商后，[SCOPE.sCountry('samos_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.106.f: "几个世纪以来，这座岛屿坚定地抵抗着土耳其和欧洲的入侵。终于，他们将与同胞们团结在一起。"
 grefm_megali_idea.106.a: "最令人满意的解决方案。"
 grefm_megali_idea.110.t: "《[SCOPE.sState('trabzon_capital').GetCityHubName]条约》"
 grefm_megali_idea.110.d: "在迅速的磋商后，[SCOPE.sCountry('trabzon_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.110.f: "特拉布宗曾抵抗奥斯曼帝国一段时间，但最终也是败落。今天他们回归成为一个[ROOT.GetCountry.GetName]。"
 grefm_megali_idea.110.a: "最令人满意的解决方案。"
 grefm_megali_idea.111.t: "《[SCOPE.sState('cappadocia_capital').GetCityHubName]条约》"
 grefm_megali_idea.111.d: "在迅速的磋商后，[SCOPE.sCountry('cappadocia_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.111.f: "位于安纳托利亚高原深处的卡帕多基亚古地区，曾长期聚居着许多希腊族群，这些族群至今仍保留着其独特的身份认同。"
 grefm_megali_idea.111.a: "最令人满意的解决方案。"
 grefm_megali_idea.120.t: "《[SCOPE.sState('theodoro_capital').GetCityHubName]条约》"
 grefm_megali_idea.120.d: "在迅速的磋商后，[SCOPE.sCountry('theodoro_scope').GetName]同意加入希腊国。"
 grefm_megali_idea.120.f: "狄奥多罗公国曾抵抗奥斯曼帝国一段时间，但最终也是败落。今天，我们欢迎他们回归成为一个[ROOT.GetCountry.GetName]。"
 grefm_megali_idea.120.a: "“最令人满意的解决方案。”"
 grefm_megali_idea.200.t: "土耳其人的命运"
 grefm_megali_idea.200.d: "随着安纳托利亚成为帝国不可分割的一部分，人们提出了如何处理遍布我国各地的残余土耳其人的问题。"
 grefm_megali_idea.200.f: "尽管奥斯曼人占领和统治拜占庭帝国领土长达400多年，但他们仍容忍东正教信徒的存在。因此国家必须决定他们的未来是什么。"
 grefm_megali_idea.200.a: "正如我们与他们共存一样，土耳其人也将与我们共存。"
 grefm_megali_idea.200.b: "我们是希腊人的希腊国家。"
 grefm_megali_idea.201.t: "本土问题"
 grefm_megali_idea.201.d: "随着我们对以前土地的控制权的确立，如何处理[SCOPE.sState('turkish_homeland_state').GetName]内的土耳其人的问题再次浮出水面。"
 grefm_megali_idea.201.f: "安纳托利亚的突厥人虽然来自草原，但他们与祖先几乎没有任何联系，而且其中大多数人甚至认为，安纳托利亚#italic 是#!他们的家园。而大希腊主义的领导人都宣称希腊人在这些土地上拥有至高无上的地位。"
 grefm_megali_idea.201.a: "这些土地理应属于希腊。"
 grefm_megali_idea.201.b: "[SCOPE.sState('turkish_homeland_state').GetName]将保留。"
 grefm_megali_idea.201.c: "他们属于[SCOPE.sState('turkish_reserve_state').GetName]"
 grefm_megali_idea.202.t: "希腊在[SCOPE.sState('grefm_expansion_state').GetName]的扩张"
 grefm_megali_idea.202.d: "[SCOPE.sState('grefm_expansion_state').GetName]的安纳托利亚地区已被并入希腊，许多希腊人希望再次将这里称为自己的家。"
 grefm_megali_idea.202.f: "希腊世界曾经从喀尔巴阡山脉延伸到兴都库什山脉。安纳托利亚只是这个更大整体的一小部分。"
 grefm_megali_idea.202.a: "这片土地自古以来就属于我们。"
 grefm_megali_idea.203.t: "希腊‑土耳其国家"
 grefm_megali_idea.203.d: "事实证明，我们整合奥斯曼帝国前臣民的努力卓有成效。尽管希腊各地的民族主义团体进行了极端抵抗，但[GetCulture('turkish').GetName]人已经开始认同自己希腊‑土耳其国家公民的身份。"
 grefm_megali_idea.203.f: "尽管我们存在差异和分歧，但我们不能否认，我们的希腊文化与土耳其的影响密不可分，土耳其文化也受到我们的影响。被征服的希腊征服了土耳其人。"
 grefm_megali_idea.203.a: "希腊人和土耳其人将平等相处。"
 grefm_megali_idea.005.b: "必须追究[ROOT.GetCountry.GetRuler.GetFullName]的责任。"
 grefm_megali_idea.030.t: "收复巴尔干"
 grefm_megali_idea.030.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_balkan_highlands').GetName]纳入帝国疆域。"
 grefm_megali_idea.030.f: "“帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！”"
 grefm_megali_idea.030.a: "荣耀归于[ROOT.GetCountry.GetName]！"
 grefm_megali_idea.031.t: "收复安纳托利亚"
 grefm_megali_idea.031.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_anatolia').GetName]纳入帝国疆域。"
 grefm_megali_idea.031.f: "帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_megali_idea.031.a: "荣耀归于[ROOT.GetCountry.GetName]！"
 grefm_megali_idea.032.t: "收复黎凡特"
 grefm_megali_idea.032.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_levant').GetName]纳入帝国疆域。"
 grefm_megali_idea.032.f: "帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_megali_idea.032.a: "荣耀归于[ROOT.GetCountry.GetName]！"
 grefm_megali_idea.033.t: "收复埃古普托斯"
 grefm_megali_idea.033.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_aegyptus').GetName]纳入帝国疆域。"
 grefm_megali_idea.033.f: "帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_megali_idea.033.a: "荣耀归于[ROOT.GetCountry.GetName]！"
 grefm_megali_idea.034.t: "收复意大利"
 grefm_megali_idea.034.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_italia').GetName]纳入帝国疆域。"
 grefm_megali_idea.034.f: "帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_megali_idea.034.a: "荣耀归于[ROOT.GetCountry.GetName]！"
 grefm_megali_idea.035.t: "收复意大利"
 grefm_megali_idea.035.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]开启了一场持续数日的庆祝活动，欢庆[ROOT.GetCountry.GetName]重新将[GetGeographicRegion('geographic_region_aegean_sea').GetName]纳入帝国疆域。"
 grefm_megali_idea.035.f: "帝国万岁！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_megali_idea.035.a: "荣耀属于[ROOT.GetCountry.GetName]"