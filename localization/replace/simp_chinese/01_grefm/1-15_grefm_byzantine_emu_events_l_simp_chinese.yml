l_simp_chinese:
 grefm_emu_empire.001.t: "澳大利亚人已抵达"
 grefm_emu_empire.001.d: "随着[ROOT.GetCountry.GetName]抵达巴尔干地区，一个新的构想初现曙光：倘若[ROOT.GetCountry.GetAdjectiveNoFormatting]鸸鹋能像昔日罗马帝国那样将双翼伸展至东地中海，将会如何？"
 grefm_emu_empire.001.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]可能脑子不太正常，但他的想法在民族主义者阵营中获得了支持。"
 grefm_emu_empire.001.a: "咱们再烤一只虾吧，好吗？"
 grefm_emu_empire.001.b: "告诉他，他是在做梦。"
 grefm_emu_empire.002.t: "南方帝国"
 grefm_emu_empire.002.d: "钟声齐鸣，欢呼雷动，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣告[ROOT.GetCountry.GetName]成立。在巍峨庄严的[SCOPE.sBuilding('hagia_sofia_scope').GetName]见证下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]手持重现昔日荣光的东罗马帝国徽章与权杖并着一袭华美的鸸鹋绒礼袍。[ROOT.GetCountry.GetRuler.GetFirstName]阔步走向汇聚的公民、显贵与教士，如同一座灯塔，照亮#bold #greece 鸸鹋#!#!的未来。"
 grefm_emu_empire.002.f: "“如果我们拥有一支火力与这些鸟相当的部队，它就能与世界上任何一支军队匹敌……它们能像坦克一样刀枪不入，无惧机枪扫射。它们就像祖鲁人一样，连达姆弹都无法阻挡它们。”——G·梅雷迪思少校，1932年"
 grefm_emu_empire.002.a: "这简直是易如反掌！"
 grefm_emu_empire.002.b: "帝国彻底筋疲力尽了。"
 grefm_emu_empire.003.t: "东方鸸鹋"
 grefm_emu_empire.003.d: "随着安纳托利亚和巴尔干地区牢牢掌握在我们手中，拜占庭帝国的古老心脏已被鸸鹋之翼庇护。[ROOT.GetCountry.GetAdjectiveNoFormatting]宫廷的领袖们如今呼吁将埃及与黎凡特，这片基督教曾经的坚固堡垒重新纳入帝国疆域。"
 grefm_emu_empire.003.f: "近一千年前，巴塞勒斯伊萨克一世·科穆宁引领帝国重振荣光。然而如今，古老城池沦为废墟，基督教的旧日堡垒因失去鸸鹋庇护之光而日渐凋零。"
 grefm_emu_empire.003.a: "我们将宣称东罗马帝国。"
 grefm_emu_empire.003.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]真是个吃救济的懒虫……"
 grefm_emu_empire.009.t: "神圣拜占庭鸸鹋帝国"
 grefm_emu_empire.009.d: "随着东帝国纳入我们的版图，人民正仰望鸸鹋寻求庇护与指引。所有人都呼吁#bold 鸸鹋#!引领[ROOT.GetCountry.GetName]步入这个新时代。"
 grefm_emu_empire.009.f: "他们说她已经完蛋了，没人能举起帝国旗帜。他们说[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]铁了心要当蠢货，把我们拖进这片荒芜之地的纷争。苦差事是肯定的，但你不能否认那面在博斯普鲁斯海峡飘扬的旗帜真是棒极了。"
 grefm_emu_empire.009.a: "“干得漂亮，伙计！”"