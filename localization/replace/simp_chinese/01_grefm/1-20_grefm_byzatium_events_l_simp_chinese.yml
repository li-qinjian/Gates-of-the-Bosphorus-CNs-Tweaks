l_simp_chinese:
 grefm_byzantium.010.t: "君士坦丁堡的14个地区"
 grefm_byzantium.010.d: "奥斯曼帝国征服君士坦丁堡后的几十年间，君士坦丁堡遭受了严重的衰落和人口减少。虽然城市在上个世纪有了长足的发展，但这是以贫民窟向外扩展为代价的，贫民窟已经超出了城市的古老中心地带。拜占庭信徒们敦促[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]领导"
 grefm_byzantium.010.f: "“君士坦丁堡从金门到海岸长度为一万四千零七十五英尺，宽度为六千一百五十英尺。”——君士坦丁堡的通告，五世纪中叶"
 grefm_byzantium.010.a: "我们将重建万城之女王。"
 grefm_byzantium.011.t: "已确认的宫殿遗址"
 grefm_byzantium.011.d: "\"我们的工程师们终于完成了细致入微的勘察工作。尽管这个计划颇为大胆，但我们的专家们认为，重建宏伟的巨型宫殿并非不可能。目前，只有布科莱翁宫的废墟矗立在那里，而几座奥斯曼时期的建筑则占据了遗址的其他部分。毫无疑问，这将是一项耗资巨大、考验国家实力的浩大工程。\""
 grefm_byzantium.011.f: "“我们沿着海岸一路策马奔驰，直抵布科莱翁宫。当我们抵达时，宫殿在有宫中人员的性命都将得到保全的条件下投降了——所有宫中人员的性命都将得到保全。在布科莱翁宫内，我们发现了大批逃入城堡的贵妇人。其中包括曾任皇后的法国国王之妹，还有同样曾为皇后的匈牙利国王之妹，以及众多其他贵族女眷。至于在这座宫殿中发现的财宝，我实在难以用言语形容。那里的珍宝之多，简直数不胜数，无法估量。仿佛置身于一个取之不尽、用之不竭的宝库之中。”——杰弗里·德·维勒阿杜安，1204年，记述蒙特费拉特的博尼法斯攻占宫殿后的情景"
 grefm_byzantium.011.a: "一切为了拜占庭的荣耀。"
 grefm_byzantium.012.t: "君士坦丁堡大皇宫"
 grefm_byzantium.012.d: "君士坦丁堡大皇宫在1081年之前一直是东罗马皇帝的主要官邸，在长达690多年的时间里一直是帝国的行政中心。修复后的东罗马帝国宫殿再次耸立在君士坦丁堡，唤起人们对君士坦丁和查士丁尼遗产的回忆。"
 grefm_byzantium.012.f: "“整个帝国，乃至全世界，恐怕再无一处能与之媲美——这里金碧辉煌，奢华至极，无与伦比的财富尽显无遗。巍峨的金色宝座之后，矗立着由纯金和白银锤炼而成的树木。树上栖息着镶满宝石的机关鸟儿，只需轻触机关，便能引得百鸟和鸣，婉转啼唱。树干周围蜿蜒盘踞着金质的狮子和狮鹫，它们威严凛然地伫立在座椅两侧，目光凶狠，仿佛随时都可能一跃而起，扑向来犯之敌。”"
 grefm_byzantium.012.a: "一切为了拜占庭的荣耀。"
 grefm_byzantium.012.tt: "[ROOT.GetCountry.GetNameNoFlag]现在可以重#!建#bold 竞技场"
 grefm_byzantium.013.t: "君士坦丁堡竞技场"
 grefm_byzantium.013.d: "经过数月的精心施工，竞技场已经重建完毕。新的赛道、看台和重新装饰过的脊柱，现在已准备就绪，等待着人们的到来。"
 grefm_byzantium.013.f: "在罗马帝国时期，君士坦丁堡的竞技场，曾为帝国公民举办过盛大的战车比赛。如今，由于大部分场地仍裸露在外，我们或许可以重建这些古老赛道。尽管距离上一次在这里举办战车比赛已经过去了一千多年，但随着赛道和座位的修复，这一古老的传统有可能重现。"
 grefm_byzantium.013.a: "挣脱牢笼"
 grefm_byzantium.013.tt: "[ROOT.GetCountry.GetNameNoFlag]现在可以决议恢复战车比赛。"
 grefm_byzantium.014.t: "君士坦丁堡的通知"
 grefm_byzantium.014.d: "多年的辛勤劳动使君士坦丁堡从一个封建时代遗留下来的城市变成了东方的一座新生大都市。确实，没有哪个城市比她更配得上“万城之女王”的称号。"
 grefm_byzantium.014.f: "几个世纪以来，君士坦丁堡一直是东方基督教的摇篮。如今，这座重建的城市已成为一个新帝国诞生的灯塔。"
 grefm_byzantium.014.a: "拜占庭永恒！"
 grefm_byzantium.020.t: "#filler 战车竞速科技事件#!"
 grefm_byzantium.020.d: "#filler grefm_byzantium.020.d#!"
 grefm_byzantium.020.f: "#filler grefm_byzantium.020.f#!"
 grefm_byzantium.020.a: "#filler grefm_byzantium.020.a#!"
 grefm_byzantium.021.t: "战车竞赛复办"
 grefm_byzantium.021.d: "巴西琉斯下令恢复古老的战车比赛制度。这项赛事每四年举办一次，向“万城之女王”的市民和游客开放。"
 grefm_byzantium.021.f: "经过训练和选拔，四支队伍成立了：#red 红队#!、#white 白队#!、#green 绿队#!和#blue 蓝队#!——每支队伍都以古代罗马战车队中的一支命名。"
 grefm_byzantium.021.a: "把战车开出来！"
 grefm_byzantium.022.t: "战车竞赛扩大"
 grefm_byzantium.022.d: "巴西琉斯大笔一挥，战车竞赛又增加了两支队伍。"
 grefm_byzantium.022.f: "这两支新战队是罗马后期战车队#gold 金队#!和#purple 紫队#!的再次复现！"
 grefm_byzantium.022.a: "荣耀归于拜占庭！"
 grefm_byzantium.023.t: "赛事中的一日"
 grefm_byzantium.023.d: "在夏日的骄阳下，各大战车队在大竞技场的起跑线上一字排开。广场里挤满了观众，粉丝和反对者的欢呼声此起彼伏。发令枪一响，战车飞驰在赛道上，每支队伍都在催促自己的战马前进。最终[GetPlayer.MakeScope.Var('grefm_chariot_race_var').GetFlagName]取得了胜利。"
 grefm_byzantium.023.f: "“当马匹转过一个又一个弯道时，人群咆哮，地面颤抖。就好像万城之女皇本身已经活了过来一样。”"
 grefm_byzantium.023.a: "拜占庭传统的出色展示。"
 grefm_byzantium.024.t: "赛事中的一日‑重赛"
 grefm_byzantium.024.d: "在夏日的骄阳下，各大战车队在大竞技场的起跑线上一字排开。广场里挤满了观众，粉丝和反对者的欢呼声此起彼伏。发令枪一响，战车飞驰在赛道上，每支队伍都在催促自己的战马前进。一天的比赛结束后，最终没有任何一支队伍能够取得胜利。观众们要求进行#italic 重赛#!，一场决胜局比赛。"
 grefm_byzantium.024.f: "“当马匹转过一个又一个弯道时，人群咆哮，地面颤抖。就好像万城之女皇本身已经活了过来一样。”"
 grefm_byzantium.024.a: "我们将安排重赛。"
 grefm_byzantium.024.b: "我们承认平局"
 grefm_byzantium.025.t: "体育骚乱"
 grefm_byzantium.025.d: "在今年的战车比赛中，敌对粉丝之间的争斗导致大竞技场一片混乱。"
 grefm_byzantium.025.f: "在夏日炎炎的烈日下，当各队列队准备参加四轮比赛时，整个大竞技场都洋溢着一片欢乐的气氛。当参赛队退场准备最后的比赛时，观众之间爆发了一场混战。当卫兵进场恢复秩序时，一场骚乱已经开始，并有可能蔓延到街道上。"
 grefm_byzantium.025.a: "疏散旁观者。"
 grefm_byzantium.025.b: "逮捕这些狂热分子。"
 grefm_byzantium.026.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]尝试加入比赛"
 grefm_byzantium.026.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]已被激励参加今年的比赛。"
 grefm_byzantium.026.f: "虽然这对大众来说绝对是个很好的娱乐节目，但这可能有点......有失身份。"
 grefm_byzantium.026.a: "听起来很有体育精神！"
 grefm_byzantium.026.b: "这对于有教养的男人来说是难以接受的。"
 grefm_byzantium.027.t: "战车队伍被发现舞弊"
 grefm_byzantium.027.d: "由[SCOPE.gsInterestGroup('cheater_ig_scope').GetName]支持的战车队被发现试图操纵今年的比赛。"
 grefm_byzantium.027.f: "审计发现的腐败现象令人难以置信，从贿赂到公然破坏比赛设备。一些消息来源暗示，赛场本身也可能成为不法行为的目标。"
 grefm_byzantium.027.a: "取消比赛并展开调查。"
 grefm_byzantium.027.b: "让他们比赛吧，技艺必将战胜奸诈。"
 grefm_byzantium.028.t: "内燃机的轰鸣响彻竞技场！"
 grefm_byzantium.028.d: "今日，人群蜂拥至竞技场，只为一睹空前盛况：\n伴随着震耳欲聋的引擎轰鸣，观众们目睹了几位汽车爱好者在古老的竞技场内疾驰。驾驶员们死死抓牢方向盘，驾驶着座驾在夯实的泥土跑道上飞驰。这些赛车手为自己的爱车装饰上色彩鲜艳的标志和徽记，似乎试图将这场比赛打造成一场现代化的\"机械战车\"竞赛。"
 grefm_byzantium.028.f: "尽管缺乏正式组织，这些狂热分子已经自发开展起了直线加速赛和拖拉机拉力赛等非正式运动。一些热心观众甚至提议将这些运动正规化，其中最富想象力的人还建议，可以让更小型的车辆——或许是由割草机改装而来的载具也加入赛道。然而，社会精英们对这种危险的活动大加抨击，并对可能损坏这座古老竞技场的风险表示深切忧虑。"
 grefm_byzantium.028.a: "我们应该让这成为常态！"
 grefm_byzantium.028.b: "在这些疯子杀人之前逮捕他们！"
 grefm_byzantium.030.t: "复兴交响乐"
 grefm_byzantium.030.d: "随着[ROOT.GetCountry.GetName]的重生，复兴[ROOT.GetCountry.GetAdjectiveNoFormatting]诸多制度的梦想已然苏醒。其中便包括“政教协和”理念——这种曾存在于帝国国家机关与教会机构间的独特平衡，二者在行政上密不可分，却在政治上保持独立。"
 grefm_byzantium.030.f: "人们普遍认为，交响协和体制最初形成于查士丁尼一世统治时期，他开始运用国家权力强制推行教会法。虽然当今世界已不见其踪迹，但许多[GetIdeology('ideology_gbbf_symphonist_leader').GetName]主张：若能重建帝国，其古老制度亦当复兴。"
 grefm_byzantium.030.a: "没有信仰的帝国算什么？"