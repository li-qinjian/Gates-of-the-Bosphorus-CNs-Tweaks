l_simp_chinese:
 je_grefm_lands_of_arianon: "伊朗人之地"
 je_grefm_lands_of_arianon_reason: "在希腊影响的鼎盛时期，先后有两个希腊‑伊朗帝国横跨伊朗高原。从伊斯兰霸主手中夺回这些土地的重任落在我们的肩上。"
 je_grefm_the_graveyard_of_empires: "帝国坟场"
 je_grefm_the_graveyard_of_empires_reason: "两千多年前，亚历山大大帝的军队以迅雷不及掩耳之势横扫欧亚大陆，将兴都库什山脉以南的土地纳入希腊版图。此后的几个世纪里，希腊化王国兴衰迭起，确保希腊人的影响力远达印度河畔。甚至后来，聂斯脱利的追随者也将他们的异端教义带到了这片土地上。现在，帝国将见证这片领土在希腊国家的统治下繁荣昌盛。"
 je_grefm_black_sea: "帝国雄心：好客之海"
 je_grefm_black_sea_reason: "黑海一度尽归希腊世界版图之内，我们将为仍视其沿岸为故乡的同胞送去慰藉。"
 je_grefm_magna_graecia: "帝国雄心：大希腊"
 je_grefm_magna_graecia_reason: "南意大利曾经是希腊文化的腹心地带之一，它见证了整个古典时代中古希腊与古罗马文化的融合过程。"
 je_grefm_alexandria_oxus: "考古发现：乌浒河畔的亚历山大里亚"
 je_grefm_alexandria_oxus_reason: "亚历山大城被同时代的人视为“绝域亚历山德里亚”，它代表了希腊文化对中国影响的交融。"
 je_grefm_alexandria_merv: "考古发现：马尔吉亚纳的亚历山大里亚"
 je_grefm_alexandria_merv_reason: "「绿洲驿站」梅尔夫城有着超越文字记载的悠久历史。该城曾一度以亚历山大的名字命名，是希腊文化对中亚影响的最北端。"
 je_grefm_alexandria_indus: "考古发现：印度河畔的亚历山大里亚"
 je_grefm_alexandria_indus_reason: "印度河和亚辛河交汇处有一座残破的城堡，它是亚历山大为安置色雷斯军人而建立的城市遗迹。虽然这座城市本身已所剩无几，但这座废墟却是希腊影响到印度最远的见证。"
 je_grefm_alexandria_susiana: "考古发现：苏锡安那的亚历山大里亚"
 je_grefm_alexandria_susiana_reason: "舒什在古代曾被称为“苏锡安那”，尽管地理位置偏僻，但历史悠久，在青铜时代曾称霸札格罗斯山脉。亚历山大在征服阿契美尼德帝国后，曾在这里为马其顿和波斯贵族之间举办了一系列集体婚礼，以确保他对波斯王位的宣称。"