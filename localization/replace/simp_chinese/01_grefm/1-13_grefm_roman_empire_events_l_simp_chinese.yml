l_simp_chinese:
 grefm_roman_empire.001.t: "凤凰涅槃"
 grefm_roman_empire.001.d: "钟声齐鸣，欢呼雷动，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣告[ROOT.GetCountry.GetName]重获新生。在巍峨庄严的[SCOPE.sBuilding('hagia_sofia_scope').GetName]见证下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]手持重现昔日荣光的东罗马帝国徽章与权杖。[ROOT.GetCountry.GetRuler.GetFirstName]阔步走向汇聚的公民、显贵与教士，如同一座灯塔，照亮希腊民族的未来。"
 grefm_roman_empire.001.f: "几个世纪以来，无数次复兴罗马和君士坦丁堡的尝试均以失败告终，而今日，帝国终于再度崛起。然而，重任依旧在肩：众多希腊同胞仍在异教徒和异端的统治之下，昔日罗马的土地依旧被外族篡位者攫取，无数拜占庭珍宝仍流落在异国他乡。若要为[ROOT.GetCountry.GetName]带来荣耀，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须不负臣民的期望，竭尽全力。"
 grefm_roman_empire.001.a: "我们从灰烬中崛起。"
 grefm_roman_empire.002.t: "永恒之城"
 grefm_roman_empire.002.d: "我们的努力终于开花结果，[ROOT.GetCountry.GetName]重获新生。如今，众多声音呼吁收复“永恒之城”罗马，以恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的威权与声望。[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的未来，如今系于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的决断之上"
 grefm_roman_empire.002.f: "“希腊王国不是希腊；它只是希腊的一部分，而且是希腊最小且最贫困的一部分。希腊人不仅是居住在希腊王国的人们，约阿尼纳、色萨利、色雷斯、阿德里安堡、君士坦丁堡、特拉布宗、克里特、萨摩斯的人们，以及和希腊历史相关的人们所居住的所有地区的人们都是希腊人……希腊有两个伟大的中心，雅典是王国的首都，而君士坦丁堡是伟大的都城，是所有希腊人的梦想与希望。”——约安尼斯·科莱提斯，1844年"
 grefm_roman_empire.002.a: "我们会恢复[ROOT.GetCountry.GetName]的荣耀。"
 grefm_roman_empire.002.b: "这个目标不切实际。"
 grefm_roman_empire.009.t: "罗马帝国的复兴"
 grefm_roman_empire.009.d: "当帝国大军踏入永恒之城时，我们重建罗马帝国的梦想终于画上了圆满的句号。时隔千年之久，罗马——这座永恒之城，这个五大牧首区中的首席——终于重归帝国怀抱。从博斯普鲁斯海峡的岸边直至泰伯河的浩荡水流，古罗马的土地如今已在同一面旗帜下重新统一。"
 grefm_roman_empire.009.f: "罗马城曾是统治欧洲的最伟大帝国之一的核心。数个世纪以来，它在伦巴第和高卢篡位者的手中日渐衰落。而今，这颗帝国的明珠，这颗跳动的心脏，终于从蛮族之手收复！向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]致敬！愿[ROOT.GetCountry.GetName]荣光永存！"
 grefm_roman_empire.009.a: "罗马将再次伟大！"
 grefm_roman_empire.009.b: "君士坦丁堡就是新罗马！"
 grefm_roman_empire.001.b: "是时候关注我们自身的繁荣了。"