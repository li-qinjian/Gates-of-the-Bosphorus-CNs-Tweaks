l_simp_chinese:
 grefm_samos.001.t: "萨摩斯反抗者"
 grefm_samos.001.d: "尽管在希腊独立战争期间拿起武器，[ROOT.GetCountry.GetName]仍然与#greece 希腊本土#!分离。不过土耳其实行统治后，成千上万的人逃离该岛，到希腊寻找他们的命运。而岛屿由不受欢迎的[ROOT.GetCountry.GetRuler.GetFullName]统治，他经常滥用权力，导致岛上的居民则梦想着与自由的$grefm_greek$联合。"
 grefm_samos.001.f: "虽然名义上受制于#bold 高门#!，但该岛又被赋予了很大程度的自治权，实际上可以作为一个独立的国家运作。苏丹希望，这一妥协将避免在安纳托利亚海岸附近出现外国威胁。"
 grefm_samos.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 grefm_samos.002.t: "强加的统治者"
 grefm_samos.002.d: "[ROOT.GetCountry.GetRuler.GetFullName]被任命统治[ROOT.GetCountry.GetName]还不到两年，人民就十分厌恶。王子忠于#bold 高门#!的需求置于首位，他将统治重点放在税收和独裁上，力图将自己确立为该岛的永久统治者。\n\n为此，他偏向于$gbbf_landowners$，并以此作为巩固其权力基础的手段，而牺牲受到来自欧洲的自由主义浪潮的$gbbf_rural_folk$，只因他们要求人民享有宪法权利。"
 grefm_samos.002.f: "尽管亲王打着“统治”萨摩斯的幌子，却从未踏上过这座岛屿，而且他确保了在岛上的代表和指挥官只效忠于他一人。"
 grefm_samos.002.a: "[ROOT.GetCountry.GetAdjective]人民值得得到更好的待遇"
 grefm_samos.003.t: "原始宪章"
 grefm_samos.003.d: "岛上的立法机构违背了亲王意愿，强行通过了一项法律，严重削弱亲王和#bold 高门#!对萨摩斯人民的权利。"
 grefm_samos.003.f: "原始宪章"
 grefm_samos.003.a: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm_samos.004.t: "斯特凡诺斯的暴政"
 grefm_samos.004.d: "[ROOT.GetCountry.GetRuler.GetFullName]违背人民意愿，对萨摩斯岛实行独裁统治。他现在在岛上定居，自称为“萨摩斯之主”。"
 grefm_samos.004.f: "[ROOT.GetCountry.GetRuler.GetFirstName]的行动是对#bold 高门#!的背叛！希腊人被屠杀！在这种情况下，我们只能寄希望于国外的希腊同胞提供援助。"
 grefm_samos.004.a: "人民对治理又了解多少呢？"
 grefm_samos.005.t: "被废黜的暴君"
 grefm_samos.005.d: "萨摩斯岛上对亲王的不满达到了极点，在一场大规模的抗议中，[ROOT.GetCountry.GetCapital.GetCityHubName]的群众冲进亲王官邸，抓走了亲王和他的代表。在将他们送回大陆后，民众领袖向#bold 高门#!要求排出更好的人来治理，作为回应[SCOPE.sCharacter('samos_next_ruler_scope').GetFullName]已被派往该岛。"
 grefm_samos.005.f: "萨摩斯人民不甘心继续受压迫，他们把这个暴君赶出了岛屿。"
 grefm_samos.005.a: "让这位苏丹的下一任仆人来试试吧。"
 grefm_samos.006.t: "任命新总督"
 grefm_samos.006.d: "在奥斯曼帝国宫廷无休止的政治变动中，[ROOT.GetCountry.GetRuler.GetFullName]已被#bold 高门#!召回！随着他的离开，一名译员前来报告，[SCOPE.sCharacter('samos_next_ruler_scope').GetFullName]已被任命为[ROOT.GetCountry.GetName]的新总督。"
 grefm_samos.006.f: "根据其对萨摩斯的条约权利，#bold 高门#!已经提名了群岛的下一任统治者，人民没有任何发言权。"
 grefm_samos.006.a: "他只是苏丹的另一个仆人。"
 grefm_samos.007.t: "领主[ROOT.GetCountry.GetRuler.GetFirstName]被废黜"
 grefm_samos.007.d: "萨摩斯岛上对亲王的不满达到了极点，在一场大规模的抗议中，[ROOT.GetCountry.GetCapital.GetCityHubName]的群众冲进亲王官邸，抓走了亲王和他的代表。在将他们送回大陆后，民众领袖向#bold 高门#!要求排出更好的人来治理，作为回应[SCOPE.sCharacter('samos_next_ruler_scope').GetFullName]已被派往该岛。"
 grefm_samos.007.f: "萨摩斯人民不甘心继续受压迫，他们把暴君又一次赶出了岛屿。"
 grefm_samos.007.a: "让这位苏丹的下一任仆人来试试吧。"
 grefm_samos.008.t: "萨摩亚解放"
 grefm_samos.008.d: "[ROOT.GetCountry.GetName]漫长而残酷的奴役终于结束了。独立后，该岛现在可以自由地寻求与希腊联合。"
 grefm_samos.008.f: "首先是自由。其次是#italic 合一#!！"
 grefm_samos.008.a: "[ROOT.GetCountry.GetAdjective]人民终于自由了！"
 grefm_samos.009.t: "萨摩斯与希腊联盟"
 grefm_samos.009.d: "经过数十年的酝酿和要求，[SCOPE.sCountry('samos_scope').GetName]终于与[ROOT.GetCountry.GetName]实现了统一。在[SCOPE.sCountry('samos_scope').GetCapital.GetCityHubName]举行的一个简单仪式上，[SCOPE.sCountry('samos_scope').GetAdjective]国旗被降下，取而代之的是希腊国旗。"
 grefm_samos.009.f: "“那么，你们到底想要我们还是不要我们？”——T.索福利斯1912年对希腊政府说"
 grefm_samos.009.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"