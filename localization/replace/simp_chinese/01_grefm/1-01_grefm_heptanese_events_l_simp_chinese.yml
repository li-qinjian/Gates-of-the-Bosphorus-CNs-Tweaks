l_simp_chinese:
 grefm_heptanese.001.t: "七岛共和国"
 grefm_heptanese.001.d: "鲁米利亚和伯罗奔尼撒半岛沿岸有许多[ROOT.GetCountry.GetName]岛屿。伊奥尼亚群岛在50多年前被法国占领，现在作为[ROOT.GetCountry.GetPowerBloc.GetName]的一部分接受殖民统治。在他们的统治下，伊奥尼亚群岛已经开始步入工业时代，然而人民却梦想着有朝一日能与#bold 希腊统一#!。"
 grefm_heptanese.001.f: "希腊人在伊奥尼亚群岛可以追溯到古希腊的书面记录之前，许多人认为这些岛屿具有神话地位。在13世纪初被威尼斯占领后，这些岛屿幸免于奥斯曼人的征服，但却陷入了一个传统和工业都过时的半农业社会。"
 grefm_heptanese.001.a: "[ROOT.GetCountry.GetName]将找到属于自己的道路。"
 grefm_heptanese.002.t: "伊奥尼亚珠宝"
 grefm_heptanese.002.d: "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('ionian_overlord').GetAdjective]帝国的其他地区完全不同，尽管这个小国缺乏资源或商品，它已经成为良好治理典范，是西方理想与希腊理想相融合的产物。"
 grefm_heptanese.002.f: "领导人抓住了[ROOT.GetCountry.GetName]殖民体系的成功，称赞群岛的发展是[ROOT.GetCountry.GetPowerBloc.GetName]殖民成功的证明。从科孚岛到伦敦，媒体甚至将群岛称为“帝国皇冠上的明珠”。"
 grefm_heptanese.002.a: "这是[ROOT.GetCountry.GetName]取得的巨大成就。"
 grefm_heptanese.003.t: "现代化农业"
 grefm_heptanese.003.d: "我们重组[ROOT.GetCountry.GetName]农业系统的努力取得了成果。人们逐渐习惯于现代耕作方式，让人不经感叹他们当初为什么要坚持旧的耕作方式。"
 grefm_heptanese.003.f: "每年英国各殖民地的生产都被编入“蓝皮书”中，提交给议会。这本书中首次出现了这样一句话：“农业综合企业——盈利”。"
 grefm_heptanese.003.a: "好消息！"
 grefm_heptanese.004.t: "文明国度"
 grefm_heptanese.004.d: "自威尼斯的统治崩溃后，包括科孚岛在内的许多城市都涌入了大量流浪者和孤儿，他们都是与欧洲联系体系崩溃的受害者。随着社会网和贫民院的发展，贫困不再是过去的死刑判决。"
 grefm_heptanese.004.f: "通过向社会最弱势群体表达同情，[ROOT.GetCountry.GetName]打破了东方文明的常规。"
 grefm_heptanese.004.a: "干得漂亮。"
 grefm_heptanese.005.t: "伊奥尼亚学院"
 grefm_heptanese.005.d: "#yellow 伊奥尼亚学院#!最初成立于伊萨卡，自希腊独立战争以来一直在科孚岛运营。由于该大学领导层最近发生变动，新校长要求额外资金开设新的土木工程学院。"
 grefm_heptanese.005.f: "伊奥尼亚学院是希腊境内开办的第一所西式大学。这所大学一直运营到1864年，当时它的教职员工被调往雅典大学工作。"
 grefm_heptanese.005.a: "一个绝妙的提案！"
 grefm_heptanese.005.b: "听起来像是在浪费时间。"
 grefm_heptanese.010.t: "伊奥尼亚群岛的罗马尼奥特犹太"
 grefm_heptanese.010.d: "几个世纪以来，[ROOT.GetCountry.GetName]一直是#yellow 犹太人#!居住地，许多人的祖先可以追溯到第二圣殿时代。虽然他们的生活在威尼斯和法国的统治下时好时坏，但在[ROOT.GetCountry.GetPowerBloc.GetName]统治下，他们的状况无疑每况愈下。在即将离任的伦敦政府的支持下，殖民政府禁止他们担任公职或享有公平法律。"
 grefm_heptanese.010.f: "犹太教虽然法律并没有歧视，但实际上却是二等宗教，伊奥尼亚群岛宪法将所有非东正教、非天主教的信仰仅仅归类为“可容忍”。虽然犹太人一直向政府请愿要求改革，但自从英国人到来后，这些请愿都被置若罔闻。"
 grefm_heptanese.010.a: "国家应该采取行动。"
 grefm_heptanese.011.t: "犹太人要求以前的权利"
 grefm_heptanese.011.d: "如今[ROOT.GetCountry.GetPowerBloc.GetName]推进一项现代化议程，来规范整个帝国的标准化法律。作为这些改革的一部分，殖民行政官已对[ROOT.GetCountry.GetName]的法院系统进行了重大改革，在扩大希腊人接触法律渠道的同时，希腊政府制定了新的法规，继续将犹太人排除在法律体系之外。"
 grefm_heptanese.011.f: "通过规定“信奉基督教”的必要性，殖民统治者确保了岛上的犹太人与国家公职隔绝，同时又使法律为英国监督者所接受。"
 grefm_heptanese.011.a: "没什么可以做的。"
 grefm_heptanese.011.b: "我们必须抗议这种不公正！"
 grefm_heptanese.012.t: "纳卡穆利出版社"
 grefm_heptanese.012.d: "犹太人朱塞佩·纳卡穆利在[ROOT.GetCountry.GetName]开设了第一家的出版社。为了维护犹太人的权利，他开始出版一本名为《以色列纪事报》的杂志，严厉批评了殖民政府统治下犹太人的地位。这样做的目的是将为歧视程序拖到公开场合，让公民看到。"
 grefm_heptanese.012.f: "“该杂志只出版了一期，虽然其中没有任何内容会冒犯基督教和他们的宗教，但犹太报纸仍然是一种新奇事物，令希腊基督徒感到不快”——高级专员亨利·斯托克斯"
 grefm_heptanese.012.a: "他们应该被允许发言。"
 grefm_heptanese.012.b: "取缔该报社。"
 grefm_heptanese.013.t: "血祭诽谤"
 grefm_heptanese.013.d: "由于犹太人在岛上的地位日益突出，[GetReligion('orthodox').GetName]激进分子在[ROOT.GetCountry.GetCapital.GetCityHubName]散布有关犹太人的恶毒谣言，导致暴民聚集起来骚扰犹太人聚居区。"
 grefm_heptanese.013.f: "“这些国家的人民愚昧无知、偏见重重……希腊教会的信条自私自利、封建自守……其他基督教宗教，尤其是罗马天主教，被视为可怕的异端邪说，土耳其人和犹太人被视为异端。”——高级专员亨利·斯托克斯"
 grefm_heptanese.013.a: "驱散暴徒。"
 grefm_heptanese.013.b: "这听起来像是私事。"
 grefm_heptanese.014.t: "科孚岛骚乱"
 grefm_heptanese.014.d: "[GetReligion('orthodox').GetName]暴徒袭击了[ROOT.GetCountry.GetCapital.GetCityHubName]的[GetCulture('romanyotim').GetName]居住区。虽然当地安全部队镇压了骚乱，但仍有许多人伤亡。"
 grefm_heptanese.014.f: "“从那时起，那些通过煽动全城反对犹太人而获得最大利益的人就开始嚷嚷，说被杀害的女孩是基督徒，她的血是犹太人抽的，要用来做食物，法官、检察官和所有军事当局都被收买来照顾犹太人，为了将来的选举而释放凶手。”——凯法拉斯检察官，1891年"
 grefm_heptanese.014.a: "“逮捕那些疯子！”"
 grefm_heptanese.018.t: "犹太人被排斥"
 grefm_heptanese.018.d: "尽管[GetCulture('romanyotim').GetName]社区为获得法律认可做出了共同努力，但领导人被迫承认这些努力已经付诸东流。"
 grefm_heptanese.018.a: "多么可耻啊！"
 grefm_heptanese.019.t: "犹太希腊国"
 grefm_heptanese.019.d: "随着最后一批针对犹太人的法律的废除，社会领袖主张扩大当地犹太人的公民权和政治权。"
 grefm_heptanese.019.f: "国家不再承认犹太人为二等公民，这样又有一个新的问题——如果[GetCulture('romanyotim').GetName]与$grefm_greek$社区交织在一起，那么为什么不承认他们是[ROOT.GetCountry.GetName]的重要组成部分呢？"
 grefm_heptanese.019.a: "他们是我们文化不可分割的一部分。"
 grefm_heptanese.019.b: "我们已经为他们做得够多了。"
 grefm_heptanese.020.t: "合一之梦"
 grefm_heptanese.020.d: "[ROOT.GetCountry.GetName]毫无疑问是大希腊一部分。尽管政治上与希腊本土分离了几个世纪，但两个地区之间的人员和贸易往来却有增无减。随着希腊的独立，我们的许多公民都认为重新统一的时机已经成熟。"
 grefm_heptanese.020.f: "每一次易手，岛民们与大陆联合的梦想似乎都遥不可及，然而每一个掌握岛屿的[concept_great_power]都发现了掌握如此靠近东方的价值。"
 grefm_heptanese.020.a: "合一势不可挡！"
 grefm_heptanese.021.t: "伊奥尼亚群岛与希腊联盟"
 grefm_heptanese.021.d: "经过数十年的酝酿和要求，[SCOPE.sState('ionian_islands_state_scope').GetName]终于与[ROOT.GetCountry.GetName]实现了统一。在[SCOPE.sState('ionian_islands_state_scope').GetCityHubName]举行的一个简单仪式上，[SCOPE.sCountry('uk_scope').GetAdjective]国旗被降下，取而代之的是希腊国旗。"
 grefm_heptanese.021.f: "“他们是好人，但现在我们自由了！”"
 grefm_heptanese.021.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"
 grefm_heptanese.014.b: "没什么可以做的。"
 grefm_heptanese.018.f: "遵循$GBR_ADJ$的情绪，七岛政府在给予犹太人法律权利上摇摆不定，同时并未完全将他们的宗教实践定为刑事犯罪。"