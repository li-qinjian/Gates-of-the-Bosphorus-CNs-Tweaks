l_simp_chinese:
 grefm_hybrid_empire.001.t: "新希腊的崛起"
 grefm_hybrid_empire.001.d: "钟声齐鸣，欢呼雷动，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]庄严宣告[ROOT.GetCountry.GetName]的重生。在雄伟的[SCOPE.sBuilding('hagia_sofia_scope').GetName]见证下,[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]手持重现昔日荣光的古希腊国王的徽章与权杖。[ROOT.GetCountry.GetRuler.GetFirstName]阔步走向汇聚的公民、显贵与教士，如同一座灯塔，照亮希腊民族的未来。"
 grefm_hybrid_empire.001.f: "几个世纪以来，无数次复兴罗马和君士坦丁堡的尝试均以失败告终，而今日，帝国终于再度崛起。然而，重任依旧在肩：众多希腊同胞仍在异教徒和异端的统治之下，昔日罗马的土地依旧被外族篡位者攫取，无数拜占庭珍宝仍流落在异国他乡。若要为[ROOT.GetCountry.GetName]带来荣耀，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须不负臣民的期望，竭尽全力。"
 grefm_hybrid_empire.001.a: "$grefm_greek$人民将开创新的未来！"
 grefm_hybrid_empire.002.t: "永恒之城"
 grefm_hybrid_empire.002.d: "我们的努力终于开花结果，[ROOT.GetCountry.GetName]重获新生。而今诸多呼声主张恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的权势与威望，让昔日希腊故土重归[ROOT.GetCountry.GetAdjectiveNoFormatting]国家。"
 grefm_hybrid_empire.002.f: "“希腊王国不是希腊；它只是希腊的一部分，而且是希腊最小且最贫困的一部分。希腊人不仅是居住在希腊王国的人们，约阿尼纳、色萨利、色雷斯、阿德里安堡、君士坦丁堡、特拉布宗、克里特、萨摩斯的人们，以及和希腊历史相关的人们所居住的所有地区的人们都是希腊人……希腊有两个伟大的中心，雅典是王国的首都，而君士坦丁堡是伟大的都城，是所有希腊人的梦想与希望。”——约安尼斯·科莱提斯，1844年"
 grefm_hybrid_empire.002.a: "我们会恢复[ROOT.GetCountry.GetName]的荣耀。"
 grefm_hybrid_empire.002.b: "这个目标不切实际。"
 grefm_hybrid_empire.001.b: "是时候关注我们自身的繁荣了。"
 grefm_hybrid_empire.009.t: "希腊人之国"
 grefm_hybrid_empire.009.d: "欢呼声响彻整个[ROOT.GetCountry.GetName]，民众正为所有东部的$grefm_greek$民族统一到[ROOT.GetCountry.GetAdjectiveNoFormatting]中而欢呼雀跃。"
 grefm_hybrid_empire.009.f: "从伯罗奔尼撒出发，越过博斯普鲁斯海峡，沿着尼罗河而行，$grefm_greeks$终于在[ROOT.GetCountry.GetAdjectiveNoFormatting]庇护下安顿下来。"
 grefm_hybrid_empire.009.a: "真正的[ROOT.GetCountry.GetName]已经重建！"