l_simp_chinese:
 je_grefm_eastern_glory: "希腊人的帝国"
 je_grefm_eastern_glory_reason: "希腊世界的版图曾从巴尔干半岛的海岸线延伸至地中海东部的黎凡特海岸。在地中海各地，希腊人民呼唤着与希腊国家的统一。我们即将见证希腊领土的重塑与复兴。"
 je_grefm_eastern_glory_possible: "[ROOT.GetCountry.GetNameNoFlag]已经建立#bold 格拉亚#!"
 je_grefm_wonders_of_the_nile: "尼罗河奇迹"
 je_grefm_wonders_of_the_nile_reason: "腓尼基是黎凡特地区的古称，曾将古希腊世界与埃及和美索不达米亚的东方文明中心连接在一起。这些土地曾经是罗马帝国的东部边疆，但在穆斯林统治的数百年间却一直苟延残喘。"