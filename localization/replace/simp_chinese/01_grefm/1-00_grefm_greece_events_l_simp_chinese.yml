l_simp_chinese:
 grefm_greece.001.t: "摄政会议"
 grefm_greece.001.d: "独立之后，[ROOT.GetCountry.GetName]政局动荡不安，最终酿成了总督$gbbf_bio_kapodistrias_ioannis$遇刺的悲剧。为避免国家陷入内战的深渊，$gbbf_great_powers$扶持了一位来自巴伐利亚的天主教国王来治理新生的[ROOT.GetCountry.GetAdjectiveNoFormatting]政权。\n\n虽然年轻的国王[ROOT.GetCountry.GetRuler.GetFullName]最近已达到执政年龄，但他的统治之路却困难重重。其总理大臣[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]通过政治手腕积累了巨大权力，几乎掌控了整个希腊的政治命脉。"
 grefm_greece.001.f: "“伟大的希腊王啊！古希腊曾用其灿烂的文明之光照亮了德意志的心灵，而今天，德国决心以更加丰厚的文化回报这份精神遗产。我们由衷敬仰您，因为您是那唤醒地球上这最伟大民族尊严与荣光的救星！”——P·苏特索斯，1837年"
 grefm_greece.001.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 grefm_greece.002.t: "避免危机"
 grefm_greece.002.d: "面对民众的不信任，尽管[SCOPE.gsInterestGroup('ig_landowners_scope').GetName]的阴谋诡计层出不穷，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]限制了王权并给予[ROOT.GetCountry.GetName]公民以自由。然而，许多人继续呼吁进一步削弱贵族的权力和地位，使希腊成为海外希腊人民的希望灯塔。"
 grefm_greece.002.f: "我们推翻土耳其压迫者，不是让一个日耳曼压迫者取而代之。"
 grefm_greece.002.a: "仁慈的[SCOPE.sCharacter('grefm_otto_scope').GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 grefm_greece.003.t: "九月革命"
 grefm_greece.003.d: "当[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('grefm_otto_scope').GetFirstName]登上希腊王位时，许多人都希望他能给[ROOT.GetCountry.GetName]带来繁荣。但他反其道而行之，违背希腊人民的意愿，成为了一位专制君主。[SCOPE.sCharacter('ig_armed_forces_scope').GetFullName]对王室的改革步伐裹足不前感到恼火，于是召集军队，要求制定一部正式宪法，限制王室的权力，并赋予[ROOT.GetCountry.GetName]的公民以权利。"
 grefm_greece.003.f: "“过了一会儿，宫殿阳台的门打开了，国王现身并对卡勒吉斯说：‘卡勒吉斯将军。’但后者回答说：‘不是将军，只是市民。’说完这些话，军队和聚集的群众开始高呼：‘宪法万岁。卡勒吉斯万岁。’‘陛下，’卡勒吉斯高呼，‘人民想要一部宪法。’然后国王退了出去。” ——内塞尔在他的回忆录中写到"
 grefm_greece.003.a: "我们必须屈服于人民的意愿。"
 grefm_greece.003.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('grefm_otto_scope').GetFullName]不会被乌合之众欺凌。"
 grefm_greece.003.c: "从[ROOT.GetCountry.GetName]中赶走这个搅局者！"
 grefm_greece.004.t: "宪法万岁！"
 grefm_greece.004.d: "[SCOPE.sCharacter('grefm_otto_scope').GetFullName]违背民众的要求，无视对[ROOT.GetCountry.GetName]臣民的义务，解除了[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]的职务，建立了对希腊国家的君主专制统治。"
 grefm_greece.004.f: "“在我这个职位上，既没有国家总理，也没有首相，我感到一种新的动力，迫使我更加积极地投入到我的职责中，因为如今这个正义事业的成败比以前更加依赖于我。”——希腊国王奥托，1838年写给父亲巴伐利亚的路德维希"
 grefm_greece.004.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将会取得君权。"
 grefm_greece.005.t: "废除巴伐利亚专制"
 grefm_greece.005.d: "面对支持希腊独立的列强，希腊人民废除了君主制。"
 grefm_greece.005.f: "“希腊人的国王！他们为了推翻革命的成果，恢复腐败的旧制度，不惜损害人民对王室的崇敬和对您的忠诚。你最终成为了自己人性弱点的牺牲品。你们习惯于崇拜德意志的一切，被德国人在军事和其他各种事务上无与伦比的组织能力所迷惑，你们不仅期待着德意志的胜利，而且还渴望着德意志的胜利，希望它能使你们把政府的一切权力都集中到自己手中，并在实质上抛弃我们的自由宪法。”"
 grefm_greece.005.a: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm_greece.006.t: "十月革命"
 grefm_greece.006.d: "尽管出生在德意志的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('grefm_otto_scope').GetFullName]尝试保住王位，但事实证明，[ROOT.GetCountry.GetName]的人民和贵族都无法忍受他。由[SCOPE.sCharacter('ig_armed_forces_scope').GetFullName]领导的军队突然采取行动，占领了首都并废黜了国王。被废黜的[SCOPE.sCharacter('grefm_otto_scope').GetFirstName]在[SCOPE.sCountry('uk_scope').GetAdjectiveNoFormatting]海军的帮助下流亡到[SCOPE.sState('bavaria_state_scope').GetNameNoFormatting]。[SCOPE.sCharacter('voulgaris_scope').GetFullName]已经成立了一个看守政府，并将在今年晚些时候选出新君主。"
 grefm_greece.006.f: "“希腊，我的希腊，我挚爱的希腊。”——废王奥托在在临终病榻之上"
 grefm_greece.006.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 grefm_greece.006.b: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 grefm_greece.007.t: "天命攸归"
 grefm_greece.007.d: "凭借坚定果断的领导，[SCOPE.sCharacter('grefm_otto_scope').GetFirstName]确立了其统治的合法性。"
 grefm_greece.007.f: "“今天，失落已久的祖国浴火重生。今天，政治、宗教和军事斗士们死而复生，因为我们的国王来了，我们用上帝的力量孕育了他。赞美您神圣的名，全能和最仁慈的主。”"
 grefm_greece.007.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('grefm_otto_scope').GetFullName]万岁！"
 grefm_greece.008.t: "推翻巴伐利亚专制"
 grefm_greece.008.d: "面对曾经支持希腊独立的列强和企图统治[ROOT.GetCountry.GetName]的德意志僭主，希腊人民废除了君主制。"
 grefm_greece.008.f: "“希腊人的国王！他们为了推翻革命的成果，恢复腐败的旧制度，不惜损害人民对王室的崇敬和对您的忠诚。你最终成为了自己人性弱点的牺牲品。你们习惯于崇拜德意志的一切，被德国人在军事和其他各种事务上无与伦比的组织能力所迷惑，你们不仅期待着德意志的胜利，而且还渴望着德意志的胜利，希望它能使你们把政府的一切权力都集中到自己手中，并在实质上抛弃我们的自由宪法。”"
 grefm_greece.008.a: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm_greece.008.b: "这是[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的意愿！"
 grefm_greece.009.t: "失宠的暴君"
 grefm_greece.009.d: "王宫和君主制的政治结构已经崩溃，[SCOPE.sCharacter('armed_forces_leader_scope').GetFullName]骑马来到王宫抓捕了[ROOT.GetCountry.GetRuler.GetFirstName]，并确保了宪法的通过。尽管国王坚持反对，但议会早在宣布起义之前就已经起草了这份文件。"
 grefm_greece.009.f: "“我放弃了所有特权；我不再是国王。现在我的大臣、国民议会和宪法都被强加于我，我的军队也不再听从我的指挥。在希腊，宪法无非就是掠夺。”——1843年，希腊的奥托如是说"
 grefm_greece.009.a: "宪法万岁！"
 grefm_greece.010.t: "立宪承诺"
 grefm_greece.010.d: "当摄政委员会为年轻的[ROOT.GetCountry.GetName]国王代理政务时，曾许诺要制定一部正式宪法，为王权设定界限。然而如今，[ROOT.GetCountry.GetRuler.GetFirstName]却在实行专制统治，既没有任何机制来制约权力的滥用，又因奥斯曼时期遗留下来的贵族势力阻挠而无法实施税收。国王本人对推行改革毫无兴趣，反而恪守其父亲的教诲：“宪法就像是狮子洞，进去容易出来难”。"
 grefm_greece.010.f: "”.....但时至1835年的今日，希腊国土狭小，人口稀少，外国摄政统治着一贫如洗又流离失所的国民，它怎么能指望迅速发展并在未来实现繁荣与进步呢？我们公共事务的领导者和管理者是一个外国人，无论他多么善良和忠诚，还是会把个人利益看得高于一切，还是会竭尽全力在他的国家建立一个超然的骄傲存在，以摆脱我们的血汗与不宽容，因为根据自然理性，在个人利益之外，他不可能有其他有利于他的（外国）领土的同情心。”——L·康托里奥蒂斯，1835年"
 grefm_greece.010.a: "必须做些什么。"
 grefm_greece.010.tt1: "如果[ROOT.GetCountry.GetName]制定#yellow 财产投票#!、#yellow 资格性选举制#!或#yellow 普选制#!：\n#bold 避免危机#!事件将会发生。"
 grefm_greece.010.tt2: "如果[ROOT.GetCountry.GetName]制定#yellow 独裁制#!：\n#bold 宪法万岁！#!事件将会发生"
 grefm_greece.010.tt3: "如果#yellow 政局混乱度#!达到#bold 100#!：\n#bold 九月革命#!事件将会发生。"
 grefm_greece.011.t: "[SCOPE.sCharacter('ludwig_scope').GetFirstName]国王访问希腊"
 grefm_greece.011.d: "[SCOPE.sCharacter('ludwig_scope').GetFullName]国王为了支持他的儿子登基，来到了[ROOT.GetCountry.GetName]，目的是为年轻的君主提供建议和撑台。"
 grefm_greece.011.f: "一位外国君主的到来在[ROOT.GetCountry.GetCapital.GetCityHubName]引起了轩然大波，民众的反应从好奇到惶恐不一而足。"
 grefm_greece.011.a: "真有趣。"
 grefm_greece.012.t: "[ROOT.GetCountry.GetRuler.GetFirstName]出发前往[SCOPE.sState('bavaria_state_scope').GetName]"
 grefm_greece.012.d: "[ROOT.GetCountry.GetRuler.GetFirstName]国王作为一个年轻的君主还缺少很多东西，但其中最主要的是王后和继承人。年轻的国王陪同父亲[SCOPE.sCharacter('ludwig_scope').GetFirstName]回到[SCOPE.sState('bavaria_state_scope').GetName]，目的是找到一位王妃。"
 grefm_greece.012.f: "与[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]之间的争斗在大多数情况下并没有引起人们的注意，但他们对王位继承人的缺失表示不满。国王已将国家职能下放给议会，但许多人担心，一旦君主离开，摄政王会迅速扩大自己的权力。"
 grefm_greece.012.a: "国王万岁！"
 grefm_greece.013.t: "巴伐利亚王室佳偶"
 grefm_greece.013.d: "[ROOT.GetCountry.GetRuler.GetFirstName]回到巴伐利亚时，他的父亲正在为年轻的国王寻找合适的婚配，场面十分隆重。尽管有人提出了其他候选人，但最终在年轻的[SCOPE.sCountry('oldenburg_scope').GetName]贵族[SCOPE.sCharacter('queen_amalia_scope').GetFirstName]身上找到了一桩非常般配的联姻。"
 grefm_greece.013.f: "“女王身材娇小，美丽动人，身材迷人。她活泼，几乎过于活泼，谈论各种话题，称赞希腊，喜欢北欧国家，并确信我们很快就会习惯这个美丽的国家和宜人的气候。” ——吕特写于1839年，《‌阿玛莉亚王后》"
 grefm_greece.013.a: "[SCOPE.sCountry('oldenburg_scope').GetName]的[SCOPE.sCharacter('queen_amalia_scope').GetFirstName]是绝佳的配偶人选。"
 grefm_greece.013.tt: "这是史实选项。"
 grefm_greece.014.t: "[ROOT.GetCountry.GetRuler.GetFirstName]的智商指控"
 grefm_greece.014.d: "[ROOT.GetCountry.GetRuler.GetFirstName]国王已获悉[SCOPE.sCharacter('grefm_armansperg_scope').GetLastName]勋爵的阴谋。自从国王离开希腊以来，首席大臣一直秘密向[SCOPE.sCharacter('ludwig_scope').GetFirstName]发送信件，指责[ROOT.GetCountry.GetRuler.GetFirstName]精神错乱且智力低下。"
 grefm_greece.014.f: "在国王缺席的情况下，阿尔芒斯佩格勋爵将权力集中在自己身上，并开始谋划让自己成为希腊的永久摄政。"
 grefm_greece.014.a: "简直是无法无天！丧尽天良！"
 grefm_greece.015.t: "解散摄政团"
 grefm_greece.015.d: "回到[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetFullName]国王发现摄政委员会与国民议会在[SCOPE.sCharacter('grefm_armansperg_scope').GetLastName]勋爵的手中四分五裂，陷入乱局。[ROOT.GetCountry.GetRuler.GetFirstName]如今面临着来自国外的压力，要求其为希腊国家带来秩序，从而令巴伐利亚人的统治合乎法理。有鉴于此，政治家们要求解决这场危机。"
 grefm_greece.015.f: "[ROOT.GetCountry.GetName]是一个依附于列强的贫困农业国。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]目前被[ROOT.GetCountry.GetAdjectiveNoFormatting]人民所热切拥戴，但一天不进行改革，一天不能令国家富强，他的权威就会日渐衰弱，列强的耐心也会受到考验。"
 grefm_greece.015.a: "赶走这条自私自利的虫子。"
 grefm_greece.015.b: "国王应当与其和解。"
 grefm_greece.016.t: "爱正教会阴谋"
 grefm_greece.016.d: "在[ROOT.GetCountry.GetCapital.GetCityHubName]发现了一桩令人不安的阴谋。受主教[SCOPE.sCharacter('devout_leader_scope').GetFullName]支持的阴谋家们在#yellow 爱正教会#!的帮助下企图挟持国王并令王室皈依[GetReligion('orthodox').GetName]信仰。"
 grefm_greece.016.f: "$grefm_greek$人民毋庸置疑地与[GetReligion('orthodox').GetName]基督信仰密不可分，这引发了排外浪潮。从教士到农民，人们每天都在担心，确保统治者信仰[GetReligion('orthodox').GetName]可能是避免教会影响力衰退的最佳途径。"
 grefm_greece.016.a: "王室将加入教会。"
 grefm_greece.016.b: "我们将与王储[SCOPE.sCharacter('eocfm_heir_scope').GetFirstName]妥协。"
 grefm_greece.016.c: "无稽之谈！"
 grefm_greece.017.t: "皇家巴伐利亚辅助军团"
 grefm_greece.017.d: "1832年，奥托国王抵达希腊时，身边随行了3500名巴伐利亚士兵，以巩固其统治。然而，时至今日，这些士兵仍无法适应希腊的生活。他们既不会说希腊语，又无法在这个未开发的国度中享受到家乡的舒适。随着开支不断攀升，加之他们被用来镇压叛乱，他们的存在日益成为希腊民众的沉重负担。"
 grefm_greece.017.f: "“外籍援军花费了大量金钱，却收效甚微”，而“坚持让军队穿戴欧洲的服装和武器，不仅把最有用的人从军队中剔除，还使他们成为心怀不满之人。”——奥地利外交官安东·冯·普罗克施-奥斯滕"
 grefm_greece.017.a: "他们服务于国王意志。"
 grefm_greece.018.t: "巴伐利亚军队离开[ROOT.GetCountry.GetName]"
 grefm_greece.018.d: "为了回应改革者的呼声，[SCOPE.sCharacter('grefm_otto_scope').GetFullName]已将皇家巴伐利亚辅助军团召回巴伐利亚。"
 grefm_greece.018.f: "虽然拯救财政是极为重要的，但我们必须得花时间构建一支完全由希腊人构成的军官队伍。"
 grefm_greece.018.a: "必要之举。"
 grefm_greece.019.t: "“食土者”的回归"
 grefm_greece.019.d: "在一次彰显皇恩浩荡的举措中，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]特赦了#gold 尼基塔拉斯#!，不仅解除其牢狱之苦，更委以护国重任。这位希腊独立战争的传奇英雄，因其对奥斯曼军队的凶猛攻势，曾被誉为”吞食土耳其人者“。如今，尼基塔拉斯不仅重获自由，昔日对摄政王的批评之语亦得到赦免。如今，他手持利剑，曾经针对摄政王的言论也已获得赦免。我们的对手们最好对他心存敬畏。"
 grefm_greece.019.f: "“吾唯剑傍身，愿为国而伸。”——N·斯塔马特洛普洛斯，1826年"
 grefm_greece.019.a: "他将很好地为[ROOT.GetCountry.GetName]服务。"
 grefm_greece.020.t: "希腊的巴伐利亚统治"
 grefm_greece.020.d: "巴伐利亚专制早期的艰辛困苦已经成为遥远的回忆，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]如今被誉为希腊国家的脊梁。权力越来越多地集中在王室周围，人民为未来的繁荣而祈祷。"
 grefm_greece.020.f: "正是维特尔斯巴赫家族的年轻君主为[ROOT.GetCountry.GetName]带来了和平。保留他们的统治权是正确的。"
 grefm_greece.020.a: "[ROOT.GetCountry.GetName]将实行开明统治。"
 grefm_greece.021.t: "寻找国王"
 grefm_greece.021.d: "西方认可的君主出人意料地遭到拒绝，这在外交界引起了震动。[ROOT.GetCountry.GetRuler.GetFullName]成立了一个监护政府，其明确目标是为希腊王室挑选一位合适的候选人。"
 grefm_greece.021.f: "被他们理想中的$grefm_greek$人唾弃后，欧洲各地的亲希腊者对希腊的合法性提出了质疑。"
 grefm_greece.021.a: "我们必须找到一个合适的人选。"
 grefm_greece.021.tt1: "推选一位[GetCulture('greek').GetName][concept_ruler]将改善我们与西方国家的关系。"
 grefm_greece.021.tt2: "推选一位[GetCulture('rhomaios').GetName][concept_ruler]将改善我们与#bold 俄罗斯#!的关系。"
 grefm_greece.022.t: "[GetCulture('greek').GetName]国王"
 grefm_greece.022.d: "随着$grefm_bavarocracy$被推翻，[ROOT.GetCountry.GetName]摆脱了欧洲的干涉。经过几个月的寻找，国民议会确定了一系列候选人，他们都有足够的贵族血统，可以合法地继承希腊王位。"
 grefm_greece.022.f: "从18世纪的希腊计划到19世纪的$grefm_megali_idea$，学者们一直设想重建后的希腊将领导复兴的东正教帝国。随着一位希腊本土人登上王位，这一梦想离实现越来越近。"
 grefm_greece.022.1: "卡波季斯第亚斯家族将夺回王位。"
 grefm_greece.022.tt1: "一位来自#yellow 卡波季斯第亚斯#!家族的贵族将登上王位。"
 grefm_greece.022.2: "马夫罗科扎托斯家族的成员将为国家服务。"
 grefm_greece.022.tt2: "一位来自#yellow 马夫罗科扎托斯#!家族的贵族将登上王位。"
 grefm_greece.022.3: "梅塔克萨斯家族堪当大任。"
 grefm_greece.022.tt3: "一名来自#yellow 梅塔克萨斯#!家族的贵族将登上王位。"
 grefm_greece.022.4: "伊普斯兰提斯家族是众望所归。"
 grefm_greece.022.tt4: "一名来自#yellow 伊普斯兰提斯#!家族的贵族将登上王位。"
 grefm_greece.023.t: "[GetCulture('rhomaios').GetName]国王"
 grefm_greece.023.d: "随着$grefm_bavarocracy$被推翻，[ROOT.GetCountry.GetName]摆脱了欧洲的干涉。经过几个月的寻找，国民议会确定了一系列候选人，他们都有足够的贵族血统，可以合法地继承希腊王位。"
 grefm_greece.023.f: "从18世纪的希腊计划到19世纪的$grefm_megali_idea$，学者们一直设想重建后的希腊将领导复兴的东正教帝国。随着一位希腊本土人登上王位，这一梦想离实现越来越近。"
 grefm_greece.023.1: "安杰洛斯家族将再次领导希腊人民。"
 grefm_greece.023.tt1: "一名来自#yellow 安杰洛斯#!家族的贵族将登上王位。"
 grefm_greece.023.2: "杜卡斯家族将延续其高贵的血统。"
 grefm_greece.023.tt2: "一名来自#yellow 杜卡斯#!家族的贵族将登上王位。"
 grefm_greece.023.3: "坎塔库泽努斯家族功绩最为卓著。"
 grefm_greece.023.tt3: "一名来自#yellow 坎塔库泽努斯#!家族的贵族将登上王位。"
 grefm_greece.023.4: "巴列奥略家族家族是唯一正统的皇位继承人。"
 grefm_greece.023.tt4: "一名来自#yellow 巴列奥略家族#!的贵族将登上王位。"
 grefm_greece.030.t: "民选君主"
 grefm_greece.030.d: "随着巴伐利亚君主制被推翻，政府要求举行公民投票，以确定王位的最佳人选。但最受欢迎的候选人要么不愿意，要么在法理上无法继承王位，要么是有问题的，让政府不得不任命一位新统治者。"
 grefm_greece.030.f: "希腊的统治者严重高估了希腊王冠对外国人的吸引力。许多贵族都拒绝接管这个落后的国家。最受青睐的候选人因为与$GBR_ADJ$、$FRA_ADJ$或$RUS_ADJ$有关系而被排除在外。"
 grefm_greece.030.1: "年轻的丹麦威廉王子将继承。"
 grefm_greece.030.2: "高贵的菲利普·德·弗兰德王子是个不错的选择。"
 grefm_greece.030.3: "热爱希腊的埃纳尔应该担任这一最高的职位。"
 grefm_greece.030.4: "关于外国君主的讨论已经够多了，一位$grefm_greek$人将登上王位。"
 grefm_greece.030.5: "朱塞佩·加里波底又怎么样呢？"
 grefm_greece.030.6: "我们将建立一个共和国。"
 grefm_greece.030.1.tt: "#yellow 丹麦的威廉#!成为统治者。#italic 这是史实选项。#!"
 grefm_greece.030.2.tt: "#yellow 菲利普·德·弗兰德#!成为统治者。"
 grefm_greece.030.3.tt: "#yellow 热爱希腊的埃纳尔#!成为统治者。"
 grefm_greece.030.5.tt: "#yellow 朱塞佩·加里波底#!成为统治者。"
 grefm_greece.031.t1: "希腊人的国王"
 grefm_greece.031.t2: "罗马人的国王"
 grefm_greece.031.t3: "希腊人的国王"
 grefm_greece.031.d1: "国民议会匆忙召集了一个代表团，并派遣该代表团向[ROOT.GetCountry.GetRuler.GetFullName]赐予王位。新任[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]抵达[ROOT.GetCountry.GetCapital.GetCityHubName]时，人们欢呼雀跃，希望[ROOT.GetCountry.GetName]能有第二次机会。"
 grefm_greece.031.d2: "随着巴伐利亚对[ROOT.GetCountry.GetName]的统治得到巩固，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]已被国民议会赋予绝对权力的合法性。"
 grefm_greece.031.d3: "希腊迎来了新的一天，由于[ROOT.GetCountry.GetRuler.GetFirstName]国王致力于捍卫[ROOT.GetCountry.GetName]的权利和繁荣，[ROOT.GetCountry.GetCapital.GetCityHubName]的群众不仅拥戴他为希腊国王，还拥戴他为全世界$grefm_greek$的合法统治者。"
 grefm_greece.031.f: "“欢喜吧，希腊同胞们！你们的烦恼已经结束，我们的祈祷已被听到！危险时代已经过去，在国家的根基被撼动之前，危险已经平息。”——#italic 埃夫诺米亚，5月24日#!"
 grefm_greece.031.a: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitleNoFormatting]万岁！"
 grefm_greece.032.t: "“该怪谁？”"
 grefm_greece.032.d: "改革者[SCOPE.sCharacter('intelligentsia_leader_scope').GetFullName]一向对君主制不满，为此撰写了一篇煽动性文章，谴责君主让自己偏爱的朋友担任首相，而不是真正得到民众支持的政治家。支持者和反对者都认为这篇文章既是对希腊的合理批评，也是对王室的严重侮辱。"
 grefm_greece.032.f: "“如果人民没有错，那么政客就有错，正如他人说，腐败是国家的问题，因为他们属于国家。而我们的回答是，如果希腊实行自治，那么政客的行为就是国家的行为，但由于《宪法》的倒行逆施和议会的形同虚设，希腊实际上是作为一个绝对君主制国家来治理的，因此这个非法政权所宣传的政治家也应该承担责任。”——尼古拉斯·特里库皮斯于1874年如是说"
 grefm_greece.032.a: "王室必须采取行动。"
 grefm_greece.033.t: "和谐国家"
 grefm_greece.033.d: "根据国民议会的表决，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已同意进行宪法和程序改革，限制王室在未获得议会多数票的情况下任命大臣的权利。"
 grefm_greece.033.f: "\"朕以为，凡受邀参与地方治理者，必先获国民代表之众望所归。朕欣然接纳议会之举，使此资格得以彰显。盖此乃国家和谐运转之根本，舍此则治理之道难行。\"——希腊国王乔治一世，1875年"
 grefm_greece.033.a: "“齐托·瓦西里耶夫斯！齐托·瓦西里耶夫卡！——齐托，齐托！”"
 grefm_greece.034.t: "“不幸的是，我们破产了。”"
 grefm_greece.034.d: "[ROOT.GetCountry.GetName]的领导人在全国范围内表现得无能且令人尴尬，还成功地使国家破产。尽管如此，几位政治家还是制定了一系列计划来恢复我们的财政信誉。"
 grefm_greece.034.f: "历史注释：总理查里劳斯·特里库皮斯的职业生涯以超支和大量腐败为标志，随后在议会面前，发表了他生涯中最著名的讲话（或许没有说过），不过这句话实际上并没有写入相关立法会议的会议记录，但却一直流传在民间。"
 grefm_greece.034.a: "我们必须重组我们的财务。"
 grefm_greece.034.b: "取消外债。"
 grefm_greece.035.t: "顽疾"
 grefm_greece.035.d: "虽然国家权力已经实现了中央集权，但在与奥斯曼帝国接壤的丘陵地带，土匪依然猖獗。最近，一伙强盗竟大胆劫持了一群在[ROOT.GetCountry.GetName]度假的贵族。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]虽然试图通过谈判支付赎金，但因该组织与[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]派出的使者之间出现误会，这些贵族最终惨遭屠杀。这一事件在国际上引起强烈反响。"
 grefm_greece.035.f: "“我们又要转移了……前方有埃夫佐尼卫兵的身影……我们恐怕凶多吉少……” ——英国格雷勋爵的侄子，维纳先生。"
 grefm_greece.035.a: "这是[ROOT.GetCountry.GetName]的污点 。"
 grefm_greece.035.tt: "历史注释：1870年4月，一群$GBR_ADJ$旅行贵族被匪徒劫持为人质。在谈判中出现失误，他们在希腊军队逮捕匪徒之前被杀害。这严重损害了希腊的国际地位和人民对王室的信心。"
 grefm_greece.040.t: "军事联盟"
 grefm_greece.040.d: "效仿历史上的民族主义革命，一群人数不多但意志坚定的年轻军官在国民议会内形成了激进派系。这进而引发了军方的不满，他们组建了“军事联盟”，要求清除军队中一切王室影响，并重新聚焦于$grefm_megali_idea$。许多人甚至开始鼓吹共和论调。"
 grefm_greece.040.f: "尽管政治光谱各异，军事同盟的参与者们均受到早期“日本团体”这一派系的启发，该团体以明治维新的改革者为名。“日本团体”采取反寡头政治的立场，而新成立的军事同盟则保持着强烈的精英治国理念。两者最终都以民族主义为名，助长了反君主制的气焰。"
 grefm_greece.040.a: "这可能会很麻烦。"
 grefm_greece.041.t: "军事游说者"
 grefm_greece.041.d: "[SCOPE.gsInterestGroup('armed_forces_scope').GetName]的成员打断了民族议会的会议，以提出军事联盟的要求。其中，他们要求彻底改革政治制度，旨在赋予军队权力以实现$grefm_megali_idea$的目标。"
 grefm_greece.041.f: "虽然军事联盟的成员来自不同的政治派别，但他们都受到早期“日本派”的启发，虽然“日本派”采取了反寡头的政治立场，但新成立的军事联盟一直坚持强势的精英政治立场。"
 grefm_greece.041.a: "也许他们说对了几件事。"
 grefm_greece.041.b: "他们应该掂量掂量自己的处境。"
 grefm_greece.045.t: "克里特英雄"
 grefm_greece.045.d: "在军事联盟不断积聚力量并直接威胁君主政体的同时，一位名不见经传的政治家[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]来到了 [SCOPE.sState('grefm_capital_scope').GetCityHubName]并提出了一个大胆的计划：利用他作为克里特斗争领袖的声望，此人打算掌握权力，并通过让步和自由改革来安抚军事联盟。"
 grefm_greece.045.f: "“在雅典完成学业后，我回到家，挂上了我的子弹带。在我不得不拿起武器反对土耳其政府之前，我在家乡的法庭上审理过的案件并不多。虽然我的父亲出生在希腊，但我被认为是一个奥斯曼帝国的臣民——一个叛国者——这只是因为我的母亲出生在土耳其国旗之下……我很快就陷入不得不做出选择的境地：我是应该做一名职业律师，偶尔兼职革命者，还是应该做一名职业革命者，偶尔兼职律师……而自然而然地，我成为了一名职业革命者。”——E.韦尼泽洛斯，1919"
 grefm_greece.045.a: "[ROOT.GetCountry.GetName]最终会有强有力的领导。"
 grefm_greece.045.b: "这人对政治了解多少？"
 grefm_greece.047.t: "保皇党胜利"
 grefm_greece.047.d: "尽管军事联盟充满了动力和热情，但忠诚于[ROOT.GetCountry.GetGovernment.GetName]的派系已经联合起来，终结了他们的野心。由于担心报复，许多成员已提前逃往国外。"
 grefm_greece.047.f: "军事联盟成立的目标是为军队争取更多权力。在未能夺取国民议会控制权的情况下，显然希腊国家面临着更紧迫的问题。"
 grefm_greece.047.a: "国家理应享有秩序。"
 grefm_greece.048.t: "古迪政变"
 grefm_greece.048.d: "厌倦了[ROOT.GetCountry.GetGovernment.GetName]内部无休止的争吵，军事联盟控制了$gbbf_armed_forces$，并将[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]从[ROOT.GetCountry.GetName]中赶下台。在国家被他们控制后，他们建立了一个军政府，其既定目标是在赫勒斯滂地区推行希腊人至上。"
 grefm_greece.048.f: "“政治家的首要职责，是将个人利益与党派利益置于国家整体利益之下。他同样有责任始终对所有人坦诚直言，不因忠诚可能引发的不满而退缩。领导者必须以身作则，绝对服从法律，否则如何让追随者接受他们的思想？这是我的根本原则……”——埃莱夫塞里奥斯·韦尼泽洛斯，1910年"
 grefm_greece.048.a: "[ROOT.GetCountry.GetName]最终会有强有力的领导。"
 grefm_greece.049.t: "民族领袖的崛起"
 grefm_greece.049.d: "在民众的大力支持下，[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]已经掌权，并提出了一系列激进的改革措施，旨在彻底改变希腊国家。得到人民的意愿和[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的勉强支持，[ROOT.GetCountry.GetName]将成为东方变革的先驱。"
 grefm_greece.049.f: "“……我建议军队应专注于紧迫的任务，即重组国家的军事力量。同时，我向革命提出建议，要求并推动召开修正议会，以修订宪法中那些经过近半个世纪的经验证明需要改革的条款……”——埃莱夫塞里奥斯·韦尼泽洛斯，1910年"
 grefm_greece.049.a: "今天标志着[ROOT.GetCountry.GetName]的崭新未来。"
