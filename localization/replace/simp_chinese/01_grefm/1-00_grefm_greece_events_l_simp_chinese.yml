 grefm_greece.060.t: "国民议会的性质"
 grefm_greece.060.d: "[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]及其支持者引发了一场激烈的辩论，一方是主张对希腊国家进行激进变革的韦尼泽洛斯修正派支持者，另一方则是要求彻底重写宪法的立宪派。"
 grefm_greece.060.f: "“我对王室惰性的批评被曲解为反王朝。恰恰相反，我认为展现对统治王朝的忠诚符合国家利益，因此我主张议会应保持修订职能，根据现代需求重塑立法基础，特别是在公共教育、劳工问题以及劳资关系等领域……\n\n因此，我将与那些致力于将希腊在道德和物质层面提升至其他现代国家水平，并使她成为东方文明与进步重要力量的人们携手合作。”——埃莱夫塞里奥斯·韦尼泽洛斯，1910年"
 grefm_greece.060.a: "承受修正主义者的指责。"
 grefm_greece.100.t: "修复啤酒厂"
 grefm_greece.100.d: "在新独立的希腊，一些巴伐利亚贵族跟随奥托国王定居在阿提卡，并带来了他们对啤酒的嗜好。为了与从巴伐利亚进口的啤酒竞争，约翰‑卡尔‑菲克斯在雅典建立了一家酿酒厂，以满足精英阶层的需求。"
 grefm_greece.100.f: "在奥托国王摄政时期，约翰·亚当·菲克斯开始了他的啤酒酿造事业，并很快发现这是一项极为赚钱的生意。在成为乔治一世国王的指定啤酒供应商后，他的儿子约翰·卡尔·菲克斯开创了菲克斯啤酒厂。这家啤酒厂随后在希腊啤酒市场上占据了主导地位，一直持续到20世纪60年代。"
 grefm_greece.100.a: "让啤酒流动起来！"
 grefm_greece.101.t: "希腊铁路"
 grefm_greece.101.d: "阿提卡与塞萨利的连接清楚地表明了[ROOT.GetCountry.GetName]从农业社会中转变的迹象。"
 grefm_greece.101.f: "历史注释：在19世纪80年代，希腊铁路建设的序幕在总理查里劳斯·特里库皮斯的监督下拉开。他负责监督雅典与新征服的塞萨利地区之间的首条铁路线的建设，随后又扩展至色雷斯地区。"
 grefm_greece.101.a: "前进！"
 grefm_greece.102.t: "希腊航空的诞生"
 grefm_greece.102.d: "在[SCOPE.sState('attica_scope').GetCityHubName]一个晴朗的日子里，希腊飞行家埃马努埃尔‑阿吉罗普洛斯成为第一个飞越雅典上空的希腊人，给下面的市民带来了欢乐和好奇。"
 grefm_greece.102.f: "历史注释：1912年2月8日，阿吉罗普洛斯成为第一个在希腊上空飞行的人。当天进行的第二次飞行中，搭载了当时的总理埃莱夫特里奥斯·韦尼泽洛斯，这一壮举深刻地影响了国家领导人，使他们认识到建立希腊空军的重要性。"
 grefm_greece.102.a: "对[ROOT.GetCountry.GetName]多么有意义的一天。"
 grefm_greece.103.t: "商业传统"
 grefm_greece.103.d: "自新石器时代晚期希腊文明首次踏足巴尔干半岛起，他们就在爱琴海的海上贸易中扮演了举足轻重的角色。希腊航运巨头们积累的财富如此巨大，以至于他们的物质支持成为了#italic 希腊启蒙运动#!的催化剂，最终引领至希腊革命的爆发。"
 grefm_greece.103.f: "在历史的长河中，希腊人一直在爱琴海上占据着海上霸权。在奥斯曼帝国的统治期间，希腊商人开始崭露头角，逐渐建立起自己的影响力。从16世纪到18世纪，随着大不列颠、法国和俄罗斯之间的政治博弈，东地中海的贸易被希腊人牢牢掌握，他们的商船穿梭于波光粼粼的海面，成为了地中海东部贸易的主宰者。"
 grefm_greece.103.a: "爱琴海属于希腊人。"
 grefm_greece.110.t: "赫普坦画派的衰落"
 grefm_greece.110.d: "自希腊独立以来，伊奥尼亚群岛上的艺术名校随着艺术家们的海外探索而日渐衰落。一个皇家委员会建议国家建立一所皇家艺术学校，以吸引希腊艺术家。"
 grefm_greece.110.f: "在君士坦丁堡陷落后的几个世纪里，伊奥尼亚群岛上的艺术家们继承了拜占庭艺术传统。随着希腊的独立以及意大利和$FRA_ADJ$艺术家的影响，许多艺术家开始转向浪漫主义，摆脱拜占庭艺术的束缚。"
 grefm_greece.110.a: "这是多么崇高的事业！"
 grefm_greece.110.b: "国家担负不起。"
 grefm_greece.111.t: "科派斯平原"
 grefm_greece.111.d: "随着希腊工程技术的进步，土地勘探人员建议，国家可以在阿提卡的科帕伊斯湖下开垦出肥沃的土地。"
 grefm_greece.111.f: "历史简介：3000多年前，迈锡尼人曾将科派斯湖的水抽干，这是史前工程的一项惊人壮举。千百年来，他们的石工工程逐渐失效，湖泊重新蓄水。沿湖两岸的村民经常抱怨洪水泛滥，在大量洪水流入湖中时，水位会升高。"
 grefm_greece.111.a: "我们将拭目以待。"
 grefm_greece.111.tt: "你现在将获得一个能够#bold 排干科派斯湖#!的决议。"
 grefm_greece.112.t: "收复科派斯湖"
 grefm_greece.112.d: "多年的努力终于结出硕果，科派斯湖已经变成了科派斯平原。如今，数不清的农民已经在湖床上开始了农业活动，希望这些平原能被世世代代耕种。"
 grefm_greece.112.f: "后来他们从我的德意志工程师朋友齐格勒那里得知，巴伐利亚人将希望寄托在排干科派斯湖的计划上。首先，这项伟大工程的公共开支将带来不少收益；其次，科派斯平原耕地的缓慢生产也将让他们腰包满满。” \n——P·帕帕纳乌姆，1873年"
 grefm_greece.112.a: "伟大的成就"
 grefm_greece.113.t: "城堡现身"
 grefm_greece.113.d: "随着科派斯湖湖水的退去，研究人员注意到湖中有一处凸起。虽然人们已经知道这个地方有一个古代遗迹，但考古局的专家们认为，这个遗迹可能在水位的不断消退的过程中发挥了更大的作用，并已请求对该区域进行挖掘。"
 grefm_greece.113.f: "这座名为“格拉”的遗址俯瞰着科派斯平原。在湖水被排干之前，该遗址一直被忽视，很有可能是早期希腊遗址"
 grefm_greece.113.a: "我们将拭目以待。"
 grefm_greece.114.t: "商业竞争"
 grefm_greece.114.d: "随着我们的舰队开始现代化，#yellow 比雷埃夫斯#!、#yellow 帕特雷#!和#yellow 锡拉#!的港口之间形成了激烈的竞争。每个港口都请求成为[ROOT.GetCountry.GetName]的主要海军枢纽。"
 grefm_greece.114.f: "在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]看来，每个港口城市都有其独特的优势。#yellow 比雷埃夫斯#!紧邻雅典，几乎可称为其郊区。#yellow 帕特雷#!坐落于伯罗奔尼撒半岛，易于防守，并且更便于通往欧洲。位于基克拉泽斯群岛的#yellow 叙拉#!在独立战争中曾扮演了重要角色。"
 grefm_greece.114.a: "比雷埃夫斯已经建成。"
 grefm_greece.114.b: "帕特雷可能更易防守。"
 grefm_greece.114.c: "叙拉的位置很好。"
 grefm_greece.119.t: "科佩斯填湖造地"
 grefm_greece.119.d: "科佩斯湖项目的首席工程师宣布，将从湖中开垦出几大块土地。"
 grefm_greece.119.f: "随着湖面的消退，附近村庄农民已经开始在土地上进行农业耕作。"
 grefm_greece.119.a: "好极了。"
 grefm_greece.120.t: "奥运会的重生"
 grefm_greece.120.d: "经过多年的政治和金融扯皮，奥运会在两千多年后首次举行。人们纷纷来到 [SCOPE.sState('attica_state').GetCityHubName]，体验仪式和活动。"
 grefm_greece.120.f: "“我宣布雅典第一届国际奥林匹克运动会开幕。国家万岁，希腊人民万岁！”"
 grefm_greece.120.a: "值得纪念的一天。"
 grefm_greece.120.tt: "举办奥运会需要200行政力"
 grefm_greece.121.t: "资助雅典皇家大学"
 grefm_greece.121.d: "为了发展希腊国家，[SCOPE.sCharacter('university_benefactor').GetFullName]国王提出了一项计划，要在[ROOT.GetCountry.GetName]开办第一所高等学府，其形式与爱奥尼亚学院相同。这项计划将为国家带来一笔不小的开销。"
 grefm_greece.121.f: "1837年，国王颁布敕令成立了雅典大学（当时名为奥托尼安大学）。虽然起初规模较小，但它代表了现代希腊在文化方面所迈出的一大步。如今，这所大学已成为巴尔干地区历史最悠久的高等学府。"
 grefm_greece.121.a: "多么崇高的事业！"
 grefm_greece.121.b: "国王知道他的诉求"
 grefm_greece.122.t: "国立大学校"
 grefm_greece.122.d: "随着[SCOPE.sState('university_state').GetCityHubName]的解放，[SCOPE.sCharacter('university_benefactor').GetFullName]建议重组法纳尔希腊东正教学院并向大众开放，以造福希腊人民。"
 grefm_greece.122.f: "君士坦丁堡帝国大学于公元 425年在狄奥多西二世皇帝的统治下成立，被称为#italic Universitas#!。它与欧洲式的大学不同，是一所高等学府，教授从法律、数学到哲学的各种学科。该学院设有 31 个教席，教授拉丁语和希腊语两种语言，旨在培养有能力的官僚来管理拜占庭国家。君士坦丁堡陷落后，该大学重组为现在的形式，为牧师和奥斯曼帝国的大臣服务。"
 grefm_greece.122.a: "我们将恢复希腊文化的荣耀。"
 grefm_greece.122.b: "我们将恢复希腊文化的荣耀。"
 grefm_greece.122.c: "一个无畏的尝试"
 grefm_greece.123.t: "妇女杂志"
 grefm_greece.123.d: "一位年轻的克里特妇女[SCOPE.sCharacter('kalliroi_scope').GetFullName]最近在[SCOPE.sState('grefm_capital_scope').GetCityHubName]创办了一份报纸。这份双周刊被命名为#italic 妇女杂志#!，帕伦甚至出席会议，谴责将妇女排除在生产劳动和政治舞台之外的做法。"
 grefm_greece.123.f: "“原则无国界，真理无国界。妇女权利问题在任何地方都是一样的；在任何地方都可以用两个词来概括：平等、公正。”——莱昂里歇尔"
 grefm_greece.123.a: "我们必须赋予妇女和儿童权利"
 grefm_greece.123.b: "女人就该老老实实去做家务"
 grefm_greece.123.tt: "卡利罗伊‑帕伦被公认为希腊女权运动的创始人。她出生于克里特岛，在雅典接受教育，创办了完全由女性经营的#italic 妇女杂志#!，成为在希腊全国传播女权主义信息的跳板。她出席了多次国际会议，并成立了多个致力于推进妇女事业的福利组织。不过，她并不直接支持妇女选举权，因为她担心这对于世纪之交的希腊来说过于激进。"
 grefm_greece.124.t: "希腊女权联盟"
 grefm_greece.124.d: "卡利罗伊‑帕伦发起的运动取得了成果，妇女的地位得到了提升，不再只是家庭主妇。此外，对童工的限制使希腊国家有机会改善下层人民的生活。随着对妇女言论的限制逐渐消失，一些领导人呼吁进一步改革，包括婚姻平等和选举权。"
 grefm_greece.124.f: "在整个19世纪末的第一波女权改革浪潮之后，女权主义者阿夫拉‑西奥多罗普罗成立了希腊女权联盟，明确提出要为妇女争取选举权。这一事业最终分两个阶段取得了成功：第一阶段是在1930年为识字妇女争取选举权，第二阶段是在1952年为所有妇女争取选举权。女权主义的努力使妇女逐渐从沉默的家庭主妇转变为希腊民族主义发展的积极参与者。"
 grefm_greece.124.a: "我们会继续推动妇女平权"
 grefm_greece.124.b: "我们应该为已经取得的成就而自豪。"
 grefm_greece.130.t: "科林斯运河"
 grefm_greece.130.d: "在[SCOPE.sState('corinth_canal_site').GetNameNoFormatting]详细调查结束后，[SCOPE.sCharacter('ig_intelligentsia_scope').GetFullName]宣布有可能完成已故政治家伊奥尼斯‑卡波迪斯特里阿斯设想的大胆计划：一条横跨科林斯的海上运河。"
 grefm_greece.130.f: "自古希腊时代以来，科林斯地峡一直是连接伯罗奔尼撒半岛和大希腊的重要通道。凭借我们的现代创新技术，或许有可能将爱奥尼亚海和爱琴海连接起来，而历史上的尝试都失败了。"
 grefm_greece.130.a: "开工"
 grefm_greece.130.tt: "你现在可以开始修建科林斯运河了。"
 grefm_greece.131.t: "科林斯运河建成"
 grefm_greece.131.d: "经过多年的努力，我们成功开凿了一条横跨科林斯的运河，爱琴海和爱奥尼亚海的海水现在在地峡上交汇。"
 grefm_greece.131.f: "这条运河拥有高耸的石灰石城墙，大大缩短了从色雷斯到西欧的航程。"
 grefm_greece.131.a: "希腊工程的奇迹"
 grefm_greece.132.t: "皇宫"
 grefm_greece.132.d: "经过多年的辩论，在 [SCOPE.sState('palaia_anaktora_site').GetCityHubName]建造一座王室官邸的提案已被提出。"
 grefm_greece.132.f: "这座皇宫由巴伐利亚建筑师弗里德里希‑冯‑盖特纳设计，并由巴伐利亚路德维希一世出资建造，旨在提高王室的声誉。"
 grefm_greece.132.a: "很好的提议"
 grefm_greece.132.b: "这是笔无用的开销"
 grefm_greece.161.t: "唐·帕西菲科事件"
 grefm_greece.161.d1: "今天早上，一位海外公民#yellow 唐·帕西菲科#!发来了一封信报告说，他的住所被希腊暴徒洗劫一空。作为我国驻[SCOPE.sCountry('greece_scope').GetName]外交使团的前成员，他请求我们进行干预。我们的外交官建议通过担保人[SCOPE.sCountry('uk_scope').GetName]提出请求。"
 grefm_greece.161.d2: "[SCOPE.sCountry('portugal_scope').GetName]请求我们介入[SCOPE.sCountry('greece_scope').GetName]的一个小外交僵局。他们的前葡萄牙领事#yellow 唐·帕西菲科#!在家中遭到一群暴徒袭击，葡萄牙政府要确保对#yellow 唐·帕西菲科#!的赔偿。"
 grefm_greece.161.d3: "一群暴徒烧毁了葡萄牙前葡萄牙领事#yellow 唐·帕西菲科#!的家，他利用自己在[SCOPE.sCountry('portugal_scope').GetName]和[SCOPE.sCountry('uk_scope').GetName]政府中的关系，正式要求王室对其财产损失和人身侮辱进行赔偿。"
 grefm_greece.161.f: "雅典复活节的传统是焚烧犹大肖像。然而今年王室禁止了这一习俗，以免侮辱正在首都访问的#yellow 罗斯柴尔德男爵#!。令人困惑的是，城里的居民却错误地将这一问题归咎于前葡萄牙领事#yellow 唐·帕西菲科#!，并搜查了他的住所。"
 grefm_greece.161.por1: "我们将寻求平反。"
 grefm_greece.161.por2: "这不关我们的事。"
 grefm_greece.161.gbr1: "他们的要求是正当的。"
 grefm_greece.161.gbr2: "我们不能把责任推到希腊政府身上。"
 grefm_greece.161.gre1: "我们将纠正这一错误。"
 grefm_greece.161.gre2: "他们算哪根葱敢讨价还价啊！？"
 grefm_greece.180.t: "乔纳斯·金的辩护"
 grefm_greece.180.d: "[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]是一位来自[SCOPE.sCountry('usa_scope').GetName]的年轻且狂热的传教士，在[ROOT.GetCountry.GetName]传播加尔文教义，引起了公愤，其他神职人员要求[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]立即采取行动。"
 grefm_greece.180.f: "至少在纸面上，[ROOT.GetCountry.GetName]的公民享有宗教自由。然而在实践中，希腊被[SCOPE.gsInterestGroup('devout_scope').GetName]所主导。在因不尊重[ROOT.GetCountry.GetStateReligion.GetName]圣像而被指控为异端之后，他出版了#italic 《乔纳斯·金的辩护》#!，在书中辩称早期教父拒绝圣像。因此他被打上了破坏圣像运动的辩护者的标签，并引起了民众的愤怒。"
 grefm_greece.180.a: "镇压这个异端！"
 grefm_greece.180.b: "他并无恶意。"
 grefm_greece.181.t: "在亚略巴古前的演说"
 grefm_greece.181.d: "巡回传教士[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]被送上[ROOT.GetCountry.GetName]高等法院，接受异端邪说和诽谤国家的指控。经过迅速审理，法院已裁定该传教士将被流放出希腊国境。"
 grefm_greece.181.f: "“我是一名福音派传教士，是上帝之言传播者；是一名最正统的基督徒……我的书中没有提到关于玛利亚、变体论和圣像的事情；但提到了东方教会最杰出的人物，从圣伊皮法尼乌斯、金口若望、圣巴西略、圣依勒内、再到克莱门斯和尤西比乌斯。”——乔纳斯·金于1843年在亚略巴古作证。"
 grefm_greece.181.a: "谢天谢地！"
 grefm_greece.182.t: "乔纳斯·金归来"
 grefm_greece.182.d: "传教士[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]察觉到东正教与天主教之间的紧张关系有所缓和，于是再次前往[ROOT.GetCountry.GetName]。然而[SCOPE.gsInterestGroup('devout_scope').GetName]的领导人对他的回归感到非常愤怒。"
 grefm_greece.182.f: "尽管金的布道方式不那么激进，但他还是遭到了希腊教会的反对，主教们谴责他在希腊的存在是对国家的诅咒。"
 grefm_greece.182.a: "逮捕这个叛徒。"
 grefm_greece.182.b: "他不构成任何威胁。"
 grefm_greece.182.tt: "各[GetReligion('protestant').GetName]省份将会对这一行为表示赞赏。"
 grefm_greece.183.t: "外国为乔纳斯·金代祷"
 grefm_greece.183.d: "为了给针对[SCOPE.sCharacter('grefm_jonas_scope').GetFullName]的迫害行为伸张正义，[SCOPE.sCountry('usa_scope').GetName]的外交官与国王进行了斡旋，请求 [ROOT.GetCountry.GetRuler.GetFullName]对传教士宽大处理。"
 grefm_greece.183.f: "乔纳斯被指控“亵渎教会”，面临着监禁，罪名是传播异端邪说和煽动叛乱，鉴于围绕审判的微妙政治局势，政治家们转而通过 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]来决定希腊的下一步行动。"
 grefm_greece.183.a: "我们将寻求和解。"
 grefm_greece.183.b: "国家不能容忍这种侮辱。"
 grefm_greece.090.t: "摄政委员会"
 grefm_greece.090.d: "独立之后，[ROOT.GetCountry.GetName]政局动荡不安，最终酿成了总督#yellow 伊奥安尼斯·卡波迪斯特里亚斯#!遇刺的悲剧。为避免国家陷入内战的深渊，$gbbf_great_powers$扶持了一位来自巴伐利亚的天主教国王来治理新生的[ROOT.GetCountry.GetAdjectiveNoFormatting]政权。\n\n虽然年轻的国王[ROOT.GetCountry.GetRuler.GetFullName]最近已达到执政年龄，但他的统治之路却困难重重。其总理大臣[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]通过政治手腕积累了巨大权力，几乎掌控了整个希腊的政治命脉。"
 grefm_greece.090.f: "“伟大的希腊王啊！古希腊曾用其灿烂的文明之光照亮了德意志的心灵，而今天，德国决心以更加丰厚的文化回报这份精神遗产。我们由衷敬仰您，因为您是那唤醒地球上这最伟大民族尊严与荣光的救星！”——P·苏特索斯，1837年"
 grefm_greece.090.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 grefm_greece.091.t: "避免危机"
 grefm_greece.091.d: "面对民众的不信任，尽管[SCOPE.gsInterestGroup('ig_landowners_scope').GetName]的阴谋诡计层出不穷，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]限制了王权并给予[ROOT.GetCountry.GetName]公民以自由。然而，许多人继续呼吁进一步削弱贵族的权力和地位，使希腊成为海外希腊人民的希望灯塔。"
 grefm_greece.091.f: "我们推翻土耳其压迫者，不是让一个日耳曼压迫者取而代之。"
 grefm_greece.091.a: "仁慈的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]万岁！"
 grefm_greece.092.t: "宪法万岁！"
 grefm_greece.092.d: "[SCOPE.sCharacter('grefm_otto_scope').GetFullName]违背民众的要求，无视对[ROOT.GetCountry.GetName]臣民的义务，解除了[GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName]的职务，建立了对希腊国家的君主专制统治。"
 grefm_greece.092.f: "“在我这个职位上，既没有国家总理，也没有首相，我感到一种新的动力，迫使我更加积极地投入到我的职责中，因为如今这个正义事业的成败比以前更加依赖于我。”——希腊国王奥托，1838年写给父亲巴伐利亚的路德维希"
 grefm_greece.092.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将会取得君权。"
 grefm_greece.093.t: "希腊的真正信仰"
 grefm_greece.093.d: "迫于臣民的压力，[ROOT.GetCountry.GetRuler.GetFirstName]国王已同意皈依真正的[GetReligion('orthodox').GetName]信仰。然而，仍有许多人怀疑这次所谓[concept_conversion]的诚意。"
 grefm_greece.093.f: "$grefm_greek$人民毋庸置疑地与[GetReligion('orthodox').GetName]基督信仰密不可分，这引发了排外浪潮。从教士到农民，人们每天都在担心，确保统治者信仰[GetReligion('orthodox').GetName]可能是避免$gbbf_devout$影响力衰退的最佳途径。"
 grefm_greece.093.a: "王室将加入教会。"
 grefm_greece.096.t: "失宠的暴君"
 grefm_greece.096.d: "王宫和[GetLawType('law_autocracy').GetName]的政治结构已经崩溃，[SCOPE.sCharacter('armed_forces_leader_scope').GetFullName]骑马来到王宫抓捕了[ROOT.GetCountry.GetRuler.GetFirstName]，并确保了宪法的通过。尽管国王坚持反对，但议会早在宣布起义之前就已经起草了这份文件。"
 grefm_greece.096.f: "“我放弃了所有特权；我不再是国王。现在我的大臣、国民议会和宪法都被强加于我，我的军队也不再听从我的指挥。在希腊，宪法无非就是掠夺。”——1843年，希腊的奥托如是说"
 grefm_greece.096.a: "宪法万岁！"
 grefm_greece.097.t: "国王奥托倒台"
 grefm_greece.097.d: "民众受够了$grefm_bavarocracy$派系的操控，[ROOT.GetCountry.GetCapital.GetCityHubName]爆发了起义，他们推翻了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]。最后一次被人看见时，他正登上一艘驶向北方的外国双桅纵帆船。随着旧[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的离去，临时政府要求民众投票选出他的继任者。"
 grefm_greece.097.f: "“没有印好的选票？这是在开玩笑吗？”\n\n“是这样的，先生。您想让谁登基，只需写下他的名字，并在一小时内交给我。”"
 grefm_greece.097.a: "[ROOT.GetCountry.GetName]将废除[GetLawType('law_monarchy').GetName]。"
 grefm_greece.097.b: "关于外国君主的讨论已经够多了，一位$grefm_greek$人将登上王位。"
 grefm_greece.097.1: "[SCOPE.sCountry('denmark_scope').GetAdjective]领主，格吕克斯堡的威廉，应当登上王位。"
 grefm_greece.097.2: "高贵的[SCOPE.sCountry('belgium_scope').GetAdjective]菲利普·德·弗兰德王子是个不错的选择。"
 grefm_greece.097.3: "我们的赞助者，[SCOPE.sCountry('swiss_scope').GetName]的艾纳尔，配得上这个职位。"
 grefm_greece.097.4: "[SCOPE.sCountry('uk_scope').GetAdjective]公爵阿尔弗雷德出身高贵。"
 grefm_greece.097.5: "一位[SCOPE.sCountry('france_scope').GetAdjective]贵族将高举火炬。"
 grefm_greece.097.6: "尼古拉斯王子是[SCOPE.sCountry('russia_scope').GetName]的完美人选。"
 grefm_greece.097.9: "加里波第吧，最坏还能发生什么？"
 grefm_greece.097.1_tt: "一位[SCOPE.sCountry('denmark_scope').GetAdjective][GetIdeology('ideology_reformer').GetName]王子，威廉·冯·格吕克斯堡，会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.2_tt: "一位[SCOPE.sCountry('belgium_scope').GetAdjective][GetIdeology('ideology_modernizer').GetName]王子，菲利普·德·弗兰德，会成为#bold $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.3_tt: "一位[SCOPE.sCountry('swiss_scope').GetAdjective][GetIdeology('ideology_humanitarian_royalist').GetName]贵族，亲希腊的埃纳尔，会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.4_tt: "一位[SCOPE.sCountry('uk_scope').GetAdjective][GetIdeology('ideology_market_liberal').GetName]王子，爱丁堡公爵阿尔弗雷德，会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.5_tt: "一位[GetIdeology('ideology_moderate').GetName][SCOPE.sCountry('france_scope').GetAdjective]王子会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.5_tt_bourbon: "一位[SCOPE.sCountry('france_scope').GetAdjective]#b 正统派#![GetIdeology('ideology_traditionalist').GetName]王子会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#! "
 grefm_greece.097.5_tt_orleans: "一位[SCOPE.sCountry('france_scope').GetAdjective]#b 奥尔良派#![GetIdeology('ideology_market_liberal').GetName]王子会成为#b $grefm_king_of_the_hellenes$#!#b 乔治一世#!"
 grefm_greece.097.5_tt_bonaparte: "一位[SCOPE.sCountry('france_scope').GetAdjective]#b 波拿巴派#![GetIdeology('ideology_jingoist_leader').GetName]王子会成为$grefm_king_of_the_hellenes$#b 乔治一世#!"
 grefm_greece.097.6_tt: "一位[SCOPE.sCountry('russia_scope').GetAdjective][GetIdeology('ideology_royalist').GetName]王子，尼古拉·尼古拉耶维奇，会成为$grefm_king_of_the_hellenes$#b 乔治一世#!"
 grefm_greece.097.9_tt: "#bold 尼古拉斯·尼古拉耶维奇#!会成为$grefm_king_of_the_hellenes$#b 乔治一世#!"
 grefm_greece.098.t: "奥托王朝"
 grefm_greece.098.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]成功带领国家度过了动荡的早期，现在成为了一名有能力的政治家，掌管着一个稳定的政府。"
 grefm_greece.098.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]喝着咖啡翻阅了他早上的信件。和往常一样，都是些路边劫匪、腐败丑闻和派系纠纷的报告。但在沉闷的报告中有了一丝变化的迹象。近期的警察政策改变、大学的建立和现代官僚机构的发展产生了效果。很有很多工作要做，但年复一年，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]清晨的工作逐渐变得愉快起来。"
 grefm_greece.098.a: "新伯里克利！"
 grefm_greece.098.b: "新亚历山大！"
 grefm_greece.099.t: "希腊人的教化王"
 grefm_greece.099.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]成功带领国家度过了动荡的早期，现在成为了一名有能力的政治家，掌管着一个稳定的政府。"
 grefm_greece.099.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]喝着咖啡翻阅了他早上的信件。和往常一样，都是些路边劫匪、腐败丑闻和派系纠纷的报告。但在沉闷的报告中有了一丝变化的迹象。近期的警察政策改变、大学的建立和现代官僚机构的发展产生了效果。很有很多工作要做，但年复一年，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]清晨的工作逐渐变得愉快起来。"
 grefm_greece.099.a: "新伯里克利！"
 grefm_greece.099.b: "新亚历山大！"
 grefm_greece.041.c: "逮捕这些抗命的恶犬！"
 grefm_greece.041.tt: "[SCOPE.sCharacter('armed_forces_leader_scope').GetFullName]将辞去[SCOPE.sCharacter('armed_forces_leader_scope').GetHerHis]的职务"
 grefm_greece.051.b: "$coup_pulse_events.2.b$"
 grefm_greece.052.b: "$coup_pulse_events.3.b$"
 grefm_greece.053.b: "$coup_pulse_events.4.b$"
 grefm_greece.054.b: "$coup_pulse_events.5.b$"
 grefm_greece.055.b: "$coup_pulse_events.6.b$"
 grefm_greece.056.b: "$coup_pulse_events.7.b$"
 grefm_greece.057.b: "$coup_pulse_events.8.b$"
 grefm_greece.058.b: "$coup_pulse_events.9.b$"
 grefm_greece.059.b: "$coup_pulse_events.10.b$"
 grefm_greece.060.b: "彻底重构国家。"
 grefm_greece.061.t: "重振国家"
 grefm_greece.061.d: "[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName]提出的首批改革迅速聚焦于国家机构的重组。韦尼泽洛斯派决心使[ROOT.GetCountry.GetName]彻底挣脱其奥斯曼帝国历史的最后残留，正着手筹备涵盖土地政策、司法改革及官僚体系专业化的各项改革。"
 grefm_greece.061.f: "“我不承诺政府能在一日之间开创黄金时代；沉疴积重，疗程必久；但我能保证的是，疗法必将严酷彻底。”——埃莱夫塞里奥斯·韦尼泽洛斯，1910年"
 grefm_greece.061.a: "人民理应拥有一个称职的国家。"
 grefm_greece.062.t: "重组军队"
 grefm_greece.062.d: "尽管军方影响力过强，[SCOPE.sCharacter('grefm_venizelos_scope').GetLastName]仍将军队视为希腊民族认同与国家安全不可或缺的组成部分。目前其已提出多项建议，旨在提升[SCOPE.gsInterestGroup('armed_forces_scope').GetName]的兵力规模、装备水平和训练质量，从而使[ROOT.GetCountry.GetName]能够在巴尔干地区施加影响力。"
 grefm_greece.062.f: "“希腊军队真的准备好了吗？希腊能派出多少兵力投入战场？”"
 grefm_greece.062.a: "军队必须保卫希腊人的国家。"
 grefm_greece.063.t: "社会进步"
 grefm_greece.063.d: "在提出官僚改革要求之后，韦尼泽洛斯派开始推动针对妇女和儿童地位的改革。他们认为妇女和儿童是国家未来的根基，主张儿童应属于学校，而妇女应在工厂中获得更多权利。"
 grefm_greece.063.f: "与以往政府不同，韦尼泽洛斯派认为，尽管让儿童离开工厂会在短期内影响生产，但这些变革是对希腊国家未来的投资。"
 grefm_greece.063.a: "我们不能沉湎于过去。"
 grefm_greece.064.t: "无知的刁民"
 grefm_greece.064.d: "[ROOT.GetCountry.GetName]长期以来一直饱受文盲率高和农村贫困这两大问题的困扰。尽管#italic 法纳尔人#!和东正教会的英勇努力使希腊语得以延续，但韦尼泽洛斯派认为，现在是时候让教育和文化不再仅限于城市精英阶层了。"
 grefm_greece.064.f: "效仿法国人和美国人的做法，韦尼泽洛斯派致力于将文明之光带给全体希腊人。"
 grefm_greece.064.a: "人民必须摆脱农村的束缚。"
 grefm_greece.065.t: "资助艺术"
 grefm_greece.065.d: "除了实现国家与军队现代化的目标外，韦尼泽洛斯派还提出了在[ROOT.GetCountry.GetNameNoFlag]开始资助艺术的计划"
 grefm_greece.065.f: "在古代和中世纪时期，希腊一直以输出知识和艺术品而闻名。韦尼泽洛斯派通过支持人文学科，希望借此重现奥斯曼统治前希腊文化的辉煌。"
 grefm_greece.065.a: "我国一直是一个文化大国。"
 grefm_greece.069.t: "希腊国家复兴"
 grefm_greece.069.d: "尽管充满争议且具有煽动性，但无人能否认韦尼泽洛斯派改革希腊国家的努力已获成功。从行政管理到公民权利，[ROOT.GetCountry.GetName]已准备就绪，将再次成为东方文明的灯塔。"
 grefm_greece.069.f: "“我们的民族万岁！\n韦尼泽洛斯万岁！\n大希腊万岁！”"
 grefm_greece.069.a: "我们的未来依然光明！"
 grefm_greece.162.t: "保加利亚访客"
 grefm_greece.162.d: "今日午后，[ROOT.GetCountry.GetRuler.GetFirstName]国王在[SCOPE.sState('greece_capital_scope').GetCityHubName]的宫廷迎接了[SCOPE.sCountry('bulgaria_scope').GetName]的[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]亲王。一番引见后，[SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName]亲王热切陈词，主张泛巴尔干合作以对抗苏丹。亲王几乎带着焦虑，等候着国王的答复。"
 grefm_greece.162.f: "许多希腊人既居住在保加利亚境内，也定居于其南至色雷斯的更大宣称疆域中。亲王或许承诺他们在保加利亚统治下会受到公正对待，但这难以平息当前统治下遭受不公待遇的传闻。尽管如此，宫廷中仍有人认为，对抗土耳其苏丹政府的联盟或许是确保[ROOT.GetCountry.GetName]未来前途的唯一途径。"
 grefm_greece.162.a: "我们欢迎任何支持希腊事业的人。"
 grefm_greece.162.tt: "现在来解决宣称重叠的问题……"
 grefm_greece.162.b: "斯拉夫人在这里找不到朋友。"
 grefm_greece.070.t: "一部真正的宪法"
 grefm_greece.070.d: "通过改革和系统化民主价值观，韦尼泽洛斯派制定了一部宪法，其宏伟程度足以媲美$grefm_bavarocracy$早期宪政主义者最宏大的梦想。专制和专横统治的时代已经一去不复返了。"
 grefm_greece.070.f: "“一个政党的建立不应仅以人数为依据，而应以道德原则为基础；若缺乏道德原则，政党既无法成就有益之事，也无法赢得信任。”——埃莱夫塞里奥斯·韦尼泽洛斯"
 grefm_greece.070.a: "[ROOT.GetCountry.GetName]将获得自由！"
 grefm_greece.071.t: "称职的官僚机构"
 grefm_greece.071.d: "通过大刀阔斧的改革和人才招募，[ROOT.GetCountry.GetName]已组建了一支名副其实的会计师和文员大军，足以满足希腊国家未来的需求。"
 grefm_greece.071.f: "“政治家的首要职责，就是将个人利益和党派利益置于国家整体利益之下……政治家必须将权力视为实现崇高且爱国目标的手段，而非目的。”——埃莱夫塞里奥斯·韦尼泽洛斯，1910年"
 grefm_greece.071.a: "国家必须为人民服务。"
 grefm_greece.072.t: "一支强大的军队"
 grefm_greece.072.d: "希腊军队以西方军队的强大实力和严明纪律为榜样，已从革命时期的部落民兵蜕变为一支现代化且强大的战斗力量，使[ROOT.GetCountry.GetName]具备了向境外投射实力的能力。"
 grefm_greece.072.f: "“去伦敦有什么用？英国首都的浓雾对我们毫无助益；我们不如在恰塔尔贾会面，在炮火的掩护下拟定和平条款。”——埃莱夫塞里奥斯·韦尼泽洛斯，1913年"
 grefm_greece.072.a: "[ROOT.GetCountry.GetName]无所畏惧。"
 grefm_greece.073.t: "现代的社会"
 grefm_greece.073.d: "凭借耐心和稳健的作风，韦尼泽洛斯派成功推动了[ROOT.GetCountry.GetName]对妇女和儿童态度的转变。"
 grefm_greece.073.f: "这些变化将使女性不再仅仅是温顺的家庭主妇，使儿童不再仅仅是可有可无的顽童。"
 grefm_greece.073.a: "这些变化是理所应当的。"
 grefm_greece.074.t: "受教育的民众"
 grefm_greece.074.d: "韦尼泽洛斯派为希腊人民建立现代化教育体系的努力，最终促成了一个健全的公共教育体系的诞生。"
 grefm_greece.074.f: "通过教导民众识字，我们将既能守护我们的文化遗产，又能为工业化的未来奠定基础。"
 grefm_greece.074.a: "干得漂亮！"
 grefm_greece.075.t: "高雅文化"
 grefm_greece.075.d: "韦尼泽洛斯派通过发扬古希腊文化与艺术中的浪漫主义理想，使[ROOT.GetCountry.GetNameNoFlag]成为现代社会中高雅文化的首要输出国之一。"
 grefm_greece.075.f: "“战时英勇，和平时期亦显功绩，\n你堪称第二伯里克利！”\n——节选自罗纳德·巴罗斯1913年所作的#italic 《希腊人致克里特人韦尼泽洛斯的颂歌》#!"
 grefm_greece.075.a: "[ROOT.GetCountry.GetNameNoFlag]应当成为优雅的典范。"
 grefm_greece.080.t: "第三希腊"
 grefm_greece.080.d: "突如其来的政治变动席卷了$gbbf_armed_forces$的建制。[SCOPE.sCharacter('ioannis_metaxas_scope').GetFullName]作为一名职业将军，通过煽动民众对自由主义可能导致国家衰弱的担忧，一跃成为瞩目人物。迄今为止，他已在军方权力核心中建立了令人担忧的权力基础。"
 grefm_greece.080.f: "“致国王\n\n致武装部队\n\n致希腊人民\n\n兄弟般的军队和人民正遭受着人民专制的压迫……为从这种专制中夺回自由，我们向国王发出呼吁，要求立即罢免专制政府，以恢复法治……国王万岁，希腊万岁。”——干尼亚广播电台，宣布政变企图，1938年7月28日"
 grefm_greece.080.a: "[SCOPE.sPoliticalMovement('grefm_fascist_scope').GetName]已抵达[ROOT.GetCountry.GetNameNoFlag]"
 grefm_greece.081.t: "[ROOT.GetCountry.GetName]的阿基戈斯"
 grefm_greece.081.d: "梅塔克萨斯派所提出的宏伟抱负，随着其改革计划的成功而结出了硕果。在国民议会前，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]正式宣布“第三希腊”的诞生。"
 grefm_greece.081.f: "“自8月4日起，希腊便成为了一个反共国家、一个反议会国家、一个极权国家。这是一个以农民和工人为基础的国家，因此也是反寡头统治的。当然，并没有某个特定的政党来执政。这个政党就是全体人民，除了那些顽固不化的共产主义者和反动的旧政党政客。”——约安尼斯·梅塔克萨斯"
 grefm_greece.081.a: "[SCOPE.sCharacter('grefm_fascist_leader_scope').GetFirstName]是第二$gbbf_bio_aristotles$！"
 grefm_greece.081.b: "[SCOPE.sCharacter('grefm_fascist_leader_scope').GetFirstName]是新$gbbf_bio_belisarius$！"
 grefm_greece.082.t: "[GetIdeology('ideology_gbbf_metaxist').GetName]运动的失败"
 grefm_greece.082.d: "尽管梅塔克萨斯派采取了激进的政治手段，但在争取控制[ROOT.GetCountry.GetNameNoFlag]的努力中却未能取得进展。虽然他们可能对希腊政坛产生过影响，但他们对该国未来的影响，充其量也只是个未知数。"
 grefm_greece.082.f: "“除了在阴谋诡计方面颇具天赋外，梅塔克萨斯将军并未表现出任何从事政治生涯的资质。他缺乏稳重，且容易投机取巧，这点与他大多数同胞如出一辙。他‘精明’——这正是美国人通常赋予该词的含义。面对政治对手，他的态度时而示好，时而威胁。”——英国公使馆成员本廷克先生致柯兹伦先生，雅典，1923年7月4日"
 grefm_greece.082.a: "被遗忘是他们最好的归宿。"
 grefm_greece.083.t: "传统支柱"
 grefm_greece.083.d: "通过将君主制和[GetReligion('orthodox').GetName]确立为国家法律框架的核心，梅塔克萨斯派宣布恢复希腊民族的两大“支柱”。"
 grefm_greece.083.f: "“国家、忠诚、家庭与宗教”"
 grefm_greece.083.a: "$gbbf_armed_forces$将领导国家。"
 grefm_greece.083.b: "$gbbf_devout$将以信仰引领我们。"
 grefm_greece.083.c: "[SCOPE.sCharacter('grefm_facist_leader_scope').GetFullName]将领导国家！"
 grefm_greece.084.t: "镇压异见"
 grefm_greece.084.d: "国家权力的巩固使[SCOPE.sCharacter('grefm_fascist_leader_scope').GetFullName]得以巩固其对媒体的控制。唯一剩下的问题是，任何受控的反对派的未来将会如何？"
 grefm_greece.084.f: "”我已经决定掌握拯救希腊于威胁她的灾难所需的一切权力。”——伊奥尼斯·迈塔克萨斯"
 grefm_greece.084.a: "允许象征性反对。"
 grefm_greece.084.b: "我们绝不容忍任何异议。"
 grefm_greece.085.t: "希腊属于希腊人"
 grefm_greece.085.d: "通过对公民身份和移民法的全面改革，以及一项积极的同化计划，[SCOPE.sCharacter('grefm_fascist_leader_scope').GetFullName]为推行希腊身份认同奠定了基础。现在，国家必须决定如何处理其少数族裔……"
 grefm_greece.085.f: "“我将希腊的尊严置于一切之上。”——伊奥尼斯·梅塔克萨斯，1940年8月28日"
 grefm_greece.085.a: "不久之后，我们的全体国民都将变成希腊人。"
 grefm_greece.085.b: "遵从信仰即可"
 grefm_greece.086.t: "道德社会"
 grefm_greece.086.d: "随着一套由省份主导、引领社会迈向更加公正与道德的制度框架的建立，梅塔克萨斯派的进步目标已得以实现。"
 grefm_greece.086.f: "“我受到人民如此的爱戴。我该如何描述这些情感与奉献呢。但我仍保持谦逊，因为唯一伟大的存在是上帝，而对于希腊来说，就是它的人民。”——摘自约安尼斯·梅塔克萨斯日记"
 grefm_greece.086.a: "道德的生活就是正当的生活。"