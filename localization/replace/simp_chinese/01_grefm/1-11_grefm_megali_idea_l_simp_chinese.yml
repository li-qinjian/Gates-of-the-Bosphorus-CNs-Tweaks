 grefm_annex_samos_desc: "自独立战争以来，萨摩斯岛一直拒绝臣服于高门，也许我们应该欢迎他们加入希腊。"
 grefm_annex_trabzon_name: "吞并特拉布宗"
 grefm_annex_trabzon_desc: "特拉布宗在拜占庭陷落后仍坚守了数年。凭借耐心的外交手段，他们或许能与希腊国家重新统一。"
 grefm_annex_cappadocia_name: "吞并卡帕多基亚"
 grefm_annex_cappadocia_desc: "自希腊化时代以来，卡帕多西亚高地一直居住着希腊人。我们通过一些谈判，可以让他们回归希腊大家庭。"
 grefm_annex_theodoro_name: "吞并狄奥多罗"
 grefm_annex_theodoro_desc: "狄奥多罗曾是君士坦丁堡陷落后幸存下来的几个小城邦之一。今天，仍然有希腊人会仍然称呼这个它为家园，我们可以协商让与希腊重新团聚。"
 grefm_form_byz_name: "建立#bold $BYZ$"
 grefm_balkans_triumph_name: "为[GetGeographicRegion('geographic_region_balkan_highlands').GetName]举办一场胜利庆典"
 grefm_balkans_triumph_desc: "马其顿及其周边地区坐落在巴尔干半岛的腹地，是亚历山大大帝建立希腊首个帝国的核心所在。没有我们的古老本土，我们绝不能指望帝国得以复兴。"
 grefm_aegean_triumph_name: "为[GetGeographicRegion('geographic_region_aegean_sea').GetName]举办凯旋庆典"
 grefm_aegean_triumph_desc: "四千多年来，希腊人民始终在爱琴海的碧波之上往来穿梭。这片海域早已与希腊人的民族认同融为一体，成为其精神血脉不可分割的一部分。"
 grefm_anatolia_triumph_name: "为[GetGeographicRegion('geographic_region_anatolia').GetName]举办凯旋庆典"
 grefm_anatolia_triumph_desc: "在帝国覆灭之前，安纳托利亚曾为各方争夺长达数个世纪，对于希腊人而言，它与巴尔干一样古老。"
 grefm_levant_triumph_name: "为[GetGeographicRegion('geographic_region_levant').GetName]举办凯旋庆典"
 grefm_levant_triumph_desc: "腓尼基一度将古希腊世界与埃及和美索不达米亚等东方文明中心相连。这些土地曾是东罗马帝国的一部分，却在长达数个世纪的穆斯林统治下日渐衰微。"
 grefm_egypt_triumph_name: "为[GetGeographicRegion('geographic_region_aegyptus').GetName]举办凯旋庆典"
 grefm_egypt_triumph_desc: "罗马的东方曾以埃及行省为支柱。我们将把这座昔日希腊文化的堡垒重新纳入帝国版图。"
 grefm_italy_triumph_name: "为[GetGeographicRegion('geographic_region_italia').GetName]举办凯旋庆典"
 grefm_italy_triumph_desc: "曾经处于希腊文化边缘地带的意大利，在古典时代见证了希腊与罗马文化的交融。如今东方尽在我们掌控之中，是时候夺回罗马帝国古老的腹心了。"
