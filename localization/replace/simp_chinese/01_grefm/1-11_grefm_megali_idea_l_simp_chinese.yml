 je_grefm_megali_idea_body_default: "希腊世界的版图曾从巴尔干半岛的海岸线延伸至地中海东部的黎凡特海岸。在地中海各地，希腊人民呼唤着与希腊国家的统一。我们即将见证希腊领土的重塑与复兴。"
