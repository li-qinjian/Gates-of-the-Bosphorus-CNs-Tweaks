 je_grefm_megali_idea_body_bulgaria: "公元924年，$gbbf_bio_simeon_veliki$摄政西美昂一世被拜占庭皇帝罗曼努斯一世加冕为#italic 保加利亚人的皇帝#!。随着拜占庭帝国被奥斯曼人灭亡以及保加利亚国家的复兴，民族主义者宣称[ROOT.GetCountry.GetName]继承罗马帝国的衣钵。"
 je_grefm_megali_idea_body_romania: "罗马帝国曾一度横跨地中海，正是罗马定居者的到来才形成了罗马尼亚民族。[ROOT.GetCountry.GetName]是时候收复巴尔干并重振罗马在巴尔干的权威了。"
 je_grefm_megali_idea_body_australia: "西方正迎来一个新时代。双头鹰的羽翼曾遍及整个地中海。随着[GetCulture('australian').GetName]抵达巴尔干，鸸鹋将取而代之。"
