l_simp_chinese:
 je_grefm_megali_idea: "[GetPlayer.GetCustom('grefm_megali_idea_name_type')]"
 je_grefm_megali_idea_reason: "[GetPlayer.GetCustom('grefm_megali_idea_body_type')]"
 je_grefm_the_greek_plan: "希腊计划"
 je_grefm_the_greek_plan_reason: "18世纪80年代，叶卡捷琳娜二世设想在$RUS_ADJ$的监护下重建希腊帝国，以确保获得进入黑海的通道。她的计划导致成千上万的希腊人移民到黑海北岸。我们应该团结这些民族，为希腊人谋求更好的生存。"
 je_grefm_emu_empire: "鸸鹋帝国"
 je_grefm_emu_empire_reason: "罗马人的土地曾横跨巴尔干半岛和安纳托利亚。随着[ROOT.GetCountry.GetName]的建立，我们将再次确保对这些土地的统治。"
 je_grefm_emu_of_the_east: "东方鸸鹋"
 je_grefm_emu_of_the_east_reason: "在罗马的鼎盛时期，帝国东部的疆土包括了整个埃及和黎凡特，现在双头鸸鹋将再次保护基督教的领地。"
 grefm_annex_hepatanese_decision: "吞并伊奥尼亚群岛"
 grefm_annex_hepatanese_decision_desc: "在拿破仑战争期间，伊奥尼亚群岛多次易手，独立后未并入希腊。如果我们能获得伊奥尼亚人民和政府及其保护者的同意，我们或许能够通过谈判实现权力的和平过渡。"
 grefm_annex_epirus_decision: "吞并伊庇鲁斯"
 grefm_annex_epirus_decision_desc: "伊庇鲁斯人民从奥斯曼手中争得了自由并加入希腊国。我们应该欢迎他们的回归。"
 grefm_annex_cyprus_decision: "吞并塞浦路斯"
 grefm_annex_cyprus_decision_desc: "塞浦路斯人民推翻了土耳其压迫者，并呼吁与希腊合并。"
 grefm_annex_macedonia_decision: "吞并马其顿"
 grefm_annex_macedonia_decision_desc: "马其顿人民从穆斯林的迫害中赢得了自由。他们应该在希腊国家中占据一席之地。"
 grefm_annex_crete_decision: "吞并克里特"
 grefm_annex_crete_decision_desc: "克里特人民世世代代与穆斯林压迫者进行斗争。我们应该欢迎他们进入希腊国家。"
 grefm_annex_samos_decision: "吞并萨摩斯"
 grefm_annex_samos_decision_desc: "自独立战争以来，萨摩斯岛一直拒绝臣服于高门，也许我们应该欢迎他们加入希腊。"
 grefm_annex_trabzon_decision: "吞并特拉布宗"
 grefm_annex_trabzon_decision_desc: "特拉布宗在拜占庭陷落后仍坚守了数年。凭借耐心的外交手段，他们或许能与希腊国家重新统一。"
 grefm_annex_cappadocia_decision: "吞并卡帕多基亚"
 grefm_annex_cappadocia_decision_desc: "自希腊化时代以来，卡帕多西亚高地一直居住着希腊人。我们通过一些谈判，可以让他们回归希腊大家庭。"
 grefm_annex_theodoro_decision: "吞并狄奥多罗"
 grefm_annex_theodoro_decision_desc: "狄奥多罗曾是君士坦丁堡陷落后幸存下来的几个小城邦之一。今天，仍然有希腊人会仍然称呼这个它为家园，我们可以协商让与希腊重新团聚。"
