 grefm_megali_idea: "@gbbf_unification!#o #tooltip:[GetRawTextTooltipTag('grefm_megali_idea_desc')] 伟大理想#!#!"
 grefm_megali_idea_desc: "@gbbf_identity!#header 伟大理想#!\n$TOOLTIP_DELIMITER$\n#lore “多年以后，仍将属我”#!\n\n#bold 伟大理想#!是一个民族主义与领土扩张主义理念，旨在复兴涵盖希腊国家及仍受奥斯曼帝国统治的希腊族群的希腊帝国。由于缺乏正式定义或宣言，其主张的疆域从巴尔干半岛延伸至安纳托利亚与塞浦路斯。\n$TOOLTIP_DELIMITER$\n#bold 伟大理想#![concept_journal_entry]将根据您所在国家的[concept_primary_cultures]采用不同名称。这些名称包括：\n•[GetCulture('greek').GetName]国家为#bold $je_grefm_megali_idea_name_hellene$#!\n•[GetCulture('rhomaios').GetName]国家为#bold $je_grefm_megali_idea_name_rhomaios$#!\n•[GetCulture('urum').GetName]国家为#bold $je_grefm_megali_idea_name_urum$#!"
 grefm_megali_idea_aspirant: "[ROOT.GetCountry.GetName]将能够访问$grefm_megali_idea$[concept_journal_entry]"
 grefm_greek_empire: "#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_greek_empire_desc')] 希腊帝国#!#!"
 grefm_greek_empires: "#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_greek_empire_desc')] 希腊帝国#!#!"
 grefm_greek_empire_desc: "希腊帝国[concept_country]可能被称为：\n•#bold $dyn_c_hellas$#!\n•#bold $dyn_c_rhomania$#!\n•#bold $dyn_c_byzantium$#!\n•#bold $dyn_c_graia$#!"
 grefm_greek_empire_name_hellas: "由于我们拥有[GetCulture('greek').GetName]$gbbf_primary_culture$，$grefm_greek_empire$将被称作#v $dyn_c_hellas$#!"
 grefm_greek_empire_name_rome: "由于我们拥有[GetCulture('rhomaios').GetName]$gbbf_primary_culture$，$grefm_greek_empire$将被称作#v $dyn_c_rhomania$#!"
