l_simp_chinese:
 grefm_hellenic_empire.001.t: "维吉纳太阳升起"
 grefm_hellenic_empire.001.d: "钟声齐鸣，欢呼雷动，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]庄严宣告[ROOT.GetCountry.GetName]的重生。在雄伟的[SCOPE.sBuilding('hagia_sofia_scope').GetName]见证下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]手持重现昔日荣光的古希腊国王的徽章与权杖。[ROOT.GetCountry.GetRuler.GetFirstName]阔步走向汇聚的公民、显贵与教士，如同一座灯塔，照亮希腊民族的未来。"
 grefm_hellenic_empire.001.f: "几个世纪以来，无数次复兴罗马和君士坦丁堡的尝试均以失败告终，而今日，帝国终于再度崛起。然而，重任依旧在肩：众多希腊同胞仍在异教徒和异端的统治之下，昔日罗马的土地依旧被外族篡位者攫取，无数拜占庭珍宝仍流落在异国他乡。若要为[ROOT.GetCountry.GetName]带来荣耀，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须不负臣民的期望，竭尽全力。"
 grefm_hellenic_empire.001.a: "这是新的黎明。"
 grefm_hellenic_empire.002.t: "希腊人的复仇"
 grefm_hellenic_empire.002.d: "我们的努力终于开花结果，[ROOT.GetCountry.GetName]重获新生。如今，众多声音呼吁收复原属希腊的领土，以恢复[ROOT.GetCountry.GetAdjectiveNoFormatting]的威权与声望。[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的未来，如今系于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的决断之上。"
 grefm_hellenic_empire.002.f: "“希腊王国不是希腊；它只是希腊的一部分，而且是希腊最小且最贫困的一部分。希腊人不仅是居住在希腊王国的人们，约阿尼纳、色萨利、色雷斯、阿德里安堡、君士坦丁堡、特拉布宗、克里特、萨摩斯的人们，以及和希腊历史相关的人们所居住的所有地区的人们都是希腊人……希腊有两个伟大的中心，雅典是王国的首都，而君士坦丁堡是伟大的都城，是所有希腊人的梦想与希望。”——约安尼斯·科莱提斯，1844年"
 grefm_hellenic_empire.002.a: "我们会恢复[ROOT.GetCountry.GetName]的荣耀。"
 grefm_hellenic_empire.002.b: "这个目标不切实际。"
 grefm_hellenic_empire.009.t: "希腊人之国"
 grefm_hellenic_empire.009.d: "欢呼声响彻整个[ROOT.GetCountry.GetName]，民众正为所有东部的$grefm_greek$民族统一到[ROOT.GetCountry.GetAdjectiveNoFormatting]中而欢呼雀跃。"
 grefm_hellenic_empire.009.f: "从伯罗奔尼撒出发，越过博斯普鲁斯海峡，沿着尼罗河而行，$grefm_greeks$终于在[ROOT.GetCountry.GetAdjectiveNoFormatting]庇护下安顿下来。"
 grefm_hellenic_empire.009.a: "真正的[ROOT.GetCountry.GetName]已经重建！"
 grefm_hellenic_empire.010.t: "伊朗人之地"
 grefm_hellenic_empire.010.d: "随着我国东部边界的确立，学者与民族主义者纷纷呼吁将希腊影响力扩展至伊朗高原上曾经属于希腊的领土。"
 grefm_hellenic_empire.010.f: "在公元六七世纪伊斯兰教迅猛崛起之前，从底格里斯河到印度河流域的无数族群都自视为基督教世界的一部分，其中包括古代东方教会和聂斯脱里主义异端。这些族群自从与基督教古老中心隔绝后，日益分崩离析。更早之前，希腊王国曾沿着兴都库什山脉散布于伊朗高原，直至旁遮普边陲。"
 grefm_hellenic_empire.010.a: "波斯、非洲、阿拉伯……都将臣服于希腊。"
 grefm_hellenic_empire.010.b: "我们应该心存感激。"
 grefm_hellenic_empire.011.t: "帝国坟场"
 grefm_hellenic_empire.011.d: "征服伊朗后，一项更宏大的计划浮出水面：收复亚历山大大帝曾占领的土地。"
 grefm_hellenic_empire.011.f: "在塞琉古帝国崩溃、罗马帝国崛起之后，伊朗高原和兴都库什山脉的阿富汗地区兴起了几个强大的希腊王国，这些王国一直延续到公元1世纪。时至今日，仍能从地名和散落在山间的零星希腊村落中感受到它们的存在。"
 grefm_hellenic_empire.011.a: "我们将实现这个目标。"
 grefm_hellenic_empire.012.t: "希腊人的帝国"
 grefm_hellenic_empire.012.d: "曾被亚历山大大帝在希腊文明巅峰之际征服的土地，如今再度归于希腊掌控！希腊化帝国已然重铸！"
 grefm_hellenic_empire.012.f: "尽管短暂，亚历山大的征服仍代表着希腊统治者所掌控的最大疆域。凭借我军将士的英勇无畏，以及[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]的稳健执政，我们已重振帝国荣光。"
 grefm_hellenic_empire.012.a: "希腊帝国重建"
 grefm_hellenic_empire.013.t: "好客之海海岸"
 grefm_hellenic_empire.013.d: "我们在基督教世界的中心地带拥有无可撼动的统治地位。阻碍我们权威的最后障碍仍以$RUS_ADJ$正教的形式存在，该教派至今仍宣称对东方教会拥有至高无上的权威。"
 grefm_hellenic_empire.013.f: "[ROOT.GetCountry.GetName]曾统治黑海全境。时至今日，东正教希腊人社群仍散居于其沿岸。在将目光投向北方的篡位者之前，我们必须先将同胞从斯拉夫人的枷锁中解放出来。"
 grefm_hellenic_empire.013.a: "准备舰队！"
 grefm_hellenic_empire.014.t: "大希腊的土地"
 grefm_hellenic_empire.014.d: "随着帝国试图确立其合法性，民族主义领导人开始高呼南意大利应回归希腊统治，如同罗马人到来之前的时代。"
 grefm_hellenic_empire.014.f: "意大利南部，古罗马人称之为“大希腊”，曾是多个希腊殖民地的所在地，孕育了希腊与拉丁文化独特交融的文明。尽管与希腊本土隔绝数百年，半岛上仍有若干希腊语社群持续繁荣发展。"
 grefm_hellenic_empire.014.a: "我们将收复这些土地"
 grefm_hellenic_empire.015.t: "亚历山大的奠基"
 grefm_hellenic_empire.015.d: "当亚历山大的军队如雷霆般横扫亚洲时，他和他的将军们以他的名义建立了多座城市，每座都成为希腊文明在东方的灯塔。随着[ROOT.GetCountry.GetName]的重建，领袖们热切呼吁重新征服帝国最遥远的疆域，其中许多地区现已落入$gbbf_great_powers$之手。"
 grefm_hellenic_empire.015.f: "“我该因你曾率军征讨希腊而置你于不顾，任你倒卧于此？还是该因你胸怀宽广，且在其他方面德行卓著而为你重新立像？”——亚历山大大帝对薛西斯大帝雕像所言（据传）"
 grefm_hellenic_empire.015.a: "我们将见证亚历山大的遗产得以恢复。"
 grefm_hellenic_empire.001.b: "是时候关注我们自身的繁荣了。"