 je_grefm_archaeology_base: "@information!每当我们挖掘一个[GetCulture('greek').GetName]遗址，都会增加对#bold 希腊多神教#!的支持。同样每挖掘一个[GetCulture('rhomaios').GetName]遗址，都会增加对#bold 罗马多神教#!的支持。\n$gbbf_linebreak_normal$我们已挖掘了#bold #greece [GetPlayer.MakeScope.Var('grefm_hellenic_archeaology_var').GetValue]#!#!个[GetCulture('greek').GetName]遗址。\n我们已挖掘了#bold #greece [GetPlayer.MakeScope.Var('grefm_roman_archeaology_var').GetValue]#!#!个[GetCulture('rhomaios').GetName]遗址。"
