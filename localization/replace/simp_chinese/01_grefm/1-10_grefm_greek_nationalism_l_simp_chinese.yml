 notification_grefm_minor_collapse_desc: "当地报纸报道了挖掘现场发生的轻微泥石流。工程人员将此归咎于异常高的降水量。发掘工作因此被推迟了#bold #red 4个月#!#!。"
 notification_grefm_major_collapse_name: "发掘现场的灾难！"
 notification_grefm_major_collapse_desc: "多份报告称，挖掘队遭遇了灾难。经过调查，督政报告说发生了大规模泥石流和结构坍塌，夺去了数十名工人的生命，并将大部分遗址再次掩埋在泥土之下。发掘工作将推迟#bold #red 12个月#!#!。"
 notification_grefm_popular_interest_name: "大众对发掘的兴趣"
 notification_grefm_popular_interest_desc: "发掘项目周围的人群越来越多。儿童和成年人都纷纷前来观看这一壮观场面。有些人甚至加入进来，帮助我们的工人。"
 notification_grefm_palace_discovered_name: "宫殿重见天日"
 notification_grefm_palace_discovered_desc: "发掘现场的工程师发现了一系列古老的地基，这些地基被初步认定为古代贵族统治者的宫廷。预计大量古代文物中的第一批已经运抵考古学会办公室。"
 grefm_embrace_hellenic_identity_name: "拥抱希腊认同"
 grefm_embrace_hellenic_identity_desc: "[GetCulture('greek').GetName]运动是我们唯一能够真正将[ROOT.GetCountry.GetName]统一为一个单一认同的手段。我们应该拥抱我们真正古老的根源。"
 grefm_embrace_hellenic_identity_possible: "[GetCulture('greek').GetName][concept_culture]拥有#bold 10点#!支持"
 grefm_embrace_roman_identity_name: "拥抱罗马认同"
 grefm_embrace_roman_identity_desc: "[GetCulture('rhomaios').GetName]运动代表了希腊人民继承的遗产，我们不能否认我们的罗马身份。"
 grefm_embrace_roman_identity_possible: "[GetCulture('rhomaios').GetName][concept_culture]拥有#bold 10点#!支持"
 grefm_embrace_hybrid_identity_name: "拥抱混合认同"
 grefm_embrace_hybrid_identity_desc: "[GetCulture('greek').GetName]和[GetCulture('rhomaios').GetName]运动不过是一个身份的两半。我们身为$grefm_greek$，就要同时拥抱我们古希腊和希腊罗马的根源。"
 grefm_declare_national_language_name: "宣布国家语言"
 grefm_declare_national_language_desc: "语言问题自革命前就一直困扰着希腊身份认同的议题。虽然我们目前尚无机构来推行全国通用语言，但我们可以表明对希腊语的立场。"
 grefm_declare_national_language_possible: "任何希腊方言都至少有#bold 100点#!的支持。"
 grefm_mega_palation_name: "勘察宫殿废墟"
 grefm_mega_palation_desc: "帝国宫殿虽已沦为废墟，但仍有可能修复其大部分区域。"
 grefm_hippodrome_name: "勘察竞技场"
 grefm_hippodrome_desc: "竞技场数百年来一直是大众娱乐的场所。虽然已遭废弃，但修复它仍非不可能之事。"
 grefm_mega_palation_survey_name: "勘察皇宫废墟"
 grefm_mega_palation_survey_desc: "随着君士坦丁堡光复成为拜占庭权力的中心，一场勘查旧大皇宫遗址的运动应运而生——这座宫殿曾作为皇权所在地。如今，仅有少数残破的大厅和地基碎片留存至今。"
 grefm_greek_sites_name: "显示古希腊遗址"
 grefm_greek_sites_desc: "古希腊遗址遍布爱琴海，我们对希腊遗址的每一次发掘都将#bold 增加#!我们对希腊人身份认同的倾向。"
 grefm_greek_sites_effect: "这将切换是否显示希腊发掘遗址"
 grefm_roman_sites_name: "显示古罗马遗址"
 grefm_roman_sites_desc: "罗马帝国的遗迹与我们的生活息息相关，以至于许多建筑至今仍在使用，而它们最初的用途早已被人们遗忘。我们对罗马遗址的每一次发掘都将#bold 增加#!我们对罗马人身份认同的倾向。"
 grefm_roman_sites_effect: "这将切换是否显示罗马发掘遗址"
 grefm_alternate_sites_name: "考虑备选遗址"
 grefm_alternate_sites_desc: "目前，我们的学者们将全部精力都集中在某个特定时期的遗址发掘上。尽管学术界普遍反对，我们仍可将研究领域扩展至古典时代和中世纪两个时期。"
 grefm_cancel_dig_name: "取消当前勘察"
 grefm_cancel_dig_desc: "这将取消当前挖掘。所有进度都将丢失。"
 grefm_gla_name: "勘察格拉城堡"
 grefm_gla_desc: "随着科帕伊斯湖的水位下降，湖心的一座小岛被确认为可追溯到希腊史前时期的大型要塞，一些监察官已推动派遣探险队前往该地。"
 grefm_delos_name: "勘察提洛岛"
 grefm_delos_desc: "自8世纪末被实际废弃以来，提洛岛一直是古希腊神话的中心之一。岛上散布着无数遗迹，多位监察官认为，该遗址对于展现古希腊的多元文化特质及其在地中海地区的地位至关重要。"
 grefm_larissa_name: "勘察拉里萨遗址"
 grefm_larissa_desc: "拉里萨是[ROOT.GetCountry.GetName]最大的城市之一，建在若干前现代希腊遗迹之上，其中一些仍在使用。随着城市开始扩张，当地的学者和工程师报告称发现了大量遗址。"
 grefm_rhodes_name: "勘察罗得岛遗址"
 grefm_rhodes_desc: "罗得岛位于希腊群岛的东端，曾是政治与海上影响力的中心。学者们早已熟知这座岛上遍布着丰富的文化历史。"
 grefm_archeaology_thessaloniki_name: "细述塞萨洛尼基遗址"
 grefm_archeaology_thessaloniki_desc: "深藏于塞萨洛尼基古老核心的赫普塔皮尔吉翁，在狄奥多西皇帝的命令下被改建成一座巨型城堡。奥斯曼征服后，它又沦为监狱。"
 grefm_archeaology_thebes_name: "调查底比斯的工坊"
 grefm_archeaology_thebes_desc: "底比斯曾是拜占庭丝绸生产的核心。监察官们认为，这一庞大产业的遗迹很可能散落在现代城市的各个角落。"
 grefm_archeaology_nicomedia_name: "发掘尼科米底亚遗址"
 grefm_archeaology_nicomedia_desc: "尼科米底亚遗址埋藏在伊兹米特的地下，它构成了现代伊兹米特的基础。"
 grefm_archeaology_smyrna_name: "勘察士麦那遗址"
 grefm_archeaology_smyrna_desc: "虽然古士麦那定居点可以追溯到古希腊，但这座城市在罗马时代才开始显赫起来，在罗马时代的几个世纪里，该城经历了几个阶段的入侵、衰落和复兴。"
 grefm_archeaology_tyana_name: "发掘提亚那遗址"
 grefm_archeaology_tyana_desc: "提亚那遗址范围很广，有罗马统治的几个世纪小城，也有罗马在东方的大城，甚至后来中世纪的边疆城市。"
 grefm_archeaology_chios_name: "编目希俄斯岛"
 grefm_archeaology_chios_desc: "希俄斯岛数千年来一直是希腊文化的中心。这座岛屿历史悠久，在漫长的历史中先后被罗马、拜占庭、热那亚和奥斯曼帝国统治。"
 grefm_value_from_local_artifact_major: "收集到的$gbbf_artifact_greek_local_major$数量"
 grefm_value_from_local_artifact_minor: "根据收集到的$gbbf_artifact_greek_local_minor$数量"
