 grefm_identity: "@gbbf_identity!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc 认同#!#!"
 grefm_identity_desc: "@gbbf_identity!#header 希腊认同#!$gbbf_linebreak_normal$自史前时代抵达[GetStrategicRegion('region_balkans').GetName]以来，历经不同统治者与帝国更迭，$grefm_greek$民族从未形成过超越自身村庄与部落的单一文化认同。受西欧与北美洲思想家的启发，有人构建出从古希腊时代延续至今的[GetCulture('greek').GetName]民族宏大愿景。然而这个构想遭到仍生活在奥斯曼帝国内的$grefm_greeks$群体广泛质疑——在他们看来，无论拜占庭帝国存续期间还是覆灭之后，他们始终都是[GetCulture('rhomaios').GetName]人。"
 grefm_identities: "@gbbf_identity!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc 认同#!#!"
 grefm_national_identity: "@gbbf_identity!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc 民族认同#!#!"
 grefm_dialect: "@gbbf_dialect!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc 方言#!#!#!"
 grefm_dialect_desc: "@gbbf_dialect!#header 希腊方言#!\n$TOOLTIP_DELIMITER$\n在前伊斯兰时期，希腊语曾形成从亚得里亚海沿岸到黎凡特地区的连续语言区。阿拉伯与突厥政权的逐步侵蚀使希腊语空间逐渐碎片化，形成了若干#bold 方言#!，这些方言之间的相互理解程度各不相同。\n$TOOLTIP_DELIMITER$\n•#bold #greece 通俗希腊语#!#!通行于爱琴海地区，是希腊世界现存唯一完整的方言连续体\n•#bold #purple 纯正希腊语#!#!是一种构造出来的希腊语，旨在“净化”语言，去除土耳其语和其他“外来”影响。\n•#bold #yellow 通用希腊语#!#!作为希腊正教会广泛使用的礼仪用语，代表了中世纪的希腊语形式\n•#bold #green 本都希腊语#!#!是包括一系列在安纳托利亚地区的希腊社区中使用的方言。"
 grefm_national_dialect: "@gbbf_dialect!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc 国家语言#!#!#!"
 grefm_dialects: "@gbbf_dialect!#o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc 方言#!#!#!"
