 je_grefm_greek_nationalism_flavor: "[GetCulture('greek').GetName]$grefm_identity$由西欧和美国的亲希腊思想家引领，主张希腊人民是青铜与铁器时代希腊文化的继承者，因此是西方文明祖先的后裔。希腊主义支持者将罗马与奥斯曼时代视为希腊文化陷入停滞与压制的“黑暗时代”。与此同时，[GetCulture('rhomaios').GetName]$grefm_identity$体现了希腊人民从希腊罗马时期到现代一脉相承的延续性，其间希腊文化在罗马、斯拉夫和土耳其影响下不断演变发展。"
 je_grefm_greek_nationalism_details: "#white •[GetCulture('greek').GetName]$grefm_identity$拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_hellenism_breakdown [GetPlayer.MakeScope.Var('grefm_hellene_culture_var').GetValue]#!，来自#bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_hellenism_factors')]其因素#!#!#!的支持。\n•[GetCulture('rhomaios').GetName]$grefm_identity$拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_romanism_breakdown [GetPlayer.MakeScope.Var('grefm_rhomaios_culture_var').GetValue]#!，来自#bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_romanism_factors')]其因素#!#!#!#!的支持。"
 je_grefm_greek_nationalism_ethostate: "如果已制定[GetLawType('law_ethnostate').GetName]，[ROOT.GetCountry.GetNameNoFlag]将采用其当前[concept_primary_cultures]的$grefm_national_identity$"
 je_grefm_greek_nationalism_multicultural: "如果已制定[GetLawType('law_multicultural').GetName]，[ROOT.GetCountry.GetNameNoFlag]将采纳一种混合的$grefm_national_identity$"
 je_grefm_greek_nationalism_lobby: "$gbbf_journal_lobby$\n从古希腊城邦时代到多民族的罗马与奥斯曼帝国时期，希腊人从未见过一个能让他们超越自己家乡村庄和地区认同的国家实体。在启蒙思想的引领下，两种对立运动应运而生，都试图将希腊人民凝聚在真正共同的身份认同之下。"
