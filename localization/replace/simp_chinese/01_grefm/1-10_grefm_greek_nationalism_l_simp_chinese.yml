 grefm_parthenon_button_1: "勘察雅典卫城"
 grefm_parthenon_button_1_desc: "古雅典卫城高耸入云，位于雅典城邦的中心，曾被称为#bold 高处的城市#!。然而，经过千年的荒废，如今的卫城已成为一片废墟。考古局的监督官要求对遗址进行适当的研究。"
 grefm_parthenon_button_2: "发掘帕特农神庙"
 grefm_parthenon_button_2_desc: "由于摩里亚战争的破坏和后来奥斯曼清真寺的修建，帕特农神庙只剩骨架。尽管如此，专家们认为利用现代工业技术进行部分修复是可行的。"
 grefm_mycenae_button_1: "探索克诺索斯"
 grefm_mycenae_button_1_desc: "长期以来，主流学术界一直认为克里特岛是古代米诺斯文明的核心。米诺斯·卡洛凯里诺斯的业余发掘证明了青铜时代宫殿的存在，但土耳其政府的干预阻碍了对该岛的正式研究。"
 grefm_mycenae_button_2: "发掘米诺斯宫殿"
 grefm_mycenae_button_2_desc: "随着宫殿遗址的确定，学者们开始对这一庞大建筑群进行全面挖掘和修复。"
 grefm_archeaology_corinth_button_1: "发掘六里墙"
 grefm_archeaology_corinth_button_1_desc: "发掘六里墙始建于狄奥多西二世统治时期，是保护伯罗奔尼撒半岛免受北方入侵的防御工事。虽然现已废弃，但这座庞大的建筑一直保留到拜占庭早期。"
 grefm_archeaology_corinth_button_2: "探索科林斯卫城"
 grefm_archeaology_corinth_button_2_desc: "科林斯卫城建在科林斯山顶上，在拜占庭时代发挥着重要作用，并逐渐发展成为希腊统治区的所在地"
