l_simp_chinese:
 grefm_greek_nationalism.001.t: "什么是“希腊人”？"
 grefm_greek_nationalism.001.d: "$grefm_greek$认同问题因#yellow 民族主义#!思想在[ROOT.GetCountry.GetName]产生有了新的发展。知识分子强调通过语言和宗教来界定共同的[GetCulture('greek').GetName]身份。然而，这一观点未能在普通民众中引起共鸣，他们认为自拜占庭时代以来一直存在的[GetCulture('rhomaios').GetName]村庄和社区与其关系更为紧密。"
 grefm_greek_nationalism.001.f: "在拜占庭时期，希腊人通常用两种方式定义自己，首先自称为“罗马人”；其次强调基督徒的身份。这种混合身份证明在奥斯曼帝国时期变得更加重要，他们的文化通过共同的语言和宗教经历幸存下来，经历了奥斯曼帝国统治者的接受和迫害的不同阶段。"
 grefm_greek_nationalism.001.a: "我们不一直都是希腊人吗？"
 grefm_greek_nationalism.001.tt1: "我们在#bold 希腊民族主义#![concept_journal_entry]中的选择将影响[GetCulture('rhomaios').GetName]人的地位。"
 grefm_greek_nationalism.001.tt2: "我们在#bold 希腊民族主义#![concept_journal_entry]中的选择将影响[GetCulture('greek').GetName]人的地位。"
 grefm_greek_nationalism.002.t: "《希腊民族史》"
 grefm_greek_nationalism.002.d: "经过数十年的编纂，康斯坦丁·帕帕里戈普洛斯出版了其著作#italic 《希腊民族史》#!的最后一卷。这部作品生动而优雅地将古希腊、中世纪和现代希腊国家的历史串联在一起，展现了希腊人在巴尔干半岛和安纳托利亚的悠久存在。"
 grefm_greek_nationalism.002.f: "历史注解：帕帕里戈普洛斯1860年至1877年间出版的六卷本著作具有开创性意义。在此之前，学界普遍认为希腊民族在大迁徙时期就已被斯拉夫人取代或同化。这种观点完全忽视了两个关键历史事实：一是拜占庭帝国对黑海海峡地区近千年的统治，二是希腊人在奥斯曼帝国统治下依然保持着自己独特的文化身份。帕帕里戈普洛斯的著作第一次用严谨的学术方法，系统地驳斥了这种过于简单化的历史观点，为希腊民族的历史连续性提供了有力的学术支撑。"
 grefm_greek_nationalism.002.a: "希腊之火永远不会熄灭。"
 grefm_greek_nationalism.002.b: "我们不能忘记我们的罗马根源。"
 grefm_greek_nationalism.003.t: "希腊首都"
 grefm_greek_nationalism.003.d: "解放后的[SCOPE.sState('eastern_thrace_scope').GetCityHubName]希腊人已向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]请愿，要求恢复该城市作为希腊世界原有的中心地位。"
 grefm_greek_nationalism.003.f: "不要把希腊王国等同于希腊整体；它不过是希腊的一小部分，而且是最小、最贫困的一部分。真正的希腊人不仅包括王国境内的居民，还包括所有生活在约阿尼纳、塞萨洛尼基、塞雷斯、埃迪尔内、君士坦丁堡、特拉布宗、克里特、萨摩斯等地的同胞，只要这片土地曾经烙印着希腊的历史，居住着希腊民族的后裔...希腊文明有两座重镇：雅典是当前王国的都城，而君士坦丁堡则是那座伟大的都城，承载着全体希腊人的梦想与期望。"
 grefm_greek_nationalism.003.a: "君士坦丁堡将成为[ROOT.GetCountry.GetName]的中心！"
 grefm_greek_nationalism.003.b: "[SCOPE.sState('attica_scope').GetCityHubName]符合我们的需要。"
 grefm_greek_nationalism.006.t: "语言问题"
 grefm_greek_nationalism.006.d: "自独立以来，[SCOPE.gsInterestGroup('ig_intelligentsia_scope').GetName]一直在推动采用一种名为$grefm_dialect_katharevousa$的希腊语。不过人们还是继续使用$grefm_dialect_demotic$，而每个地区都有自己的希腊地方方言。同时，[SCOPE.gsInterestGroup('ig_devout_scope').GetName]继续使用可追溯到希腊化时期的$grefm_dialect_khoine$。"
 grefm_greek_nationalism.006.f: "历史注释：在1976年之前，希腊语中哪一种方言应该被提升为官方语言一直是备受争论的话题。希腊语存在几千年，直到塞尔柱土耳其人的到来，他们在希腊各族群之间划出了物理分界线，导致许多方言分化到几乎无法相互理解的地步。"
 grefm_greek_nationalism.006.a: "我们的语言将把我们联系在一起。"
 grefm_greek_nationalism.006.tt1: "支持$grefm_dialect_demotic$或$grefm_dialect_katharevousa$将增加我们的#bold 希腊化#!倾向。"
 grefm_greek_nationalism.006.tt2: "支持$grefm_dialect_khoine$或$grefm_dialect_rhomaiika$将增加我们的#bold 罗马化#!倾向。"
 grefm_greek_nationalism.007.t: "官方语言"
 grefm_greek_nationalism.007.d: "通过严谨的学术研究和国家推动，领导人已经准备好组织全国推广希腊语课程。虽然这不能在一夜之间解决语言问题，但我们至少可以确保我们的孩子在希腊全境都能接受统一的语言教育。"
 grefm_greek_nationalism.007.f: "随着希腊文学的发展，纯正希腊语受到了作家和政治家们的青睐。但是许多人担心，进一步推动纯正希腊语只会进一步疏远民众，阻碍大众接受教育。而另一部分人认为，净化语言中的斯拉夫语和土耳其语“污染”将使教育工作者能够精练原本粗俗的大众语言。"
 grefm_greek_nationalism.007.a: "$grefm_dialect_demotic$是人民真正的语言。"
 grefm_greek_nationalism.007.b: "$grefm_dialect_katharevousa$将巩固希腊的身份认同。"
 grefm_greek_nationalism.007.c: "$grefm_dialect_khoine$是唯一且真正的希腊语言。"
 grefm_greek_nationalism.007.e: "$grefm_dialect_rhomaiika$是唯一有价值的方言。"
 grefm_greek_nationalism.007.g: "也许我们太草率了……"
 grefm_greek_nationalism.007.tt: "我们不会确立官方语言"
 grefm_greek_nationalism.008.t: "定义希腊根源"
 grefm_greek_nationalism.008.d: "考古学会取得的巨大进步让希腊人民感觉到巴尔干地区可以追溯到史前时代。每个月都有更多的人在谈论希腊，仿佛它已经存在了很久，甚至将现代的政府与奥斯曼帝国之前的拜占庭和罗马政府混为一谈。"
 grefm_greek_nationalism.008.f: "多亏了我们的学者，我们可以毫无疑问地说，“原初希腊人”早在有文字记载的历史之前就来到了巴尔干半岛，并且从那时起就一直在这里。无论是前罗马城邦、拜占庭帝国，还是威尼斯和奥斯曼帝国的压迫者，这片土地一直都是希腊的，而且永远都是希腊的。"
 grefm_greek_nationalism.008.a: "我们一直在这里。"
 grefm_greek_nationalism.009.t: "希腊族裔形成"
 grefm_greek_nationalism.009.d: "没有人能告诉你这是什么时候发生的，但每个人都知道它发生了，人民为能走在[SCOPE.sCulture( 'grefm_national_culture_scope').GetName]街道上、从事[SCOPE.sCulture( 'grefm_national_culture_scope').GetName]人的工作、与[SCOPE.sCulture( 'grefm_national_culture_scope').GetName]邻居共处而感到自豪。[ROOT.GetCountry.GetName]和她的人民从一个不团结、摇摇欲坠的后发国家开始，已经崛起为一个真正的民族国家。"
 grefm_greek_nationalism.009.f: "“何时我们能像勇士一样，站在圣山上，高举旗帜\n宁要那一小时的自由，也不要四十年的奴役与囚禁！”\n\n——里加斯·费拉伊奥斯，1797年所著#italic 《战歌》#!"
 grefm_greek_nationalism.009.a: "不自由毋宁死！"
 grefm_greek_nationalism.009.b: "太好了。"
 grefm_greek_nationalism.040.t: "雅典考古学会"
 grefm_greek_nationalism.040.d: "在政治家和学者的支持下，希腊各地的考古学家已经开始了对众多古希腊遗迹的定位、保护和修复工作。希腊考古局的监督官已经编制了一份需要立即研究的遗址清单。"
 grefm_greek_nationalism.040.f: "雅典考古学会成立于1837年，在为从拜占庭时代到希腊青铜时代的无数遗址和文物进行编目和修复方面发挥了重要作用。"
 grefm_greek_nationalism.040.a: "一项崇高的事业。"
 grefm_greek_nationalism.040.a.tt: "您现在可以通过日志启动考古研究。"
 grefm_greek_nationalism.041.t: "准备发掘"
 grefm_greek_nationalism.041.d1: "考古学会的考古学家们已经组织了一支队伍，在[SCOPE.sState('grefm_excavation_site').GetName]开始对遗址进行系统发掘。目前考古队已[SCOPE.sState('grefm_excavation_site').GetCityHubName]驻扎，等待批准出发。"
 grefm_greek_nationalism.041.d2: "考古协会的专家们已经组建了一支队伍，开始对格拉城堡进行系统发掘。考古队目前正在等待批准出发。"
 grefm_greek_nationalism.041.f: "从伯罗奔尼撒半岛到遥远的兴都库什山脉，我们可以找到无数的希腊遗产宝藏。"
 grefm_greek_nationalism.041.a: "好的，祝他们好运。"
 grefm_greek_nationalism.041.b: "不行，现在不是一个好时机。"
 grefm_greek_nationalism.042.t: "考虑其他挖掘地点"
 grefm_greek_nationalism.042.d1: "在制度和文化潮流的推动下，考古局局长批准了对古希腊时代遗迹以及拜占庭时代遗址的研究。"
 grefm_greek_nationalism.042.d2: "在制度和文化潮流的推动下，考古局局长批准了对拜占庭时代遗址以及古希腊时代遗迹的研究。"
 grefm_greek_nationalism.042.f: "事实证明，这一决定在学术界并不受欢迎，许多人担心承认这段历史会淡化我们的文化独特性。"
 grefm_greek_nationalism.042.a: "这无疑是一项独特的举措。"
 grefm_greek_nationalism.042.b: "也许这不是好主意......"
 grefm_greek_nationalism.042.tt1: "你现在可以开展#yellow 希腊#!遗迹考古。"
 grefm_greek_nationalism.042.tt2: "你现在可以开展#yellow 罗马#!遗迹考古。"
 grefm_greek_nationalism.043.t1: "雅典卫城勘察完毕"
 grefm_greek_nationalism.043.d1: "学者宣布，清理和编目雅典卫城遗址的庞大工程已经完成。在成堆的砖块和石头中，山顶上发现了十多个独特遗址。其中最引人注目的是帕特农神庙，后来改为教堂，目前中心有一座清真寺。雅典卫城的历史可以追溯到迈锡尼时期，几千年来被无数次修建和改建。遗址上散布着几座寺庙、圣殿和大门，每个都在历代政权统治下找到了新的用途，直到现代。"
 grefm_greek_nationalism.043.t2: "帕特农神庙遗址发掘完毕"
 grefm_greek_nationalism.043.d2: "清真寺已经拆除，帕特农神庙的场地也已清理完毕。在建筑师尼古拉斯·巴拉诺斯的监督下，帕特农神庙用铁和混凝土进行结构加固，重新修建。"
 grefm_greek_nationalism.043.t3: "克诺索斯勘察完毕"
 grefm_greek_nationalism.043.d3: "在米诺斯·卡洛凯林诺斯在19世纪70年代初步探索该遗址的基础上，一个考古团队在青铜时代宫殿的中心发现了一个巨大的王座室。进一步的发掘揭示了包括宫殿建筑群和古代城市遗址在内的庞大遗迹。在克诺索斯正式开始发掘之前，克里特岛在米诺斯文明中的作用尚不明确。随着宫殿建筑群的发现，这座城市作为米诺斯文明核心的地位得到了确认。"
 grefm_greek_nationalism.043.t4: "米诺斯宫殿修复完毕"
 grefm_greek_nationalism.043.d4: "在英国人阿瑟·埃文斯的帮助下，工人们完成了宫殿及其附属建筑的大规模重建。工匠们巧妙地将现代修复技艺与古代美学融合，精心重建了众多房间和壁画。尽管成果令人印象深刻，宫殿的“重建”却引发了广泛的批评，许多人认为埃文斯的“艺术创作”可能会误导后人对历史的理解。"
 grefm_greek_nationalism.043.t5: "格拉城堡发掘完毕"
 grefm_greek_nationalism.043.d5: "负责监督格拉遗址的监督官报告说，已经完成了对遗址的全面详查。对遗址中几座建筑发现证明，迈锡尼建筑已经开始与古典希腊建筑相似，城堡有一块延伸到前科帕伊斯湖深处的露头。该遗址的面积比古雅典城的占地面积还要大，且主要有两个特点：北部有一个类似宫殿的建筑，南部有两个类似仓库的建筑。学者们推测，整个遗址可能是战争或困难时期的临时避难所。"
 grefm_greek_nationalism.043.t6: "提洛岛勘察完毕"
 grefm_greek_nationalism.043.d6: "提洛岛位于基克拉泽斯群岛之中，是爱琴海的神话中心。由于该岛自拜占庭时代以来就遭到遗弃，只留一小部分看守人口管理，提洛岛的“发掘”更像是对岛上各类建筑的记录。岛上的几座神庙和社交中心都保存完好。"
 grefm_greek_nationalism.043.t7: "拉里萨勘察完毕"
 grefm_greek_nationalism.043.d7: "尽管多座希腊城市在岁月的流逝中遭到遗弃，但像拉里萨这样的城市依然屹立不倒，那里中世纪和现代的建筑与古典时代的遗迹和谐共存。经过深入调查，考古局已详细记录了散布在城市各处的多个遗址和建筑。随着清单陆续交给当地官员，大家希望城市规划者能够避免破坏这些已知的古代遗址。"
 grefm_greek_nationalism.043.t8: "罗得岛勘察完毕"
 grefm_greek_nationalism.043.d8: "罗得岛自迈锡尼人时代就有人居住，曾先后被希腊人、拜占庭人、医院骑士团和奥斯曼人统治。与此同时，犹太人、多神教徒、基督徒和穆斯林也相继定居，给这座岛屿带来了各种各样的文化影响。然而，尽管取得了一些成果，监督官仍然失望地宣布，并未发现传说中的罗得岛巨像的任何痕迹。"
 grefm_greek_nationalism.043.f: "每调查一处古代遗址，[ROOT.GetCountry.GetName]与古代的联系就会变得更加清晰和紧密。"
 grefm_greek_nationalism.043.a: "干得漂亮！"
 grefm_greek_nationalism.044.t1: "六里墙勘察完毕"
 grefm_greek_nationalism.044.d1: "考古局的监督官宣布完成了一项庞大的调查，详细记录了六里墙的范围。这座城墙横跨地峡，其遗址为专家们提供了多件来自罗马时代的重要文物。"
 grefm_greek_nationalism.044.t2: "科林斯卫城勘察完毕"
 grefm_greek_nationalism.044.d2: "经过数月的努力，监督官们已完成对科林斯卫城主要大型建筑的清理与记录工作。从拜占庭堡垒到东正教教堂，再到后来的清真寺，该遗址的传奇历史见证了时代的变迁。如今，许多人都期待着将这一遗址对公众开放。"
 grefm_greek_nationalism.044.t3: "七塔修复完毕"
 grefm_greek_nationalism.044.d3: "七塔展示了拜占庭鼎盛时期惊艳绝伦的建筑风格。随着大规模修复工作的推进，考古局对将这一遗址作为拜占庭文化教育中心的构想表示了极大的热情。"
 grefm_greek_nationalism.044.t4: "底比斯工坊发掘完毕"
 grefm_greek_nationalism.044.d4: "执法官宣布，已完成对底比斯众多小型遗址的定位与编目工作。在拜占庭时代，这些建筑曾是拜占庭丝绸产业的核心。"
 grefm_greek_nationalism.044.t5: "尼科米底亚勘察完毕"
 grefm_greek_nationalism.044.d5: "通过结合公众调查和私人报告，学者们详细撰写了一系列报告，揭示了这座城市悠久的罗马历史。由于遗址的庞大规模，分辨古代遗迹与现代城市的界限变得异常困难。"
 grefm_greek_nationalism.044.t6: "士麦拿勘察完毕"
 grefm_greek_nationalism.044.d6: "监督官宣布了他们对士麦那庞大遗址群的调查结论。在拜占庭时代，士麦那曾是堪与君士坦丁堡媲美的“第二大城市”。研究人员已修复数千件文物，这些文物可确认出自士麦那的鼎盛时期。"
 grefm_greek_nationalism.044.t7: "提亚那发掘完毕"
 grefm_greek_nationalism.044.d7: "尽管提亚那在突厥征服安纳托利亚的初期便已失落，但这并未阻止考古学家在古城中探寻出数百处遗址。"
 grefm_greek_nationalism.044.t8: "希俄斯勘察完毕"
 grefm_greek_nationalism.044.d8: "监督官宣布已完成对希俄斯岛的勘察工作。几处遗址已被确认，这些遗址证明了该岛在罗马时代作为战略要地的地位，以及其后被热那亚人占领，最终落入奥斯曼帝国之手的历史。"
 grefm_greek_nationalism.044.f: "每探索一处中世纪遗址，[ROOT.GetCountry.GetName]都会想起它在罗马时代的繁荣景象。"
 grefm_greek_nationalism.044.a: "伟大的成就"
 grefm_greek_nationalism.050.t: "挖掘按计划进行"
 grefm_greek_nationalism.050.d: "首席工程师报告说，正在进行的挖掘项目比预期进展得更快。监理也表示，该项目现在回比预期更快完成。"
 grefm_greek_nationalism.050.f: "除非地基出现意外，我们的工作进展顺利，并将继续如此。"
 grefm_greek_nationalism.050.a: "好消息！"
 grefm_greek_nationalism.050.tt: "发掘将会#green 提前#!4个月进行"
 grefm_greek_nationalism.051.t: "请求工业设备"
 grefm_greek_nationalism.051.d: "堆积的粘土和突然出现的基岩混杂在一起，令挖掘现场的工程师们感到困惑。负责监理的工程师建议使用重型机械来破坏不规则的地形。"
 grefm_greek_nationalism.051.f: "一两个电钻应该就能解决这个问题。他们一到，我们甚至可以改变整个项目方法"
 grefm_greek_nationalism.051.a: "他们会得到他们需要的东西。"
 grefm_greek_nationalism.051.a.tt: "发掘将会#green 提前#!6个月进行"
 grefm_greek_nationalism.051.b: "去敲几块石头？我可不这么认为。"
 grefm_greek_nationalism.051.b.tt: "发掘将会#red 推迟#!6个月进行"
 grefm_greek_nationalism.052.t: "古墓重见天日"
 grefm_greek_nationalism.052.d: "考古学家宣布在挖掘现场发现了一个墓穴，并要求对墓葬物品进行更详细的编目。规划人员告诫说，这种做法可能会大大延误工程进度。"
 grefm_greek_nationalism.052.f: "虽然它们可能只是死者的小饰品，但这些墓葬物品却是那个时代保存最完好的一些遗物"
 grefm_greek_nationalism.052.a: "我们必须找出一切。"
 grefm_greek_nationalism.052.a.tt: "发掘将会#red 推迟#!6个月进行"
 grefm_greek_nationalism.052.b: "这是在浪费时间"
 grefm_greek_nationalism.053.t: "发掘现场发生泥石流"
 grefm_greek_nationalism.053.d: "当地报纸报道了挖掘现场发生的轻微泥石流。工程人员将此归咎于异常高的降水量。"
 grefm_greek_nationalism.053.f: "听着，我告诉他们我们可能需要加固整个南墙，但他们让我继续铲。"
 grefm_greek_nationalism.053.a: "这太糟糕了。"
 grefm_greek_nationalism.053.a.tt: "发掘将会#red 推迟#!4个月进行"
 grefm_greek_nationalism.054.t: "发掘现场的灾难！"
 grefm_greek_nationalism.054.d: "多份报告称，挖掘队遭遇了灾难。经过调查，督政报告说发生了大规模泥石流和结构坍塌，夺去了数十名工人的生命，并将大部分遗址再次掩埋在泥土之下。"
 grefm_greek_nationalism.054.f: "虽然这是一起悲剧性事件，但分析师们建议进行几项改革，以防止今后再发生此类事件……"
 grefm_greek_nationalism.054.a: "不幸"
 grefm_greek_nationalism.054.a.tt: "发掘将会向后#red 推迟#!12个月"
 grefm_greek_nationalism.055.t: "挖掘工作激起民众兴致"
 grefm_greek_nationalism.055.d: "发掘项目周围的人群越来越多。儿童和成年人都纷纷前来观看这一壮观场面。有些人甚至加入进来，帮助我们的工人。"
 grefm_greek_nationalism.055.f: "老实说，他们根本不碍事。我们的一些年轻学者甚至借此机会向大众宣传我们引以为豪的历史。"
 grefm_greek_nationalism.055.a: "真有趣。"
 grefm_greek_nationalism.056.t: "宫殿重见天日"
 grefm_greek_nationalism.056.d: "发掘现场的工程师发现了一系列古老的地基，这些地基被初步认定为古代贵族统治者的宫廷。预计大量古代文物中的第一批已经运抵考古学会办公室。"
 grefm_greek_nationalism.056.f: "这里珍宝荟萃！看来，足够在国家博物馆新建一个展厅了！"
 grefm_greek_nationalism.056.a: "太棒了"
 grefm_greek_nationalism.057.t: "阿伽门农黄金面具"
 grefm_greek_nationalism.057.d: "在[SCOPE.sState('peloponnese_scope').GetName]的一个小发掘现场工作的考古学家宣布了一项令人难以置信的发现：一系列精美绝伦、细节考究的纯金陪葬面具。这些面具被发现时仍盖在陪葬品上，初步断定这些人地位显赫。有些人甚至声称，这可能就是传说中的迈锡尼国王阿伽门农的坟墓。"
 grefm_greek_nationalism.057.f: "“……金发碧眼，高大威猛。他能言善辩，睿智高贵，天赋异禀。”——达雷斯·弗里吉乌斯，公元 5 世纪"
 grefm_greek_nationalism.057.a: "真是太美妙了！"
 grefm_greek_nationalism.058.t: "[SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName]提供资金"
 grefm_greek_nationalism.058.d: "为了支持我们在[SCOPE.sState('grefm_excavation_target').GetName]方面的努力，[SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName]的成员主动提出为这项工作提供资金。"
 grefm_greek_nationalism.058.f: "接受这些资金将有助于我们加快发掘进度，但我们可以肯定，他们会利用这一点进行宣传。"
 grefm_greek_nationalism.058.a: "欢迎大家为保护我们的历史提供支持。"
 grefm_greek_nationalism.058.b: "我们不能允许学术界受到不当影响。"
 grefm_greek_nationalism.058.tt: "发掘将会#green 提前#!6个月进行"
 grefm_greek_nationalism.059.t: "重建招致批评"
 grefm_greek_nationalism.059.d: "[SCOPE.sState('grefm_excavation_target').GetName]学者就我们的领队长官对发掘现场的重建提出了一些措辞严厉的投诉。"
 grefm_greek_nationalism.059.f: "“看，你可以清楚地看出那根柱子应该在那边……而且马赛克的风格与这个地层的时代不符……等等，这里谁说了算？！”"
 grefm_greek_nationalism.059.a: "“好的，但是他们有原始计划吗”"
 grefm_greek_nationalism.059.b: "我们的人应该退居二线。"
 grefm_greek_nationalism.059.b.tt: "发掘将会#red 推迟#!6个月进行"