l_simp_chinese:
 je_grefm_constantinople: "君士坦丁堡的14个地区"
 je_grefm_constantinople_reason: "君士坦丁堡曾是中世纪最伟大的城市，其发展程度在欧洲无与伦比。自被奥斯曼征服后，这座城市的发展停滞不前，而希腊世界的中心却再次掌握在希腊人手中。各路领袖们从早期拜占庭作家那里汲取灵感，推动城市重建，将君士坦丁堡推向东罗马帝国皇帝时期的高度。"
 je_grefm_mega_palation_survey: "勘察皇宫遗址"
 je_grefm_mega_palation_survey_reason: "我们的专家们正在调查圣索菲亚大教堂附近的宫殿遗迹。"
 je_grefm_mega_palation_survey_goal: "等待勘测完成……"
 je_grefm_byzantine_nationalism: "拜占庭民族主义"
 je_grefm_byzantine_nationalism_reason: "[ROOT.GetCountry.GetName]曾经是一个多民族国家，被[GetReligion('orthodox').GetName]信仰和政府结合在一起。虽然$grefm_greek$语是国家的语言，但帝国内各民族只要信奉君士坦丁堡的信仰并遵守法律，就会受到平等对待。在恢复一方面之前，我们不能认为帝国真正完成了重建。"
