 grefm_chariot_team: "@gbbf_charioteer!战车团队"
 grefm_chariot_teams_desc: "@gbbf_charioteer!#bold 战车团队#!$gbbf_linebreak_normal$#bold 战车竞速#!从古希腊到拜占庭时期都是最受瞩目的体育赛事之一。单名车手驾驭由2到4匹马组成的队伍，围绕赛马场跑5至12圈，具体圈数依时代和形式而定。该运动的危险性和不可预测性使其广受欢迎，赞助战车赛事被视为执政官和皇帝共同承担的公民义务。\n\n复兴后的队伍各自由某个[concept_interest_group]赞助。比赛采用每4年一届形式，获胜队伍的赞助者将获得#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_chariot_teams_modifier_desc')] $modifier_grefm_ig_won_races$#!#!$gbbf_linebreak_normal$战车队伍有：\n※$grefm_chariot_team_reds$\n※$grefm_chariot_team_whites$\n※ $grefm_chariot_team_greens$\n※$grefm_chariot_team_blues$\n※$grefm_chariot_team_purples$（需要扩展赛马阵容）\n※$grefm_chariot_team_golds$（需要扩展赛马阵容）"
