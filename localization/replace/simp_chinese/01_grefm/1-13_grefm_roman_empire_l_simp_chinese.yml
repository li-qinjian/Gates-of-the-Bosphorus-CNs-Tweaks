l_simp_chinese:
 je_group_grefm_roman_empire: "紫凤凰"
 je_grefm_purple_pheonix: "紫凤凰"
 je_grefm_purple_pheonix_reason: "[GetCulture('rhomaios').GetName]领地曾经横跨巴尔干和安纳托利亚。随着[ROOT.GetCountry.GetName]的重生，我们将再次确保对这些土地的统治。"
 je_grefm_purple_pheonix_possible: "[ROOT.GetCountry.GetNameNoFlag]已经建立#bold 拜占庭#!"
 je_grefm_purple_pheonix_complete_1: "[ROOT.GetCountry.GetNameNoFlag]直接或间接控制巴尔干半岛的10个及以上的地区。"
 je_grefm_purple_pheonix_complete_2: "[ROOT.GetCountry.GetNameNoFlag]直接或间接控制安纳托利亚的9个及以上的地区。"
 je_grefm_rome_of_the_east: "东方的罗马"
 je_grefm_rome_of_the_east_reason: "在罗马的鼎盛时期，帝国东部的疆土包括了整个埃及和黎凡特。我们将会夺回这些土地。"
 je_grefm_rome_of_the_east_status: "重申[ROOT.GetCountry.GetAdjective]对近东的控制。"
 je_grefm_renovatio_imperii_romanorum: "紫凤凰"
 je_grefm_renovatio_imperii_romanorum_reason: "随着东方已经落入我们的掌控之下，也是时候重新夺回罗马帝国的古老心脏了。"
 je_grefm_renovatio_imperii_romanorum_status: "掌控意大利亚。"
 je_grefm_renovatio_imperii_romanorum_tt1: "确保罗马城"
 je_grefm_renovatio_imperii_romanorum_dalmatia: "收复达尔马提亚"
 je_grefm_renovatio_imperii_romanorum_dalmatia_reason: "达尔马提亚海岸是罗马在意大利之外最早的扩张领土之一。在陆续经历了哥特人和斯拉夫人的征服后，如今哈布斯堡家族维持着对这片前罗马领土的统治。"
 je_grefm_renovatio_imperii_romanorum_tt2: "确保达尔马提亚的海岸"
 je_grefm_renovatio_imperii_romanorum_northern_italy: "收复伦巴第"
 je_grefm_renovatio_imperii_romanorum_northern_italy_reason: "曾经被伦巴第人征服，现在又被法国人占据，可曾记得，北意大利也曾经是保护罗马免受日耳曼野蛮人侵害的堡垒。"
 je_grefm_renovatio_imperii_romanorum_tt3: "确保伦巴第的土地"
 je_grefm_renovatio_imperii_romanorum_southern_italy: "收复大希腊"
 je_grefm_renovatio_imperii_romanorum_southern_italy_reason: "南意大利曾经是希腊文化的腹心地带之一，它见证了整个古典时代中古希腊与古罗马文化的融合过程。"
 je_grefm_renovatio_imperii_romanorum_tt4: "确保大希腊的海岸"
 je_grefm_renovatio_imperii_romanorum_central_italy: "收复拉文纳督主教区"
 je_grefm_renovatio_imperii_romanorum_central_italy_reason: "曾经，通过对拉文纳旧都的统治，大主教能够在此处行使拜占庭对永恒之城的权力。"
 je_grefm_renovatio_imperii_romanorum_tt5: "确保拉文纳督主教区"