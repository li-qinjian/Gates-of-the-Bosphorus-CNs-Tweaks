 je_grefm_venizelism_lobby: "$gbbf_journal_lobby$\n埃莱夫塞里奥斯·韦尼泽洛斯执掌大权，希腊国家由此迎来了一个剧变的时代。在民族主义热情高涨的背景下，韦尼泽洛斯及其支持者致力于将希腊推向世界舞台，几乎完全无视列强的意愿。#italic 安居拉！安居拉！#!"
