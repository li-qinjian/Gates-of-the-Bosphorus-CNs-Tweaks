 je_grefm_land_reclamation: "科派斯湖围垦"
 je_grefm_land_reclamation_reason: "科派斯平原在古代是一片肥沃的土地。凭借我们的工业实力，我们可以恢复他的生产力。目前，我们估计水位已经下降了#blue [GetGlobalVariable('grefm_lake_kopais_var').GetValue]/3#!。"
