 grefm_dismiss_auxilliaries_name: "解散巴伐利亚辅助部队"
 grefm_dismiss_auxilliaries_desc: "当国王奥托于1832年抵达时，他带来了3500名巴伐利亚士兵以巩固其统治。此后，这些士兵发现自己无法融入[ROOT.GetCountry.GetNameNoFlag]的生活——既不会当地语言，也无法在这个几乎全是农村的希腊国家获得家的舒适。随着开支不断增加以及他们被用于镇压叛乱，他们的存在令希腊民众感到日渐不满。"
 grefm_release_nikitaras_name: "释放尼基塔拉斯"
 grefm_release_nikitaras_desc: "尼基塔斯·斯塔马特洛普洛斯因在希腊独立战争中的英勇表现被视为民族英雄。然而，在$grefm_regency_council$执政期间，他因强烈反对$grefm_bavarocracy$而被囚禁。时至今日，仍有热忱的支持者渴望他重获自由。"
 grefm_authorize_palace_name: "资助皇家宫殿"
 grefm_authorize_palace_desc: "在许多方面，$grefm_bavarocrat$宫廷试图使其在希腊国家的存在合法化。国王议会中的几位成员已提议，建造一座真正的皇家住所将有助于巩固对[ROOT.GetCountry.GetName]的统治地位。"
 grefm_philhellenic_loan_name: "寻求亲希腊贷款"
 grefm_philhellenic_loan_desc: "热爱古希腊文化和艺术的亲希腊者资助了希腊革命。在西欧，多个亲希腊组织已承诺向这个年轻国家提供资金支持。"
 grefm_bavarocracy_convert_name: "皈依[GetReligion('orthodox').GetName][concept_religion]"
 grefm_bavarocracy_convert_desc: "尽管[ROOT.GetCountry.GetName]是一个虔诚的[GetReligion('orthodox').GetName]国家，但[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]却顽固地坚持其本土的[GetReligion('catholic').GetName]信仰，在他新获得的附属国中引起了相当大的惊愕。\n\n如果奥托的统治要在希腊人中持续下去，也许必须做出一些个人牺牲？"
 grefm_bavarocracy_convert_possible: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]信奉[GetReligion('catholic').GetName][concept_religion]"
 grefm_bavarocracy_convert_effect: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]将改信[GetReligion('orthodox').GetName]"
 grefm_seek_royal_wedding_name: "寻求皇室婚礼"
 grefm_seek_royal_wedding_desc: "$grefm_bavarocracy$的合法性因[ROOT.GetCountry.GetNameNoFlag]王位缺乏继承人而受损。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的顾问们建议，婚姻及生育继承人对确保[ROOT.GetCountry.GetRuler.GetLastName]家族持续被认可至关重要。"
 grefm_favor_hellene_king_name: "偏爱希腊候选人"
 grefm_favor_hellene_king_desc: "[GetCulture('greek').GetName]认同是团结全体希腊人的唯一途径。若我们有意，可为该文化背景的候选人提供官方支持。"
 grefm_favor_roman_king_name: "偏爱罗马候选人"
 grefm_favor_roman_king_desc: "[GetCulture('rhomaios').GetName]认同是团结全体希腊人的唯一途径。若我们有意，可为该文化背景的候选人提供官方支持。"
 grefm_elect_hellene_king_name: "选举一位希腊国王"
 grefm_elect_hellene_king_desc: "经过数月的艰辛筹备，一份由[GetCulture('greek').GetName]文化背景的王位候选人名单已然出炉，他们个个出身显赫、声望卓著，足以坐上[ROOT.GetCountry.GetName]的王座。国民议会正静待时机，选举下一任国王。"
 grefm_elect_hellene_king_possible: "[ROOT.GetCountry.GetNameNoFlag]向成为[GetCulture('greek').GetName]国王的进度已取得#v 100#!。"
 grefm_elect_hellene_king_effect: "[GetCulture('greek').GetName][concept_ruler]将被任命"
 grefm_elect_roman_king_name: "选举一位罗马国王"
 grefm_elect_roman_king_desc: "经过数月的艰辛筹备，一份由[GetCulture('rhomaios').GetName]文化背景的王位候选人名单已然出炉，他们个个出身显赫、声望卓著，足以坐上[ROOT.GetCountry.GetName]的王座。国民议会正静待时机，选举下一任国王。"
