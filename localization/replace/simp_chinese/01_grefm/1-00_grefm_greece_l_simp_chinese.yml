 je_grefm_bavarocracy_ip3: "巴伐利亚人统治"
 je_grefm_bavarocracy_ip3_reason: "继1832年$gbbf_bio_kapodistrias_ioannis$遇刺后，新生的[ROOT.GetCountry.GetAdjective] 王国——自君士坦丁十一世以来第一个真正独立的希腊国家——一直处于[ROOT.GetCountry.GetRuler.GetFullName]及其巴伐利亚摄政的控制之下。\n\n自掌权以来，[ROOT.GetCountry.GetRuler.GetFirstName]国王一直密谋通过专制手段统治希腊。与此同时，公民和政治家们都在抗议国内泛滥的停滞与腐败。如果这位年轻的国王想要证明自己是[GetCulture('greek').GetName]的合格统治者，他必须采取果断措施来安抚他的新臣民。$gbbf_linebreak_normal$当前，[concept_bavarocratic_ire]为#v [GetPlayer.MakeScope.Var('grefm_bavarocracy_instability_var').GetValue]#!。预计下个月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_ip3_ire_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#!。\n\n革命声势为#v [GetPlayer.MakeScope.Var('grefm_bavarocracy_var').GetValue]#!。当[concept_bavarocratic_ire]超过#v 80#!时，每月将增加#v 1#!革命声势。若革命声势达到#v 50#!，$grefm_bavarocracy$将被驱逐出[ROOT.GetCountry.GetName]。[GetPlayer.GetCustom('grefm_tyranny_type')]"
 je_grefm_bavarocracy_ip3_liberalism_complete: "如果以自由结果完成，触发#white #bold 希腊人的教化王#!#!事件"
 je_grefm_bavarocracy_ip3_autocracy_complete: "如果以专制结果完成，触发#white #bold 奥托王朝#!#!事件"
 je_grefm_bavarocracy_ip3_fail: "巴伐利亚统治民愤已连续#v 50#!个月处于#v 80#!或以上。目前已持续#v [GetPlayer.MakeScope.Var('grefm_bavarocracy_var').GetValue]#!个月。"
