l_simp_chinese:
 grefm_corinth_canal_survey_decision: "勘测科林斯地峡"
 grefm_corinth_canal_survey_decision_desc: "自古以来，科林斯地峡一直是连接伯罗奔尼撒半岛和希腊其他地区的重要通道。随着现代爆破工程技术的进步，我们或许能将伊奥尼亚海和爱琴海连接起来。"
 grefm_lake_kopais_decision: "排干科派斯湖"
 grefm_lake_kopais_decision_desc: "在古代，科派达平原经排水治理后成为该地区重要的农业区。凭借我们日益强大的工业实力，科派斯湖有望再次被排干。"
 je_grefm_bavarocracy_main: "巴伐利亚人统治"
 je_grefm_bavarocracy_main_reason: "在$gbbf_bio_kapodistrias_ioannis$遇刺导致[ROOT.GetCountry.GetAdjective]政府倒台后，$gbbf_great_powers$扶持了#yellow 维特尔斯巴赫家族#!作为希腊国家的君主，希望能为这个年轻的国家带来稳定。然而，自掌权以来，国王[ROOT.GetCountry.GetRuler.GetFullName]却密谋通过专制手段统治希腊。与此同时，公民和政治家们都在抗议国内泛滥的停滞与腐败。[SCOPE.GetRootScope.GetCountry.GetCustom('grefm_bavarocracy_type')]$gbbf_linebreak_normal$目前，国王享有#bold #greece [ROOT.GetVariable('grefm_bavarocracy_var').GetValue]#!#!#bold 政治支持度#!。\n预计下个月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_main_breakdown [ROOT.GetVariable('grefm_bavarocracy_progress_var').GetValue|+=2]#!。"
 je_grefm_bavarocracy_phase_regency: "$gbbf_linebreak_normal$@information!$grefm_regency_council$目前牢牢掌控着希腊国家及其政治。随着年轻的国王即将成年，他很快就能采取行动对抗#yellow 阿曼斯佩格#!及其爪牙。$gbbf_linebreak_normal$#bold 当前政局混乱度：#red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/100#!\n预计下个月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#!。"
 je_grefm_bavarocracy_phase_constitution: "$gbbf_linebreak_normal$@information!当$grefm_regency_council$为年幼的奥托国王代管国家时，曾承诺制定一部限制王权并为人民提供良好治理的宪法。国民议会正焦急地等待颁布选举权。如果政治动荡进一步加剧，宪政派领导人将对国王采取行动。$gbbf_linebreak_normal$#bold 当前政局混乱度：#red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!\n预计下个月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#!。"
 je_grefm_bavarocracy_phase_tyranny: "$gbbf_linebreak_normal$@information![ROOT.GetCountry.GetRuler.GetFullName]已宣布自己为[ROOT.GetCountry.GetName]的专制统治者。国民议会被解散，国王亲自主持枢密院，将所有国务直接收归御前。这并未石沉大海，宪政统治的支持者已开始号召人民投身民主事业。如果政治动荡进一步加剧，宪政派领导人将对国王采取行动。$gbbf_linebreak_normal$国王维持独裁统治已达#bold [ROOT.GetVariable('grefm_tyranny_var').GetValue]/84#!个月。\n#bold 当前政局混乱度：#red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!\n预计下个月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#!。"
 je_grefm_bavarocracy_phase_bavarianism: "$gbbf_linebreak_normal$@information![ROOT.GetCountry.GetRuler.GetFullName]已在[ROOT.GetCountry.GetName]强化了他的专制统治。剩下的就是稳固他对希腊国家的政治控制。"
 je_grefm_bavarocracy_status_regency: "$grefm_regency$掌握着王位。\n#bold 政局混乱度：#red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!"
 je_grefm_bavarocracy_status_constitution: "人民要求制定宪法。\n#bold 政局混乱度：#red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!"
