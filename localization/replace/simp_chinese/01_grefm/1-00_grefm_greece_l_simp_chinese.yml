 je_grefm_greek_king: "一位希腊国王"
 je_grefm_greek_king_reason: "欧洲强加的$grefm_bavarocracy$已经被推翻，然而这是以挑战[ROOT.GetCountry.GetAdjectiveNoFormatting]的外交为代价的。为了拯救独立的[ROOT.GetCountry.GetName]合法性，[ROOT.GetCountry.GetRuler.GetFullName]成立了一个临时政府，目的是任命一位能够获得欧洲贵族家族承认的统治者。"
 je_grefm_the_dedilomeni_principle: "信任投票原则"
 je_grefm_the_dedilomeni_principle_reason: "在经历了两次反对君主制的起义之后，改革精神在希腊广泛传播。改革者要求授权国王任命一位拥有多数派系支持的政府领导人，而不是通过国王的青睐来选择领导人。"
 je_grefm_the_dedilomeni_principle_otto_alternate_tt: "日志的成果将取决于哪一组法律的实施。"
 je_grefm_the_dedilomeni_principle_otto_alternate_goal: "专制还是民主"
 je_grefm_the_dedilomeni_principle_byzantium_alternate: "巴西琉斯与独裁者"
 je_grefm_the_dedilomeni_principle_byzantium_alternate_reason: "拜占庭王朝已重现辉煌，悠久的希腊行政传统历经四千年沧桑而延续至今。在希腊国家逐步围绕皇室法庭重塑其体制之际，无论是政治家还是普通市民，都对即将形成的帝国行政架构充满了期待与好奇。"
 je_grefm_the_military_league: "军事联盟"
 je_grefm_the_military_league_reason: "受克里特岛的合一运动和重新统一希腊民族的梦想驱使，我国的一群军国主义极端分子制定了一个推翻政府、让自己掌权的计划。如果他们成功了，他们打算重新组织希腊国，并推进$grefm_megali_idea$的事业。"
 je_grefm_the_womens_journal: "妇女杂志"
 je_grefm_the_womens_journal_reason: "在卡里罗伊·帕伦的带领下，以及在更广泛的女权运动的支持下，希腊的妇女渴望得到更好的待遇。历史上，她们被视为仅仅是家庭主妇，她们试图在促进希腊民族的团结和独立中发挥自己的作用。一份出版物，#italic 《妇女杂志》#!，为这一运动发出了号召，主张妇女应该有自己的财产权，以及儿童应该远离工厂的剥削。"
 je_grefm_corinth_canal_survey: "科林斯运河勘测"
 je_grefm_corinth_canal_survey_reason: "对科林斯运河的勘测已经展开。工程师们对开凿一条横跨地峡的航道以实现千年以来的梦想持乐观态度。"
 je_grefm_corinth_canal_survey_goal: "等待勘测完成……"
