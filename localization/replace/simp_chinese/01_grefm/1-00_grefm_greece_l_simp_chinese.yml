 grefm_identity_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_reform_desc 制定$grefm_identity$身份认同议程#!#!$grefm_agenda$"
 grefm_identity_reform_desc: "尽管$grefm_greek$人自古以来就生活在[GetGeographicRegion('geographic_region_aegean_sea').GetName]沿岸，但他们从未拥有过一种能够将他们团结在一起的独特文化认同。在民族领袖激情洋溢的演说鼓舞下，韦尼泽洛斯派希望建立一种能够将希腊国家凝聚在一起的文化。"
 grefm_identity_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_reform_desc 发展国家$grefm_identity$#!#!"
 grefm_civic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_civic_reform_desc 政府现代化#!#!$grefm_agenda$"
 grefm_civic_reform_desc: "希腊自从从奥斯曼帝国独立以来已经走了很长的路。现在，有了韦尼泽洛斯带来的新动力，修正主义者希望将国家机器建设成一个能够与西欧国家机器相媲美的体系。"
 grefm_civic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_civic_reform_desc 政府现代化#!#!"
 grefm_military_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_military_reform_desc 扩充军队#!#!$grefm_agenda$"
 grefm_military_reform_desc: "人们对希腊革命期间仓促组建的半正式#italic 部队#!的记忆已所剩无几。在决策者们希望希腊在巴尔干地区拥有话语权时就愈发清楚：一支纪律严明、战力强劲的军队，将是确保这一目标实现的关键所在。"
 grefm_military_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_military_reform_desc 扩充军队#!#!"
 grefm_social_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_social_reform_desc 推进社会规范#!#!$grefm_agenda$"
 grefm_social_reform_desc: "在许多方面，希腊的社会规范反映了几个世纪以来奥斯曼国家和东正教会带来的保守压力。知识分子认为，希腊必须摆脱这些封建残余，才能跃入现代。"
 grefm_social_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_social_reform_desc 推进社会规范#!#!"
 grefm_education_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_education_reform_desc 加强教育体系#!#!$grefm_agenda$"
 grefm_education_reform_desc: "尽管雄心勃勃，但韦尼泽洛斯派提出的教育改革旨在使希腊人民跻身学术水平的前列。"
 grefm_education_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_education_reform_desc 加强教育体系#!#!"
 grefm_constitution_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_constitution_reform_desc 改革宪法#!#!$grefm_agenda$"
 grefm_constitution_reform_desc: "随着韦尼泽洛斯抵达希腊，国民议会中的制宪派推动彻底废除君主制。"
 grefm_constitution_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_constitution_reform_desc 改革宪法#!#!"
 grefm_culture_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_culture_reform_desc 赞助人文学#!#!$grefm_agenda$"
 grefm_culture_reform_desc: "正是古希腊文化的遗产，最初激励了亲希腊派支持希腊国家的独立。韦尼泽洛斯派希望通过资助希腊全境的艺术活动，开启一场新的希腊文艺复兴。"
 grefm_culture_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_culture_reform_desc 赞助人文学#!#!"
