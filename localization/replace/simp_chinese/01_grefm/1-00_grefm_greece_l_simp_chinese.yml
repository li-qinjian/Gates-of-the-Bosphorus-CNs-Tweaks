 je_grefm_metaxism_flavor: "安德烈亚斯·梅塔克萨斯预示了[ROOT.GetCountry.GetName]一种新型威权政治的到来。梅塔克萨斯派借鉴了欧洲更广泛的[GetIdeology('ideology_fascist').GetName]思想流派，旨在[ROOT.GetCountry.GetAdjectiveNoFormatting]国家建立自己的专制统治——这种统治结合了社会进步、工业化理想以及种族纯洁与道德观。"
