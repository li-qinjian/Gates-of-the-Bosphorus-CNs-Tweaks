 grefm_metaxism_authoritarian_reform_agenda_desc: "梅塔克萨斯将希腊独立后的政治史描绘为充斥着动荡与腐败。有鉴于此，他的支持者力图边缘化并取缔一切形式的政治异见与民众抗争。"
 grefm_metaxism_authoritarian_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_authoritarian_reform_agenda_desc 巩固政治主导地位#!#!"
 grefm_metaxism_assimilation_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_assimilation_reform_agenda_desc 强制推行国家认同#!#!$grefm_agenda$"
 grefm_metaxism_assimilation_reform_agenda_desc: "受西方民族主义运动的启发，梅塔克萨斯阐述了他的梦想——建立一个仅由“纯正”希腊人居住的希腊国家。"
 grefm_metaxism_assimilation_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_assimilation_reform_agenda_desc 强制推行国家认同#!#!"
