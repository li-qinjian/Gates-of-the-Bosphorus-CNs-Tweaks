 grefm_metaxism_tradition_reform_agenda_desc: "梅塔克萨斯将其“新国家”的愿景建立在从古希腊斯巴达的纪律以及拜占庭帝国的中央集权国家和信仰中汲取的“国家、忠诚、家庭和宗教”价值观之上。因此，他的支持者接受了他的目标，即将[GetLawType('law_monarchy').GetName]和[GetLawType('law_state_religion').GetName]确立为新希腊的支柱。"
 grefm_metaxism_tradition_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_tradition_reform_agenda_desc 恢复传统的支柱#!#!"
