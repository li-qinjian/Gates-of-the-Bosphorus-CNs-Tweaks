 notification_grefm_don_pacifico_gre1_desc: "希腊已接受我们关于解决唐·帕西菲科事件争端的提议，双方关系得到改善。"
 notification_grefm_don_pacifico_gre2_name: "[SCOPE.sCountry('greece_scope').GetName]拒绝了我们的妥协。"
