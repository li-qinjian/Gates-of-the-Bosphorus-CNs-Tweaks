 grefm_metaxism_social_reform_agenda_desc: "梅塔克萨斯派对自由主义改革的否定并非全盘否定。尽管其根基在于民粹主义与民族主义，梅塔克萨斯派仍致力于为整个希腊带来繁荣。"
