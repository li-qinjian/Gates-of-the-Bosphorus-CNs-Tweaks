l_simp_chinese:
 je_grefm_samos_main: "萨摩斯的奴役"
 je_grefm_samos_main_reason: "#yellow 希腊#!在#bold 独立战争#!反抗时，爱琴海上许多较小的岛屿上的人民也加入了他们的行列。其中就有[ROOT.GetCountry.GetName]，他们反抗奥斯曼帝国，拒绝接受将他们重新并入帝国的条件。他们的反抗得到了$gbbf_great_powers$的认可，并从中进行干预#bold 奥斯曼宫廷#!，以确保群岛自治。\n\n目前这些岛屿名义上由苏丹任命的#italic 贝伊#!统治，但实际上独立统治。随着与#yellow 希腊#!合并被否决，岛民们希望有一天能结束与希腊表亲的分离现状。\n\n[Country.GetCustom('grefm_samos_support_type')]"
 je_grefm_samos_main_status_1: "领主[ROOT.GetCountry.GetRuler.GetFirstName]实行铁腕统治。"
 je_grefm_samos_main_status_2: "领主[ROOT.GetCountry.GetRuler.GetFirstName]有#bold #greece [GetPlayer.MakeScope.Var('grefm_samos_support_var').GetValue]#!#!支持"
 je_grefm_samos_main_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_samos_support_value')]"
 je_grefm_samos_organic_law: "萨摩斯组织法"
 je_grefm_samos_organic_law_reason: "[ROOT.GetCountry.GetName]的经济现状是奥斯曼帝国数百年来对它的统治体现。为了保卫这个小岛，$gbbf_great_powers$确保苏丹颁布了《组织宪章》，以换取该岛臣服于#bold 奥斯曼高门#!。不过岛上行政职能的实施却由岛民自己决定。"
 modifier_grefm_submission: "向苏丹投降"
 modifier_grefm_hegemonic_ruler: "霸权统治者"
 modifier_grefm_organic_charter: "原始宪章"
 modifier_grefm_samian_union: "萨摩斯联盟"
 custom_grefm_samos_progress: "亲王有#bold #greece [GetPlayer.MakeScope.Var('grefm_samos_support_var').GetValue]点#!#!支持，下个月将变化#tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_samos_main_breakdown [Country.MakeScope.ScriptValue('grefm_samos_support_value')|+=]点#!"
 grefm_samos_from_support: "有#green #bold 正面#!#![concept_approval]的$gbbf_interest_groups$[concept_clout] "
 grefm_samos_from_opposition: "有#red #bold 正面#!#![concept_approval]的$gbbf_interest_groups$[concept_clout] "
 je_grefm_stefanos_tt: "#yellow 斯特凡诺斯·博戈里迪#!不再是#bold 萨摩斯亲王#!"
 je_grefm_samos_main_lobby: "$gbbf_journal_lobby$\n萨摩斯岛名义上由苏丹任命的#italic 贝伊#!统治，但该岛政府除名义外拥有完全自治权。由于与希腊的合并被拒绝，岛民们盼望着与希腊亲族残酷分离的局面能够早日结束。"
 je_grefm_samos_organic_law_lobby: "$gbbf_journal_lobby$\n为了保卫这座小岛，西方国家迫使苏丹颁布了《组织宪章》，以此换取该岛以换取该岛臣服于$turkfm_porte$。不过岛上行政职能的实施却由岛民自己决定。"