l_simp_chinese:
 je_grefm_ion_xenocracy: "外来统治者"
 je_grefm_ion_xenocracy_reason: "从两千年前最初被罗马人征服开始，伊奥尼亚群岛就几经易手，虽然他们躲过了奥斯曼帝国的征服，但[ROOT.GetCountry.GetName]见证了无数霸主的来来往往。自1815年起，该岛成为大英帝国的保护国。在高级专员[ROOT.GetCountry.GetRuler.GetFullName]的主持下，帝国各地的亲希腊者努力将群岛塑造成一个理想的殖民地，与英国在其领土上取得的成就保持一。"
 je_grefm_ion_venetian_legacy: "威尼斯的遗产"
 je_grefm_ion_venetian_legacy_reason: "伊奥尼亚群岛在13世纪被威尼斯人从衰落的拜占庭帝国手中夺走后，威尼斯人带来了新的耕作方式，取代了古老的耕作方式。从此各岛屿的农业一直保持不变，在经历$gbbf_great_powers$之间冲突和#bold 希腊独立战争#!的破坏后，农业产量有所下降。随着伦敦亲希腊人的再次关注，当地领导人开始推动全岛农业改革。"
 je_grefm_ion_poverty: "救济院与卫生设施"
 je_grefm_ion_poverty_reason: "在#bold 希腊独立战争#!之后，[ROOT.GetCountry.GetName]涌入了大量难民。由于缺乏工业和农业，高级专员根据自己的授权成立了一个委员会，其明确目标是提供计划，来帮助赤贫者。"
 je_grefm_ion_jewry: "伊奥尼亚群岛的犹太人"
 je_grefm_ion_jewry_reason: "[GetCulture('sephardic').GetName]犹太人在[ROOT.GetCountry.GetName]有着悠久的历史。从第二圣殿时代和罗马统治时期的第一批犹太人，到因天主教的驱逐而迁徙的犹太人，因此伊奥尼亚群岛上有许多[GetReligion('jewish').GetName]社区。\n\n虽然在拜占庭、威尼斯和法国统治期间，犹太人的权利各不相同，但他们一直习惯于与[GetReligion('orthodox').GetName]$grefm_greek$社区共存。然而，随着群岛划归[ROOT.GetCountry.GetPowerBloc.GetName]，他们的处境发生了突变，大多数犹太人被排除在国家之外，许多人开始抗议他们的二等地位。\n\n目前，我们的#yellow 塞法迪犹太人#!$gbbf_pops$中有#bold #green [GetPlayer.MakeScope.Var('grefm_samos_loyalist_jews_var').GetValue]%#!#!是[concept_loyalist]，此外#yellow 塞法迪犹太人#!$gbbf_pops$有#bold #red [GetPlayer.MakeScope.Var('grefm_samos_radical_jews_var').GetValue]%#!#!是[concept_radical]。"
 je_grefm_ion_jewry_complete_tt1: "#yellow 塞法迪犹太人#!$gbbf_pops$[concept_sol]获得#bold #green +4#!或更高#!的[concept_acceptance][concept_modifier]。"
 je_grefm_ion_jewry_complete_tt2: "我们有超过#bold #green 75%#!#!#yellow 塞法迪犹太人#!$gbbf_pops$是$gbbf_loyal$。"
 je_grefm_ion_jewry_fail_tt: "我们有超过#bold #red 75%#!#!#yellow 塞法迪犹太人#!$gbbf_pops$是[concept_radical]。"
