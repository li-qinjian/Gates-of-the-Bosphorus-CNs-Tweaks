 je_balkfm_ser_monarchism_flavor_gotb: "与巴尔干地区其他国家不同，[ROOT.GetCountry.GetName]保留了本土贵族，而非引入欧洲王室。这有助于塞尔维亚实现自治。然而该国因此分裂为两大王朝：亲奥地利的$balkfm_house_obrenovic$王朝与亲$RUS_ADJ$的$balkfm_house_karadordevic$王朝。"
 je_balkfm_ser_monarchism_desc_gotb: "•$balkfm_house_obrenovic$目前拥有#bold [Country.MakeScope.Var('balkfm_obrenovic_support_var').GetValue]#!$balkfm_serbian_senate_support$。预计下个月将产生#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_breakdown [Country.MakeScope.ScriptValue('balkfm_obrenovic_progress_value')|+=]#!支持度。\n•$balkfm_house_karadordevic$目前拥有#bold [Country.MakeScope.Var('balkfm_karadordevic_support_var').GetValue]#!$balkfm_serbian_senate_support$。预计下个月将产生#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_breakdown [Country.MakeScope.ScriptValue('balkfm_karadordevic_progress_value')|+=]#!支持度。\n•[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_dynastic_rivalry_tilt_type')]"
 je_balkfm_ser_monarchism_factors_gotb: "$balkfm_house_obrenovic$将会因保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_pos 加强#!，因自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_neg 削弱#!。同样，$balkfm_house_karadordevic$将会因自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_pos 加强#!，因保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_neg 削弱#!。"
 je_balkfm_ser_monarchism_body_ip3: "$je_balkfm_ser_monarchism_flavor_ip3$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_desc_ip3$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_factors_ip3$"
 je_balkfm_ser_monarchism_flavor_ip3: "自[ROOT.GetCountry.GetName]独立以来，$balkfm_house_obrenovic$与$balkfm_house_karadordevic$两大王朝便为争夺[ROOT.GetCountry.GetAdjectiveNoFlag]王位暗中角力。$balkfm_house_karadordevic$——其始祖曾被誉为塞尔维亚民族英雄——正密谋推翻$balkfm_house_obrenovic$。卡拉乔尔杰曾解放塞尔维亚诸省，使其摆脱叛变的耶尼切里暴政，在世纪曙光中点燃自由之火。然而，也正是他在危机关头临阵脱逃。此后，$balkfm_house_obrenovic$家族挺身扛起旗帜。随着时间的推移，阴谋者必定会试图煽动民众，以实现其不可告人的目的，并推翻[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。这种权力更迭会给政府带来混乱，直到尘埃落定。"
 je_balkfm_ser_monarchism_desc_ip3: "•$balkfm_house_obrenovic$目前拥有#bold [Country.MakeScope.Var('balkfm_obrenovic_support_var').GetValue]#!$balkfm_serbian_senate_support$。预计下个月将产生#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_breakdown [Country.MakeScope.ScriptValue('balkfm_obrenovic_progress_value')|+=]#!支持度。\n•$balkfm_house_karadordevic$目前拥有#bold [Country.MakeScope.Var('balkfm_karadordevic_support_var').GetValue]#!$balkfm_serbian_senate_support$。预计下个月将产生#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_breakdown [Country.MakeScope.ScriptValue('balkfm_karadordevic_progress_value')|+=]#!支持度。\n•[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_dynastic_rivalry_tilt_type')]"
 je_balkfm_ser_monarchism_factors_ip3: "$balkfm_house_obrenovic$将会因保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_pos_ip3 加强#!，因自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_neg_ip3 削弱#!。同样，$balkfm_house_karadordevic$将会因自由主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_pos_ip3 加强#!，因保守主义而#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_neg_ip3 削弱#!。"
 je_balkfm_ser_obrenovic_pos_ip3: "以下因素将#bold 加强#!$balkfm_house_obrenovic$：\n•若已制定其中之一法律，支持[GetLawType('law_autocracy').GetName]或[GetLawType('law_autocracy').GetName]$gbbf_interest_groups$的[concept_clout]\n•若[GetPlayer.GetNameNoFlag]拥有[GetInstitutionType('institution_police').GetName][concept_institution]，支持[GetLawGroup('lawgroup_policing').GetName]的$gbbf_interest_groups$的[concept_clout]\n•若已制定其中之一法律，支持[GetLawType('law_serfdom').GetName]或[GetLawType('law_tenant_farmers').GetName]的$gbbf_interest_groups$的[concept_clout]\n•[GetPlayer.GetNameNoFlag]中的$gbbf_loyalists$\n•与#yellow 奥地利#!保持#green #bold 正面#!#![concept_relations]\n•使我们亲#yellow 奥地利#!的$gbbf_lobbies$保持#green #bold 正面#!#![concept_political_lobby_appeasement]\n•将#yellow 奥地利#!置于[ROOT.GetCountry.GetAdjectiveNoFlag]外交优先地位的首位\n•针对$balkfm_house_obrenovic$的对手进行抹黑行动\n•事件中的选择与结果"
 je_balkfm_ser_obrenovic_neg_ip3: "以下因素将 #bold 削弱#! $balkfm_house_obrenovic$：\n•若已制定任何#yellow 选举权#!法律，支持[GetLawType('law_autocracy').GetName]或[GetLawType('law_autocracy').GetName]$gbbf_interest_groups$的[concept_clout]\n•未启用[GetInstitutionType('institution_police').GetName][concept_institution]\n•若#bold 未制定#!上述任何法律，支持[GetLawType('law_serfdom').GetName]或[GetLawType('law_tenant_farmers').GetName]的$gbbf_interest_groups$的[concept_clout]\n•来自[GetPlayer.GetNameNoFlag]中的$gbbf_radicals$\n•与#yellow 奥地利#!处于#red #bold 负面#!#![concept_relations]\n•使我们亲#yellow 奥地利#!的$gbbf_lobbies$处于#red #bold 负面#!#![concept_political_lobby_appeasement]\n•将#yellow 俄罗斯#!置于[ROOT.GetCountry.GetAdjectiveNoFlag]外交优先地位的首位\n•$balkfm_house_obrenovic$未能支持#yellow 伏伊伏丁那#!\n•事件中的选择与结果"
 je_balkfm_ser_karadordevic_pos_ip3: "以下因素将 #bold 加强#! $balkfm_house_karadordevic$：\n•若颁布任何#yellow 选举权#!法律，支持#yellow 普选制#!的 $gbbf_interest_groups$ 的[concept_clout]\n•若颁布其中之一法律，支持 [GetLawType('law_right_of_assembly').GetName] 或 [GetLawType('law_protected_speech').GetName] 的 $gbbf_interest_groups$ 的[concept_clout]\n•若颁布其中之一法律，反对 [GetLawType('law_serfdom').GetName] 或 [GetLawType('law_tenant_farmers').GetName] 的 $gbbf_interest_groups$ 的[concept_clout]\n•与#yellow 俄罗斯#!保持 #green #bold 正面#!#! [concept_relations]\n•使我们亲#yellow 俄罗斯#!的 $gbbf_lobbies$ 保持 #green #bold 正面#!#! [concept_political_lobby_appeasement]\n•将#yellow 俄罗斯#!置于 [ROOT.GetCountry.GetAdjectiveNoFlag] 外交优先地位的首位\n•针对 $balkfm_house_karadordevic$ 的对手进行抹黑行动\n•事件中的选择与结果"
 je_balkfm_ser_karadordevic_neg_ip3: "以下因素将 #bold 削弱#! $balkfm_house_karadordevic$：\n•若#bold 未颁布#!任何#yellow 选举权#!法律，支持#yellow 普选制#!的 $gbbf_interest_groups$ 的[concept_clout]\n•若#bold 未颁布#!上述任何法律，支持 [GetLawType('law_right_of_assembly').GetName] 或 [GetLawType('law_protected_speech').GetName] 的 $gbbf_interest_groups$ 的[concept_clout]\n•若#bold 未颁布#!上述任何法律，反对 [GetLawType('law_serfdom').GetName] 或 [GetLawType('law_tenant_farmers').GetName] 的 $gbbf_interest_groups$ 的[concept_clout]\n•与#yellow 俄罗斯#!处于 #red #bold 负面#!#! [concept_relations]\n•使我们亲#yellow 俄罗斯#!的 $gbbf_lobbies$ 处于 #red #bold 负面#!#! [concept_political_lobby_appeasement]\n•将#yellow 奥地利#!置于 [ROOT.GetCountry.GetAdjectiveNoFlag] 外交优先地位的首位\n•$balkfm_house_karadordevic$ 未能支持#yellow 伏伊伏丁那#!\n•事件中的选择与结果"
 je_balkfm_ser_defenders_reason: "为了对[ROOT.GetCountry.GetName]的王室特权施加切实的限制，一群自称为“宪法捍卫者”的政治家联合起来反对专制统治。"
 je_balkfm_ser_greater_serbia_complete: "[ROOT.GetCountry.GetNameNoFlag]在[concept_nation_formation]组建了#yellow 塞尔维亚帝国#!"
 je_balkfm_ser_monarchism_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\n与巴尔干地区其他国家不同，#yellow 塞尔维亚#!保留了本土贵族，而非引入欧洲王室。这有助于塞尔维亚实现自治。然而该国因此分裂为两大家族：亲奥地利的#yellow 奥布雷诺维奇#!王朝与亲$RUS_ADJ$的#yellow 卡拉乔尔杰维奇#!王朝。"
 je_balkfm_ser_serbian_heartlands_lobby: "$gbbf_journal_lobby$\n塞尔维亚仅以影子的形式存在。只要我们的大多数人民还在外国的控制之下，我们的国家就没有未来。"
