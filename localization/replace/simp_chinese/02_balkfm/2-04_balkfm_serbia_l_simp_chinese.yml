 balkfm_serbian_senate_desc: "#bold 塞尔维亚参议院#!是塞尔维亚的主要立法机构。该机构于塞尔维亚脱离$turkfm_porte$统治获得自治之后成立，并就参议院在塞尔维亚未来扮演的角色问题上与君主制政府长期针锋相对。"
 balkfm_house_obrenovic_desc: "由米洛什·奥布雷诺维奇创立，并在1815年塞尔维亚起义中凭借其领导地位而掌权，是争夺塞尔维亚王位的两大王朝之一。该家族倾向于与奥地利结盟，自1817年卡拉乔尔杰遇刺后，便与$balkfm_house_karadordevic$陷入了激烈的争斗。"
 balkfm_house_karadordevic_desc: "由塞尔维亚1804年起义的#italic 领袖#!乔尔杰·彼得罗维奇创立的卡拉乔尔杰维奇王朝，是争夺塞尔维亚王位的两大王朝之一。该家族倾向于与俄罗斯结盟，自1817年卡拉乔尔杰遇刺后，便与$balkfm_house_obrenovic$陷入了激烈的权力斗争。"
