 balkfm_yugoslavia.016.d: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName]迈出了大胆的一步，毅然向其前宗主国宣告独立。在一份激进的宣言中，[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetRuler.GetFullName]宣布该国寻求与[ROOT.GetCountry.GetName]进行政治合并。"
