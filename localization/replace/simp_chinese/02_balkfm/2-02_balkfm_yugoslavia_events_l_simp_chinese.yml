l_simp_chinese:
 balkfm_yugoslavia.001.t1: "伊利里亚情怀"
 balkfm_yugoslavia.001.t2: "南斯拉夫主义"
 balkfm_yugoslavia.001.t3: "《草案》"
 balkfm_yugoslavia.001.t4: "南斯拉夫帝国"
 balkfm_yugoslavia.001.d1: "随着巴尔干地区反对帝国主义列强的紧张局势日益加剧，#yellow 伊利里亚运动#!的理想开始在南斯拉夫人中广泛传播。这一运动最初源于几位[GetCulture('croat').GetName]学者的著作，现已发展成为一场旨在将所有斯拉夫人从奥地利和奥斯曼统治下解放出来的宏大运动。"
 balkfm_yugoslavia.001.d2: "一份塞尔维亚民族主义文献的发表，在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的宫廷中引起了轩然大波。该文献被其作者#yellow 伊利亚·加拉沙宁#!命名为“草案”，其中规划了巴尔干斯拉夫人建立联盟的统一外交路线图。"
 balkfm_yugoslavia.001.d3: "在与[ROOT.GetCountry.GetRuler.GetLastName]亲王的会面中，民族主义政治家[SCOPE.sCharacter('garasanin_scope').GetFullName]向亲王及其满朝文武呈递了一份雄心勃勃的蓝图：通过与目前处于奥斯曼帝国控制下的南斯拉夫人联合，从而复兴塞尔维亚帝国。加拉沙宁深受波兰外交官#yellow 亚当·耶日·恰尔托里斯基#!著作的影响，提出了建立南斯拉夫联盟构想。在西方传入的民族主义思潮激发下，他将自己的理念浓缩为一份名为《纳切尔塔尼耶》（意为“草案”）的计划。"
 balkfm_yugoslavia.001.d4: "随着我们在东巴尔干的地位稳固，民族主义思想家们宣告：[ROOT.GetCountry.GetName]的天命当是从黑海一路延伸至亚德里亚海。"
 balkfm_yugoslavia.001.f1: "“我们的意图并非要废除各民族自身的名字，而是将其统一在一个总称之下。因为每一个独立的名字都承载着其独特的历史，而这些历史汇聚在一起，便构成了伊利里亚民族更宏大的整体历史。”——柳德维特·盖伊，1839年"
 balkfm_yugoslavia.001.f2: "加拉沙宁深受波兰外交官#yellow 亚当·耶日·恰尔托里斯基#!著作的影响，提出了建立南斯拉夫联盟构想。在西方传入的民族主义思潮激发下，他将自己的理念浓缩为一份名为《纳切尔塔尼耶》（意为“草案”）的计划。"
 balkfm_yugoslavia.001.f3: "“……殿下，我的儿子[SCOPE.sCharacter('garasanin_scope').GetFirstName]渴求进入国家机构效力已久，并已为此做好了充分准备。若蒙殿下不弃，赐予他这份荣耀，那将是莫大的恩典。”——M·加拉沙宁上米洛什亲王书，1833年"
 balkfm_yugoslavia.001.f4: "除非所有#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!人民都能生活在我们的旗帜下，否则从奥斯曼枷锁中解放出来的梦想就无法完全实现。"
 balkfm_yugoslavia.001.a: "我们将与我们的$balkfm_south_slav$兄弟统一！"
 balkfm_yugoslavia.001.b: "这是一个不切实际的想法。"
 balkfm_yugoslavia.002.t: "《山地花环》"
 balkfm_yugoslavia.002.d: "历经一年的潜心创作，[SCOPE.sCountry('montenegro_scope').GetName]的[SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('montenegro_scope').GetRuler.GetFullName]发表了他的史诗巨著——#yellow 《山地花环》#!。作为一部气势磅礴的黑山史诗级诗作，这部宏大的长诗讲述了黑山人民反抗那些企图将他们从巴尔干版图上抹去的势力的英勇故事。通过将这部作品带给劳苦大众，[SCOPE.sCountry('montenegro_scope').GetRuler.GetFirstName]点燃了一座灯塔，号召斯拉夫各民族在独立自主的同一面旗帜下走向统一。"
 balkfm_yugoslavia.002.f: "“顺境之中人皆可伪善，\n逆境之下方能显英雄！”\n——《山地花环》，第137–138诗节"
 balkfm_yugoslavia.002.a: "我们的精神永不熄灭。"
 balkfm_yugoslavia.002.b: "这只会进一步加剧紧张局势……"
 balkfm_yugoslavia.003.t: "《维也纳文学协定》"
 balkfm_yugoslavia.003.d: "来自[GetCulture('serb').GetName]、[GetCulture('croat').GetName]和[GetCulture('slovene').GetName]的知识分子齐聚[SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName]，旨在统一并规范他们的文学语言。虽然此次会议并未达成具有约束力的正式协议，但各方一致认为，应以#yellow 什托方言#!作为未来标准语的基础。"
 balkfm_yugoslavia.003.f: "“整个伊利里亚只能有一种真正的文学语言……它不属于某一个地方或某一个国家，而是属于整个伊利里亚……我们的语法和词典就是整个伊利里亚。在那座无垠的花园里，处处盛开着美丽的鲜花：让我们把所有最美好的事物编织成一顶永不枯萎的花环。”——L·盖伊，1835年"
 balkfm_yugoslavia.003.a: "一次有趣的尝试。"
 balkfm_yugoslavia.008.t: "南斯拉夫主义的幻灭"
 balkfm_yugoslavia.008.d: "随着南斯拉夫主义最后堡垒的崩溃，建立一个统一南斯拉夫国家的梦想已然宣告破灭。"
 balkfm_yugoslavia.008.f: "“嘿，斯拉夫人，我们祖先的遗训（精神）犹在，\n只要子孙的心脏还在为民族跳动！\n斯拉夫精神永存，它将千秋万代，永垂不朽！”"
 balkfm_yugoslavia.008.a: "这真是灾难性的一天。"
 balkfm_yugoslavia.009.t: "南斯拉夫的诞生"
 balkfm_yugoslavia.009.t1: "《[SCOPE.sCountry('yugoslav_formation_scope').GetCapital.GetCityHubName]宣言》"
 balkfm_yugoslavia.009.d: "巴尔干的斯拉夫人民已经砸碎了奥斯曼和奥地利帝国的枷锁，合并为了一个统一的国家。在[SCOPE.sCountry('yugoslav_formation_scope').GetCapital.GetCityHubName]举行的一系列群情激昂的演讲中，南斯拉夫主义领袖们正式宣告了[SCOPE.sCountry('yugoslav_formation_scope').GetName]的成立。"
 balkfm_yugoslavia.009.f: "自由。这不仅是从桎梏中解脱，更是真正的自由。我们不再夹在铁锤与铁砧、猎犬与猎人之间，开启全新联合的时机已经成熟。一个让世人瞩目的斯拉夫新联盟就此诞生。"
 balkfm_yugoslavia.009.a: "一个伟大的联邦。"
 balkfm_yugoslavia.010.t: "南斯拉夫主义者暴动"
 balkfm_yugoslavia.010.d: "在我们的暗中支持下，身处[SCOPE.sState('balkfm_rebellion_state_scope').GetCityHubName]的#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!激进分子已经夺取了地区首府的控制权，并宣布[SCOPE.sCountry('balkfm_rebellion_scope').GetName]独立。他们已向国际社会发出呼吁，寻求援助与外交承认。"
 balkfm_yugoslavia.010.f: "“这里至少有五百万人说着同一种语言，但由于宗教信仰不同，他们被分成了三个群体……其中只有前三百万人自称为塞尔维亚人，其余的人则不愿接受这个称呼。”——武克·卡拉季奇，1849年"
 balkfm_yugoslavia.010.a: "所有斯拉夫人都理应获得自由。"
 balkfm_yugoslavia.011.t: "[SCOPE.sState('balkfm_rebellion_state_scope').GetName]的南斯拉夫主义者暴动"
 balkfm_yugoslavia.011.d: "[SCOPE.sState('balkfm_rebellion_state_scope').GetName]境内的#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!激进分子已经夺取了地区首府的控制权，并宣布[SCOPE.sCountry('balkfm_rebellion_scope').GetName]独立。他们要求[ROOT.GetCountry.GetAdjectiveNoFlag]当局立即承认其独立地位。"
 balkfm_yugoslavia.011.f: "“他们所到之处，身后都留下一道宽宽的血痕；在他们的统治所及之处，文明荡然无存。他们代表的处处是强权统治，而非法律治理。为了这一生的指引，他们抱持着冷酷的宿命论；而作为来世的奖赏，则是骄奢淫逸的天堂。”——W·E·格莱斯顿，1876年"
 balkfm_yugoslavia.011.a: "镇压他们！"
 balkfm_yugoslavia.011.b: "赐予他们自治权。"
 balkfm_yugoslavia.012.t: "[SCOPE.sState('balkfm_rebellion_state_scope').GetName]的南斯拉夫主义者暴动"
 balkfm_yugoslavia.012.d: "[SCOPE.sState('balkfm_rebellion_state_scope').GetName]境内的#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!激进分子已经夺取了地区首府的控制权，并宣布[SCOPE.sCountry('balkfm_rebellion_scope').GetName]独立。他们要求[ROOT.GetCountry.GetAdjectiveNoFlag]当局立即承认其独立地位。"
 balkfm_yugoslavia.012.f: "“他们所到之处，身后都留下一道宽宽的血痕；在他们的统治所及之处，文明荡然无存。他们代表的处处是强权统治，而非法律治理。为了这一生的指引，他们抱持着冷酷的宿命论；而作为来世的奖赏，则是骄奢淫逸的天堂。”——W·E·格莱斯顿，1876年"
 balkfm_yugoslavia.012.a: "镇压他们！"
 balkfm_yugoslavia.012.b: "赐予他们自治权。"
 balkfm_yugoslavia.014.t: "南斯拉夫主义者起义"
 balkfm_yugoslavia.014.d: "[SCOPE.sState('balkfm_provocation_state_scope').GetName]内的[SCOPE.sCulture('balkfm_rebellion_culture_scope').GetName]激进分子已经夺取了地区首府的控制权，并宣布[SCOPE.sCountry('balkfm_rebellion_scope').GetName]独立。他们要求[ROOT.GetCountry.GetAdjectiveNoFlag]当局立即承认其独立地位。"
 balkfm_yugoslavia.014.f: "“他们所到之处，身后都留下一道宽宽的血痕；在他们的统治所及之处，文明荡然无存。他们代表的处处是强权统治，而非法律治理。为了这一生的指引，他们抱持着冷酷的宿命论；而作为来世的奖赏，则是骄奢淫逸的天堂。”——W·E·格莱斯顿，1876年"
 balkfm_yugoslavia.014.a: "镇压他们！"
 balkfm_yugoslavia.014.b: "赐予他们自治权。"
 balkfm_yugoslavia.015.t: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName]寻求联合"
 balkfm_yugoslavia.015.d: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName]迈出了大胆的一步，毅然向其前宗主国宣告独立。在一份激进的宣言中，[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetRuler.GetFullName]宣布该国寻求与[ROOT.GetCountry.GetName]进行政治合并。"
 balkfm_yugoslavia.015.f: "谈判进行得出乎意料地顺利，两国的合并前景十分乐观。然而，反对者仍在不断警告，这可能会在巴尔干地区引发更进一步的动荡风险。"
 balkfm_yugoslavia.015.a: "我们欢迎我们的#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!兄弟！"
 balkfm_yugoslavia.015.b: "现在还不是时候，耐心会有回报的。"
