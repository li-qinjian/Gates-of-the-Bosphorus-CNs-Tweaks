l_simp_chinese:
 je_balkfm_rom_regulamentul_organic: "《组织条例》"
 je_balkfm_rom_regulamentul_organic_reason: "[ROOT.GetCountry.GetName]名义上只是奥斯曼帝国的一部分。但该国最近获得了自治权，不过大部分地区仍然是落后地区。几个世纪以来，奥地利军事冲突和俄土冲突破坏了秩序，使得国家无法在乡村行使权力，经济仍然是名存实亡的封建经济。\n\n$RUS_ADJ$帝国利用其作为罗马尼亚人民守护者的名号，对[ROOT.GetCountry.GetAdjectiveNoFormatting]国家强加了#italic 《组织条例》#!，里面规定要求[ROOT.GetCountry.GetNameNoFormatting]采取措施使自己和人民实现现代化。\n\n#blue 《组织条例》规定，我国[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的任期不得超过七年。#!"
 je_rom_regulamentul_organic_tt: "[ROOT.GetCountry.GetNameNoFlag]已完成大于等于4项#bold 奥斯曼统治的遗祸#!日志条目（已完成#bold [GetPlayer.MakeScope.Var('balkfm_ottoman_legacy_var').GetValue]#!项）"
 je_balkfm_rom_regulamentul_election_tt1: "#bold 大公#!选举将在#bold [ROOT.GetVariable('balkfm_regulamentul_var').GetValue]#!年后举行"
 je_balkfm_rom_regulamentul_election_tt2: "#bold 大公#!选举将在明年举行"
 je_balkfm_rom_regulamentul_election_tt3: "#bold 大公#!选举正在进行中"
 je_balkfm_rom_regulamentul_election_tt4: "选举进程受到干扰。"
 je_balkfm_rom_1848: "罗马尼亚自由主义"
 je_balkfm_rom_1848_reason: "随着启蒙思想涌入[ROOT.GetCountry.GetName]，围绕在亲王周围的贵族阶层已经对#italic 《组织条例》#!上承诺感到失望。自由派虽然并不寻求彻底废除《组织条例》，但也提出了限制亲王特权和保障公民权利的要求。\n\n当前亲王有#variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200点#!支持度，预计下个月将变动#variable #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_1848_sources [ROOT.GetVariable('balkfm_1848_progress_var').GetValue|+=]#!#!"
 je_balkfm_rom_1848_status: "亲王有#variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200#!点支持度"
 je_balkfm_rom_1848_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_1848_progress_value')]"
 balkfm_1848_rom_success_tt: "亲王有获得#bold 200点#!支持度"
 balkfm_1848_rom_fail_tt: "亲王已失去所有支持"
 balkfm_intervention_tt: "亲王的支持点不到#bold 50#!"
 je_balkfm_rom_statutul_dezvoltator: "地区开发"
 je_balkfm_rom_statutul_dezvoltator_reason: "[ROOT.GetCountry.GetRuler.GetFullName]已经巩固罗马尼亚公国，现在利用他作为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]正试图扩大对国家控制，他现在的目标是恢复公国的专制统治，来打压反对派。\n\n对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的支持度下月预计将变化#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_statutul_dezvoltator_sources [ROOT.GetVariable('balkfm_dezvoltator_progress_var').GetValue|+=]#!"
