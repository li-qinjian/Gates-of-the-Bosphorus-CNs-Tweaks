 je_balkfm_rom_constitution_3: "国王已经没有多少支持者了。"
 je_balkfm_rom_nationalism: "罗马尼亚民族主义"
 je_balkfm_rom_nationalism_reason: "罗马尼亚人至少在达契亚行省时代就已存在，但这些讲罗曼语的民族的起源却一直是个谜。从最初被罗马征服，到斯拉夫民族和后来的突厥民族入侵，罗马尼亚人从未建立过属于自己民族的国家。在民族主义浪潮的推动下，出现了两个相互竞争的思想流派，他们试图书写自己版本的罗马尼亚历史，实现自己对[ROOT.GetCountry.GetName]的愿景。$gbbf_linebreak_normal$#yellow 保守派朱尼姆派#!认为，罗马尼亚缺乏坚实的社会经济基础，现代罗马尼亚人有纯正罗马血统的观点是完全是捏造的。由#yellow 蒂图·麦奥雷斯库#!领导的#yellow 朱尼姆派#!控制了#white #bold [ROOT.GetVariable('balkfm_junimism_var').GetValue]点支持度#!#!，预计下一个月将变化#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_junimism_sources [Country.MakeScope.ScriptValue('balkfm_junimism_progress_value')|+=]#!$gbbf_linebreak_normal$#yellow 自由派达契亚派#!认为，罗马尼亚民族的严谨性十分独特，融合了罗马人和达契亚人的特点，赋予罗马尼亚民族开拓精神，促使他们成为欧洲事务的领导者。在 #yellow 博格丹·哈斯杜#!领导的#yellow 达契亚派#!控制#white #bold [ROOT.GetVariable('balkfm_dacianism_var').GetValue]点支持度#!#!，预计下一个月将变化#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_dacianism_sources [Country.MakeScope.ScriptValue('balkfm_dacianism_progress_value')|+=]#!\n$gbbf_linebreak_normal$\n[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_romanian_nationalism_progress_type')]"
