 je_balkfm_rom_statutul_dezvoltator_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_dezvoltator_progress_value')]"
 je_balkfm_rom_1866_1: "罗马尼亚宪政"
 je_balkfm_rom_1866_1_reason: "[ROOT.GetCountry.GetRuler.GetFullName]国王以捍卫罗马尼亚人民的自由为借口受邀统治[ROOT.GetCountry.GetName]。随着他对宪法的认可，人民期待着他领导人将制定的改革付诸实施。"
 je_balkfm_rom_1866_2: "罗马尼亚宪政"
 je_balkfm_rom_1866_2_reason: "[ROOT.GetCountry.GetRuler.GetFullName]国王以捍卫罗马尼亚人民的自由为借口应邀统治[ROOT.GetCountry.GetName]。然而国王贪图王位专制的权力，试图将自己的统治强加给罗马尼亚国家。\n\n国王当前有#variable [ROOT.GetVariable('balkfm_1866_var').GetValue]#!点支持度。因#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_sources 各种原因#!，下个月将更变为#variable [ROOT.GetVariable('balkfm_1866_progress_var').GetValue|+=]#!。"
 je_balkfm_rom_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_1866_progress_value')]"
 je_balkfm_rom_1866_fail: "国王已失去所有支持"
 je_balkfm_rom_constitution_1: "国王得到了广泛的支持。"
