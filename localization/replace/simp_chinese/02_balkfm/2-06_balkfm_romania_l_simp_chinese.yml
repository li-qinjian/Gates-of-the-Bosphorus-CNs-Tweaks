 je_balkfm_rom_united_principalities: "罗马尼亚诸公国"
 je_balkfm_rom_united_principalities_reason: "多瑙沿岸的诸公国，醒来！祖国的利益呼唤着自由，罗马尼亚民族的福祉要求我们行动！我们必须实现联合，分散各地的讲罗马尼亚语的同胞要建立一个统一的民族国家。然而，我们必须谨慎行事——绝不能在这一进程中惊扰到任何$gbbf_great_powers$。\n\n我们已维系公国联合达#variable [Country.MakeScope.Var('romanian_union_var').GetValue]/120#!月。。"
 je_balkfm_rom_united_principalities_reason_status_1: "统一罗马尼亚诸公国"
 je_balkfm_rom_united_principalities_reason_status_2: "维系公国联合达10年。"
 je_balkfm_rom_greater_romania: "大罗马尼亚"
 je_balkfm_rom_greater_romania_reason: "[ROOT.GetCountry.GetName]已经联合，然而无数罗马尼亚人被困在国外，遭受列强的统治和虐待。只有当所有罗马尼亚人都能以罗马尼亚为家时，罗马尼亚国家才是完整的。"
