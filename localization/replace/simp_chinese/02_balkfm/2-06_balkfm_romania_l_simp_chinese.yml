 balkfm_romanian_liberalism_progressbar: "罗马尼亚自由主义支持#!：\n#bold 当前支持度：[ROOT.GetVariable('balkfm_1848_rom_var').GetValue] / 200#!$gbbf_linebreak_normal$\n#bold #italic 影响自由主义支持度的因素：#!#!\n[GetPlayer.MakeScope.GetScriptValueDesc('balkfm_1848_progress_value')]$gbbf_linebreak_normal$#white #bold #italic 预计[ROOT.GetVariable('balkfm_1848_progress_var').GetValue|+=] / 月"
 balkfm_romanian_liberalism_progressbar_desc: "罗马尼亚自由主义支持"
 je_balkfm_rom_regulamentul_organic_lobby: "$gbbf_journal_lobby$\n凭借其作为罗马尼亚人民担保者的地位，$RUS_ADJ$帝国已向各公国强加了#italic 《组织条例》#!。该法规各项条款规定，这些小国必须采取措施实现自身及人民的现代化。"
 je_balkfm_rom_nationalism_lobby: "$gbbf_journal_lobby$\n从罗马征服，到斯拉夫迁徙，再到土耳其入侵，罗马尼亚人民从未拥有过自己的国家。在民族主义浪潮的推动下，两种相互竞争的思潮应运而生，它们试图书写各自版本的罗马尼亚历史，并推行其对于罗马尼亚的愿景。"
 je_balkfm_rom_united_principalities_lobby: "$gbbf_journal_lobby$\n多瑙沿岸的诸公国，醒来！祖国的利益呼唤着自由，罗马尼亚民族的福祉要求我们行动！我们必须实现联合，分散各地的讲罗马尼亚语的同胞要建立一个统一的民族国家。"