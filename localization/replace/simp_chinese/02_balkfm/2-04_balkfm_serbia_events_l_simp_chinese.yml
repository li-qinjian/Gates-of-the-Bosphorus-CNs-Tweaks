l_simp_chinese:
 balkfm_serbia.001.t: "米莱塔叛乱"
 balkfm_serbia.001.d: "像绝大多数巴尔干国家一样，[ROOT.GetCountry.GetName]以农村为主且混乱不堪，依赖于列强，从[SCOPE.sCountry('ottoman_scope').GetName]获得事实上的独立的数十年来，塞尔维亚被保皇派和立宪派间的政治斗争弄得四分五裂。\n\n在#yellow 米勒塔·拉多伊科维奇#!叛乱后，[ROOT.GetCountry.GetRuler.GetFirstName]大公有意将其权利限制，然而列强对此强烈反对，迫于外界压力，大公出于对“塞尔维亚公国宪法”改革的担忧，废除了该宪法，目前正等待国民议会制定新宪法"
 balkfm_serbia.001.f: "大公[ROOT.GetCountry.GetRuler.GetFullName]要求在绝对君主制下进行社会改革，但遭到了#yellow 亚历山大·卡拉乔尔杰维奇#!的支持者们的反对，他们要求限制君主权力。大公[ROOT.GetCountry.GetRuler.GetLastName]或许是位战争英雄，但他对绝对统治的要求使他与人民渐行渐远。"
 balkfm_serbia.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_serbia.002.t: "被强加的宪法"
 balkfm_serbia.002.d: "#yellow 大公#![ROOT.GetCountry.GetRuler.GetLastName]不愿召集议会起草宪法，并对提交给高门和列强的文件感到愤怒。在议会和外国代表的双重压力下，大公签署了被称为“土耳其宪法”的文件并离开国家，就此退位。体弱多病，一只脚踏进棺材里的新大公[SCOPE.sCharacter('milan_scope').GetFullName]即将登上宝座。"
 balkfm_serbia.002.f: "“当这块石头从萨瓦河升起时，你将再次回到塞尔维亚！”——佩里希奇致信米洛什大公，1839年"
 balkfm_serbia.002.a: "专制主义不容于[ROOT.GetCountry.GetName]。"
 balkfm_serbia.002.tt: "#yellow 米洛什大公#!退位。"
 balkfm_serbia.003.t: "无经验的统治者"
 balkfm_serbia.003.d: "在米洛什大公退位后，他的儿子[ROOT.GetCountry.GetRuler.GetFullName]名义上继承了大公衔。他登上宝座时身患肺结核，勉强活了四周便魂归天堂了。他的兄弟[SCOPE.sCharacter('milhailo_scope').GetFullName]转而被选为大公衔继承人。他年轻而缺乏从政经验，很快便发现自己只能听任一心想要进一步削减王室权力的参议院的摆布。"
 balkfm_serbia.003.f: "年轻的大公似乎打算追随父亲的脚步。尽管父亲已经流亡海外，但他仍推动恢复独裁统治，却不知道自己正在逐渐失去他所拥有的一点政治支持。利用他政治经验不足这一弱点，卡拉乔尔杰维奇家族的支持者开始反对大公，试图将奥布雷诺维奇家族赶下台。"
 balkfm_serbia.003.a: "他会得到教训的。"
 balkfm_serbia.007.t: "宪法捍卫者"
 balkfm_serbia.007.d: "在专制统治的威胁下，[SCOPE.sCharacter('kaykay_scope').GetFullName]团结了政治和军事领导人，将[ROOT.GetCountry.GetRuler.GetFullName]赶下了王位。经高门批准，他被任命为[ROOT.GetCountry.GetName]的新亲王。"
 balkfm_serbia.007.f: "“我们推翻一个帕夏，并不是为了用另一个帕夏来取而代之。”"
 balkfm_serbia.007.a: "我们将捍卫我们的自由。"
 balkfm_serbia.007.tt1: "#yellow 米海洛亲王#!退位。"
 balkfm_serbia.007.tt2: "#yellow 卡拉乔尔杰维奇#!家族登上王位"
 balkfm_serbia.008.t: "缺乏改革"
 balkfm_serbia.008.d: "尽管人们普遍要求进行改革，摆脱奥斯曼帝国统治时期留下的陈旧社会经济制度，但黑山议会却迟迟未能及时实施这些改革。"
 balkfm_serbia.008.f: "除非[ROOT.GetCountry.GetName]能够摆脱奥斯曼残留制度，否则我们可能注定落后。"
 balkfm_serbia.008.a: "我们注定要停滞不前吗？"
 balkfm_serbia.009.t: "重铸[ROOT.GetCountry.GetName]"
 balkfm_serbia.009.d: "尽管王室尊严受到侵犯，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]还是推行了改革，大大削减了王室特权，同时为塞尔维亚人民提供了自由保障。"
 balkfm_serbia.009.f: "塞尔维亚人民可以自信地摆脱奥斯曼帝国强加给他们的封建残余枷锁。"
 balkfm_serbia.009.a: "干得漂亮。"
 balkfm_serbia.010.t: "卡拉乔尔杰维奇家族登上王位"
 balkfm_serbia.010.d: "奥布雷诺维奇家族的支持率如今已经一落千丈。[ROOT.GetCountry.GetRuler.GetFullName]流亡归来。经参议院批准，他被拥立为新的[ROOT.GetCountry.GetName]大公。"
 balkfm_serbia.010.f: "前大公[SCOPE.sCharacter('balkfm_obrenovic_scope').GetFullName]已流亡。然而，他在参议院内仍有强有力的基本盘。新大公必须迅速采取行动使其统治合法化。"
 balkfm_serbia.010.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 balkfm_serbia.011.t: "奥布雷诺维奇家族登上王位"
 balkfm_serbia.011.d: "卡拉乔尔杰维奇家族的支持率如今已经一落千丈。[ROOT.GetCountry.GetRuler.GetFullName]流亡归来。经参议院批准，他被拥立为新的[ROOT.GetCountry.GetName]大公。"
 balkfm_serbia.011.f: "前大公[SCOPE.sCharacter('balkfm_balkfm_karadordevic_scope').GetFullName]已流亡。然而，他在参议院内仍有强有力的基本盘。新大公必须迅速采取行动使其统治合法化。"
 balkfm_serbia.011.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 balkfm_serbia.012.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName]要求优先地位"
 balkfm_serbia.012.d: "随着[ROOT.GetCountry.GetRuler.GetLastName]家族坐上王位，他们在[SCOPE.sCountry('balkfm_supplicant_scope').GetName]的支持者向宫廷提出要求，要求将他们的领事排在塞尔维亚外交排序的第一位，而[SCOPE.sCountry('balkfm_consul_scope').GetName]的领事对此提出抗议。"
 balkfm_serbia.012.f: "尽管俄罗斯和奥地利没有在这个问题上发生冲突，但两国之间为争夺对亲王的影响力而展开了无休止的竞争。"
 balkfm_serbia.012.a: "我们不会驱逐[SCOPE.sCountry('balkfm_consul_scope').GetName]"
 balkfm_serbia.012.b: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName]值得优先考虑。"
 balkfm_serbia.013.t: "腺鼠疫爆发！"
 balkfm_serbia.013.d: "一场瘟疫正在[SCOPE.sCountry('ottoman_scope').GetName]蔓延，这使得[ROOT.GetCountry.GetRuler.GetFirstName]亲王陷入了进退维谷的境地：是将染病的土耳其驻军封锁在堡垒中，限制疫情蔓延，还是放任疾病扩散，以避免惹怒高门？"
 balkfm_serbia.013.f: "尽管已经封锁了边境，但驻扎在贝尔格莱德的土军还是将瘟疫带入了塞尔维亚。我们相信，只要迅速采取行动，就能控制住疫情的蔓延。"
 balkfm_serbia.013.a: "封锁驻地，严禁出入。"
 balkfm_serbia.013.b: "这将侵犯高门的权利。"
 balkfm_serbia.014.t: "暴虐的驻军"
 balkfm_serbia.014.d: "贝尔格莱德的土耳其驻军被指控对该市的塞尔维亚居民实施虐待。从盗窃到公然谋杀的指控不一而足，议会已要求亲王向奥斯曼帝国寻求赔偿。"
 balkfm_serbia.014.f: "名义上，塞尔维亚被授予了完全的自主管理权。然而，高门却坚持在贝尔格莱德要塞驻军，这一行为明显违背了条约中的规定。"
 balkfm_serbia.014.a: "我们将要求补偿。"
 balkfm_serbia.014.b: "我们不能激怒高门。"
 balkfm_serbia.018.t: "巩固君主制"
 balkfm_serbia.018.d: "在对#o 参议院#!的激动人心的演讲中，#yellow [ROOT.GetCountry.GetRuler.GetLastName]家族#!正式要求承认他们的统治应该是永久和世袭的。"
 balkfm_serbia.018.f: "尽管得到了广泛的支持，但[ROOT.GetCountry.GetName]各地仍有强大的反对者，这还不包括外国势力可能做出的反应。"
 balkfm_serbia.018.a: "[ROOT.GetCountry.GetName]值得一个合适的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 balkfm_serbia.018.cement: "水泥是一种粘结剂，是一种用于建筑的化学物质，可以凝固、硬化并粘附在其他材料上，将它们粘合在一起。水泥很少单独使用，而是用来将沙子和碎石（骨料）粘合在一起。水泥与细骨料混合可制成砌筑砂浆，或与沙子和砾石混合可制成混凝土。混凝土是目前使用最广泛的材料，是地球上仅次于水的消耗量最大的资源。"
 balkfm_serbia.019.t: "天命攸归"
 balkfm_serbia.019.d: "尽管#o 参议院#!内部存在严重分歧，但#yellow [ROOT.GetCountry.GetRuler.GetLastName]家族#!已巩固了自己作为[ROOT.GetCountry.GetName]合法统治者的地位。随着《继承法》的通过，塞尔维亚国家最终将拥有世袭君主。"
 balkfm_serbia.019.f: "通过稳定君主制之间的争论，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和参议院应该能够确保塞尔维亚一定程度的政治稳定。"
 balkfm_serbia.019.a: "[ROOT.GetCountry.GetRuler.GetLastName]家族万岁！"
 balkfm_serbia.200.t: "塞尔维亚的心脏地带"
 balkfm_serbia.200.d: "[ROOT.GetCountry.GetName]或许已经摆脱了高门的直接统治，但是依旧有无数的[GetCulture('serb')]人口流落在国界以外。我们必须将他们全部纳入统一的塞尔维亚国家。"
 balkfm_serbia.200.f: "征服瓦尔达尔河以北，南至马其顿西至波斯尼亚的“古塞尔维亚”之地，已经成为了塞尔维亚民族主义者的战斗口号。"
 balkfm_serbia.200.a: "我们的义务便是将所有塞族人从压迫中解放。"
 balkfm_serbia.201.t: "大塞尔维亚"
 balkfm_serbia.201.d: "随着我们祖国的心脏地带在我们的控制之下，收复主义狂热席卷了[ROOT.GetCountry.GetName]。无论是公民还是政客，都在高呼恢复塞尔维亚在巴尔干地区的霸主地位。"
 balkfm_serbia.201.f: "在拜占庭时期，塞尔维亚帝国统治着一个幅员辽阔的地区"
 balkfm_serbia.201.a: "[ROOT.GetCountry.GetName]将再次崛起！"
 balkfm_serbia.201.tt: "#red 恢复#bold 塞尔维亚帝国#!将放弃南斯拉夫事业#!"
 balkfm_serbia.202.t: "塞尔维亚帝国复辟"
 balkfm_serbia.202.d: "历经塞尔维亚人民的鲜血和牺牲，[ROOT.GetCountry.GetName]重生了！"
 balkfm_serbia.202.f: "今天塞尔维亚国旗在巴尔干半岛上空骄傲飘扬，我们的人民绝不会再沦为成为外国的奴隶。"
 balkfm_serbia.202.a: "[ROOT.GetCountry.GetName]永远不会被征服！"
 balkfm_serbia.203.t: "塞尔维亚文学会"
 balkfm_serbia.203.d: "塞尔维亚知识分子在[ROOT.GetCountry.GetCapital.GetCityHubName]召开会议，旨在讨论并就[GetCulture('serb').GetName]语的标准化达成共识。"
 balkfm_serbia.203.f: "在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的支持下，该小组已经在编制第一份通用字母表方面取得了重大进展。"
 balkfm_serbia.203.a: "一个绝妙的提案！"
 balkfm_serbia.204.t: "五月大会"
 balkfm_serbia.204.d: "[SCOPE.sCountry('vojvodina_scope').GetCapital.GetName]的[GetCulture('serb').GetName]领导人聚集在一起，目的是放弃奥地利统治。五月大会的成员无视 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的规定，宣布塞尔维亚为[SCOPE.sCountry('vojvodina_scope').GetName]，并请求[ROOT.GetCountry.GetCapital.GetCityHubName]获得自治。"
 balkfm_serbia.204.f: "塞族知识分子担心他们的斗争被奥地利和匈牙利之间争端所掩盖，他们抓住了塞尔维亚人民对未来可能受到布达佩斯政府压迫的恐惧心理。"
 balkfm_serbia.204.a: "我们不能容忍这种侮辱[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的行为。"
 balkfm_serbia.204.b: "他们的要求是公平的。"
 balkfm_serbia.205.t: "伏伊伏丁那起义"
 balkfm_serbia.205.d: "我们在[SCOPE.sCountry('vojvodina_scope').GetName]的[GetCulture('serb').GetName]兄弟已宣布脱离[SCOPE.sCountry('austria_scope').GetName]皇家政府并宣布自治。[SCOPE.sCountry('austria_scope').GetRuler.GetFirstName]拒绝了他们的独立要求，现在正试图镇压起义。"
 balkfm_serbia.205.f: "在奥地利军队的压力下，伏伊伏丁那的塞族人已向塞尔维亚求援，希望获得外国支持。"
 balkfm_serbia.205.a: "我们将加入我们的兄弟！"
 balkfm_serbia.205.b: "走私援助越过边境。"
 balkfm_serbia.205.c: "我们干涉不起。"
 balkfm_serbia.206.t: "塞尔维亚省"
 balkfm_serbia.206.d: "我们在[SCOPE.sCountry('vojvodina_scope').GetName]的[GetCulture('serb').GetName]兄弟已经宣布脱离[SCOPE.sCountry('austria_scope').GetName]政府。而[SCOPE.sCountry('austria_scope').GetRuler.GetFirstName]已经承认了他们的自治权，并将该地区组织为哈布斯堡帝国的一个最高级省份。"
 balkfm_serbia.206.f: "通过给治下的塞尔维亚人提供权利，[SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle]打散威胁帝国完整的民族主义运动之一。"
 balkfm_serbia.206.a: "如果没有他们，[ROOT.GetCountry.GetName]就不会完整！"
 balkfm_serbia.017.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName]要求优先地位"
 balkfm_serbia.017.d: "随着[ROOT.GetCountry.GetRuler.GetLastName]家族坐上王位[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]将[SCOPE.sCountry('balkfm_supplicant_scope').GetAdjective]的领事排在[ROOT.GetCountry.GetAdjective]外交排序的第一位，而[SCOPE.sCountry('balkfm_consul_scope').GetName]的领事对此提出抗议。"
 balkfm_serbia.017.f: "尽管俄罗斯和奥地利没有在这个问题上发生冲突，但两国之间为争夺对亲王的影响力而展开了无休止的竞争。"
 balkfm_serbia.017.a: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName]值得优先考虑。"
 balkfm_serbia.020.t: "教士宣传团"
 balkfm_serbia.020.d: "[SCOPE.gsInterestGroup('serb_clerical_publicity_ig').GetName]已向我们提供援助，以削弱[SCOPE.sCharacter('balkfm_karadordevic_scope').GetFullName]对民众的影响力。逃兵的后裔无权在[ROOT.GetCountry.GetName]发声。"
 balkfm_serbia.020.f: "在塔科沃村一处幽静的山谷中，[ROOT.GetCountry.GetRuler.GetFullNameNoFormatting]与同伴们走出集会，宣布并发动了反抗奥斯曼帝国的塞尔维亚起义。\n\n那是在1815年。现在那些自诩“英雄”的人早已逃往外国主子羽翼下寻求庇护，其中就包括[SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFirstNameNoFormatting]的父亲——卡拉乔尔杰。"
 balkfm_serbia.020.a: "这应该就足够了。"
 balkfm_serbia.020.b: "团结就是力量。"
 balkfm_serbia.020.c: "慈善是信仰的本质，对吧？"
 balkfm_serbia.021.t: "诽谤册子"
 balkfm_serbia.021.d: "我们有机会通过印制小册子来诋毁[ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')]。"
 balkfm_serbia.021.f:1 "宣扬与诽谤之间仅有一线之隔，而前者无疑能成为政客最致命的武器。那天早晨，一份由知名艺术家兼书法家制作的小册子样本被呈递给了大公。\n\n他拿着那份文件，注意到在顶部诸多恶意“事实”的描述下，画着[ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')]的族长四肢着地啃食着一块大腿肉，并用当地语言标注着“一位塞尔维亚农民”，而一名奥斯曼帕夏正对他肆意嘲弄与驱使。"
 balkfm_serbia.021.a: "真有创意。"
 balkfm_serbia.021.b: "批量印刷，马上！"
 balkfm_serbia.022.t: "揭露伪君子"
 balkfm_serbia.022.d: "现已查明，[SCOPE.gsInterestGroup('serb_busted_ig').GetName]的领袖[SCOPE.sCharacter('serb_busted_ig_leader').GetFullName]一直在暗中游说其他政客支持[SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetLastName]的卑劣行动。"
 balkfm_serbia.022.f: "宴会作为重要聚会场合，各种隐晦的博弈在此展开。通常包含谈判协商、权势展现、自大者狼吞虎咽的声响，以及同僚间维护声望的无形较量。\n\n要应对这些表里不一的复杂人物固然充满挑战，却也值得尝试。"
 balkfm_serbia.022.a: "让他消失"
 balkfm_serbia.022.b: "强迫他为我们效力。"
 balkfm_serbia.023.t: "叛乱的哈伊杜克"
 balkfm_serbia.023.d: "[SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName]麾下的非正规军一直在骚扰[SCOPE.sReligion('sunni_pop_scope').GetName]和[SCOPE.sReligion('jewish_pop_scope').GetName]的聚居区。"
 balkfm_serbia.023.f: "“你知道他们的做派，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。他们过去专门抢劫奥斯曼商队与贵族，如今却只能欺凌无人庇护的农民。”顾问挥手打发走了信使，接着说道，“卡拉乔尔杰在起义时期就曾是他们的一员，如今他儿子不过是想取悦其父亲的旧部。”"
 balkfm_serbia.023.a: "随他们去吧，也许他们会开始抢劫自己人。"
 balkfm_serbia.023.b: "必须结束这种情况。"
 balkfm_serbia.024.t: "城镇叛军"
 balkfm_serbia.024.d: "[SCOPE.sState('capital_state').GetName]的一伙叛匪正要求我们将王位让给[SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName]他们构不成重大威胁，但对此事的处理将传递出某种信号。"
 balkfm_serbia.024.f: "“共情是所有杰出领袖必备的品格。大公曾反抗过不公的压迫，自然很清楚夺回本就属于自己的东西意味着什么。”\n\n“他们不过是一群年轻、易受挑拨的混小子罢了。”他望向窗外低声说，“我们当年至少是为国家的未来而战，而非为某个人。”"
 balkfm_serbia.024.a: "务必让他们彻底闭嘴。"
 balkfm_serbia.024.b: "给效忠者武装，并派他们去展示实力。"
 balkfm_serbia.024.c: "没必要流血，人人都有个价码。"
 balkfm_serbia.025.t: "求援"
 balkfm_serbia.025.d: "最近我们收到[SCOPE.sState('delvidek_scope').GetName]被马扎尔化的坏消息。一些塞尔维亚村落正等待河对岸同胞的支援。这是巩固我们对抗[SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName]立场的良机。"
 balkfm_serbia.025.f: "信使解开捆扎信封的细绳，取出最上面那封高声宣读：\n\n“致最尊贵的陛下，[ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]家族的[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]，全体高贵塞尔维亚人的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。\n\n恳求陛下垂听，\n\n我谨代表我们这个卑微但忠诚的村庄，谦卑地请求陛下回赐恩泽。或许陛下已不记得，但事实上，在陛下抗击奥斯曼人的革命胜利时，我们曾倾尽所能给予支持……”"
 balkfm_serbia.025.a: "给予他们帮助，助他们抵抗。"
 balkfm_serbia.025.b: "邀请他们回到真正的故土，并助其重建家园。"
 balkfm_serbia.025.b_move_pops_tt: "[SCOPE.sState('delvidek_scope').GetName]10%的塞尔维亚人将迁往[SCOPE.sState('capital_state').GetName]。"
 balkfm_serbia.028.t: "于此驻留"
 balkfm_serbia.028.d: "[ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')]的爪牙们一个接一个地背叛了他们，让其走向悲惨的结局。所有人都看到了无可争辩的事实：[ROOT.GetCountry.GetName]属于[ROOT.GetCountry.GetCustom('serbia_ruling_dynasty')]！"
 balkfm_serbia.028.f: "“你们就这样对待救命恩人吗？”大厅里回荡着恐慌与绝望的声音，“我父亲带领这个国家走向自由，而你们全在为自己敛财。你们永远不懂英雄血脉的意义！”\n\n忠犬们正等待着审判。\n“永远！”"
 balkfm_serbia.028.a: "你将与你父亲迎接同样的命运。"
 balkfm_serbia.028.b: "永远别再踏上塞尔维亚的土地。"
 balkfm_serbia.028.c: "仁慈是真正的领袖才能施予的恩赐。"
 balkfm_serbia.029.t: "最终审判"
 balkfm_serbia.029.d: "正如他们的父亲曾拯救国家免于崩溃，[ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')]如今也战胜了[ROOT.GetCountry.GetCustom('serbia_ruling_dynasty_short')]的暴政。[ROOT.GetCountry.GetName]的王位现在属于他们。"
 balkfm_serbia.029.f: "“同志们！神圣的母亲们！我们现在已摆脱了那些只为一己私欲、不为国家做任何事的政客的摆布……”[ROOT.GetCountry.GetNameNoFormatting]的新任[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]高声宣告。\n\n回想起他父亲追求自由的英勇事迹，人群继续欢呼着，迫切等待最终判决。\n\n“……那么，对于背叛者的命运，你们的看法是什么？”大公稍作停顿，他很清楚，无论接下来他口中说出什么，人们都会毫无疑问地遵从。"
 balkfm_serbia.029.a: "“……我们该送他们去见上帝吗？”"
 balkfm_serbia.029.b: "“……我们难道要继续养着他们？”"
 balkfm_serbia.029.c: "“……仁慈会是他们的最终判决吗？”"