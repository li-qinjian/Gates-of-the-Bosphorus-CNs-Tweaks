 je_balkfm_unification_of_yugoslavia: "大南斯拉夫蓝图"
 je_balkfm_unification_of_yugoslavia_reason: "$balkfm_south_slav$已经在[GetStrategicRegion('region_balkans').GetName]繁衍生息超过了一千年。尽管我们曾被时代和方言所阻隔，但这一计划从#bold 意大利统一运动#!中汲取灵感，号召在同一顶王冠下统一所有南斯拉夫人。\n$gbbf_delimiter_normal$\n@information!如果我们是$balkfm_yugoslav_leader$并研究了[GetTechnology('pan-nationalism').GetName]，我们将能够吞并邻近的$balkfm_yugoslav$国家。\n[GetGlobalVariable('balkfm_yugoslavia_journal_var').Var('balkfm_yugoslav_leader_var').GetCountry.GetName]目前是拥有[GetGlobalVariable('balkfm_yugoslavia_journal_var').Var('balkfm_yugoslav_leader_prestige_var').GetValue][concept_prestige]的$balkfm_yugoslav_leader$。\n$gbbf_delimiter_normal$\n目前所有$balkfm_yugoslav_cultures$之间共有[GetGlobalVariable('balkfm_yugoslav_fervor_var').GetValue][concept_fervor]。每#v 100#!热情将为所有$balkfm_yugoslav$[concept_subject]提供以下效果：\n[GetStaticModifier('modifier_balkfm_yugoslavist_separatism').GetDesc]"
