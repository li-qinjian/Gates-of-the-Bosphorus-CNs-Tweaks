 je_balkfm_unification_of_yugoslavia_status_idle: "目前没有$balkfm_yugoslav_leader$。"
 je_balkfm_yugoslav_nationalism: "南斯拉夫的本质"
 je_balkfm_yugoslav_nationalism_reason: "经过几代人的奋斗，[ROOT.GetCountry.GetName]作为一个独立的国家诞生了。然而，长达千年的分离在$balkfm_south_slavs$人之间播下了分歧。随着新国家开始确立自身认同，一个新问题摆在了面前：什么是“$YUG$”？\n\n"
