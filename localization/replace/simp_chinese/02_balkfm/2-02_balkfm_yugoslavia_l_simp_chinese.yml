 balkfm_south_slav: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫人#!#!"
 balkfm_south_slavs: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫人#!#!"
 balkfm_yugoslavism: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] 南斯拉夫主义#!#!"
 balkfm_yugoslavism_desc: "#bold 南斯拉夫主义#!是一种政治主张，即认为$balkfm_south_slav$各族虽被历史局势、语言方言和宗教信仰所分裂，但本质上仍属于同一个统一的$balkfm_yugoslav$民族。其支持者主张无论是通过外交手段还是武力冲突，都应将所有南斯拉夫人团结到同一个国家。"
 balkfm_yugoslavist: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] 南斯拉夫主义者#!#!"
 balkfm_yugoslavist_movement: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] 南斯拉夫主义运动#!#!"
 balkfm_support_yugoslavism: "这将使我们致力于支持南斯拉夫主义事业。"
 balkfm_oppose_yugoslavism: "这将使我们致力于反对南斯拉夫主义事业。"
 balkfm_yugoslav_leader: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_leader_desc')] 南斯拉夫统一领袖#!#!"
 balkfm_yugoslav_leader_desc: "#bold 南斯拉夫统一领袖#!是指在所有$balkfm_yugoslav$文化的国家中威望最高的那一个国家。"
 balkfm_yugoslav_union: "若[ROOT.GetCountry.GetName]已$balkfm_yugoslav_involved$#bold $je_balkfm_unification_of_yugoslavia$#![concept_journal_entry]中，且是$balkfm_yugoslav_leader$，则该国将可以吞并所有#tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_union_desc')] 符合条件#!#!的$balkfm_yugoslav$$gbbf_countries$"
 balkfm_yugoslav_union_desc: "若以下条件满足，$balkfm_yugoslav_leader$可以吞并其他$balkfm_yugoslav$$gbbf_countries$：\n•$balkfm_yugoslav_leader$已研究[GetTechnology('pan-nationalism').GetName]\n•$balkfm_yugoslav_leader$#bold 未#!制定[GetLawType('law_ethnostate').GetName]\n•两个$gbbf_countries$保持#bold #green 善意#!或以上#!的[concept_relations]#bold 大于等于60个月#!\n•两个[concept_country]均不是[concept_subject]\n•两国接壤"
 balkfm_yugoslav_involved: "#tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_involved_desc')] 参与#!#!"
 balkfm_yugoslav_involved_desc: "满足以下条件的[concept_country]将参与#bold $je_balkfm_unification_of_yugoslavia$#!：\n•有一个$balkfm_yugoslav$$gbbf_primary_culture$\n•有一个[concept_state]在[GetStrategicRegion('region_balkans').GetName][concept_strategic_region]\n•已研究[GetTechnology('nationalism').GetName]\n\n@information!在[GetStrategicRegion('region_balkans').GetName]有一个$balkfm_yugoslav$[concept_subject]的[concept_country]也将参与#bold $je_balkfm_unification_of_yugoslavia$#!"
 balkfm_yugoslav_solution: "@gbbf_identity!#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] 南斯拉夫问题解决方案#!#!"
 balkfm_yugoslav_solution_desc: "随着#bold $YUG$#!的建立，大$yugoslav$蓝图终于开花结果。然而，条约上的墨迹未干，各方政要与社会精英便意识到，让$balkfm_yugoslavs$和睦共处远比消除边界线要困难得多。鉴于$balkfm_yugoslav_cultures$之间存在的摩擦，各路知识分子为这个新生政权提出了数个#bold 解决方案#!："
 balkfm_yugoslav_solutions: "@gbbf_identity!#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] 南斯拉夫问题解决方案#!#!"
 balkfm_yugoslav_solution_short: "@gbbf_identity!#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] 解决方案#!#!"
 balkfm_yugoslav_solutions_short: "@gbbf_identity!#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] 解决方案#!#!"
 balkfm_integralist: "@gbbf_identity!#o #tooltip:[GetRawTextTooltipTag('balkfm_integralist_desc')] 整合主义#!#!"
 balkfm_integralist_desc: "#bold 整合主义#!方案的支持者主张构建一个超脱于各族之上的崭新文化认同，并最终取代各地的$balkfm_yugoslav_cultures$。该模式在普通民众中几乎得不到支持，他们将其视为对自己历史遗产和传统习俗的毁灭。"
