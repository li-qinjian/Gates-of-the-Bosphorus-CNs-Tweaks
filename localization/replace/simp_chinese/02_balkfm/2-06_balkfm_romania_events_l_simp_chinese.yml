l_simp_chinese:
 balkfm_romania.001.t: "《组织条例》"
 balkfm_romania.001.d: "从[SCOPE.sCountry('ottoman_scope').GetName]独立后，[SCOPE.sCountry('moldavia_scope').GetName]和[SCOPE.sCountry('wallachia_scope').GetName]都遭受了政治动荡，导致饥荒和瘟疫。为了恢复各公国的秩序并建立现代国家的基础，[SCOPE.sCountry('russia_scope').GetName]对各邦实施了#italic 《组织条例》#!规定，希望开始西化进程。"
 balkfm_romania.001.f: "#italic 《组织条例》#!是公国的第一部宪法，$RUS_ADJ$政府认识到与西方相比其发展停滞不前的威胁，主张在[ROOT.GetCountry.GetNameNoFlag]建立逐步现代化。"
 balkfm_romania.001.a: "这些都是崇高的愿望。"
 balkfm_romania.001.tt: "完成#bold 奥斯曼统治的遗祸#!$balkfm_reform_agendas$以推进进度条"
 balkfm_romania.004.t: "选举大公"
 balkfm_romania.004.d: "[ROOT.GetCountry.GetRuler.GetFullName]作为[ROOT.GetCountry.GetName]大公的任期已满。根据#italic 《组织条例》#!和《阿克曼公约》的条款，新总督的选举已经开始。"
 balkfm_romania.004.f: "从许多方面来看，大公选举都是波雅尔制度的演变，领主们通常会选举自己的成员来“统治” [ROOT.GetCountry.GetNameNoFormatting]。"
 balkfm_romania.004.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName]应该保留头衔"
 balkfm_romania.004.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName]看起来很有资格。"
 balkfm_romania.004.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName]可能是最好的选择。"
 balkfm_romania.005.t: "选举大公"
 balkfm_romania.005.d: "[ROOT.GetCountry.GetName][ROOT.GetCountry.GetRuler.GetFullName]总督任期已满。根据#italic 《组织条例》#!和《阿克曼公约》的条款，新总督的选举已经开始。"
 balkfm_romania.005.f: "从许多方面来看，大公选举都是波雅尔制度的演变，领主们通常会选举自己的成员来“统治” [ROOT.GetCountry.GetNameNoFormatting]。"
 balkfm_romania.005.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName]应该保留头衔"
 balkfm_romania.005.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName]看起来很有资格。"
 balkfm_romania.005.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName]可能是最好的选择。"
 balkfm_romania.006.t: "封建制度的消亡"
 balkfm_romania.006.d: "尽管各方都对此抱有偏见和怀疑，[ROOT.GetCountry.GetName]还是成功摆脱了陈旧的封建制度。"
 balkfm_romania.006.f: "尽管我们被奥斯曼帝国剥削了几个世纪，但今天，[ROOT.GetCountry.GetAdjectiveNoFormatting]人民已经准备好开创自己的未来。"
 balkfm_romania.006.a: "[ROOT.GetCountry.GetName]的辉煌成就。"
 balkfm_romania.007.t: "专制主义者愿望"
 balkfm_romania.007.d: "[ROOT.GetCountry.GetRuler.GetFullName]推动了一系列宪法改革，大大加强了他对国家的控制。"
 balkfm_romania.007.f: "在[ROOT.GetCountry.GetRuler.GetFullName]的努力下，[ROOT.GetCountry.GetName]摆脱了奥斯曼的统治，实现了统一。然而[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已开始要求增加中央权利，以将国家转变为一个由农民授权的合法专制国家。"
 balkfm_romania.007.a: "我们应该支持他的努力。"
 balkfm_romania.007.b: "他是一个鲁莽的暴君。"
 balkfm_romania.008.t: "天命攸归"
 balkfm_romania.008.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]作为罗马尼亚的统一者，用高超的政治技巧巩固了对[ROOT.GetCountry.GetName]的独裁统治。"
 balkfm_romania.008.f: "在农民的支持下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]准备带领[ROOT.GetCountry.GetAdjectiveNoFormatting]走向复兴。他的统治得到了#bold 高门#!和欧洲列强的默认，如今所有诋毁者只能闭嘴。"
 balkfm_romania.008.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"
 balkfm_romania.009.t: "怪物联盟"
 balkfm_romania.009.d: "为了反对[ROOT.GetCountry.GetRuler.GetFullName]的疯狂专制，一群政治家加入了反对他的统治派系。媒体称他们为#bold “怪物联盟”#!，为此他们召集军队，要将[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]赶下王位。\n\n联盟已呼吁列强批准选择新的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 balkfm_romania.009.f: "[ROOT.GetCountry.GetRuler.GetFirstName]以一己之力，成功地让保守派地主和自由派商人团结起来共同反对[ROOT.GetCountry.GetRuler.GetFirstName]。"
 balkfm_romania.009.a: "霍亨索伦王子是一个可以接受的选择。"
 balkfm_romania.009.a.tt: "#yellow 卡罗尔·霍亨索伦#!成为统治者。"
 balkfm_romania.009.b: "高贵的菲利普·德·弗兰德王子是个不错的选择。"
 balkfm_romania.009.b.tt: "#yellow 菲利普·德·弗兰德#!成为统治者。"
 balkfm_romania.100.t: "斯特凡大公的土地"
 balkfm_romania.100.d: "在[SCOPE.sCountry('ottoman_scope').GetName]几个世纪的统治之后，《亚得里亚堡条约》确立了[SCOPE.sCountry('moldavia_scope').GetName]和[SCOPE.sCountry('wallachia_scope').GetName]公国仅作为高门名义上的附属。\n\n在[SCOPE.sCountry('russia_scope').GetName]外交支持下，公国在封建历史下艰难地找到了自己的立足点。"
 balkfm_romania.100.f: "在奥斯曼的统治下，多瑙河和德涅斯特河河口周边的宗主权曾而产生数个世纪的冲突，[ROOT.GetCountry.GetNameNoFlag]饱受战乱和穷困之苦，但许多人仍对未来摆脱彻底奴役抱有希望。"
 balkfm_romania.100.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_romania.101.t: "请愿书宣言"
 balkfm_romania.101.d: "人民对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的专制不满日益高涨。以[SCOPE.sCharacter('balkfm_alecsandri_scope').GetFullName]为首的著名知识分子乘着自由主义和民族主义在欧洲蔓延的浪潮，要求改革，防止大公滥用职权。"
 balkfm_romania.101.f: "革命者由贵族和受过西方教育的知识分子组成，他们希望在[ROOT.GetCountry.GetNameNoFormatting]建立一个温和的自由主义过度，而无需彻底推翻#italic 《组织条例》#!体系。"
 balkfm_romania.101.a: "国家不会向煽动者低头。"
 balkfm_romania.101.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须听取人民的意见。"
 balkfm_romania.102.t: "摩尔达维亚革命委员会"
 balkfm_romania.102.d: "著名知识分子[SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName]召集其他激进分子向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]提出要求。他们自称为#italic 摩尔达维亚革命委员会#!"
 balkfm_romania.102.f: "[ROOT.GetCountry.GetName]激进主义令人忧心，因为委员会一直没有要求废除#italic 《组织条例》#!制度，$RUS_ADJ$和奥斯曼代表担心，这些改革可能让多瑙河沿岸进一步激进化的。"
 balkfm_romania.102.a: "我们必须找到一个妥协方案。"
 balkfm_romania.103.t: "科格尔尼恰努的革命"
 balkfm_romania.103.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的支持已经崩溃。屈服于#italic 革命委员会#!的要求！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已签署同意他们的自由化要求，并放弃了他的职位。"
 balkfm_romania.103.f: "自由派政治家[SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName]取代了声名狼藉的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，并承诺领导[ROOT.GetCountry.GetName]的改革。"
 balkfm_romania.103.a: "随它去吧。"
 balkfm_romania.104.t: "《巴尔塔李曼公约》"
 balkfm_romania.104.d: "随着革命被压制，[SCOPE.sCountry('russia_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]联合代表团确认了他们共同监督罗马尼亚公国的现状。"
 balkfm_romania.104.f: "尽管各公国都希望实现现代化，但它们宗主国却试图将它们的独立限制在严格的范围内。"
 balkfm_romania.104.a: "随它去吧。"
 balkfm_romania.105.t: "宪政僵局"
 balkfm_romania.105.d: "席卷[ROOT.GetCountry.GetName]的自由主义运动未能取得重大进展。由于他们的目标尚未完成，并且面临着[SCOPE.sCountry('russia_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]的联合干预，#italic 革命委员会#!已经解散。"
 balkfm_romania.105.f: "尽管各公国都希望实现现代化，但它们宗主国却试图将它们的独立限制在严格的范围内。"
 balkfm_romania.105.a: "随它去吧。"
 balkfm_romania.106.t: "$RUS_ADJ$军队进入摩尔达维亚"
 balkfm_romania.106.d: "遵照[SCOPE.sCountry('moldavia_scope').GetRuler.GetFullName]的请求，[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFullName]已派遣军队进入[SCOPE.sCountry('moldavia_scope').GetName]镇压#italic 革命委员会#!"
 balkfm_romania.106.f: "$RUS_ADJ$外交部门越过[SCOPE.sCountry('ottoman_scope').GetName]的宗主权，选择让公国沦为自由主义的土地，并在德涅斯特河两岸部署了军队。"
 balkfm_romania.106.a: "秩序大于一切！"
 balkfm_romania.106.b: "我们不能容忍这种行为。"
 balkfm_romania.106.tt: "这将为亲王提供巨大的支持。"
 balkfm_romania.200.t: "雪山那边的土地"
 balkfm_romania.200.d: "在[SCOPE.sCountry('ottoman_scope').GetName]几个世纪的统治之后，《亚得里亚堡条约》确立了[SCOPE.sCountry('moldavia_scope').GetName]和[SCOPE.sCountry('wallachia_scope').GetName]公国仅作为高门名义上的附属。\n\n在[SCOPE.sCountry('russia_scope').GetName]外交支持下，公国在封建历史下艰难地找到了自己的立足点。"
 balkfm_romania.200.f: "在奥斯曼的统治下，多瑙河和德涅斯特河河口周边的宗主权曾而产生数个世纪的冲突，[ROOT.GetCountry.GetNameNoFlag]饱受战乱和穷困之苦，但许多人仍对未来摆脱彻底奴役抱有希望。"
 balkfm_romania.200.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_romania.201.t: "伊斯拉兹宣言"
 balkfm_romania.201.d: "著名知识分子[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]召集了其他同僚，他们自称#italic 兄弟会#!向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]施压，并提出了一系列要求，要求大幅增加投票权，还要将大多数国家职能移交给立法机构。"
 balkfm_romania.201.f: "对[ROOT.GetCountry.GetName]激进主义的担忧尚未得到证实，因为兄弟会一直没有公开要求废除#italic 《组织条例》#!制度。$RUS_ADJ$和奥斯曼代表担心，这些改革可能会让多瑙河沿岸地区进一步激进化。"
 balkfm_romania.201.a: "[ROOT.GetCountry.GetName]必须遵循人民的意愿。"
 balkfm_romania.201.b: "让这些无政府主义者闭嘴。"
 balkfm_romania.202.t: "瓦拉几亚兄弟会"
 balkfm_romania.202.d: "[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]顺应了席卷欧洲的激进主义浪潮，向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]提出了一系列要求，打算剥夺[ROOT.GetCountry.GetName]的权威。"
 balkfm_romania.202.f: "与[SCOPE.sCountry('moldavia_scope').GetName]的同胞不同，#italic 兄弟会#!提出了激进的要求，寻求罗马尼亚统一和废除#italic 《组织条例》#!制度。"
 balkfm_romania.202.a: "我们必须找到一个妥协方案。"
 balkfm_romania.203.t: "革命之剑"
 balkfm_romania.203.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的支持已经崩溃。屈服于#italic 革命委员会#!的要求！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已签署同意他们的自由化要求，并放弃了他的职位。"
 balkfm_romania.203.f: "自由派政治家[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]取代了声名狼藉的[SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName]，并承诺领导[ROOT.GetCountry.GetName]的改革。"
 balkfm_romania.203.a: "随它去吧。"
 balkfm_romania.204.t: "《巴尔塔李曼公约》"
 balkfm_romania.204.d: "随着革命被压制，[SCOPE.sCountry('russia_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]联合代表团确认了他们共同监督罗马尼亚公国的现状。"
 balkfm_romania.204.f: "尽管各公国都希望实现现代化，但它们宗主国却试图将它们的独立限制在严格的范围内。"
 balkfm_romania.204.a: "随它去吧。"
 balkfm_romania.205.t: "宪政僵局"
 balkfm_romania.205.d: "席卷[ROOT.GetCountry.GetName]的自由主义运动未能取得重大进展。由于他们的目标尚未完成，并且面临着[SCOPE.sCountry('russia_scope').GetAdjective]和[SCOPE.sCountry('ottoman_scope').GetAdjective]的联合干预，#italic 革命委员会#!已经解散。"
 balkfm_romania.205.f: "尽管各公国都希望实现现代化，但它们宗主国却试图将它们的独立限制在严格的范围内。"
 balkfm_romania.205.a: "随它去吧。"
 balkfm_romania.206.t: "$RUS_ADJ$军队进入瓦拉几亚"
 balkfm_romania.206.d: "遵照[SCOPE.sCountry('wallachia_scope').GetRuler.GetFullName]的请求，[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFullName]已派遣军队进入[SCOPE.sCountry('wallachia_scope').GetName]镇压#italic 革命委员会#!"
 balkfm_romania.206.f: "$RUS_ADJ$外交部门越过[SCOPE.sCountry('ottoman_scope').GetName]的宗主权，选择让公国沦为自由主义的土地，并在德涅斯特河两岸部署了军队。"
 balkfm_romania.206.a: "秩序大于一切！"
 balkfm_romania.206.b: "我们不能容忍这种行为。"
 balkfm_romania.206.tt: "这将为亲王提供巨大的支持。"
 balkfm_romania.300.t: "森外之地"
 balkfm_romania.300.d: ""
 balkfm_romania.300.f: ""
 balkfm_romania.300.a: ""
 balkfm_romania.300.b: ""
 balkfm_romania.400.t: "民选君主"
 balkfm_romania.400.d: "经列强同意和制宪会议批准，[ROOT.GetCountry.GetRuler.GetFullName]已被任命为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。据报道，他已经抵达[ROOT.GetCountry.GetCapital.GetCityHubName]。"
 balkfm_romania.400.f: "虽然新[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]不熟悉[ROOT.GetCountry.GetName]和她的习俗，但人们对未来的政治稳定持乐观态度。"
 balkfm_romania.400.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 balkfm_romania.401.t: "自由主义者的要求"
 balkfm_romania.401.d: "由于#italic 《《库萨规约》》#! 的失败，政治领导人提出了为[ROOT.GetCountry.GetName]制定新宪法的计划。此外罗马尼亚知识分子受到比利时自由主义的启发，希望新宪法能引领罗马尼亚进入现代化。"
 balkfm_romania.401.f: "此次提议的变革在范围上远比以往更为温和，试图在西方引入的自由主义思想与罗马尼亚国家的独特国情之间寻求平衡。"
 balkfm_romania.401.a: "这是[ROOT.GetCountry.GetName]崇高的事业！"
 balkfm_romania.401.b: "这散发着资产阶级特权的气息。"
 balkfm_romania.402.t: "普洛耶什蒂叛乱"
 balkfm_romania.402.d: "因国王拒绝接受宪法限制，一群知识分子在[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]的领导下，在#yellow 普洛耶什蒂#!市宣布起义。当地安全部队已开始逮捕参与者，但许多人担心，[ROOT.GetCountry.GetName]将再次陷入激进主义蔓延的危机。"
 balkfm_romania.402.f: "“我们会步行到西斯米吉乌花园另一边的火车站，然后到早上的时候我们会乘火车去普洛耶什蒂……在那里，我不再害怕，我会和我的同类在一起！他们都是共和党人！” ——摘自1880年的戏剧《科努·列奥尼达面临的反应》"
 balkfm_romania.402.a: "逮捕这些激进分子。"
 balkfm_romania.402.b: "我们无法抗拒他们的要求。"
 balkfm_romania.402.c: "这个人本来可以有更好的前途……"
 balkfm_romania.402.tt: "国王的支持率减少#bold 20#!"
 balkfm_romania.403.t: "普洛耶什蒂叛乱被镇压"
 balkfm_romania.403.d: "自称#yellow 普洛耶什蒂共和国#!的组织迅速作鸟兽散，组织者也都随即遭到逮捕。"
 balkfm_romania.403.f: "“在我们这个世纪的历史中，曾诞生并消逝过一个非常有趣的国家，一个任何严谨的历史学家都不应忽视的国家。我想说的就是普洛耶什蒂共和国，一个虽然仅存在了十五个小时，却无疑在当代历史中写下了光辉一页的国家。它是在人民的推动下诞生的，因人民而生，且为人民而存在。1870年8月8日凌晨约两点，这个年轻的共和国宣告诞生，但同一天，下午四点左右，它便被扼杀了。没关系！国家的伟大与重要性，并非通过其疆域和存在的时间来衡量，而是通过它在世界历史体系中所扮演的或多或少精彩的角色。”——伊昂·卢卡·卡拉迦列"
 balkfm_romania.403.a: "好消息！"
 balkfm_romania.403.tt: "国王的支持率增加#bold 20#!"
 balkfm_romania.404.t: "普洛耶什蒂政治极端主义"
 balkfm_romania.404.d: "自称#yellow 普洛耶什蒂共和国#!的组织迅速作鸟兽散，组织者也都随即遭到逮捕。然而，当地部队的残暴行为激励了其他一些人投身于共和事业。"
 balkfm_romania.404.f: "“……你忘了我是普洛耶什蒂人——是的，普洛耶什蒂人，老兄，我给你搞个革命，但可不是普通的革命……是让你永远记住我的那种！”节选自1885年的《狂欢节》"
 balkfm_romania.404.a: "局势正在失控。"
 balkfm_romania.404.tt: "国王的支持率减少#bold 20#!"
 balkfm_romania.405.t: "坎迪亚诺共和国"
 balkfm_romania.405.d: "激进主义席卷了[ROOT.GetCountry.GetAdjective]。[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]激进分子独挑大旗，掌握了国家大权，并承诺为[ROOT.GetCountry.GetName]带来一个全新的自由主义时代。"
 balkfm_romania.405.f: "面对人身威胁，[SCOPE.sCharacter('balkfm_ruler_scope').GetFullName]逃往西方。"
 balkfm_romania.405.a: "打倒暴君！"
 balkfm_romania.406.t: "君主制巩固"
 balkfm_romania.406.d: "[ROOT.GetCountry.GetName]欢迎[ROOT.GetCountry.GetRuler.GetFullName]国王入主其中， 而其却自封为独裁者。"
 balkfm_romania.406.f: "随着公民们纷纷接受新秩序，阴谋者已被揭露和逮捕。"
 balkfm_romania.406.a: "[ROOT.GetCountry.GetName]需要秩序。"
 balkfm_romania.406.b: "驱逐这些激进分子。"
 balkfm_romania.407.t: "[ROOT.GetCountry.GetName]共和国"
 balkfm_romania.407.d: "激进主义席卷了[ROOT.GetCountry.GetAdjective]。[SCOPE.sCharacter('balkfm_candiano_scope').GetFullName]激进分子独挑大旗，掌握了国家大权，并承诺为[ROOT.GetCountry.GetName]带来一个全新的自由主义时代。"
 balkfm_romania.407.f: "面对人身威胁，[SCOPE.sCharacter('balkfm_ruler_scope').GetFullName]逃往西方。"
 balkfm_romania.407.a: "[ROOT.GetCountry.GetName]必须找到自己的道路。"
 balkfm_romania.500.t: "罗马尼亚学院"
 balkfm_romania.500.d: "为了发展[ROOT.GetCountry.GetName]，[SCOPE.sCharacter('university_benefactor').GetFullName]国王提出了在[SCOPE.sState('university_state').GetCityHubName]开办一所本地高等学府的计划，这项计划将为国家带来一笔不小的开销。"
 balkfm_romania.500.f: "罗马尼亚学院于1866年在布加勒斯特成立。如今，它是罗马尼亚语言、历史和文化的权威机构。"
 balkfm_romania.500.a: "多么崇高的事业！"
 balkfm_romania.500.b: "代价太大了……"
 balkfm_romania.501.t: "皇家庄园"
 balkfm_romania.501.d: "#yellow 佩莱什城堡#!已在[SCOPE.sState('wallachia_state_scope').GetName]建成，[ROOT.GetCountry.GetRuler.GetFullName]急于使其统治合法化，已开始将其宫廷迁入里面。"
 balkfm_romania.501.f: "“意大利人是泥瓦匠，吉普赛人是苦力；阿尔巴尼亚人和希腊人是石匠，德国人和匈牙利人是木匠。土耳其人烧砖，罗马尼亚人搭建露台；工匠是波兰人，石匠是捷克人；法国人负责绘图，英国人负责测量，那时你可以看到数百种民族服装和十四种语言，他们用各种方言和语调说话、唱歌、咒骂和争吵，这是男人、马、家畜的欢乐组合。”——维德的伊丽莎白女王"
 balkfm_romania.501.a: "奇伟瑰怪"
 balkfm_romania.600.t: "没有基础"
 balkfm_romania.600.d: "关于罗马尼亚身份的争论在文学界达到了白热化。学者[SCOPE.sCharacter('balkfm_mairoescu_scope').GetFullName]猛烈抨击罗马尼亚国家的“鲁莽”现代化，声称自由主义在[ROOT.GetCountry.GetName]没有基础，因为罗马尼亚是一个没有资产阶级的农民和地主国家。"
 balkfm_romania.600.f: "曼约雷斯库库及其支持者聚集在一个名为“青年社”的文学俱乐部周围。他们声称拥护真正的罗马尼亚身份，在要求立法倒退罗马尼亚社会，他们已成为罗马尼亚保守主义的一个浓缩点。"
 balkfm_romania.600.a: "但我们一直都是罗马尼亚人……"
 balkfm_romania.601.t: "罗马尼亚来源"
 balkfm_romania.601.d: "罗马尼亚历史学家[SCOPE.sCharacter('balkfm_hasdeu_scope').GetFullName]在发表了有关罗马尼亚人的文献后，发现自己成了#yellow 朱尼姆#!运动的目标，但毫不畏惧，还继续鼓吹罗马尼亚人民一直是并将继续是欧洲创新的主要力量。"
 balkfm_romania.601.f: "罗马尼亚的自由主义思想建立在一种自诩为罗马尼亚“开拓精神”的基础之上，他们声称这种精神推动了罗马尼亚在历史上的领先地位。这一思想流派被称为#yellow 达契亚主义#!，他们认为自罗马达契亚时代起，罗马尼亚人就一直站在政治和科学的前沿，尽管他们的说法明显缺乏证据支持。"
 balkfm_romania.601.a: "确实是某种“开拓精神”……"
 balkfm_romania.602.t: "罗马尼亚认同"
 balkfm_romania.602.d1: "#yellow 朱尼姆#!运动的胜利为罗马尼亚民族身份认同统一奠定了基础。罗马尼亚人通过平衡贵族和农民，将自己视为一个融合了达契亚主义和罗马政治遗传的民族。"
 balkfm_romania.602.d2: "#yellow 达契亚主义#!运动的胜利为罗马尼亚民族身份认同统一奠定了基础。罗马尼亚人认为他们是进步和创新的继承者，这种传统可以追溯到第一批罗马殖民者踏上这片土地。"
 balkfm_romania.602.f1: "“罗马尼亚农民才是真正的社会阶级，而他们的现实就是苦难，因为正是他们每天辛勤劳动，才构成罗马尼亚文化的基石。我们迫使他们倾尽所有来哺育我们的画家和音乐家以及文学和科学奖项。但我们没有感激他们，没有创作一件艺术作品，让他们忘记日常的痛苦。”——蒂图·马约雷斯库"
 balkfm_romania.602.f2: "“……在我注定要经历的残酷孤独中，只有这本庞大百科全书《罗马尼亚人民》，只有每天与整个民族精神接触，只有我一个人做了连我的敌人都承认没有人能做到的事情，只有这些才能让我摆脱自我毁灭的丑陋。用罗马皇帝的话来说，我感觉我正在变成一个神，感觉到了这一点的我只想笑。”——博格丹·彼得里塞库·哈斯德乌"
 balkfm_romania.602.a: "[ROOT.GetCountry.GetName]不会抛弃自己的根源。"
 balkfm_romania.602.b: "[ROOT.GetCountry.GetName]将开拓新的未来。"
 balkfm_romania.700.t: "我国宣布联合"
 balkfm_romania.700.d: "凭借我等之力量和智慧，我们已经迈出了统一罗马尼亚民族的第一步。未来在向我们招手！"
 balkfm_romania.700.f: "记者开始记录当天的经历：“整个首都只剩热烈的欢呼声。在城市的所有街道、人行道和公共场所，都只剩下这一种声音。我们的农民同胞们现在正用发自灵魂深处的全部力量呐喊着：‘#italic 祖国万岁！罗马尼亚万岁！#!’”\n\n一滴喜悦的泪水顺着他的脸颊滚落下来，\"所有人都投向了彼此的怀抱，不分地位高低，就好像，总之，仿佛所有人都摆脱了最压迫的枷锁\"。"
 balkfm_romania.700.a: "万众一心"
 balkfm_romania.700.a.tta: "[SCOPE.sCountry('romania_lesser_partner').GetName]应成为与我国[concept_personal_union]中的次级成员。"
 balkfm_romania.700.a.ttb: "[SCOPE.sCountry('romania_lesser_partner').GetName]应成为我们的[concept_puppet]。"
 balkfm_romania.701.t: "醒来吧，罗马尼亚人！"
 balkfm_romania.701.d: "我国与[SCOPE.sCountry('romania_lesser_union_partner').GetName]的联合已告完成。我等纽带乃坚实牢靠，我等执念乃不屈不挠——联合起来，我们如今自称为#bold 罗马尼亚#!。"
 balkfm_romania.701.d2: "我们与[SCOPE.sCountry('romania_lesser_union_partner').GetName]和[SCOPE.sCountry('transylvania_union_partner').GetName]的联盟已经完成。我们的纽带牢固，我们的意志不屈不挠——我们在一起就是#bold 罗马尼亚#!。"
 balkfm_romania.701.f: "“醒来吧，罗马尼亚人，从死一样的沉睡中，”群众如此咆哮。\n\n“从野蛮暴君的压迫中\n就在现在建立新的命运\n即使是最残酷的敌人也会屈服！”\n\n三色旗迎风飘扬。孩子们被高高举起，这一刻将伴随着其童稚而铭刻在他们的记忆中。人们一起唱着从未听过的歌，但那歌词早已烂熟于心。"
 balkfm_romania.701.a: "生死与共，肝胆相照！"
 balkfm_romania.702.t: "准许回归"
 balkfm_romania.702.d: "经过谈判，[SCOPE.sCountry('romanian_bessarabia_owner').GetName]同意将比萨拉比亚的一部分割让给[ROOT.GetCountry.GetName]。"
 balkfm_romania.702.f: "罗马尼亚的统一梦想将会缓慢实现。"
 balkfm_romania.702.a: "对于[GetCulture('romanian').GetName]人民来说，这是一个伟大的进步！"
 balkfm_romania.703.t: "拒绝回归"
 balkfm_romania.703.d: "关于将比萨拉比亚土地归还[ROOT.GetCountry.GetName]的谈判宣告破裂。至此，[GetCulture('romanian').GetName]人民仍被外国边境所阻隔。"
 balkfm_romania.703.f: "罗马尼亚人民长期以来一直是巴尔干地区列强的猎物，这次失败是他们又一次的被压迫。"
 balkfm_romania.703.a: "他们不会阻止[GetCulture('romanian').GetName]事业。"
 balkfm_romania.704.t: "联合特兰西瓦尼亚"
 balkfm_romania.704.d: "我们与[SCOPE.sCountry('transylvania_scope').GetName]的联盟已经完成。我们团结一心，[ROOT.GetCountry.GetName]不会拒绝的！"
 balkfm_romania.704.f: "“1918年11月18日阿尔巴尤利亚国民议会决议中提到的土地将永远与罗马尼亚王国统一。”——1918年12月11日斐迪南一世讲到"
 balkfm_romania.704.a: "全部归一！"
 balkfm_romania.705.t: "《[SCOPE.sState('transylvania_capital_scope').GetCityHubName]条约》"
 balkfm_romania.705.d: "在迅速的磋商后，[SCOPE.sCountry('transylvania_scope').GetName]同意加入希腊国。"
 balkfm_romania.705.f: "[SCOPE.sState('transylvania_capital_scope').GetName]的罗马尼亚人为自由而战。他们重新加入[ROOT.GetCountry.GetAdjective]大家庭是理所当然的。"
 balkfm_romania.705.a: "[ROOT.GetCountry.GetName]的意志不可违背！"
 balkfm_romania.706.t: "罗马尼亚海外动员！"
 balkfm_romania.706.d: "在我们的支持下，[SCOPE.sCountry('austria_scope').GetAdjectiveNoFlag]中的[GetCulture('romanian').GetName]激进分子已经开始在全国范围内组织民间示威活动，希望进一步推动罗马尼亚事业。"
 balkfm_romania.706.f: "噢！主啊！我们的天父，请伸出你的手来照耀罗马尼亚吧！"
 balkfm_romania.706.a: "直到[ROOT.GetCountry.GetName]全部完整，我们才会停止。"
 balkfm_romania.707.t: "罗马尼亚煽动者反对[ROOT.GetCountry.GetAdjective]统治！"
 balkfm_romania.707.d: "特兰西瓦尼亚的[GetCulture('romanian').GetName]激进分子在全国范围内挑起了示威游行。他们要求[ROOT.GetCountry.GetName]中的所有斯拉夫人享有平等权利。"
 balkfm_romania.707.f: "虽然街头局势混乱，但初步怀疑是来自[SCOPE.sCountry('romania_scope').GetName]的煽动者所为。"
 balkfm_romania.707.a: "这不是文明行为。"
 balkfm_romania.708.t: "大罗马尼亚之地"
 balkfm_romania.708.d: "随着各公国统一于单一国家之下，一个更宏大的计划已现出轮廓：统一#yellow 多瑙河#!流域的所有[GetCulture('romanian').GetName]土地。"
 balkfm_romania.708.f: "“[ROOT.GetCountry.GetName]的唯一未来是国家自由且完整。”"
 balkfm_romania.708.a: "这些土地理应属于我们。"
 balkfm_romania.709.t: "罗马尼亚统一"
 balkfm_romania.709.d: "从德涅斯特河到蒂萨河，一个完整而独立的[ROOT.GetCountry.GetName]梦想已经成为现实。"
 balkfm_romania.709.f: "“罗马尼亚人！ 近两年来，战争越来越逼近我们的边界，深深地动摇了欧洲根基。它带来了几个世纪以来良知、罗马尼亚国家的创始人、独立战争中统一公国的人、民族复兴的领袖们所期盼的一天。这是我们民族团结起来的日子，今天，我们能够完成我们祖先的任务——米哈伊·佩特拉库大帝建立的东西，即喀尔巴阡山脉两岸的罗马尼亚联盟……”\n——1916年8月28日斐迪南国王公告"
 balkfm_romania.709.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"
 balkfm_romania.710.t: "拿起武器！[SCOPE.sCountry('transylvania_scope').GetName]！"
 balkfm_romania.710.d: "在我们的支持下，[SCOPE.sCountry('transylvania_scope').GetCapital.GetName]的[GetCulture('romanian').GetName]激进分子夺取了地区控制权，并宣布[SCOPE.sCountry('transylvania_scope').GetName]独立，还呼吁国际社会给予援助和承认。"
 balkfm_romania.710.f: "虽然特兰西瓦尼亚义军已经赶走了奥地利总督，但要想免遭奥地利的报复，他们急需国际援助。"
 balkfm_romania.710.a: "所有罗马尼亚人都应享有自由。"
 balkfm_romania.711.t: "拿起武器！[SCOPE.sCountry('transylvania_scope').GetName]！"
 balkfm_romania.711.d: "[SCOPE.sCountry('transylvania_scope').GetCapital.GetName]的[GetCulture('romanian').GetName]激进分子夺取了地区的控制权，并宣布[SCOPE.sCountry('transylvania_scope').GetName]独立。他们要求立即得到[ROOT.GetCountry.GetAdjectiveNoFlag]政府的承认并脱离其统治。"
 balkfm_romania.711.f: "虽然我们可能没有直接证据，但我们的情报部门报告说，[SCOPE.sCountry('romanian').GetName]直接负责资助和组织这次叛乱。"
 balkfm_romania.711.a: "剿灭他们"
 balkfm_romania.711.b: "给他们自治权。"
 balkfm_romania.720.t: "帝国旗帜"
 balkfm_romania.720.d: "随着[GetCulture('romanian').GetName]人开始将自己认为是一个独特的民族，许多人开始质疑[ROOT.GetCountry.GetName]在东欧政治中的角色。随着民族主义在民众中日益巩固，民族统一运动者宣称，我们是#yellow 罗马帝国#!的唯一真正继承者！"
 balkfm_romania.720.f: "我们从希腊、$RUS_ADJ$和奥斯曼的压迫者手中赢得了独立。现在我们必须决定自己在巴尔干共同体中的立场。。"
 balkfm_romania.720.a: "我们将夺回帝国宝座！"
 balkfm_romania.720.b: "帝国已经亡了，就让它彻底成为历史吧。"
 balkfm_romania.721.t: "万城之女王"
 balkfm_romania.721.d: "随着博斯普鲁斯海峡和达达尼尔海峡两岸的土地被征服，重建拜占庭帝国的目标已经实现。现在，我们的公民期待着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]带领他们进入一个新时代。"
 balkfm_romania.721.f: "君士坦丁堡现在在我们的控制之下，没有人可以质疑我们对拜占庭皇位的合法要求。"
 balkfm_romania.721.a: "我们的军队将再次举起帝国的旗帜！"
 balkfm_romania.790.t: "罗马尼亚宣布联合"
 balkfm_romania.790.d: "[SCOPE.sCountry('romania_unifier').GetName]宣布自己是罗马尼亚的统一者，并试图与该地区的其他罗马尼亚公国建立联合。"
 balkfm_romania.790.f: "\"我们宣布担当我族真正的代表，担当富饶之土地与兴旺之历史的继业者。实现这一神圣愿望将造福千秋万代，我等决不容忍他国的一切抵制——这是我们的土地，这是我们的命运。”"
 balkfm_romania.790.a: "我等对此联合表示欢迎，并将履行与[SCOPE.sCountry('romania_unifier').GetName]的协定。"
 balkfm_romania.790.b: "不干！必须就此事谴责[SCOPE.sCountry('romania_unifier').GetName]。"
 balkfm_romania.791.t: "收复南比萨拉比亚"
 balkfm_romania.791.d: "在某个列强的支持下，[SCOPE.sCountry('romanian_bessarabia_receiver').GetName]现向[SCOPE.sState('south_bessarabia_cession').GetName]要求获得一片领土——以前由摩尔多瓦统治的领土——以允许其进入黑海。特使声称，如果我们同意这一要求，我们将得到一个心怀感激的罗马尼亚的感谢。"
 balkfm_romania.791.f: "“如果没有出海口，我们会成为什么样的国家？卡胡尔、博尔格勒和伊斯梅尔，这些城市将为我们的繁荣和你们的子孙后代做出巨大贡献。”"
 balkfm_romania.791.a: "割让[SCOPE.sState('south_bessarabia_cession').GetName]是我等承受得起的代价。"
 balkfm_romania.791.b: "[SCOPE.sState('south_bessarabia_cession').GetName]归我们，以后也会归我们，永远不会归他们！"