l_simp_chinese:
 balkfm_croatia.200.t: "伊利里亚情怀"
 balkfm_croatia.200.d: "哈布斯堡帝国与[SCOPE.sCountry('ottoman_scope').GetName]争夺着东南欧的控制权，并成功阻止了[GetCulture('turkish').GetName]向中欧的扩张。在这些冲突发生之前和期间，数个#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] 南斯拉夫#!#!民族已将这些土地视为家园，其中许多人归于哈布斯堡的统治之下。\n\n随着[GetTechnology('nationalism').GetName]席卷欧洲，政治家[SCOPE.sCharacter('balkfm_metternich_scope').GetFullName]敏锐地察觉到，[GetCulture('croat').GetName]人民中日益增长的激进主义正成为帝国面临的新威胁。"
 balkfm_croatia.200.f: "“没有国家的民族，\n犹如没有骨骼的躯体。”\n——#italic 《晨星报》#!开篇格言，1835–1849年"
 balkfm_croatia.200.a: "帝国必须保持不可分割。"
 balkfm_croatia.201.t: "奥地利‑斯拉夫提案"
 balkfm_croatia.201.d: "随着#yellow 民族主义#!情怀开始在[ROOT.GetCountry.GetName]落地生根，一位[GetCulture('czech').GetName]政治家[SCOPE.sCharacter('balkfm_borovsky_scope').GetFullName]提出了一种奇特的理论，旨在解决帝国面临的民族压力。该计划被称为#yellow 奥地利斯拉夫主义#!，设想将帝国的各个王国重组为一个民主化国家的联邦单位。"
 balkfm_croatia.201.f: "在哈布斯堡王冠下建立联邦制国家的想法迅速在帝国的数个少数民族中引发共鸣。然而，这一构想遭到了匈牙利宫廷的强烈反对，因为他们将因此失去对数个少数民族地区的控制。"
 balkfm_croatia.201.a: "这是一个值得赞赏的提议。"
 balkfm_croatia.201.b: "我们不能削弱王权的绝对权力。"
 balkfm_croatia.202.t: "《维也纳文学协定》"
 balkfm_croatia.202.d: "来自[GetCulture('serb').GetName]、[GetCulture('croat').GetName]和[GetCulture('slovene').GetName]的知识分子齐聚在[ROOT.GetCountry.GetCapital.GetCityHubName]，旨在统一并推进其书面语言的规范化。尽管未达成任何具有约束力的协议，但各方达成共识，认为应以#yellow 什托方言#!作为未来标准语言的基础。"
 balkfm_croatia.202.f: "“伊利里亚只能有一种真正的书面语言……它不存在于某一个地方，或某一个国家，而存在于整个伊利里亚之中……我们的语法和词典就是整个伊利里亚。在那个巨大的花园里，到处都是美丽的鲜花：让我们把所有最美好的东西编织成一个永不凋谢的花环。”——L·盖伊，1835年"
 balkfm_croatia.202.a: "颇为有趣的尝试。"
 balkfm_croatia.209.t1: "克罗地亚-匈牙利妥协案"
 balkfm_croatia.209.t2: "奥地利-克罗地亚折衷案"
 balkfm_croatia.209.d1: "国家已成功与[GetCulture('croat').GetName]人民达成平衡。在未来的世代中，他们将在塑造国家的未来方面发挥重要作用。"
 balkfm_croatia.209.d2: "随着政治领袖们齐聚一堂要求承认[GetCulture('croat').GetName]人民，克罗地亚的局势已开始白热化。如果我们拒绝他们的呼声，恐将面临公开叛乱的风险。"
 balkfm_croatia.209.f1: "虽然这远非克罗地亚的真正独立，但这一举措为防止未来奥匈建制派的滥权提供了坚实的保障。"
 balkfm_croatia.209.f2: "帝国及地方官员纷纷赶往[ROOT.GetCountry.GetCapital.GetCityHubName]，向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]发出警告：南部正在组织[GetCulture('croat').GetName]分裂运动。运气好的话，我们或许能在暴力冲突爆发前与他们达成妥协。"
 balkfm_croatia.209.a1: "克罗地亚是帝国不可分割的一部分。"
 balkfm_croatia.209.a2: "他们应自行处理内部事务。"
 balkfm_croatia.209.a3: "我们必须接受这份协议。"
 balkfm_croatia.209.a4: "[ROOT.GetCountry.GetNameNoFormatting]首先是[ROOT.GetCountry.GetAdjectiveNoFormatting]！"
 balkfm_croatia.209.b1: "克罗地亚是帝国不可分割的一部分。"
 balkfm_croatia.209.b2: "他们应自行处理内部事务。"
 balkfm_croatia.209.b3: "我们必须接受这份折衷案。"
 balkfm_croatia.209.b4: "[ROOT.GetCountry.GetNameNoFormatting]首先是[ROOT.GetCountry.GetAdjectiveNoFormatting]！"
 balkfm_croatia.300.t: "三一梦想"
 balkfm_croatia.300.d: "随着[ROOT.GetCountry.GetName]的独立，一种收复失地的渴望开始在我们的公民中蔓延，他们期盼将前#yellow 三一王国#!的所有人民纳入一个统一的国家之中。"
 balkfm_croatia.300.f: "“我们抛弃了数百年的帝国统治，才让[ROOT.GetCountry.GetName]得以诞生。然而，这还远远不够。我们的许多同胞仍生活在异族统治的压迫枷锁之下，渴望拥有一个真正属于自己的国家。”"
 balkfm_croatia.300.a: "我们不能任由我们的同胞遭受苦难。"
 balkfm_croatia.301.t: "三一王国的复兴"
 balkfm_croatia.301.d: "随着三一王冠领土的解放，重塑[ROOT.GetCountry.GetName]的梦想已然成真。我们的公民如今指望着国家引领他们迈向新时代。"
 balkfm_croatia.301.f: "新的一天已经破晓，一个全新的国家正在世界舞台上崛起。[ROOT.GetCountry.GetAdjectiveNoFormatting]的荣耀便是不可阻挡的未来。"
 balkfm_croatia.301.a: "我们将高举[ROOT.GetCountry.GetAdjective]的旗帜！"