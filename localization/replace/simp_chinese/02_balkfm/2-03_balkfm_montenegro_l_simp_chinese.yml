l_simp_chinese:
 je_balkfm_mon_prince_bishopric: "采邑主教辖区"
 je_balkfm_mon_prince_bishopric_reason: "对许多人来说，黑山这个国家似乎是一个来自遥远过去的幽灵。西有民族国家，东有庞大帝国，这个弱小的国家依然伫立，提醒着人们欧洲那封建的过去。彼得二世的登基终于为这个亲王主教国带来了变革的曙光。在父亲彼得一世的理想以及西方自由主义思潮的鼓舞下，年轻的主教希望将现代化的曙光带给黑山。"
 je_balkfm_mon_prince_bishopric_status: "引导[ROOT.GetCountry.GetName]走向现代化。"
 je_balkfm_mon_prince_bishopric_tt1: "我们已经#bold 改革了我们的社会组织#!"
 je_balkfm_mon_prince_bishopric_tt2: "我们已经#bold 实现了中央集权#!"
 je_balkfm_mon_prince_bishopric_tt3: "我们已经#bold 组建了常备军#!"
 je_balkfm_mon_societal_reform: "采邑主教区：社会改革"
 je_balkfm_mon_societal_reform_reason: "黑山受困于其封建现状。在黑山的群山脚下，人民依然延续着自拜占庭时代以来的传统农业模式。工业完全绝迹，农民依然依附于他们的领主和部落酋长。主教希望能将国家从这种可怜的状态中解救出来。"
 je_balkfm_mon_administration: "采邑主教区：行政改革"
 je_balkfm_mon_administration_reason: "采邑主教拥有绝对的权威。然而，黑山政府几乎没有正式的结构。虽然主教可以挑选他的部长，但却没有法律体系来执行法律和税收标准，这些事务大都由地方的酋长和法庭处理。如果国家不能首先建立起对自身人民的控制，彼得一世对黑山的宏伟愿景就永远无法实现。"
 je_balkfm_mon_military_reform: "采邑主教区：军事改革"
 je_balkfm_mon_military_reform_reason: "黑山的军队很难被称为真正的军队。由于国家陷于中世纪的落后状态，政府没有正式的军事单位可用于国防。奥斯曼的维齐尔时常袭扰我们的边境城镇，而保卫国土的重任落在了部落酋长身上，他们对主教的忠诚至多只能用“面和心不和”来形容。除非黑山能找到自卫的力量，否则它便时日无多了。"
 je_balkfm_mon_nationalism: "黑山之魂"
 je_balkfm_mon_nationalism_reason: "[ROOT.GetCountry.GetNameNoFlag]的人民普遍认为自己是更广泛的[GetCulture('serb').GetName]文化的一部分。然而，经过几个世纪的分离和独立王朝的统治，一个潜藏的问题浮现了出来：如果我们不仅仅是迷途的塞尔维亚人呢？如果成为[GetCulture('montenegrin').GetName]人有着特殊的意义呢？"
 balkfm_mon_declare_kingdom_decision: "宣布成立黑山王国"
 balkfm_mon_declare_kingdom_decision_desc: "世代以来，黑山一直是巴尔干地区的边缘势力。现在，我们已经准备好通过将国家提升至与古老王国相称的地位，向世界舞台彰显我们的意图。"
 balkfm_great_montenegrivation_decision: "大黑山化进程"
 balkfm_great_montenegrivation_decision_desc: "“在国家停滞不前且面临毁灭性的伏特加短缺之际，尼古拉一世亲王在整个皇宫里‘大展黑山神威’。这真是太恶心了。”"
