 je_balkfm_mon_austria_alliance_reason: "[SelectLocalization(SCOPE.sCountry('austria').IsValid, SCOPE.sCountry('austria').GetName, 'AUS')]承认其占领了理应属于我们的沿海土地。然而，它坚决要通过维持[concept_relations]来将[SelectLocalization(SCOPE.sCountry('russia').IsValid, SCOPE.sCountry('russia').GetAdjective, 'russian')]的影响力挡在地中海之外。\n\n如果我们能让奥地利人相信，我们已经与同属正教会的[SelectLocalization(SCOPE.sCountry('russia').IsValid, SCOPE.sCountry('russia').GetAdjective, 'russian')]兄弟反目，他们或许会被说服归还我们宝贵的海岸。"
 je_balkfm_mon_prince_bishopric_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\n对许多人而言，黑山国仿佛是来自遥远过去的幽灵。西有民族国家，东临帝国强权，这个小国始终屹立，成为欧洲封建历史的见证。佩塔尔二世的登基预示着这个政教合一公国的变革。受其父佩塔尔一世的理想与来自西方的自由主义思潮的激励，这位年轻的主教希望将现代文明之光带入黑山。"
 je_balkfm_mon_ali_pasha_lobby: "$gbbf_journal_lobby$\n#yellow 黑山#!正遭受黑塞哥维那总督#yellow 阿里帕夏·里兹万贝戈维奇#!的猛烈攻势。为在奥斯曼高门面前彰显己能，阿里帕夏与斯库台总督#yellow 奥斯曼帕夏·斯科普利亚克#!决意将黑山纳入#yellow 奥斯曼帝国#!的版图。"
