l_simp_chinese:
 balkfm_revivalism.001.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]米勒特"
 balkfm_revivalism.001.d: "[ROOT.GetCountry.GetNameNoFlag]省包含了中世纪[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的核心地带。随着塞尔维亚起义和希腊国家的独立，民族主义运动在整个省份生根发芽，[ROOT.GetCountry.GetAdjectiveNoFormatting]人民正奋力将自己凝聚为一个统一的民族。\n\n然而，他们的宏图却遭到了#yellow 法那尔#!$grefm_greek$贵族的百般阻挠，这些贵族试图利用自身的影响力，将[ROOT.GetCountry.GetAdjectiveNoFormatting]的民族认同从[GetStrategicRegion('region_balkans').GetName]中彻底抹去。"
 balkfm_revivalism.001.f: "“我的臣民们彼此隔绝，这很好……他们每个人都盯着自己的邻居：他们什么都不懂，并且从灵魂深处厌恶彼此。多亏了这种普遍的互不信任，秩序才得以维持，他们之间的仇恨确保了长久的和平。”——皇帝弗朗茨一世致$FRA_ADJ$大使"
 balkfm_revivalism.001.bul: "“在保加利亚人居住的地方，我们将获得完全的自由：在保加利亚、色雷斯、马其顿。无论何种族裔的人生活在我们这片天堂里，他们在一切权利上都将与保加利亚人平等。”——瓦西尔·列夫斯基"
 balkfm_revivalism.001.bos: "“在波斯尼亚，生活是建立在奴役之上的，整个社会都是奴隶……我们，波斯尼亚的青年，必须开始创造新的历史……我们必须向悲观、怠惰和气馁宣战，我们是新一代和新人类的先驱……”——弗拉基米尔·加齐诺维奇"
 balkfm_revivalism.001.alb: "“正因为我们不是也不想成为土耳其人，所以我们将竭尽全力反对任何企图把我们变成斯拉夫人、奥地利人或希腊人的人。我们只想做阿尔巴尼亚人。”——普里兹伦联盟，1878年"
 balkfm_revivalism.001.a: "[ROOT.GetCountry.GetAdjectiveNoFormatting]人民终会找到出路"
 balkfm_revivalism.002.t: "保加利亚问题"
 balkfm_revivalism.002.d: "虽然本省坐拥最古老的[GetCulture('bulgarian').GetName]故土，但我们与色雷斯和马其顿的同胞依然处于分裂状态。在[ROOT.GetCountry.GetNameNoFlag]、 #yellow 鲁米利亚#!和#yellow 埃迪尔内#!之间，曾经统一的保加利亚认同已开始走向割裂。民族主义者强烈要求我们必须强调所有保加利亚人之间的共通性。"
 balkfm_revivalism.002.f: "“众所周知，我们的语言分为两大主要方言，其中一种在保加利亚和色雷斯使用，另一种在马其顿使用……不仅不应该也不能把马其顿方言排除在共同的标准语言之外，而且如果把它作为主要基础还会更好，原因在于它更悦耳、更流利、结构更严谨，并且在许多方面更完整、更丰富。”——帕尔特尼·佐格拉夫斯基，1857年"
 balkfm_revivalism.002.a: "这些土地理应属于[GetCulture('bulgarian').GetName]"
 balkfm_revivalism.002.b: "我们必须专注于和平共处"
 balkfm_revivalism.003.t: "保加利亚民族复兴"
 balkfm_revivalism.003.d: "民族主义的信条已彻底融入保加利亚社会。从佃农到行省官员，保加利亚人民开始形成一种新的认知：他们不再是苏丹的顺民，而是一个无论是现在还是未来，都将独立于希腊和土耳其统治者影响之外的独立民族。"
 balkfm_revivalism.003.f: "“哦，伏尔加河，伏尔加河！你唤起了我怎样的回忆，你又是如何驱使我将自己埋葬在过去！你的河水波涛汹涌，伏尔加河。我和我的朋友——他也是个保加利亚人——我们潜入水中，骄傲地告诉自己，就在这一刻，我们接受了真正的洗礼……”"
 balkfm_revivalism.003.a: "我们将使祖国重获新生"
 balkfm_revivalism.003.tt: "保加利亚民族主义运动现在每月都会获得声势"
 balkfm_revivalism.009.t: "民族新生"
 balkfm_revivalism.009.d1: "在[SCOPE.sCountry('balkfm_support_scope').GetName]的公开支持下，新成立的“国民议会”在[ROOT.GetCountry.GetCapital.GetName]举行了感人至深的仪式，宣告保加利亚国家的重建。据报，来自苏丹宫廷的使者正携带着令状赶往此地，以使这一行动合法化。"
 balkfm_revivalism.009.d2: "在[ROOT.GetCountry.GetCapital.GetName]举行的一场感人至深的仪式上，新成立的“国民议会”宣告了保加利亚国家的重建，并赋予自身统治保加利亚人民的权力。"
 balkfm_revivalism.009.f1: "在与苏丹达成的妥协中，复兴运动者绝口不提独立，而是同意在奥斯曼的虚名宗主权下保持自治地位。"
 balkfm_revivalism.009.f2: "在反抗了近四个世纪的异族统治后，保加利亚国家终于浴火重生。"
 balkfm_revivalism.009.a: "保加利亚历久弥坚！"
 balkfm_revivalism.009.tt: "$gbbf_devout$将转变为#bold 正教会#!。"