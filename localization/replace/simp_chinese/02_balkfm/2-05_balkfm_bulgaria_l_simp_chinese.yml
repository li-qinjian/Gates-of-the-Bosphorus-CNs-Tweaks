 balkfm_countercoup_reduce_2: "这将#red 减少#bold 2点#!#!亲王支持度"
 je_balkfm_bul_russian_influence: "$RUS_ADJ$影响"
 je_balkfm_bul_russian_influence_reason: "沙皇的将军们的行为严重冒犯了[ROOT.GetCountry.GetRuler.GetFullName]。为寻求补偿并重新得到沙皇的支持，[ROOT.GetCountry.GetRuler.GetFullName]组织了一支随行团，准备启程前往莫斯科。亲王不仅希望沙皇能够支持他继续统治保加利亚，更期望惩处那两个忘恩负义之徒。"
 je_balkfm_bul_royal_influence_status: "主教访问莫斯科"
 je_balkfm_bul_railways: "保加利亚铁路"
 je_balkfm_bul_railways_reason: "俄罗斯的支持取决于战略铁路的修建，以其在巴尔干地区的影响力。同样$GBR_ADJ$也向保加利亚政府提出条件，要求其收购该地区几条由英国运营的铁路线。"
 je_balkfm_bul_stambolovism: "斯塔姆博洛夫主义"
 je_balkfm_bul_stambolovism_goal: "亲王已获得了至少#bold  5个#!合法因素。"
 je_balkfm_bul_stambolovism_sources: "以下因素会影响对亲王认可度：\n•亲王有继承人\n•亲王有超过50[concept_popularity]\n•完成军事改革\n•#yellow 斯特凡·斯塔姆博洛夫#!是政治领袖\n•斯坦波罗夫事件中的选择"
 je_balkfm_bul_stambolovism_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_stambolovism_value')]"
 je_balkfm_bul_stambolovism_fail: "国王在使其家族合法化之前已经去世或离开王位。"
 je_balkfm_bul_military_modernization: "$je_prussia_of_the_balkans$"
 je_balkfm_bul_military_modernization_reason: "$je_prussia_of_the_balkans_reason$"
 je_balkfm_bul_liberation_of_bulgaria: "保加利亚的解放"
 je_balkfm_bul_liberation_of_bulgaria_reason: "历经近五个世纪对沙皇格勒的苏丹权势的屈服，保加利亚终于获得了自由。然而，我们与其他保加利亚同胞的统一却遭到了不公的阻挠。我们在东鲁米利亚的兄弟姐妹正呼唤着摆脱奥斯曼高门的统治，重获自由。"
 je_balkfm_bul_greater_bulgaria: "大保加利亚"
 je_balkfm_bul_greater_bulgaria_reason: "《圣斯特凡诺条约》曾规定保加利亚国将横跨梅西亚和色雷斯地区。然而，列强的干预导致这些保加利亚人占多数的土地被剥离，重新划归奥斯曼帝国高门管辖。"
 je_balkfm_bul_greater_bulgaria_alternate: "大保加利亚"
 je_balkfm_bul_greater_bulgaria_alternate_reason: "《圣斯特凡诺条约》曾规定保加利亚国将横跨梅西亚和色雷斯地区。然而，列强的干预导致这些保加利亚人占多数的土地被剥离，重新划归奥斯曼帝国高门管辖。"
 je_balkfm_bul_tsardom: "保加利亚沙皇国"
 je_balkfm_bul_tsardom_reason: "保加利亚人抵达巴尔干后逐渐斯拉夫化，并在该地区北部建立了广袤的疆域。随着拜占庭帝国的陨落，奥斯曼高门的巧妙安排使各保加利亚族群彼此疏离。我们应当重新全巴尔干的保加利亚同胞团结在同一面旗帜之下。"
 je_balkfm_bul_empire: "保加利亚帝国"
 je_balkfm_bul_empire_reason: "随着民族主义精神的传播并摆脱奥斯曼帝国压迫的枷锁，[ROOT.GetCountry.GetName]渴望成为巴尔干半岛的新主人。我们将确保自己对鲁米利亚的统治。"
 je_balkfm_bul_empire_tt: "我们已经建立#bold 保加利亚帝国#!"
 je_balkfm_bul_old_bulgaria: "古大保加利亚"
 je_balkfm_bul_old_bulgaria_reason: "保加利亚人发家于草原，是大名鼎鼎的游牧民族，在德涅斯特河和伏尔加河之间建立保加利亚帝国。随着[ROOT.GetCountry.GetName]巩固其在巴尔干地区的权力，学者和民族主义者建议我们将统治范围扩大到曾经的古老家园。"
 je_balkfm_bul_two_bulgarias: "保加利亚二分"
 je_balkfm_bul_two_bulgarias_reason: "保加利亚的分裂不过是一个巨大的拟制，目的是将保加利亚民族一分为二，使我们更容易为奥斯曼帝国政府所控制。在保加利亚重新成为一个整体之前，保加利亚人民既不会有和平，也不会有安全。"
 je_balkfm_bul_two_bulgarias_status: "我们的总督任期还有#bold [GetPlayer.MakeScope.Var('balkfm_erum_governor_var').GetValue]#!个月。"
