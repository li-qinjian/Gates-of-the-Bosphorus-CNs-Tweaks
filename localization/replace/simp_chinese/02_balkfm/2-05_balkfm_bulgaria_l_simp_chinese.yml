l_simp_chinese:
 je_balkfm_bul_battenburg_monarchy: "巴腾堡君主制"
 je_balkfm_bul_battenburg_monarchy_reason: "在获得奥斯曼高门承认后，#yellow 亚历山大一世#!在沙皇的公开支持下当选。然而，人民制定的自由主义宪法与国际社会在巴尔干扶植$RUS_ADJ$傀儡的意图相悖。亲王谨慎周旋，因为进一步的自由改革可能危及他在俄罗斯的地位。\n\n亲王能否保住王位将取决于各种 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_pos 有利#! 或 #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_neg 不利#! 因素。意见严重分歧的国民议会只有在亲王捍卫自由理想并维持$RUS_ADJ$沙皇支持的情况下，才会容忍他的统治。\n\n亲王目前拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_bul_battenburg_monarchy_breakdown [Country.MakeScope.ScriptValue('balkfm_battenburg_support_value')]#!点支持度"
 je_balkfm_bul_battenburg_monarchy_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_battenburg_support_value')]"
 je_balkfm_battenburg_pos: "以下条件将会#bold 推进#!#bold 进度条#!：\n•与#yellow 俄罗斯#!在同一[concept_power_bloc]\n•与#yellow 俄罗斯#!保持#bold #green 善意#!或者更高#!的[concept_relations]\n•[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]是[concept_powerful]和[concept_in_government]\n•接受#bold $RUS_ADJ$军事顾问#!。\n•已制定#yellow 言论自由#!或#yellow 集会权#!\n•在#yellow 保加利亚#!建造铁路\n•是#red #bold 分裂分子#!#!或有#bold 自主教会#!\n•解决#bold 匪患#!问题。"
 je_balkfm_battenburg_neg: "下列条件将 #bold 减少#!#bold 进度条#!：\n•未与#yellow 俄罗斯#!在一个[concept_power_bloc]\n•未能与#yellow 俄罗斯#!保持良好的[concept_relations]\n•[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]是[concept_powerful]但不是[concept_in_government]。\n•没有任何投票权\n•已制定#yellow 异议非法#!或#yellow 出版物审查#! \n•直接控制#yellow 保加利亚#!，并直接或间接控制#yellow 北色雷斯#!\n•购买#bold 鲁塞‑瓦尔纳铁路#!。"
 je_balkfm_alex_yeeted_tt: "亚历山大被驱逐出#bold 保加利亚#!"
 battenburg_monarchy_success_tt1: "#bold 进度条#!高于#bold 5#!"
 battenburg_monarchy_success_tt2: "亲王已流放。"
 battenburg_monarchy_fail_tt1: "#bold 进度条#!低于或等于#bold 5#!"
 battenburg_monarchy_fail_tt2: "亲王已流放。"
 balkfm_coup_warning_1: "巴腾堡君主制得以保全。"
 balkfm_coup_warning_2: "对巴滕伯格家族的不满不绝于耳……"
 balkfm_coup_warning_3: "不同政见者对君主制提出质疑。"
 balkfm_coup_warning_4: "君主制在国民议会中不受欢迎。"
 balkfm_countercoup_add_1: "这将#green 增加#bold 1点#!#!亲王支持度"
 balkfm_countercoup_add_2: "这将#green 增加#bold 2点#!#!亲王支持度"
