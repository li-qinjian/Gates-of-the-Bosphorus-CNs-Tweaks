l_simp_chinese:
 balkfm_bosnia.001.t: "塞尔维亚人的小邦国"
 balkfm_bosnia.001.d: "作为对$turkfm_porte$终身服务的奖励，[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]被授予[ROOT.GetCountry.GetName]作为其个人封地。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]对目前的处境并不满意，并公开宣布其目标是将统治范围扩大到[GetStateRegion('STATE_MONTENEGRO').GetName]，终有一日自立为苏丹。"
 balkfm_bosnia.001.f: "“这些是黑塞哥维那的地方……这些地方已赐予我、我的子孙及我的族人，我这样做是为了防止某个恶毒的帕夏统治黑塞哥维那。我认为，与其让外族人来统治，不如由我这样的本地人来治理黑塞哥维那；没有人会对自己家怀有恶意。我将以公正审判所有人……”——阿里·帕夏·里兹万贝戈维奇，1833年"
 balkfm_bosnia.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_bosnia.002.t: "波斯尼亚的里兹万贝戈维奇家族"
 balkfm_bosnia.002.f: "“伊斯坦布尔有一位苏丹，但在莫斯塔尔，我才是苏丹。” ——阿里帕夏，1841年"
 balkfm_bosnia.002.a: "[ROOT.GetCountry.GetName]将走自己的路。"
 balkfm_bosnia.003.t: "失败的野心"
 balkfm_bosnia.003.d: "随着阿里帕夏去世，他建立独立的波斯尼亚野心随之破灭。尽管[ROOT.GetCountry.GetRuler.GetFullName]有统治的意愿，但显然他缺乏其父的深厚人脉。"
 balkfm_bosnia.003.f: "“如果我们现在不阻止奥马尔帕夏，三十年后波斯尼亚将不再属于波斯尼亚人。”——阿里·帕夏，约1850年"
 balkfm_bosnia.003.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 balkfm_bosnia.005.t: "重组开始"
 balkfm_bosnia.005.d: "信使已从君士坦丁堡抵达，报告《花厅御诏》的颁布。作为坦齐马特改革的下一阶段，苏丹已指示所有成员执行其现代化指令……不顾贵族和总督权力的任何削弱。"
 balkfm_bosnia.005.f: "“若是你在波斯尼亚和黑塞哥维那推行坦齐马特，你甚至连三十年都无法维持下去。” ——阿里帕夏"
 balkfm_bosnia.005.a: "我们将投身于这一崇高目标。"
 balkfm_bosnia.005.b: "这些计划不合理。"
 balkfm_bosnia.001.tt1: "波斯尼亚的[concept_general]#bold $Smail$#!已被派遣袭击边境，违背了$turkfm_porte$的意愿。"
 balkfm_bosnia.001.tt2: "如果[ROOT.GetCountry.GetName]失去对[GetStateRegion('STATE_MONTENEGRO').GetName]的[concept_claim]，则将从#bold $je_eqfm_karadag$#![concept_journal_entry]中移除。"
 balkfm_bosnia.002.d: "凭借大胆与傲气，阿里帕夏确立了对[SCOPE.sCountry('bosnia_scope').GetName]的统治。随着他的苏丹国崛起，[GetStrategicRegion('region_balkans').GetName]迎来了一个新时代。"
 balkfm_bosnia.004.t: "$Rizvanbegovic$家族的终结"
 balkfm_bosnia.004.d: "$turkfm_porte$的制裁毫无征兆且十分迅速，威名赫赫的[SCOPE.sCharacter('omer_pasha_scope').GetFirstName]#yellow 帕夏#![SCOPE.sCharacter('omer_pasha_scope').GetLastName]抵达[SCOPE.sCountry('bosnia_scope').GetName]以恢复控制。$Rizvanbegovic$家族因妄图谋求独立而被废黜，苏丹已宣布意图在[GetStateRegion('STATE_BOSNIA').GetName]重建中央权威。"
 balkfm_bosnia.004.f: "[SCOPE.sCharacter('omer_pasha_scope').GetFullNameNoFormatting]已经证明自己是一位能够驾驭[GetStrategicRegion('region_balkans').GetName]这个火药桶的能干将领，其忠于$turkfm_porte$，每当当地贵族的利益与$turkfm_porte$的利益发生冲突时，[SCOPE.sCharacter('omer_pasha_scope').GetFirstNameNoFormatting]总能伸张正义，因而赢得了良好的声望。"
 balkfm_bosnia.004.a: "真是好消息。"
 balkfm_bosnia.004.b: "[ROOT.GetCountry.GetNameNoFormatting]会变成什么样？"
 balkfm_bosnia.004.c: "终于解脱了。"