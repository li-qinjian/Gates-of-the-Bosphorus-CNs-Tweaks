 balkfm_agendas: "#o #tooltip:[GetPlayer.GetTooltipTag],balkfm_reform_agenda_desc 议程#!#!"
 balkfm_tax_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_tax_reform_desc 推行税法现代化#!#!$balkfm_agenda$"
 balkfm_tax_reform_desc: "作为奥斯曼帝国统治的残余，现行的税制仍严重依赖地税，而最沉重的负担则落在了耕作田地的农民身上。虽然此体制深受贵族阶层青睐，但这只会阻碍[GetPlayer.GetNameNoFormatting]走向未来。"
 balkfm_tax_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_tax_reform_desc 推行税法现代化#!#!"
 balkfm_land_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_land_reform_desc 改革奥斯曼土地旧制#!#!$balkfm_agenda$"
 balkfm_land_reform_desc: "奥斯曼帝国数百年的停滞统治，导致[GetPlayer.GetName]沦落为一个彻头彻尾的落后农业国。各方领袖已要求[GetPlayer.GetRuler.GetPrimaryRoleTitle]锐意进取，引领[GetPlayer.GetAdjectiveNoFormatting]人民摆脱这种落后的务农境遇。"
 balkfm_land_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_land_reform_desc 确立文官传统#!#!"
 balkfm_civic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_civic_reform_desc 确立文官传统#!#!$balkfm_agenda$"
 balkfm_civic_reform_desc: "在奥斯曼帝国的长期统治下，地方缙绅根深蒂固，他们利用宪政结构的缺失，将亲信推上权力宝座。这导致了[GetPlayer.GetAdjectiveNoFormatting]社会各阶层腐败横行。"
 balkfm_civic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_civic_reform_desc 确立文官传统#!#!"
 balkfm_security_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_security_reform_desc 稳定乡野秩序#!#!$balkfm_agenda$"
 balkfm_security_reform_desc: "希腊独立战争之后，土匪和强盗盘踞在巴尔干的乡村地带，无论是奥斯曼帝国还是[GetPlayer.GetAdjectiveNoFormatting]政府都鞭长莫及。该地区的民众群情激愤，强烈要求将这些暴徒绳之以法。"
 balkfm_security_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_security_reform_desc 稳定乡野秩序#!#!"
 balkfm_state_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_state_reform_desc 整顿国家行政体制#!#!$balkfm_agenda$"
 balkfm_state_reform_desc: "[GetPlayer.GetName]摆脱奥斯曼的监护独立时，其国家机器极其简陋，甚至很难称之为一个政府。倾向改革的领袖们已要求[GetPlayer.GetRuler.GetPrimaryRoleTitle]彻底推行各项改革，以确保[GetPlayer.GetAdjectiveNoFormatting]国家能够获得正常的行政管理。"
 balkfm_state_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_state_reform_desc 整顿国家行政体制#!#!"
 balkfm_economic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_economic_reform_desc 整顿国家经济#!#!$balkfm_agenda$"
 balkfm_economic_reform_desc: "由于在历史上长期饱受各大列强的裹挟与争夺，[GetPlayer.GetNameNoFormatting]的经济发展远远落后于其邻国。目前，由于该国大部分地区仍由自给自足的农业和贵族庄园主导，改革派的目标是将工业引入[GetPlayer.GetName]。"
 balkfm_economic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_economic_reform_desc 整顿国家经济#!#!"
 balkfm_social_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_social_reform_desc 启动社会改革#!#!$balkfm_agenda$"
 balkfm_social_reform_desc: "长期以来，[GetPlayer.GetAdjectiveNoFormatting]人一直与西方的意识形态相隔绝，但随着从奥斯曼国家获得自治，一波启蒙思想的浪潮席卷而来。[GetPlayer.GetAdjectiveNoFormatting]的学者们认为，[GetPlayer.GetAdjectiveNoFormatting]国家想要立足，唯一的出路就是拥抱现代法律与社会运动。"
 balkfm_social_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_social_reform_desc 启动社会改革#!#!"
