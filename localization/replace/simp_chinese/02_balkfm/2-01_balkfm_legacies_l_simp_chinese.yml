l_simp_chinese:
 je_balkfm_legacies: "奥斯曼统治的遗祸"
 je_balkfm_legacies_reason: "$je_balkfm_legacies_flavor$\n$gbbf_delimiter_normal$$je_balkfm_legacies_details$"
 je_balkfm_legacies_flavor: "“#italic 土耳其曾实行自由贸易，结果如何？它摧毁了世界上一些最优秀的制造业。直到1812年，这些制造业尚且存在，但如今已被彻底摧毁。这便是土耳其放任竞争的恶果，其危害之深，与西班牙走向反面极端所造成的后果同样致命。#!”——本杰明·迪斯雷利，1847年\n\n数世纪的奥斯曼帝国统治使[GetGeographicRegion('geographic_region_rumelia').GetName]处于一种乡村化且落后的状态。当工业化与启蒙思想席卷欧洲之际，受土耳其人统治的地区却被隔绝于创新与现代化之外。走向繁荣的唯一途径，就是将这个国家身上那层腐朽的封建主义外壳彻底剥离。"
 je_balkfm_legacies_details: "[GetPlayer.GetCustom('balkfm_tax_reform_status_type')][GetPlayer.GetCustom('balkfm_land_reform_status_type')][GetPlayer.GetCustom('balkfm_civic_reform_status_type')][GetPlayer.GetCustom('balkfm_security_reform_status_type')][GetPlayer.GetCustom('balkfm_state_reform_status_type')][GetPlayer.GetCustom('balkfm_economic_reform_status_type')][GetPlayer.GetCustom('balkfm_social_reform_status_type')]"
