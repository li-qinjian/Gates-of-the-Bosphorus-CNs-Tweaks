l_simp_chinese:
 balkfm_montenegro.001.t: "封建遗存"
 balkfm_montenegro.001.d: "[ROOT.GetCountry.GetName]采邑主教辖区独自抵抗着帝国在[GetStrategicRegion('region_balkans').GetName]的扩张。然而，该国缺乏中央权力，税收是不成文的，司法往往由部落领袖执行。年轻的采邑主教[ROOT.GetCountry.GetRuler.GetFullName]试图提升国家的地位，摆脱其封建落后面貌，而嗜战的奥斯曼维齐尔们则在一旁对边境虎视眈眈。"
 balkfm_montenegro.001.f: "“我们人民的观念仍然非常宗法化。在这里，匕首、复仇和部落制度的顽固程度是其他任何地方都无法比拟的。整个国家错综复杂，几乎每个人都互相认识。黑山不过是一个大家庭——而这一切绝非吉兆。”——米哈伊洛·德德伊"
 balkfm_montenegro.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_montenegro.001.tt: "只要我们与奥斯曼帝国没有正式边界，我们就有可能遭到当地#italic 贝伊#!跨境袭击"
 balkfm_montenegro.002.t: "走出传统"
 balkfm_montenegro.002.d: "冲破几个世纪以来的因循守旧，[ROOT.GetCountry.GetName]终于开始摆脱其封建枷锁。"
 balkfm_montenegro.002.f: "尽管遭到了保守派领导层的抵制，采邑主教辖区已经迈出了走向现代社会的第一步。虽然还有很长的路要走，但伴随着这些最初的社会改革，人民也许可以开始憧憬一个将所有生活在黑山阴影下的黑山人包容在内的世界。"
 balkfm_montenegro.002.a: "[ROOT.GetCountry.GetName]的根只能在这里。"
 balkfm_montenegro.003.t: "中央行政"
 balkfm_montenegro.003.d: "采邑主教的努力结出了硕果，该国历史上第一个真正具备国家形态的行政机构诞生了。"
 balkfm_montenegro.003.f: "通过从教会手中夺回对处于起步阶段的国家机器的控制权，采邑主教已经开始了将[ROOT.GetCountry.GetName]软硬兼施地拽入现代社会的进程。"
 balkfm_montenegro.003.a: "干得漂亮。"
 balkfm_montenegro.004.t: "正规部队"
 balkfm_montenegro.004.d: "经过采邑主教的不懈努力，军队已经从一个勉强能被称为民兵的部落武装，重组为国家权力的正规延伸。"
 balkfm_montenegro.004.f: "尽管这无法动摇高门死守巴尔干半岛的决心，但至少我们有可能抵御他们的怒火。"
 balkfm_montenegro.004.a: "好消息！"
 balkfm_montenegro.005.t: "沙皇的宫廷"
 balkfm_montenegro.005.d: "历经数月的延宕和外交斡旋，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]终于在[SCOPE.sCountry('russia_scope').GetCapital.GetName]受到了[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]的接见。在一番晚宴和友好相谈之后，他带着$RUS_ADJ$将继续支持黑山事业的承诺返回了[ROOT.GetCountry.GetName]。"
 balkfm_montenegro.005.f: "与1834年的访问相比，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]此次出访受到的接待略显冷淡，原因是他希望将自由主义思想引入黑山。然而，$RUS_ADJ$朝廷似乎不愿放弃这样一个切入巴尔干半岛的绝佳机会。"
 balkfm_montenegro.005.a: "我们需要强有力的庇护者。"
 balkfm_montenegro.006.t: "《山区花环》"
 balkfm_montenegro.006.d: "经过一年的潜心创作，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]出版了他的史诗巨著——#yellow 《山区花环》#!。作为一部宏伟的黑山史诗诗篇，这部长诗讲述了黑山人反抗企图将其从巴尔干半岛抹去的势力的英雄故事。通过将这部作品带给大众，[ROOT.GetCountry.GetRuler.GetFirstName]点亮了一座灯塔，号召黑山塞尔维亚人在一面独立的旗帜下走向统一。"
 balkfm_montenegro.006.f: "“顺境之中做好人易，\n苦难之中方显英雄！”\n——《山区花环》第137–138节"
 balkfm_montenegro.006.a: "[ROOT.GetCountry.GetName]将会崛起。"
 balkfm_montenegro.006.tt: "控制#yellow 塞尔维亚人#!土地的国家将开始触发增加#yellow 塞尔维亚人#!激进度的事件。"
 balkfm_montenegro.007.t: "难治之症"
 balkfm_montenegro.007.d: "几个月来，主教[ROOT.GetCountry.GetRuler.GetLastName]一直饱受剧烈咳嗽的折磨。在卡塔罗看医后，亲王被诊断出患有#yellow 肺结核#!。此后，主教的病情持续恶化，导致许多人担心他在世的日子已所剩无几。"
 balkfm_montenegro.007.f: "[ROOT.GetCountry.GetName]缺乏接受过治疗肺结核所需培训的医生。为了缓解病痛改善心境，亲王将更多的时间投入到了休养和写作中。"
 balkfm_montenegro.007.a: "真是不幸。"
 balkfm_montenegro.008.t: "主教崩逝"
 balkfm_montenegro.008.d: "悲剧降临了[ROOT.GetCountry.GetName]。主教[ROOT.GetCountry.GetRuler.GetFirstName]被发现死在寝殿中，他的生命最终被肺结核夺走。国家元老院在[SCOPE.sCharacter('balkfm_heir_scope').GetFirstName]和他的兄弟[SCOPE.sCharacter('balkfm_pero_scope').GetFullName]之间产生了分歧，最终达尼洛在民众的支持下夺取了政权。"
 balkfm_montenegro.008.f: "虽然和他的父亲一样充满活力，但主教[SCOPE.sCharacter('balkfm_heir_scope').GetLastName]依然年轻且缺乏经验。然而，他秉承了其父在黑山推行世俗统治的同样愿望。"
 balkfm_montenegro.008.a: "悲惨的际遇。"
 balkfm_montenegro.009.t: "现代化的黎明"
 balkfm_montenegro.009.d: "[ROOT.GetCountry.GetName]近期的改革在实现#yellow 彼得一世#!让国家摆脱部落根基、向前发展的梦想方面取得了重大进展。虽然还有许多工作要做，但这些第一步向世界表明，这个小国已经准备好在全球社会中留下自己的印记。"
 balkfm_montenegro.009.f: "尽管与列强相比，西方可能仍然认为黑山很落后，但他们再也不能指责我们“未开化”了。"
 balkfm_montenegro.009.a: "干得漂亮。"
 balkfm_montenegro.010.t: "小兔子"
 balkfm_montenegro.010.d: "[ROOT.GetCountry.GetRuler.GetFirstName]在没有充分准备的情况下被推上了统治者的位置。鉴于他的年轻和缺乏经验，几位部落首领云集采蒂涅，公开谴责他继承[ROOT.GetCountry.GetName]的王位。"
 balkfm_montenegro.010.f: "随着彼得猝逝的噩耗传来，年轻的[ROOT.GetCountry.GetRuler.GetFirstName]中断了在国外的学业，匆忙赶回黑山，希望能阻止部落首领的任何干涉企图。"
 balkfm_montenegro.010.a: "我们必须维持秩序。"
 balkfm_montenegro.011.t: "宫廷纷争"
 balkfm_montenegro.011.d: "#yellow 彼得二世#!的过世重新点燃了旧日的部落恩怨。采邑主教在执政初期便指定[ROOT.GetCountry.GetRuler.GetFirstName]为他的继承人。但在[SCOPE.sCharacter('balkfm_landowners_leader_scope').GetFullName]的带领下，部落领袖们采取行动，试图拥立已故采邑主教的兄弟[SCOPE.sCharacter('balkfm_pero_scope').GetFullName]为[ROOT.GetCountry.GetName]的统治者。"
 balkfm_montenegro.011.f: "按照传统，年轻的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]完全有权将这个挑战者驱逐出境。然而，黑山的社会规范使他陷入了两难境地：他要么展现宽容，从而显得软弱；要么冒着让#yellow 彼得罗维奇家族#!与自己的族人结下血仇的风险诉诸武力。"
 balkfm_montenegro.011.a: "我们绝不能容忍这种傲慢。"
 balkfm_montenegro.011.b: "暴力并非解决之道。"
 balkfm_montenegro.012.t: "血亲复仇"
 balkfm_montenegro.012.d: "采蒂涅传来了可怕的消息。[ROOT.GetCountry.GetRuler.GetFirstName]被他自己的同胞#yellow 托多尔·卡迪奇#!刺杀，这显然是为了报复在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]统治初期对其部落同胞的羞辱。"
 balkfm_montenegro.012.f: "在没有宣布正式血仇的情况下突然刺杀[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，引发了人们对政治甚至国际势力干涉该国的怀疑。"
 balkfm_montenegro.012.a: "这简直令人愤慨！"
 balkfm_montenegro.013.t: "见多识广的领袖"
 balkfm_montenegro.013.d: "前任[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的遇刺为[ROOT.GetCountry.GetRuler.GetFullName]登基扫清了道路。新任[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在西方接受过教育，充满年轻人的活力，他欣然就职，决心完成彼得一世所设想的现代化工作。"
 balkfm_montenegro.013.f: "与其祖辈相比，[ROOT.GetCountry.GetRuler.GetFirstName]所受的广泛教育使他成为统治过黑山的人中最有见识的绅士之一。"
 balkfm_montenegro.013.a: "[ROOT.GetCountry.GetName]承受不起这些干扰。"
 balkfm_montenegro.020.t: "黑山王国"
 balkfm_montenegro.020.d: "顶着欧洲更大势力均衡的压力，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]领导国民议会，单方面将[ROOT.GetCountry.GetName]提升为王国。"
 balkfm_montenegro.020.f: "尽管听起来只是外交沟通中的一个变化，但这一行动对于彰显一个独立黑山国家的存在至关重要。"
 balkfm_montenegro.020.a: "[ROOT.GetCountry.GetName]永不屈服。"
 balkfm_montenegro.100.t: "大黑山化进程"
 balkfm_montenegro.100.d: "一只纤细的手正敲击着黑山的权力宝座——这是朝廷早已非常熟悉的节拍。那是[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的手。在最近的记忆中，这是一只没有下达过任何命令、颁布过任何法令或法律的手。"
 balkfm_montenegro.100.f: "“这个国家曾经意义非凡”，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]伸手去拿他的拉基亚酒杯时想这样说。然而当酒杯碰到嘴唇时，他很快意识到根本没有哪个辉煌的过去值得一提。#bold 他已经“黑山”得精疲力竭了#!。"
 balkfm_montenegro.100.a: "黑山时刻已到"
 balkfm_montenegro.100.tt: "“#italic 这里肯定在哪藏着点康波特吧……#!”"
 balkfm_montenegro.200.t: "黑山之魂"
 balkfm_montenegro.200.d: "随着$balkfm_yugoslavism$的观念开始在[GetStrategicRegion('region_balkans').GetName]生根发芽，一小批[ROOT.GetCountry.GetAdjectiveNoFlag]知识分子提出了一个具有争议的观点：[ROOT.GetCountry.GetName]不仅拥有独特的文化身份，而且[GetCulture('montenegrin').GetName]人在$balkfm_south_slavs$中也是一个完全独立的文化群体。"
 balkfm_montenegro.200.f: "“为了黑山的权利、荣誉与自由。”——绿党格言，1919年–1929年"
 balkfm_montenegro.200.a: "我们到底是[GetCulture('montenegrin').GetName]人，还是[GetCulture('serb').GetName]人？"
 balkfm_montenegro.900.t: "#filler 生成历史继承人#!"
 balkfm_montenegro.900.d: "#filler [balkfm_montenegro.900.d]#!"
 balkfm_montenegro.900.f: "#filler [balkfm_montenegro.900.f]#!"
 balkfm_montenegro.900.a: "#filler [balkfm_montenegro.900.a]#!"
