l_simp_chinese:
 balkfm_bulgaria.001.t: "金狮觉醒"
 balkfm_bulgaria.001.d: "近百年来，[SCOPE.sCountry('ottoman_scope').GetName]的势微力衰，与民族觉醒运动的蓬勃发展交相呼应，终于促成了[ROOT.GetCountry.GetName]的重新崛起。在[SCOPE.sCountry('russia_scope').GetName][SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]的大力支持下，一位信奉天主教的奥地利亲王被推选为[ROOT.GetCountry.GetName]这个新生国家的君主。"
 balkfm_bulgaria.001.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]年轻缺乏经验，而且国家处于岌岌可危的境地。[ROOT.GetCountry.GetName]尚未完全摆脱高门的枷锁，国家以农业为主、贫穷落后，在很大程度上依赖[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]的外交支持。然而，人民对于摆脱压迫、获得自由的未来，以及与仍生活在奥斯曼领土上的保加利亚同胞实现统一满怀希望。"
 balkfm_bulgaria.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_bulgaria.002.t: "民主的阻碍"
 balkfm_bulgaria.002.d: "[ROOT.GetCountry.GetRuler.GetFullName]亲王雄心壮志，计划快速推进国家机构的建设，却发现他的宏伟蓝图因国民议会内部的争吵不休而化为泡影。与此同时，民众公开表达了他们对保加利亚政治进程的不信任。在$RUS_ADJ$外交官的支持下，亲王提议废除宪法的诸多条款。"
 balkfm_bulgaria.002.f: "“陛下，我认为，这一关于斯拉夫民族，或者更确切地说，关于俄罗斯的国家理念的阐述，可能会对您的政治规划有所裨益。”\n——J. 阿斯卡科夫在1881年致亲王的信函中如是写道。"
 balkfm_bulgaria.002.a: "一个强大的国家需要一位强硬的领导者。"
 balkfm_bulgaria.002.b: "政治进程需要时间的沉淀。"
 balkfm_bulgaria.003.t: "异见出版物"
 balkfm_bulgaria.003.d: "一家著名报纸《保加利亚日报》谴责了大公的独裁欲望，引来了大公的内政部长的怒火。他已向大公提议，绝不能容忍这种对其权威的侮辱。"
 balkfm_bulgaria.003.f: "“人民唯一需要的声音，就是他们的君主——大公的声音！”"
 balkfm_bulgaria.003.a: "对新闻界施加限制。"
 balkfm_bulgaria.003.b: "新闻界神圣不可侵犯。"
 balkfm_bulgaria.004.t: "沙皇影响"
 balkfm_bulgaria.004.d: "在[ROOT.GetCountry.GetName]建立并支持[ROOT.GetCountry.GetRuler.GetFullName]当选后，沙皇[SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]对待亲王更像是对待一个省份的代表而非一个外国统治者。在他最新的决策中，[SCOPE.sCountry('russia_scope').GetName]派出两位将军对我们的军队提供协助河监督。"
 balkfm_bulgaria.004.f: "这两位将军，#yellow 列昂尼德·索博列夫#!和#yellow 亚历山大·冯·考尔巴斯#!确实是资深军人，但他们在场可能将我们置于俄国更深的影响中。奥地利领事已经理所当然地提出抗议，称此事将会使$RUS_ADJ$在巴尔干获得不当的影响力。"
 balkfm_bulgaria.004.a: "我们应当相信我们的恩人。"
 balkfm_bulgaria.004.b: "我们的军队仍然是属于保加利亚人的军队。"
 balkfm_bulgaria.005.t: "俄罗斯要求屈服"
 balkfm_bulgaria.005.d: "出于对议会大胆行为和巴尔干地区方兴未艾的民族主义运动的担忧，沙皇[SCOPE.sCharacter('russia_ruler_scope').GetFullName]对我们宣称[SCOPE.sCountry('rumelia_scope').GetName]的行为提出严厉警告。"
 balkfm_bulgaria.005.f: "“目前唯一值得担心的是希腊，它想要靠自己来扩张。要让这个国家摆脱它自己引发的危机是十分困难的...必须要记住，保加利亚还没有能力应对动乱带来的后果。”——沙皇亚历山大三世就巴尔干收复失地主义对巴滕堡大公说。"
 balkfm_bulgaria.005.a: "我们当谨慎行事。"
 balkfm_bulgaria.005.b: "保加利亚的再统一无可避免。"
 balkfm_bulgaria.006.t: "破坏性态度"
 balkfm_bulgaria.006.d: "$RUS_ADJ$军事顾问的存在并非没有引起过事端。在干涉我们议会的政治活动后，#yellow 考尔巴斯#!将军要求限制本土保加利亚人将军在军队中的晋升。"
 balkfm_bulgaria.006.f: "这一举动自然引起了公愤。如果保加利亚军队仍然被俄罗斯军队束缚，保加利亚就不可能走独立自主的道路。政界领袖要求大公直接与沙皇沟通其在保加利亚的意图。"
 balkfm_bulgaria.006.a: "大公将会寻求补救。"
 balkfm_bulgaria.006.tt: "#yellow 亚历山大#!大公将启程前往莫斯科。"
 balkfm_bulgaria.006.b: "我们将容忍他们的丑剧。"
 balkfm_bulgaria.007.t: "索伯列夫摄政"
 balkfm_bulgaria.007.d: "又一次对[ROOT.GetCountry.GetName]独立的赤裸裸的侮辱，#yellow 索伯列夫#!将军滥用职权解职了多名省长和大臣，意图在大公出国期间将政府改造地更加亲俄。"
 balkfm_bulgaria.007.f: "当大公动身前往俄罗斯，他留下了一批忠臣来处理大小事务。在他不在的期间，#yellow 索伯列夫#!很快就试图取代他的统治。"
 balkfm_bulgaria.007.a: "只需纠正其行动即可。"
 balkfm_bulgaria.007.b: "把这些老鼠从[ROOT.GetCountry.GetName]赶走！"
 balkfm_bulgaria.008.t: "天命攸归"
 balkfm_bulgaria.008.d: "在可能的政变发生数天后，[SCOPE.sCharacter('balkfm_sava_scope').GetFullName]就召集了军队支持大公，逮捕密谋者并恢复了[ROOT.GetCountry.GetName]的秩序。挟$RUS_ADJ$君主支持之势，[SCOPE.sCharacter('balkfm_alex_scope').GetFullName]重返君主宝座，举国同庆。"
 balkfm_bulgaria.008.f: "大公和他的追随者展现出的意志和决心大大增强了他在人民当中的地位。在[SCOPE.sCountry('russia_scope').GetName]的支持下，大公宣布自己为保加利亚的世袭统治者。"
 balkfm_bulgaria.008.a: "[ROOT.GetCountry.GetName]的未来一片光明！"
 balkfm_bulgaria.009.t: "八月政变"
 balkfm_bulgaria.009.d: "由于他试图在[ROOT.GetCountry.GetName]推行专制统治，[ROOT.GetCountry.GetRuler.GetFullName]已逊位。国内亲俄分子闯入王宫，以死威胁大公退位。"
 balkfm_bulgaria.009.f: "大公的突然退位引发了大范围的愤懑。尽管[SCOPE.sCharacter('balkfm_sava_scope').GetFullName]试图发动反政变，亲王最终没能争取到足够的支持以塑造自己统治保加利亚的合法性。一个看守摄政团已成立，向列强请求选出新大公的呼吁已发出。"
 balkfm_bulgaria.009.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_bulgaria.012.t: "战略要求"
 balkfm_bulgaria.012.d: "《柏林条约》建立了受限的保加利亚国家。条约规定，作为东方铁路构想的一部分，[ROOT.GetCountry.GetName]必须建立一条连接土耳其和奥斯曼领土的战略铁路网。另外，$GBR_ADJ$还强令我国购买鲁塞-瓦尔纳铁路以补偿他们在该地区所受的损失。"
 balkfm_bulgaria.012.f: "自其建立以来，列强一直希望将保加利亚定位奥斯曼势力范围内的西方桥头堡。尽管我们希望将交通运输的各个方面都纳为国有，但一些人担心这将损害列强对保加利亚的支持。"
 balkfm_bulgaria.012.a: "没有铁路，何谈未来。"
 balkfm_bulgaria.013.t: "严苛定价"
 balkfm_bulgaria.013.d: "在议会的一次煽动性会议后，[ROOT.GetCountry.GetName]决定履行购买鲁塞-瓦尔纳铁路的承诺。"
 balkfm_bulgaria.013.f: "在《柏林条约》批准与购买铁路之间的延迟中，英国铁路运营商抓住机会向保加利亚国家勒索尽可能高的价格。"
 balkfm_bulgaria.013.a: "不管开价多少，这都是明智之选。"
 balkfm_bulgaria.014.t: "保加利亚铁路"
 balkfm_bulgaria.014.d: "横跨[ROOT.GetCountry.GetName]的铁路网终于建成，使我们与欧洲世界更加紧密相连。我们只能希望这能帮助我们争取摆脱[SCOPE.sCountry('ottoman_scope').GetName]并独立。"
 balkfm_bulgaria.014.f: "保加利亚几条铁路的建设对$RUS_ADJ$帝国和奥地利帝国的战略规划至关重要。它还推动了连接巴黎和君士坦丁堡的东方快车的建成。"
 balkfm_bulgaria.014.a: "铁路既通，未来可保。"
 balkfm_bulgaria.015.t: "王室随行人员"
 balkfm_bulgaria.015.d: "有了沙皇朝廷的批准，[ROOT.GetCountry.GetRuler.GetFirstName]大公已经准备好前往[SCOPE.sCountry('russia_scope').GetName]。然而，在启程前，一封信函寄来，称[SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName]苏丹想要与大公会面。"
 balkfm_bulgaria.015.f: "尽管苏丹对大公的帮助不大，但许多顾问依然力荐大公前往君士坦丁堡。大公本人则认为这可能是在前往莫斯科前访问巴尔干地区几个邻国的机会。"
 balkfm_bulgaria.015.a: "我们应表示尊重。"
 balkfm_bulgaria.015.b: "我们还是前往俄罗斯吧。"
 balkfm_bulgaria.016.t: "热情招待"
 balkfm_bulgaria.016.d: "尽管心存疑虑，但[ROOT.GetCountry.GetRuler.GetFirstName]还是受到了苏丹的热情接待。大公并没有受到短暂而冷淡的接待，而是受到了欢呼的迎接并被授予庄严的勋章。[SCOPE.sCharacter('ottoman_ruler_scope').GetFullName]显然试图平息[ROOT.GetCountry.GetName]的分离主义浪潮。"
 balkfm_bulgaria.016.f: "苏丹的举动让大公及其随从大为吃惊。苏丹对大公代表保加利亚提出的要求给予了礼貌而周到的答复，同意了大部分要求，并抱着最大的尊重拒绝了少数要求。苏丹甚至授予大公奥斯曼尼耶勋章，这是帝国第二高的勋章。"
 balkfm_bulgaria.016.a: "真是慷慨的惊喜！"
 balkfm_bulgaria.017.t: "谨慎的欢迎"
 balkfm_bulgaria.017.d1: "[ROOT.GetCountry.GetRuler.GetFirstName]大公在雅典的宫廷中受到了带着不信任感的欢迎，尽管[SCOPE.sCharacter('greece_ruler_scope').GetFullName]国王并没有表现出不尊重，但他明显不认同大公的泛巴尔干理想。"
 balkfm_bulgaria.017.d2: "[ROOT.GetCountry.GetRuler.GetFirstName]大公在希腊宫廷受到热烈欢迎。在正式仪式结束后，[SCOPE.sCharacter('greece_ruler_scope').GetFullName]国王提出了几项提议，希望在巴尔干找到希腊的盟友。国王还进一步承诺将在马其顿问题上寻求合作。"
 balkfm_bulgaria.017.f: "巴尔干各族人民间的关系始终矛盾重重。由于国界划分不明确，大城市民族高度杂居，每一次民族认同运动都会遭致那些遭到自己国家疏远的人的失望。"
 balkfm_bulgaria.017.a: "真不幸。"
 balkfm_bulgaria.017.b: "真是幸运。"
 balkfm_bulgaria.018.t: "黑色山脉"
 balkfm_bulgaria.018.d1: "黑山的清新空气和宁静环境温暖着每一位来访者的心。在受到来自[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]的热情接待后，黑山宫廷希望能让一位公主嫁给大公以强化两国间的纽带。"
 balkfm_bulgaria.018.d2: "黑山的清新空气和宁静环境温暖着每一位来访者的心。在受到来自[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]的热情接待后，对话转向了高门权势的衰落。尽管没有作出任何具体承诺，两人就巴尔干人必须团结起来抵抗土耳其人这点达成了共识。"
 balkfm_bulgaria.018.f: "[SCOPE.sCountry('montenegro_scope').GetName]数个世纪以来一直在与奥斯曼人抗衡。然而，随着高门试着加深对巴尔干半岛的控制，它发现自己四面受敌。在这种情况下，采邑主教一直争取与其他巴尔干国家建立深厚的联系。"
 balkfm_bulgaria.018.a: "大公感到十分荣幸。"
 balkfm_bulgaria.018.b: "我们不能让大公如此轻率地承诺。"
 balkfm_bulgaria.018.c: "愿这是深厚友谊的开端。"
 balkfm_bulgaria.019.t: "沙皇宫廷"
 balkfm_bulgaria.019.d: "[ROOT.GetCountry.GetRuler.GetFirstName]大公怒不可遏，因为当他抵达莫斯科时，他发现了自称是保加利亚代表团团长的索菲亚市长#yellow 尼古拉·苏克纳罗夫#!。盛怒的大公不知如何应对这一局面是好。"
 balkfm_bulgaria.019.f: "为了破坏保加利亚的自主性，#yellow 索伯列夫将军#!直接向莫斯科派出了第二个代表团。此举有意让保加利亚在外国蒙羞。在冲进沙皇的大厅后，大公要求觐见沙皇，却意外的得到了沙皇本人的亲自会见。"
 balkfm_bulgaria.019.a: "要求处罚#yellow 索伯列夫#!。"
 balkfm_bulgaria.019.b: "试图修补关系"
 balkfm_bulgaria.020.t: "当选的大公"
 balkfm_bulgaria.020.d: "随着大批外交官涌入议会，寻找领导保加利亚的新大公一事顿时波谲云诡。由[ROOT.GetCountry.GetRuler.GetFullName]领导的摄政委员会似乎已经找到了一位能被国际社会接受的候选人。"
 balkfm_bulgaria.020.f: "在#yellow 巴腾堡#!大公被逐出[ROOT.GetCountry.GetName]后，来自[SCOPE.sCountry('russia_scope').GetName]和[SCOPE.sCountry('ottoman_scope').GetName]的外交官迅速与看管政府搭线，要求议会只管批准他们的大公人选。"
 balkfm_bulgaria.020.1: "马西米连诺一世是最容易接受的。"
 balkfm_bulgaria.020.2: "格鲁吉亚亲王尼科洛兹·达迪亚尼有着优良的血统。"
 balkfm_bulgaria.020.3: "#yellow 鲁米利亚#!的前任帕夏亚历山大·博戈里迪非常理解我们。"
 balkfm_bulgaria.020.4: "丹麦王子格呂克斯堡的瓦尔德马最合适"
 balkfm_bulgaria.020.5: "普鲁士人科尔玛·冯·德·戈尔茨已经向[ROOT.GetCountry.GetPowerBloc.GetName]证明了他的价值。"
 balkfm_bulgaria.021.t: "索非亚的外国人"
 balkfm_bulgaria.021.d1: "对于[ROOT.GetCountry.GetRuler.GetFullName]来说，[ROOT.GetCountry.GetName]无疑是一个奇怪的选择。年轻的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在维也纳长大，被培养成为德国贵族，但他对自己即将统治的国家知之甚少。在他父亲的授意下，一帮家庭教师陪伴他学习[GetCulture('bulgarian').GetName]语言。"
 balkfm_bulgaria.021.d2: "对于[ROOT.GetCountry.GetRuler.GetFullName]来说，[ROOT.GetCountry.GetName]无疑是一个奇怪的选择。年轻的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在祖格迪迪长大，并被培养成$RUS_ADJ$沙皇的封臣，他对自己即将统治的国家知之甚少。在他的议会的要求下，一干导师陪伴他学习[GetCulture('bulgarian').GetName]语言。"
 balkfm_bulgaria.021.f: "“他用法语与母亲和外交官交谈；用德语与兄弟和仆人交谈；他用匈牙利语咒骂，用英语和意大利语吹牛。” ——D.甘切夫，亲王导师，1887年"
 balkfm_bulgaria.021.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]应当说人民的语言。"
 balkfm_bulgaria.021.b: "粗鄙之语配不上[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 balkfm_bulgaria.022.t: "国王合法化"
 balkfm_bulgaria.022.d: "当[ROOT.GetCountry.GetRuler.GetFirstName]坐上王位后，他发现自己的地位让他很苦恼，虽然他占据[ROOT.GetCountry.GetName]的王位，但却得不到其他君王承认，他发现自己需要依靠[SCOPE.sCharacter('stambolov_scope').GetFullName]来捍卫他作为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的地位。"
 balkfm_bulgaria.022.f: "“亲王最近完全投奔了斯坦博洛夫先生的怀抱。首相的执拗性格早已让亲王感到厌恶……如果他按照自己的独裁行事，他早就摆脱了‘造王者’。”——1887年奥地利外交公报"
 balkfm_bulgaria.022.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须巩固王位。"
 balkfm_bulgaria.023.t: "军事和解"
 balkfm_bulgaria.023.d: "自从他抵达[ROOT.GetCountry.GetName]以来，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]一直担心#yellow 巴腾堡家族#!可能会复辟。在斯利夫尼察山上的一次会议上，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]向反对前[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的领导人伸出了橄榄枝。$gbbf_armed_forces$为了寻求特赦，已放弃支持#yellow 巴腾堡家族#!，并宣誓效忠[ROOT.GetCountry.GetRuler.GetLastName]家族。"
 balkfm_bulgaria.023.f: "“我衷心感谢殿下的善意，我坚信，我所组建并带领取得胜利的军队将永远支持殿下为建立幸福繁荣的保加利亚的努力。”——亚历山大·巴腾堡，1887年致费迪南亲王\n"
 balkfm_bulgaria.023.a: "赦免他们，我们需要他们的力量。"
 balkfm_bulgaria.023.b: "我们不能相信这些叛徒。"
 balkfm_bulgaria.024.t: "军事不足"
 balkfm_bulgaria.024.d: "尽管已经独立，[ROOT.GetCountry.GetName]军队基本上还是原来的奥斯曼旧军。[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]提出了旨在实现保加利亚军队现代化的改革方案。"
 balkfm_bulgaria.024.f: "“不幸的是，我的武器和弹药严重不足。如果真的迫不得已，我们可以动员13万人，但其中大约有8万人连基本的武器都没有。此时此刻，谁能提供武器给我？我的胜利，创造一个稳定且和平的保加利亚，将是解决东方问题的关键……” —— 费迪南德大公，致鲁道夫皇储，1887年"
 balkfm_bulgaria.024.a: "我们应该投资军队。"
 balkfm_bulgaria.024.b: "军队要忍耐。"
 balkfm_bulgaria.025.t: "保加利亚军队"
 balkfm_bulgaria.025.d: "付出了巨大的努力后，[ROOT.GetCountry.GetAdjective]军队已经改革成为一支能够捍卫国家独立的强大力量。"
 balkfm_bulgaria.025.f: "这将是我们捍卫自由的利刃。"
 balkfm_bulgaria.025.a: "[ROOT.GetCountry.GetName]的意志不可违背！"
 balkfm_bulgaria.026.t: "帕尼察阴谋"
 balkfm_bulgaria.026.d: "[SCOPE.sCharacter('stambolov_scope').GetFullName]带来了不祥的消息：内务部门发现了陆军少校#yellow 科斯塔·帕尼查#!的阴谋。这个心怀不满的马其顿人领导者废黜[ROOT.GetCountry.GetRuler.GetFirstName]，复辟巴滕贝格王朝的阴谋。令朝野震惊的是，尽管先前我们已经尝试过做出补偿，但近半数的军人还是卷入了这场阴谋。"
 balkfm_bulgaria.026.f: "虽然帕尼察的支持者大多对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]持模棱两可的态度，但不少人趁机推动建立复仇主义政权，意图重新确立保加利亚在马其顿的霸权地位。"
 balkfm_bulgaria.026.a: "帕尼察将接受[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的审判。"
 balkfm_bulgaria.026.b: "把这些叛匪赶出保加利亚。"
 balkfm_bulgaria.027.t: "丧葬政治"
 balkfm_bulgaria.027.d: "科堡家族的族长，#yellow 埃内斯特二世#!公爵，不幸辞世。当众多亲属齐聚[SCOPE.sCountry('prussia_scope').GetName]参加悼念仪式时，一场外交争端随之而起：[ROOT.GetCountry.GetRuler.GetFirstName]出席时，究竟应身着礼服还是便装。"
 balkfm_bulgaria.027.f: "尽管[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]是由索布拉尼耶选举产生，但由于缺乏外交承认，国外局势因此紧张，外交官们都避免提及此事，以免影响巴尔干地区的平衡。对此，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]及其顾问决定，[ROOT.GetCountry.GetRuler.GetFirstName]应身着全套礼服，以此表明对[ROOT.GetCountry.GetName]的支持。"
 balkfm_bulgaria.027.a: "我们应该尊重这个请求。"
 balkfm_bulgaria.027.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将身着盛装出席。"
 balkfm_bulgaria.028.t: "保加利亚王室"
 balkfm_bulgaria.028.d: "今天早上，首都公民突然被101响礼炮的声音吵醒，礼炮宣布特尔诺沃[ROOT.GetCountry.GetHeir.GetFirstName]的诞生。王位继承人的及时到来让许多批评者不再质疑[ROOT.GetCountry.GetRuler.GetFirstName]的统治权。"
 balkfm_bulgaria.028.f: "“一个上帝，一个统治者，一个祖国”"
 balkfm_bulgaria.028.a: "[ROOT.GetCountry.GetRuler.GetLastName]家族的统治终于稳固了。"
 balkfm_bulgaria.029.t: "截肢"
 balkfm_bulgaria.029.d: "今天清晨的报纸头条大肆报道，[SCOPE.sCharacter('stambolov_scope').GetFullName]遭到一群马其顿极端分子的残忍袭击，原因是他在被解职后发布了一系列挑衅性的反马其顿文章。这场袭击非常凶狠，医生不得不截去了他的双手，而医生们表示，他恐怕撑不到这一周。"
 balkfm_bulgaria.029.f: "“难道不是我让你成为保加利亚亲王的吗？因此，我也承担了你错误的责任。” —— 斯特凡·斯坦博洛夫致费迪南德亲王，1894年"
 balkfm_bulgaria.029.a: "多么可怕的结果。"
 balkfm_bulgaria.030.t: "保加利亚学院"
 balkfm_bulgaria.030.d: "为了发展[ROOT.GetCountry.GetName]，[SCOPE.sCharacter('university_benefactor').GetFullName]国王提出了在[SCOPE.sState('university_state').GetCityHubName]开办一所本地高等学府的计划，这项计划将为国家带来一笔不小的开销。"
 balkfm_bulgaria.030.f: "在奥斯曼帝国的直接统治下，保加利亚人民与西方的创新隔绝了。建立真正的高等教育体系将扭转这种局面。"
 balkfm_bulgaria.030.a: "多么崇高的事业！"
 balkfm_bulgaria.030.b: "代价太大了……"
 balkfm_bulgaria.031.t: "皇家认可"
 balkfm_bulgaria.031.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的不懈努力最终使人认可其对[ROOT.GetCountry.GetName]的统治权，欧洲各地君主的祝贺和支持信函纷纷涌来。"
 balkfm_bulgaria.031.f: "“我所做的一切，都是出于我对亲爱的人民的责任……我为祖国所作的牺牲，实在是巨大无比……为了保加利亚的幸福与繁荣，我将自己的儿子奉献出去，断开了与家人的联系，也切断了我与西方的所有纽带。作为回报，我不求人民给予我热烈的掌声或虚伪的敬意，只希望他们能给予我真正的尊重与信任。” —— 费迪南德一世，致索布拉尼耶，1887年"
 balkfm_bulgaria.031.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]万岁！"
 balkfm_bulgaria.031.b: "这都要归功于[SCOPE.sCharacter('stambolov_scope').GetFullName]。"
 balkfm_bulgaria.031.c: "这是[ROOT.GetCountry.GetName]伟大的一天！"
 balkfm_bulgaria.032.t: "君士坦丁堡之春"
 balkfm_bulgaria.032.d: "为了庆祝自己加冕为[ROOT.GetCountry.GetName]真正的统治者，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]开始了对周边几个国家首都的巡访，符合一位主权君主的礼仪。经过在君士坦丁堡与苏丹[SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName]的热情接待和晚宴后，[ROOT.GetCountry.GetRuler.GetFirstName]获得了象征他作为奥斯曼帝国名誉臣民的荣誉勋章。尽管庆祝活动精彩纷呈，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]仍然深深陶醉于古老的“城市之王”君士坦丁堡所展现的魅力和历史遗产。"
 balkfm_bulgaria.032.f: "“……于是，当苏丹的官员站在门旁，愣愣地看着我时，我拿起拐杖，撩开了覆盖地板的一块垫子，露出了那块查士丁尼皇帝曾站立过的紫色石板。那时，皇帝穿着帝国紫色的鞋子站在上面。而我，我也，把自己的脚放上了那块石板！”——斐迪南一世，回忆1896年访问圣索菲亚大教堂时的情景"
 balkfm_bulgaria.032.a: "[ROOT.GetCountry.GetName]的意志不可违背！"
 balkfm_bulgaria.161.t: "$wedding.1.t$"
 balkfm_bulgaria.161.d: "$wedding.1.d$"
 balkfm_bulgaria.161.f: "$wedding.1.f$"
 balkfm_bulgaria.161.a: "$wedding.1.a$"
 balkfm_bulgaria.162.t: "教会敌意"
 balkfm_bulgaria.162.d: "最近，[ROOT.GetCountry.GetRuler.GetFirstName]在卡洛费尔附近的修道院逗留期间，被大主教[GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName]拦住，他提醒[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]他对$RUS_ADJ$沙皇的“职责”，并谴责他对[GetReligion('catholic').GetName]信仰承诺的违背。"
 balkfm_bulgaria.162.f: "虽然[GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName]已被逐出修道院，但有传言称大主教收受了$RUS_ADJ$外交部的“礼物”。"
 balkfm_bulgaria.162.a: "罢免这个骗子，剥夺他的头衔。"
 balkfm_bulgaria.162.b: "也许 [ROOT.GetCountry.GetRuler.GetFirstName]应该多了解一下[GetReligion('orthodox').GetName]的信仰。"
 balkfm_bulgaria.163.t: "正教继承人"
 balkfm_bulgaria.163.d: "[ROOT.GetCountry.GetName]是一个[GetReligion('orthodox').GetName]国家，但[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]却信奉[ROOT.GetCountry.GetRuler.GetReligion.GetName]信仰。领导人宣布只有[SCOPE.sCharacter('eocfm_heir_scope').GetFirstName]改信该信仰，他们才会承认他为继承人，这导致了严重的问题。尽管[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]努力争取国际社会对宗教的支持，但[GetReligion('catholic').GetName]势力对这一想法表示了强烈反对。"
 balkfm_bulgaria.163.f: "“如果你让儿子改信，你就会受到逐出教会！”——教皇利奥十三世1896年对费迪南王子说"
 balkfm_bulgaria.163.a: "整个王室将皈依东正教会。"
 balkfm_bulgaria.163.b: "继承人[SCOPE.sCharacter('eocfm_heir_scope').GetFirstName]应受洗为[GetReligion('orthodox').GetName]。"
 balkfm_bulgaria.163.c: "这是无稽之谈，[ROOT.GetCountry.GetRuler.GetLastName]家族是一个[GetReligion('catholic').GetName]家庭！"
 balkfm_bulgaria.200.t: "尼什之乱"
 balkfm_bulgaria.200.d: "[SCOPE.sState('southern_serbia_state_scope').GetName]的一群[GetCulture('bulgarian').GetName]民族主义者最近发动一场针对[SCOPE.sCountry('ottoman_scope').GetName]的叛乱。虽然他们很快被当地驻军逮捕，但以法纳尔家族为主的神职人员却声称对这些土地拥有主权，以此作为合法化其统治权的手段。"
 balkfm_bulgaria.200.f: "保加利亚民族主义者声称，他们没有遵守《花厅御诏》赋予他们的保护，并试图在#yellow 尼什省#!发动一场塞尔维亚式的叛乱！"
 balkfm_bulgaria.200.a: "保加利亚应该宣称对此次袭击负责。"
 balkfm_bulgaria.200.b: "让希腊人承担后果。"
 balkfm_bulgaria.201.t: "《保加利亚之鹰》"
 balkfm_bulgaria.201.d: "为声援海外保加利亚事业，民族复兴运动者伊万·博戈罗夫在君士坦丁堡开始发行亲保加利亚的报纸《保加利亚之鹰》。该报以奥斯曼帝国“众城之女王”（君士坦丁堡）的精英阶层为目标读者，旨在通过以同情笔触描绘保加利亚民众日常抗争的方式，使保加利亚民族主义在奥斯曼知识分子中合法化。"
 balkfm_bulgaria.201.f: "保加利亚人成为米勒特分支的想法对于#bold 高门#!来说并不稀奇，但高级官员表示担心，省政府的直接支持或承认可能会进一步破坏帝国的稳定。"
 balkfm_bulgaria.201.a: "这是一个崇高的事业。"
 balkfm_bulgaria.201.b: "压制公众对这篇文章的了解。"
 balkfm_bulgaria.206.t: "保加利亚军团"
 balkfm_bulgaria.206.d: ""
 balkfm_bulgaria.206.f: ""
 balkfm_bulgaria.206.a: "我们应该支持他们的努力"
 balkfm_bulgaria.206.b: "谴责这些激进分子。"
 balkfm_bulgaria.207.t: "罢工再次来袭！"
 balkfm_bulgaria.207.d: ""
 balkfm_bulgaria.207.f: ""
 balkfm_bulgaria.207.a: "这是人民的意志。"
 balkfm_bulgaria.207.b: "这太疯狂了。逮捕他们！"
 balkfm_bulgaria.208.t: "列强支持保加利亚"
 balkfm_bulgaria.208.d: "经过多年不懈的外交努力，各列强已公开宣布支持保加利亚人民扩大自治。"
 balkfm_bulgaria.208.f: "尽管他们的支持并不保证自治将以何种形式出现，但这对保加利亚事业来说仍然是一个巨大的进步。"
 balkfm_bulgaria.208.a: "[SCOPE.sCountry('russia_scope').GetName]将带领我们走向自由。"
 balkfm_bulgaria.208.b: "[SCOPE.sCountry('austria_scope').GetAdjective]将捍卫我们的自由。"
 balkfm_bulgaria.208.tt1: "我们将授权建立#bold 保加利亚#!"
 balkfm_bulgaria.208.tt2: "#bold 俄罗斯#!将会倾向于支持我们。"
 balkfm_bulgaria.208.tt3: "#bold 奥地利#!将倾向于支持我们。"
 balkfm_bulgaria.209.t: "保卫我们的主权"
 balkfm_bulgaria.209.d: "随着[ROOT.GetCountry.GetName]重生的欢庆与喜悦逐渐消退，人们的讨论转向了新[ROOT.GetCountry.GetAdjectiveNoFlag]的整体结构问题。列强对完全自治的想法犹豫不决，并就建立一个类似塞尔维亚和罗马尼亚公国达成了共识。许多候选人已被提名，其中一位日耳曼贵族，#yellow 亚历山大·约瑟夫·冯·巴腾堡#!获得了最广泛的支持。"
 balkfm_bulgaria.209.f: "公众舆论倾向于本土候选人，但外国领事警告说，如果我们推举一位不受欢迎的候选人，将会影响外国支持。"
 balkfm_bulgaria.209.1: "年轻的贵族#yellow 亚历山大·巴腾堡#!获得了最广泛的支持。"
 balkfm_bulgaria.209.1.tt: "这是史实选项。"
 balkfm_bulgaria.209.2: "外交官#yellow 伊曼纽尔·博戈里迪#!无愧于这个头衔。"
 balkfm_bulgaria.209.3: "复兴主义者#yellow 亚历山大大主教#!将是一位值得尊敬的人。"
 balkfm_bulgaria.210.t: "沙皇国之梦"
 balkfm_bulgaria.210.d: "[ROOT.GetCountry.GetName]或许已经浴火重生，但它只不过是其最大潜力的影子罢了。在西方和南方，我们的同胞仍旧生活于奥斯曼统治之下。不管是大公还是议会领袖对要求应当向保加利亚做出更多让步。"
 balkfm_bulgaria.210.f: "历史注释：1848年的《圣斯特凡诺条约》最初为新生的保加利亚国家提供了极大的益处。几个月后，新征服领土中的绝大部分都在倾向于承认塞尔维亚，黑山和罗马尼亚的《柏林条约》中被肢解。这使得保加利亚只剩下巴尔干山脉以北的土地，剩余的东鲁米利亚地区都处于奥斯曼帝国宗主的统治之下。"
 balkfm_bulgaria.210.a: "我们不能抛弃同胞。"
 balkfm_bulgaria.211.t: "《托普哈内议定书》"
 balkfm_bulgaria.211.d: "今天早上[SCOPE.sState('bulgaria_capital_scope').GetCityHubName]全城欢呼声此起彼伏，据悉称鲁米利亚傀儡政府已被推翻，[ROOT.GetCountry.GetName]和[SCOPE.sCountry('rumelia_scope').GetName]之间建立了联盟。尽管我们仍然处于奥斯曼帝国宗主的统治之下，但这是我们光复保加利亚的第一步。"
 balkfm_bulgaria.211.f: "“兄弟们！统一之时已至。压迫鲁米利亚六年的外国政府被推翻了。取而代之的是，鲁米利亚宣布与 [ROOT.GetCountry.GetNameNoFlag]公国统一，接受保加利亚大公[ROOT.GetCountry.GetRuler.GetFullName]的统治！”——少校D·尼古拉耶夫，1885年"
 balkfm_bulgaria.211.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"
 balkfm_bulgaria.212.t: "独立的保加利亚"
 balkfm_bulgaria.212.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]在圣四十人教堂发表了一份激动人心的宣言，同时宣布了[ROOT.GetCountry.GetName]的独立和吞并东鲁米利亚，在巴尔干世界掀起了轩然大波。自《柏林条约》之后，奥斯曼帝国的宗主权不过是虚无缥缈的幻觉罢了。保加利亚用自己的法律和习俗进行统治，而随着这份宣言，将我们和[SCOPE.sCountry('ottoman_scope').GetName]绑定的法律建构也被抛诸脑后。"
 balkfm_bulgaria.212.f: "“西方已对我发出诅咒，而东方的曙光将照耀我的王朝，照亮我们的未来！”——斐迪南一世致保加利亚国民议会，1887年。"
 balkfm_bulgaria.212.a: "[ROOT.GetCountry.GetName]将会凯旋！"
 balkfm_bulgaria.213.t: "保加利亚民族统一主义"
 balkfm_bulgaria.213.d: "与东鲁米利亚奇迹般地的统一使《圣斯特法诺条约》最初的目标再度摆上台面。随着民族主义狂热席卷[ROOT.GetCountry.GetName]，最狂热的支持者们坚持所有的保加利亚人都应生活于我们的国旗之下。"
 balkfm_bulgaria.213.f: "自从抵达巴尔干半岛以来，保加利亚人的社区已经从多瑙河畔扩展到爱琴海沿岸。保加利亚民族的分裂不过是法律的虚构，我们将予以纠正！"
 balkfm_bulgaria.213.a: "属于保加利亚人的土地！"
 balkfm_bulgaria.213.b: "我们不能触怒列强。"
 balkfm_bulgaria.214.t: "保加利亚沙皇国"
 balkfm_bulgaria.214.d: "大保加利亚的领土掌控于吾手，[ROOT.GetCountry.GetName]已经光复了曾经保加利亚帝国的领土。"
 balkfm_bulgaria.214.f: "从681年到1018年以及1185年到1396年，保加利亚帝国雄踞巴尔干半岛北部，甚至多次迫使拜占庭皇帝进贡和让步。"
 balkfm_bulgaria.214.a: "保加利亚将统治巴尔干。"
 balkfm_bulgaria.214.b: "我们应该为已经取得的成就而自豪。"
 balkfm_bulgaria.215.t: "[ROOT.GetCountry.GetName]的未来"
 balkfm_bulgaria.215.d: "我们最近的政府已经巩固了我们对巴尔干半岛的统治地位。我们的人民正期待着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决定保加利亚的未来。"
 balkfm_bulgaria.215.f: "我们从希腊、$RUS_ADJ$和奥斯曼的压迫者手中赢得了独立。现在我们必须决定自己在巴尔干共同体中的立场。。"
 balkfm_bulgaria.215.a: "[ROOT.GetCountry.GetName]将领导巴尔干！"
 balkfm_bulgaria.215.b: "我们的国家将属于全体南斯拉夫人！"
 balkfm_bulgaria.215.c: "我们将夺回皇位！"
 balkfm_bulgaria.215.tt: "这将启用#bold 国家草案#!日志条目。"
 balkfm_bulgaria.215.e: "我们应该为已经取得的成就而自豪。"
 balkfm_bulgaria.216.t: "保加利亚帝国"
 balkfm_bulgaria.216.d: "人群在[ROOT.GetCountry.GetCapital.GetCityHubName]中心地带聚集起来，聆听[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]宣告保加利亚在巴尔干半岛的绝对统治地位。"
 balkfm_bulgaria.216.f: "反抗那些在我们的祖国仍旧将我们视为二等公民的列强后，我们已经夺取了属于我们的自由和未来。"
 balkfm_bulgaria.216.a: "这是[ROOT.GetCountry.GetName]光荣的一天！"
 balkfm_bulgaria.217.t: "南斯拉夫"
 balkfm_bulgaria.217.d: "巴尔干半岛的斯拉夫人摆脱了奥斯曼帝国和奥地利帝国的束缚，统一为一个国家。"
 balkfm_bulgaria.217.f: "自由。不仅仅是摆脱枷锁，而是真正的自由。不再被困在铁锤和铁砧之间，猎犬和猎人之间，是时候建立一个新的联盟了。万众瞩目的斯拉夫人之间的新协议问世了。"
 balkfm_bulgaria.217.a: "南斯拉夫之梦已然成真！"
 balkfm_bulgaria.218.t: "万城之女王"
 balkfm_bulgaria.218.d: "随着博斯普鲁斯海峡和达达尼尔海峡两岸的土地被征服，重建拜占庭帝国的目标已经实现。现在，我们的公民期待着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]带领他们进入一个新时代。"
 balkfm_bulgaria.218.f: "“当你去君士坦丁堡的时候，记得想起我。”斐迪南一世，致$GBR_ADJ$将军伊恩·汉密尔顿爵士"
 balkfm_bulgaria.218.a: "我们的军队将再次举起帝国的旗帜！"
 balkfm_bulgaria.220.t: "大草原的记忆"
 balkfm_bulgaria.220.d: "在拜占庭时代，[GetCulture('bulgarian').GetName]民族的最早记载是所谓的“旧大保加利亚”，他们的土地紧邻亚速海附近的德涅斯特河和伏尔加河河畔。随着[ROOT.GetCountry.GetName]的复兴，民族主义者认为保加利亚人是时候收复先祖的土地了。"
 balkfm_bulgaria.220.f: "虽然“保加利亚”这个名字的起源已无从考证，但古人明确指出，他们首先推翻了阿瓦尔人，然后才迁移到巴尔干半岛。"
 balkfm_bulgaria.220.a: "我们将收复我们的根源。"
 balkfm_bulgaria.220.b: "这将是徒劳的努力。"
 balkfm_bulgaria.221.t: "古大保加利亚"
 balkfm_bulgaria.221.d: "我们成功从$RUS_ADJ$手中收回了保加利亚人的古老家园。尽管今天我们说着一种斯拉夫语言，但我们无法否认自己的古老根源。"
 balkfm_bulgaria.221.f: "“当有人寻求真理时，上帝自会看到；当有人撒谎时，上帝也会知晓。保加利亚人对基督徒（拜占庭人）做了很多好事，但基督徒忘记了他们，而上帝看到了。”——保加利亚国王普列西安一世（815年至852年）"
 balkfm_bulgaria.221.a: "[GetCulture('bulgarian').GetName]人的意志不可违背！"
 balkfm_bulgaria.227.t: "统一的保加利亚"
 balkfm_bulgaria.227.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]在圣四十人教堂发表了一份激动人心的宣言，宣布建立[ROOT.GetCountry.GetName]沙皇国并吞并东鲁米利亚，这在巴尔干世界引起了震动。"
 balkfm_bulgaria.227.f: "“西方已对我发出诅咒，而东方的曙光将照耀我的王朝，照亮我们的未来！”——斐迪南一世致保加利亚国民议会，1887年。"
 balkfm_bulgaria.227.a: "[ROOT.GetCountry.GetName]将会凯旋！"
 balkfm_bulgaria.228.t: "保加利亚国"
 balkfm_bulgaria.228.d: "随着[SCOPE.sCountry('bulgaria_scope').GetName]的重建，保加利亚人终于可以梦想一个属于自己的未来。这个年轻的国家需要强有力的领导，才能防范奥斯曼的报复。"
 balkfm_bulgaria.228.f: "“您非常有必要会见......这些边境地区的领袖，去讨论一个有利于所有保加利亚人的问题，柏林会议又一次把他们置于土耳其的专制统治之下了。”——奥赫里德的纳撒尼尔于1878年写给佩特科·基尔科夫·卡洛亚诺夫·佩特科·科里科夫"
 balkfm_bulgaria.228.a: "是时候把注意力放回[ROOT.GetCountry.GetName]"
 balkfm_bulgaria.228.b: "我想知道他们会有怎么样的故事……"
 balkfm_bulgaria.229.t: "金狮觉醒"
 balkfm_bulgaria.229.d: "近百年来，[SCOPE.sCountry('ottoman_scope').GetName]的势微力衰，与民族觉醒运动的蓬勃发展交相呼应，终于促成了[ROOT.GetCountry.GetName]的重新崛起。在[SCOPE.sCountry('russia_scope').GetName][SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]的大力支持下，一位信奉天主教的奥地利亲王被推选为[ROOT.GetCountry.GetName]这个新生国家的君主。"
 balkfm_bulgaria.229.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]年轻缺乏经验，而且国家处于岌岌可危的境地。[ROOT.GetCountry.GetName]尚未完全摆脱高门的枷锁，国家以农业为主、贫穷落后，在很大程度上依赖[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]的外交支持。然而，人民对于摆脱压迫、获得自由的未来，以及与仍生活在奥斯曼领土上的保加利亚同胞实现统一满怀希望。"
 balkfm_bulgaria.229.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 balkfm_bulgaria.300.t: "保加利亚二分"
 balkfm_bulgaria.300.d: "[ROOT.GetCountry.GetName]只是在技术上存在：一种旨在[GetCulture('bulgarian').GetName]人民一分为二的法律建构。它的存在是对西方未能支持保加利亚争取自决的斗争的赤裸裸的讽刺。然而，寻求保加利亚统一的梦想却比以往任何时候都更加强烈。我们剩下能做的就是与[SCOPE.sCountry('bulgaria_scope').GetName]一统，无论苏丹意愿如何。"
 balkfm_bulgaria.300.f: "“我们将在巴尔干半岛南方再次建立摇摇欲坠的土耳其统治，但这不过是暂时的喘息罢了。它们当中已经不再蕴含活力。”——索尔兹伯里勋爵，1878年。"
 balkfm_bulgaria.300.a: "[ROOT.GetCountry.GetName]将会走向统一之路。"
 balkfm_bulgaria.301.t: "总督任命"
 balkfm_bulgaria.301.d: "我们现任的总督任期已结束。根据《柏林条约》的规定，苏丹任命了一位至少能最大程度上使[ROOT.GetCountry.GetName]和国际社会接受的新总督。"
 balkfm_bulgaria.301.f: "由于我们的治理与苏丹紧密相连，我们很可能要直接向奥斯曼帝国朝廷负责。"
 balkfm_bulgaria.301.a: "随它去吧。"
 balkfm_bulgaria.307.t: "保加利亚人在鲁梅利亚的起义！"
 balkfm_bulgaria.307.d: "[SCOPE.sState('northern_thrace_state_scope').GetName]中的[GetCulture('bulgarian').GetName]起义者在整个地区引发骚乱。虽然他们未能夺取控制权，但全省保加利亚人都要求自治并与[SCOPE.sCountry('bulgaria_scope').GetName]结盟。"
 balkfm_bulgaria.307.f: "“一条路通往普罗夫迪夫，然后祈祷上帝吧，而另一条路则通往多瑙河和达姆施塔特。”—— 斯特凡·斯坦博洛夫1885年给巴腾堡亲王的建议"
 balkfm_bulgaria.307.a: "这是一次对国际秩序的挑战。"
 balkfm_bulgaria.307.b: "我们绝不会抛弃同胞！"
 balkfm_bulgaria.308.t: "东鲁米利亚叛乱！"
 balkfm_bulgaria.308.d: "在[SCOPE.sCountry('bulgaria_scope').GetName]的直接援助下，分裂分子占领了[SCOPE.sCountry('rumelia_scope').GetCapital.GetCityHubName]政府，并宣布成立[SCOPE.sCountry('rumelia_scope').GetName]公国。他们毫不迟疑地宣布从[SCOPE.sCountry('ottoman_scope').GetAdjective]中独立，并寻求与保加利亚联合。"
 balkfm_bulgaria.308.f: "叛军情绪激昂，宣布要册封[SCOPE.sCountry('bulgaria_scope').GetRuler.GetFullName]为“南北保加利亚亲王”"
 balkfm_bulgaria.308.a: "我们必须支持我们的同胞！"
 balkfm_bulgaria.308.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]将粉碎这些忘恩负义的反贼！"
 balkfm_bulgaria.308.c: "我们无力升级这场冲突。"
 balkfm_bulgaria.309.t: "联合保加利亚"
 balkfm_bulgaria.309.d: "今天早上，[Root.GetCountry.GetCapital.GetCityHubName]全城欢呼声此起彼伏，据悉称鲁米利亚傀儡政府已被推翻，[ROOT.GetCountry.GetName]和[SCOPE.sCountry('bulgaria_scope').GetName]之间建立了联盟。尽管我们仍然处于奥斯曼帝国宗主的统治之下，但这是我们光复保加利亚的第一步。"
 balkfm_bulgaria.309.f: "“兄弟们！统一之时已至。压迫鲁米利亚六年的外国政府被推翻了。取而代之的是，鲁米利亚宣布与 [ROOT.GetCountry.GetNameNoFlag]公国统一，接受保加利亚大公[ROOT.GetCountry.GetRuler.GetFullName]的统治！”——少校D·尼古拉耶夫，1885年"
 balkfm_bulgaria.309.a: "这是[GetCulture('bulgarian').GetName]人伟大的一天！"
 balkfm_bulgaria.161.b: "$wedding.1.b$"