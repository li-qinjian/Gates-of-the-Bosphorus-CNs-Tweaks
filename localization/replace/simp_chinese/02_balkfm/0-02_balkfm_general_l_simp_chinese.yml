 balkfm_purchase_rail_desc: "根据条约义务，我们有责任购买$GBR_ADJ$所有的鲁塞-瓦尔纳铁路。然而政府内部的亲俄派仍坚称这是资源浪费，认为最应优先满足$RUS_ADJ$对铁路通行权的要求。"
 balkfm_annex_rumelia: "巩固与鲁米利亚的联盟"
 balkfm_annex_rumelia_desc: "保加利亚还未统一，民族觉醒运动的领导人继续煽动保加利亚和东鲁梅利亚联合的倡议。"
 balkfm_declare_tsardom_desc: "保加利亚已经完整！亲王必须摆脱奥斯曼帝国的控制，夺回保加利亚的荣光。"
 balkfm_declare_tsardom_alternate: "宣布沙皇国成立"
 balkfm_declare_tsardom_alternate_desc: "保加利亚已经完整！亲王必须摆脱奥斯曼帝国的控制，夺回保加利亚的荣光。"
 balkfm_bulgarian_union_desc: "保加利亚还未统一，民族觉醒运动的领导人继续煽动保加利亚和东鲁梅利亚联合的倡议。"
 balkfm_revivalist_support_desc: "无论我们为保加利亚的复兴争取到多少民众支持，除非我们能得到友好的[concept_great_power]支持，否则任何获得苏丹承认的机会都是没有意义的。"
 balkfm_become_bulgaria: "宣布保加利亚国成立"
 balkfm_become_bulgaria_desc: "现在是时候让我们的努力结出硕果，宣布#bold 保加利亚#!复兴了"
 balkfm_agitate_rumelia_desc: "保加利亚国家的复兴使我们与保加利亚南部的同胞分离。分离主义者表示，如果我们提供支持，他们打算推翻奥斯曼帝国的统治。"
 balkfm_uplift_rumelia: "激发鲁米利亚起义"
 balkfm_uplift_rumelia_desc: "南北保加利亚的统一是不可避免的。#yellow 北色雷斯#!的分离主义分子报告说，他们已准备好从奥斯曼帝国争取自治，现在只等我们发出信号了。"
 balkfm_mol_intervention: "请求$RUS_ADJ$干预"
 balkfm_mol_intervention_desc: "对亲王的支持度正在断崖式下降。支持#italic 《组织条例》#!的人要求我们向$RUS_ADJ$领事提出紧急请求，以便在为时已晚之前进行直接干预。"
 balkfm_wal_intervention: "请求$RUS_ADJ$干预"
 balkfm_wal_intervention_desc: "对亲王的支持度正在断崖式下降。支持#italic 《组织条例》#!的人要求我们向$RUS_ADJ$领事提出紧急请求，以便在为时已晚之前进行直接干预。"
 balkfm_support_junimism: "支持朱尼姆派"
 balkfm_support_junimism_desc: "#yellow 蒂图·麦奥雷斯库#!的拥护者们认为，国家正在肆无忌惮的大刀阔斧改革，试图实施自由主义改革，完全不顾罗马尼亚人民的传统和文化。"
 balkfm_support_dacianism: "支持达契亚主义"
 balkfm_support_dacianism_desc: "达契亚派的理论来自于文学家#yellow 博格丹·哈斯杜#!，该派阐述了自罗马时代以来达契亚人的历史影响，包括真实与想象中的影响，认为罗马尼亚人民一直走在进步的前列。"
 balkfm_unite_principalities: "统一罗马尼亚诸公国"
 balkfm_unite_principalities_desc: "罗马尼亚要实现同一个祖国，需要先有同一位领袖。在确保统一的领导体制后，即使诸国在纸面上仍是分离的，也会对统一大业大有裨益。"
 balkfm_all_for_one: "巩固罗马尼亚国"
 balkfm_all_for_one_desc: "团结就是力量。我们必须维护好当前临时的联合状态，以在此基础上建立统一的大罗马尼亚国家。"
 balkfm_bessarabian_retrocession: "收复南比萨拉比亚"
 balkfm_bessarabian_retrocession_desc: "摩尔达维亚曾控制着一段海岸线。收复这片昔日领土，就能将我国联入黑海海上贸易线，对我们大有裨益。"
 balkfm_marea_unire: "大联合"
 balkfm_marea_unire_desc: "全体罗马尼亚人的大联合，不仅仅是多瑙河诸公国的联合，还应是所有罗马尼亚人居住的土地的联合——这就要包括特兰西瓦尼亚。"
 balkfm_annex_transylvania: "吞并特兰西瓦尼亚"
 balkfm_annex_transylvania_desc: "我们与特兰西瓦尼亚的联盟只是罗马尼亚统一的第一步。直到特兰西瓦尼亚成为[ROOT.GetCountry.GetName]不可分割的一部分，我们的使命才算完成。"
 balkfm_proclaim_triune_desc: "我们已经统一了克罗地亚、斯拉沃尼亚和达尔马提亚，剩下的工作就是宣布将这些土地合并为一个独立的国家。"
