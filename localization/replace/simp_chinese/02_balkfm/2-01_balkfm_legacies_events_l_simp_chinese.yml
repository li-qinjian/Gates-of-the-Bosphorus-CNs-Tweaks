l_simp_chinese:
 balkfm_legacies.001.t: "税制改革告成"
 balkfm_legacies.001.d: "在不懈的努力下，[ROOT.GetCountry.GetNameNoFlag]终于废除了从奥斯曼人那里继承来的旧税制。"
 balkfm_legacies.001.f: "几个世纪以来，[ROOT.GetCountry.GetNameNoFormatting]的[GetPopType('peasants').GetName]长期在掠夺性的体制下艰难苟活，而这些体制的存在仅仅是为了迎合远方统治者的利益。随着我们税法的改革，一个沉重的包袱总算从[ROOT.GetCountry.GetAdjectiveNoFormatting]人民的肩上卸了下来。"
 balkfm_legacies.001.a: "这才公平。"
 balkfm_legacies.002.t: "土地大改革"
 balkfm_legacies.002.d: "对农业生产方式和土地所有权的全面重组，彻底打破了自拜占庭时代以来就在[ROOT.GetCountry.GetName]根深蒂固的陈旧体制。当农民们开始意识到自己不仅仅是低微的劳工时，[ROOT.GetCountry.GetAdjectiveNoFormatting]国家的灵魂就仿佛从浑浑噩噩中苏醒，做好了迎接未来的准备。"
 balkfm_legacies.002.f: "虽然看到最终成果尚需时日，但农民们已经开始体会到直接拥有土地和作物的益处。"
 balkfm_legacies.002.a: "这将奠定我们的未来。"
 balkfm_legacies.003.t: "清廉新政"
 balkfm_legacies.003.d: "废除大量政府官僚机构中的世袭职位，推动政府摆脱了奥斯曼帝国遗留下来的中世纪残余。"
 balkfm_legacies.003.f: "缙绅阶层也许会含糊其辞、满腹牢骚，但[ROOT.GetCountry.GetNameNoFormatting]唯一的出路就是抛弃君主专制主义的枷锁。"
 balkfm_legacies.003.a: "一切为了国家利益。"
 balkfm_legacies.004.t: "匪患平息"
 balkfm_legacies.004.d: "国家坚定而果断的治理让肆虐乡野的土匪放下了武器，他们重新寻找正当生计，成为了社会上有价值的生产人员。"
 balkfm_legacies.004.f: "虽然这只是基本而平凡的琐事，但确保国内同胞的生命财产安全是确立国家统治合法性的关键一步。"
 balkfm_legacies.004.a: "干得漂亮。"
 balkfm_legacies.005.t: "国家基石初奠"
 balkfm_legacies.005.d: "国民议会推进的各项改革已经开始发挥效力，正逐步将[ROOT.GetCountry.GetName]从土耳其统治后的落后泥潭，转变为一个有能力与西方列强交往的现代国家。"
 balkfm_legacies.005.f: "通过同时推进司法与行政机构的改革，议会为国家的政治体制发展搭建了坚实的框架。"
 balkfm_legacies.005.a: "我们应当为此感到自豪。"
 balkfm_legacies.006.t: "现代化的经济"
 balkfm_legacies.006.d: "[ROOT.GetCountry.GetName]积极推动经济变革，已经启动了将[ROOT.GetCountry.GetAdjectiveNoFormatting]转型为工业化国家的进程。"
 balkfm_legacies.006.f: "尽管与西方相比仍然显得落后，但这些变革预示着[ROOT.GetCountry.GetNameNoFormatting]封建统治的终结。"
 balkfm_legacies.006.a: "我们的未来一片光明。"
 balkfm_legacies.007.t: "社会平等"
 balkfm_legacies.007.d: "[ROOT.GetCountry.GetName]已经通过了多项法案，赋予[ROOT.GetCountry.GetAdjectiveNoFormatting]公民土地所有权以及个人人身不可侵犯的权利。"
 balkfm_legacies.007.f: "想要摆脱对各大帝国的奴役，第一步就必须确保[ROOT.GetCountry.GetAdjectiveNoFormatting]人民自己不再遭受奴隶制度的禁锢。"
 balkfm_legacies.007.a: "这才公平。"
 balkfm_legacies.009.t: "奥斯曼统治的遗祸"
 balkfm_legacies.009.d: "[ROOT.GetCountry.GetName]虽已脱离位于[SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName]的[SCOPE.sCountry('ottoman_scope').GetAdjective]政府而独立，但这新生国家依然深受奥斯曼高门数十年粗暴忽略所带来的恶果折磨。整个国家满是乡村、落后且缺乏教育，无论在工业还是政治上都充斥着大量中世纪式的陈腐陈规。"
 balkfm_legacies.009.f: "我们的国家或许赢得了自由，但如果我们无法在经济上彻底脱离高门的掌控而独立，那么一切都将徒劳无功。"
 balkfm_legacies.009.a: "必须做些什么。"
 balkfm_legacies.009.tt: "完成#bold 奥斯曼统治的遗祸#!日志条目将会移除这些负面效果。"
 balkfm_legacies.010.t: "匪患复起"
 balkfm_legacies.010.d: "土匪洗劫了[SCOPE.sState('brigandage_state').GetName]的乡村，要求国家出兵治理的呼声再度高涨。"
 balkfm_legacies.010.f: "一些心怀不满的非正规武装分子利用脆弱的国家控制力和警界内部的腐败，对劳工和绅士阶层进行大肆洗劫。这些土匪来去如风，地方头领发现数座村庄已被洗劫并烧毁。"
 balkfm_legacies.010.a: "丧尽天良的懦夫。"