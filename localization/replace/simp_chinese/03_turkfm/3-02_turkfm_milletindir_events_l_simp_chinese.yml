l_simp_chinese:
 turkfm_milletindir.001.t: "“土耳其”国家"
 turkfm_milletindir.001.d: "奥斯曼帝国已不复存在，在其核心地带，一个[ROOT.GetCountry.GetAdjective]省份应运而生。随着这个新生国家试图站稳脚跟，许多人不禁发问：“什么是土耳其人？”"
 turkfm_milletindir.001.f: "“在今日土耳其民族的政治和社会统一体中，有一些公民和同胞被煽动，自以为是库尔德人、切尔克斯人、拉兹人或波斯尼亚人。但这些错误的称谓都是过去专制时期的产物，除了给民族个体成员带来悲伤之外，一无所获，只有少数几个没有头脑的反动分子成了敌人的工具。”——穆斯塔法·凯末尔·阿塔图尔克，1930年"
 turkfm_milletindir.001.a: "我们将夺取属于我们的未来。"
 turkfm_milletindir.001.tt: "民族主义思想家为土耳其国家的建立提出了以下几种模式：\n•$turkfm_kemalism$\n•$turkfm_turanism$\n•$turkfm_anatolianism$"
 turkfm_milletindir.002.t: "国家认同"
 turkfm_milletindir.002.d: ""
 turkfm_milletindir.002.f: ""
 turkfm_milletindir.002.a: "国家将成为秩序的支柱！"
 turkfm_milletindir.002.b: "国家将成为进步的灯塔！"
 turkfm_milletindir.010.t: "收复安纳托利亚"
 turkfm_milletindir.010.d: "$dyn_c_ottoman_empire$已经覆灭，取而代之的是[ROOT.GetCountry.GetAdjective]。无数同胞如今成为外国政府的附属国，一个比一个压迫。现在，[ROOT.GetCountry.GetNameNoFormatting]必须肩负起统一四分五裂的[GetCulture('turkish').GetName]疆域的重任。"
 turkfm_milletindir.010.f: "“我不是命令你们去战斗，而是命令你们去牺牲。在我们走向死亡的这段时间里，其他部队和将领可以挺身而出，接替我们的位置”——穆斯塔法·凯末尔·阿塔图尔克，加里波利战役，1915年4月25日"
 turkfm_milletindir.010.a: "我们将收复[GetGeographicRegion('geographic_region_anatolia').GetName]。"
 turkfm_milletindir.010.b: "帝国已死，我们将开辟一条新路！"
 turkfm_milletindir.011.t: "安纳托利亚克复"
 turkfm_milletindir.011.d: "从[ROOT.GetCountry.GetCapital.GetCityHubName]出发，[ROOT.GetCountry.GetName]的军队已经恢复了[GetCulture('turkish').GetName]对[GetGeographicRegion('geographic_region_anatolia').GetName]的控制。"
 turkfm_milletindir.011.f: ""
 turkfm_milletindir.011.a: "从灰烬中，我们涅槃重生。"
 turkfm_milletindir.011.b: "让我们迎来新的繁荣。"
 turkfm_milletindir.012.t: "破灭的野心"
 turkfm_milletindir.012.d: "尽管有过大胆的努力和激昂的演讲，但我们的领土收复计划显然已不可行。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]已为这一羞辱性的失败承担了责任。"
 turkfm_milletindir.012.f: ""
 turkfm_milletindir.012.a: "[ROOT.GetCountry.GetName]的未来将会如何？"
 turkfm_milletindir.013.t: "灰狼咆哮"
 turkfm_milletindir.013.d: "尽管帝国已经崩溃，[ROOT.GetCountry.GetName]却比以往任何时候都更强大。政界和知识界都强烈要求[GetCulture('turkish').GetName]收回那些被不公正剥夺的土地。"
 turkfm_milletindir.013.f: ""
 turkfm_milletindir.013.a: "我们将再次提升帝国的旗帜！"
 turkfm_milletindir.013.b: "帝国已死，我们将开辟一条新路！"
 turkfm_milletindir.014.t: "土耳其帝国"
 turkfm_milletindir.014.d: "凭借鲜血与汗水，帝国已然复兴。从多瑙河到尼罗河，无人敢质疑我们的统治。"
 turkfm_milletindir.014.f: ""
 turkfm_milletindir.014.a: "光荣属于[GetCulture('turkish').GetName]人！"
 turkfm_milletindir.014.b: "光荣属于[ROOT.GetCountry.GetName]！"
 turkfm_milletindir.015.t: "破灭的野心"
 turkfm_milletindir.015.d: "尽管有过大胆的努力和激昂的演讲，但我们的领土收复计划显然已不可行。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]已为这一羞辱性的失败承担了责任。"
 turkfm_milletindir.015.f: ""
 turkfm_milletindir.015.a: "[ROOT.GetCountry.GetName]的未来将会如何？"
 turkfm_milletindir.016.t: "图兰主义计划"
 turkfm_milletindir.016.d: ""
 turkfm_milletindir.016.f: "“横跨北欧与亚洲，从波罗的海到太平洋，从地中海到北冰洋，绵延着一片广袤的民族带……他们通常被统称为图兰人……尽管在文化、传统乃至外貌上各不相同……”——齐亚·格卡尔普，1917年”"
 turkfm_milletindir.016.a: ""
 turkfm_milletindir.016.b: ""
 turkfm_milletindir.017.t: "大图兰一统"
 turkfm_milletindir.017.d: ""
 turkfm_milletindir.017.f: "“对土耳其人而言，祖国既非土耳其，也非突厥斯坦；祖国是一片广阔的土地——图兰！”——齐亚·格卡尔普，1911年"
 turkfm_milletindir.017.a: "我们的帝国将永世长存！"
 turkfm_milletindir.018.t: "图兰主义梦碎"
 turkfm_milletindir.018.d: "尽管有过大胆的努力和激昂的演讲，但我们的领土收复计划显然已不可行。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetLastName]已为这一羞辱性的失败承担了责任。"
 turkfm_milletindir.018.f: ""
 turkfm_milletindir.018.a: "[ROOT.GetCountry.GetName]的未来将会如何？"
 turkfm_milletindir.100.t: "崩溃的替罪羊"
 turkfm_milletindir.100.d: "帝国的分裂在我们的[GetCulture('turkish').GetName]族群中引发了强烈震荡。为寻找替罪羊，许多人将矛头指向了东部的[GetCulture('armenian').GetName]人。"
 turkfm_milletindir.100.f: "“在巴黎杀死一个人是谋杀；在东方割断五万人的喉咙，却只成了一桩悬案。”——维克多·雨果"
 turkfm_milletindir.100.a: "末日已至。"
 turkfm_milletindir.100.tt: "未能阻止这些驱逐行动将对[ROOT.GetCountry.GetName]境内的[GetCulture('armenian').GetName]人口造成#red #bold 灾难性#!#!的后果"
 turkfm_milletindir.101.t: "安纳托利亚新边疆"
 turkfm_milletindir.101.d: "人口普查员已经证实我们那令人毛骨悚然的工作业已结束。东部将成为[GetCulture('turkish').GetName]定居者的开拓疆土。"
 turkfm_milletindir.101.f: "“我们因没有区分有罪和无辜的亚美尼亚人而受到指责……对土耳其安全的关切必须压倒所有其他顾虑。”——穆罕默德·塔拉特帕夏，1916年5月4日"
 turkfm_milletindir.101.a: "前进！"
 turkfm_milletindir.102.t: "族群赔偿"
 turkfm_milletindir.102.d: "针对[GetCulture('armenian').GetName]人的运动已经停止。现在的悬题是——国家应该如何做出弥补？"
 turkfm_milletindir.102.f: "“现在，让我们假设尼古拉做错了事：这难道就能赋予某些人权利，将五六百名使徒教会基督徒赶进山里，洗劫他们的财产并对他们展开屠杀吗？核心问题……根本不是驱逐，而是灭绝。”——特拉布宗的约尔吉·尤凡迪斯·阿凡提"
 turkfm_milletindir.102.a: "允许他们继续居住就已经是最好的补偿了。"
 turkfm_milletindir.102.b: "设立一项援助基金。"
 turkfm_milletindir.103.t: "死亡行军"
 turkfm_milletindir.103.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]主持的晨会陷入了僵局。争论的焦点是来自外交部门的可靠情报，情报显示[SCOPE.sCountry('ottoman_scope').GetName]正在对其境内的[GetCulture('armenian').GetName]人口实施残酷迫害。"
 turkfm_milletindir.103.f: "“……我们的亚美尼亚政策是绝对确定的，任何事情都无法改变。我们不容许亚美尼亚人留在安纳托利亚的任何地方。他们可以去沙漠里生活，但别想待在其他地方。”——穆罕默德·塔拉特帕夏致美国大使亨利·摩根索，1915年8月2日"
 turkfm_milletindir.103.a: "提出正式抗议。"
 turkfm_milletindir.103.b: "这与我们无关。"
 turkfm_milletindir.103.c: "我们绝不容忍此类暴行！"
 turkfm_milletindir.104.t: "亚美尼亚驱逐行动被叫停"
 turkfm_milletindir.104.d: "凭借果断的决心，[ROOT.GetCountry.GetName]制止了[SCOPE.sCountry('ottoman_scope').GetName]残暴的强迫迁移行态。"
 turkfm_milletindir.104.f: "“鉴于土耳其所犯下的这些……反人类和反文明罪行，协约国政府公开宣布……他们将让所有涉嫌此类屠杀的奥斯曼政府成员及其代理人承担个人责任。”——协约国致奥斯曼帝国的公报，1915年5月24日"
 turkfm_milletindir.104.a: "正义得到了伸张。"