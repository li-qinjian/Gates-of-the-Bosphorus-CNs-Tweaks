 turkfm_start_tanzimat_desc: "整个帝国既停滞不前，又已烂透了根基。随着部分改革尘埃落定、多项新政紧锣密鼓地推行，如今万事俱备，只待颁布皇家敕令，正式赋予这场“整顿”以法律效力。"
