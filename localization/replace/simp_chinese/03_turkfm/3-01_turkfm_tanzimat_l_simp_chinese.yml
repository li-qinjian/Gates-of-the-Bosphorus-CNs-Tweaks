 turkfm_tanzimat_identity_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_identity_agenda_desc 建立帝国认同#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_identity_agenda_desc: "$turkfm_tanzimat$成功的关键，在于能否建构起一种超越族裔的$turkfm_imperial_identity$。倘若缺少这一核心要素，$turkfm_reformist$将绝无可能亲眼见证这个帝国在风雨飘摇中幸存下来。"
 turkfm_tanzimat_identity: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_identity_agenda_desc 建立帝国认同#!#!"
 turkfm_tanzimat_gulhane_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_gulhane_desc 颁布坦齐马特法令#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_gulhane_desc: "自$gbbf_bio_selim_iii$统治时期以来，人们便已深知帝国已到了不改弦更张便无以为继的绝境。然而即便如此，马哈茂德二世苏丹在正式下诏宣布变法时，内心依然充满了犹疑与顾虑。"
 turkfm_tanzimat_gulhane: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_gulhane_desc 颁布坦齐马特法令#!#!"
 turkfm_tanzimat_agriculture_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_agriculture_desc 农业技术现代化#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_agriculture_desc: "由于数百年来处于奥斯曼的陈旧统治下，农业生产与土地制度长期停滞不前。这个帝国本质上依然是一个农业国家，甚至在某些方面表现得近乎顽固守旧。我们必须推行变革，否则饥荒与衰败的阴影将继续在神州大地上滋生蔓延。"
 turkfm_tanzimat_agriculture: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_agriculture_desc 农业技术现代化#!#!"
 turkfm_tanzimat_military_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_military_desc 整顿陆军#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_military_desc: "在#bold “吉祥事变”#!中，作茧自缚的耶尼切里制度被彻底废除，其头目也悉数遭到帝国朝廷的清洗。然而即便如此，当前的军队依然极其混乱无序，且因循守旧。"
 turkfm_tanzimat_military: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_military_desc 整顿陆军#!#!"
 turkfm_tanzimat_civics_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_civics_desc 整顿官僚机构#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_civics_desc: "帝国的所谓“行政管理”，如今已是名存实亡。尽管历经数次改革尝试，各地贝伊依然拥兵自重、割据一方，税收被层层中饱私囊，司法审判更是流于私刑习惯。如果没有一个强有力的中央权威，整个帝国将根本无法维系。"
 turkfm_tanzimat_civics: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_civics_desc 整顿官僚机构#!#!"
 turkfm_tanzimat_economy_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_economy_desc 重振经济#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_economy_desc: "尽管与欧洲市场有着数百年的贸易往来，但奥斯曼帝国的经济依然以农业为主。制成品的生产仍旧被禁锢在手工业者和行会手中，若长此以往，帝国将根本无法望西方工业化生产之项背。"
 turkfm_tanzimat_economy: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_economy_desc 重振经济#!#!"
 turkfm_tanzimat_education_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_education_desc 规范教育体制#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_education_desc: "随着帝国在通往现代化的道路上蹒跚前行，正规教育机构的缺失与大面积的文盲不仅缚住了改革的双手，也严重掣肘了工业的发展。尽管此举伴随着诸多风险，但帝国已无法再承受如此普遍的愚昧与无知。"
 turkfm_tanzimat_education: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_education_desc 规范教育体制#!#!"
 turkfm_tanzimat_millet_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_millet_desc 改革米勒特制度#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_millet_desc: "自君士坦丁堡陷落以来，米勒特制度便一直是维护帝国秩序的基石之一。然而在实际操作中，这一制度却毫无系统性可言。由于向境内的非穆斯林群体赋予了过于宽泛的自治权，帝国在有效推行和执行法律方面的能力被严重削弱。尽管每个社群都可能担心失去自身特有的特权，但我们必须将这一惯例推向规范化与统一。"
 turkfm_tanzimat_millet: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_millet_desc 改革米勒特制度#!#!"
 turkfm_tanzimat_security_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_security_desc 建立执法机构#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_security_desc: "整个帝国的警政与刑法典显得极其混乱无序。虽然苏丹能够通过法令进行统治，并确保[ROOT.GetCountry.GetCapital.GetCityHubName]周边地区的治安，但在我们的首都之外，各地贝伊和自治统治者们依然在对各自的臣民滥施权威、各行其是。"
 turkfm_tanzimat_security: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_security_desc 建立执法机构#!#!"
 turkfm_tanzimat_slavery_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_slavery_desc 废除奴隶贸易#!#!$turkfm_tanzimat_agenda$"
 turkfm_tanzimat_slavery_desc: "甚至在苏丹于君士坦丁堡站稳脚跟之前，奴隶贸易就已经是奥斯曼经济的驱动力之一。然而，这一行径在所谓的“文明”世界中早已失势，中央政府对其姑息的态度，更是被外界用来大肆攻击$turkfm_porte$的国际声誉。或许，现在已经是时候重新评估这一制度是否有必要继续存在了。"
 turkfm_tanzimat_slavery: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_slavery_desc 废除奴隶贸易#!#!"
