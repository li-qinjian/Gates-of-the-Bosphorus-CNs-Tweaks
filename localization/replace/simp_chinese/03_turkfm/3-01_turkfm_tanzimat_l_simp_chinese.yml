 turkfm_young_ottoman: "#bold #yellow #tooltip:[GetRawTextTooltipTag('turkfm_young_ottoman_desc')] 新奥斯曼人#!#!#!"
 turkfm_young_ottomans: "#bold #yellow #tooltip:[GetRawTextTooltipTag('turkfm_young_ottoman_desc')] 新奥斯曼人#!#!#!"
 turkfm_young_ottoman_desc: "#header 新奥斯曼人#!$gbbf_linebreak_normal$#lore #bold 新奥斯曼人#!的并无严格成文的意识形态，但其支持者普遍认为，解决帝国困境的方法是建立宪政政府。他们旨在建立一个将伊斯兰法学理念与西方自由主义理念融合的君主立宪制。#!$gbbf_linebreak_normal$$gbbf_interest_groups$和$gbbf_agitators$将根据他们对以下法律的立场支持青年奥斯曼：\n•支持以下任何一项：\n#indent_newline:3 •[GetLawType('law_wealth_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_census_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_universal_suffrage').GetName]#!\n•支持[GetLawType('law_state_religion').GetName]\n•支持以下任何一项：\n#indent_newline:3 •[GetLawType('law_parliamentary_republic').GetName]#!\n#indent_newline:3 •[GetLawType('law_presidential_republic').GetName]#! "
