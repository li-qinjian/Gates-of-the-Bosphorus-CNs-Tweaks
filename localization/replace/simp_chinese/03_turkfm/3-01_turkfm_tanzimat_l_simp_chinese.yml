 je_turkfm_tanzimat_main_flavor: "数十年来，[ROOT.GetCountry.GetName]一直在持续衰落，欧洲列强不断蚕食其边境，动荡在其各少数族裔间蔓延。面对这些威胁，#bold 马哈茂德二世#!苏丹引领了一个改革的时代，旨在建立一个真正的中央集权官僚体系来统治并统一整个帝国。随着西方思想开始渗透进[ROOT.GetCountry.GetCapital.GetCityHubName]，这里弥漫着改革与进步的气息。"
 je_turkfm_tanzimat_main_reform: "#white #bold 每月$turkfm_tanzimat$进度：#!#!\n•$turkfm_reformist$声势：每月改变#bold #green [GetPlayer.MakeScope.Var('turkfm_tanzimat_reformist_progress_var').GetValue|2]#!#!\n•$turkfm_conservatist$声势：每月改变#bold #red [GetPlayer.MakeScope.Var('turkfm_tanzimat_conservatist_progress_var').GetValue|2]#!#!\n\n基于#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_reformist_sources')] 改革派来源#!#!与#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_conservatist_sources')] 保守派来源#!#!，预计下月改变[GetPlayer.MakeScope.Var('turkfm_tanzimat_reform_progress_var').GetValue|+=]。"
 je_turkfm_tanzimat_main_indentity: "#white #bold 每周$turkfm_imperial_identity$进度：#!#!\n•$turkfm_ottomanist$声势：每周改变#bold #green [GetPlayer.MakeScope.Var('turkfm_tanzimat_ottomanist_progress_var').GetValue|2]#!#!\n•$turkfm_islamist$声势：每周改变#bold #red [GetPlayer.MakeScope.Var('turkfm_tanzimat_islamist_progress_var').GetValue|2]#!#!\n\n目前，[SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_identity_tilt_type')]\n\n基于#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_ottomanist_sources')] 奥斯曼主义来源#!#!与#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_islamist_sources')] 伊斯兰主义来源#!#!，预计下周[SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_identity_progress_type')]。"
 je_turkfm_tanzimat_main_on_complete_ottomanist: "如果[ROOT.GetCountry.GetNameNoFlag]接纳$turkfm_ottomanist$$turkfm_identity$：\n#indent_newline:3 •触发#white #bold 奥斯曼祖国#!#!#!事件\n#indent_newline:3 •[GetCulture('ottoman').GetName]将成为[ROOT.GetCountry.GetName]的$gbbf_primary_culture$#!\n#indent_newline:3 •大部分$gbbf_pops$将立即接纳该[concept_culture]#!\n$gbbf_delimiter_small$"
