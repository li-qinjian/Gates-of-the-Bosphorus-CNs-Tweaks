 turkfm_palace_activation_decision: "将行政部门转移至[GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_activation_decision_desc: "历经多年规划与建造，工匠们终于为新宫殿添上最后的点睛之笔。如今是时候将帝国行政机构迁入新址，以巩固$turkfm_tanzimat$了。"
 turkfm_palace_upgrade_decision: "现代化[GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_upgrade_decision_desc: "尽管宏伟壮丽、寓意吉祥，但这座皇家宫殿却缺乏许多现代科技带来的便利设施。对宫殿进行现代化改造将极大惠及帝国。"
 turkfm_palace_museum_decision: "向公众开放[GetBuildingType('gbbf_building_topkapi_palace').GetName]"
 turkfm_palace_museum_decision_desc: "帝国的古老宫殿如今只不过是维护预算中的一个无底洞。学者们建议将这些历史悠久的建筑改建成公共博物馆，以此来教育我们的臣民，让他们了解帝国的功绩。"
