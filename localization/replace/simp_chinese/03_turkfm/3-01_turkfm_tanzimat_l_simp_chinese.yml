 je_turkfm_tanzimat_reforms_flavor: "一个多世纪以来的停滞不前与积贫积弱，已使这个帝国在欧洲排山倒海的工业伟力面前相形见绌。正当西方列强将目光投向海外、四处征服开疆拓土之际，随着帝国在内忧外患中走向四分五裂，$turkfm_porte$却不得不将目光死死受困于内。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须全力发展并推进奥斯曼帝国的近代化转型，否则等待我们的，将是万劫不复的毁灭深渊。"
