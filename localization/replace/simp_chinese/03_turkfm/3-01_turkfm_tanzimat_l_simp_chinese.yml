 turkfm_depose_murad_desc: "尽管早先人们希望他能带领帝国走向现代化的新纪元，但[ROOT.GetCountry.GetRuler.GetFirstName]却因其兄弟之死而深受打击，以至于他陷入了疯狂，人们对其统治的任何希望都已经破灭。核心圈子中的一些人建议，在造成任何伤害之前，应该让他从王位上“退休”。"
