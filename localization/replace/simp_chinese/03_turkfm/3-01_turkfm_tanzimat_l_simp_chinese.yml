 turkfm_grand_collapse_possible: "#bold $je_turkfm_sick_man_grand_collapse$#![concept_journal_entry]将可用"
 turkfm_reformist: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc 改革派#!#!#!"
 turkfm_reformists: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc 改革派#!#!#!"
 turkfm_reformist_desc: "#bold 改革派#!运动代表了一股思潮，该思潮将奥斯曼帝国的停滞归因于其体制的陈旧与低效。改革派兴起于文官阶层，旨在通过引入欧洲式的行政手段和加强中央集权，来维护帝国的完整。"
 turkfm_reformist_sources: "#bold 以下是$turkfm_reformist$进度的可能来源：#!$gbbf_linebreak_normal$·启用了#yellow 世俗管治#![concept_production_method]的[GetBuildingType('building_government_administration').GetName]$gbbf_buildings$\n·启用了#yellow 世俗学术界#![concept_production_method]的[GetBuildingType('building_university').GetName]$gbbf_buildings$\n·[concept_institution]$gbbf_investment_levels$的总数量"
 turkfm_conservatist: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc 保守派#!#!#!"
 turkfm_conservatists: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc 保守派#!#!#!"
 turkfm_conservatist_desc: "#bold 保守派#!运动由顽固的贵族、神职人员和文官组成，他们将任何改革尝试都视为对其财富和声望的威胁。凭借数代人积累的财富与影响力，他们对苏丹的持续统治构成了威胁。"
 turkfm_conservatist_sources: "#bold 以下是$turkfm_conservatist$进度的可能来源：#!$gbbf_linebreak_normal$·支持[GetLawType('law_state_religion').GetName]的$gbbf_interest_groups$[concept_clout]\n·在[GetLawType('law_religious_schools').GetName]激活时[GetInstitutionType('institution_schools').GetName]的总$gbbf_investment_levels$\n·在[GetLawType('law_charitable_health_system').GetName]激活时[GetInstitutionType('institution_health_system').GetName]的总$gbbf_investment_levels$\n·启用了#yellow 教士行政#![concept_production_method]的[GetBuildingType('building_government_administration').GetName]$gbbf_buildings$\n·启用了#yellow 神职教师#![concept_production_method]的[GetBuildingType('building_university').GetName]$gbbf_buildings$"
 turkfm_ottomanist: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc 奥斯曼主义者#!#!#!"
 turkfm_ottomanist_desc: "[GetIdeology('ideology_gbbf_ottomanist').GetName]运动由一批知识分子组成，他们主张推行比$turkfm_reformist$运动更为激进的改革。他们旨在将伊斯兰法理与西方的[GetTechnology('nationalism').GetName]思想相结合，从而构建一种包罗万象的“奥斯曼”认同感，以统一整个帝国。"
 turkfm_ottomanist_sources: "#bold 以下是$turkfm_ottomanist$进度的可能来源：#!$gbbf_linebreak_normal$·#bold [GetIdeology('ideology_gbbf_ottomanist_leader').GetName]运动#!的[concept_political_movement_support]\n·#bold [GetIdeology('ideology_modernizer').GetName]运动#!的[concept_political_movement_support]"
 turkfm_ottomanism: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc 奥斯曼主义#!#!#!"
 turkfm_islamist: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc 伊斯兰主义者#!#!#!"
 turkfm_islamist_desc: "[GetIdeology('ideology_gbbf_islamist_leader').GetName]认同得到了神职人员与保守派势力的支持，他们认为伊斯兰教及其法理体系是维系帝国的唯一手段。他们致力于将沙里亚法与卡农法确立为帝国未来的唯一基石，而这往往会损害各米勒特成员的利益。"
 turkfm_islamist_sources: "#bold 以下是$turkfm_islamist$进度的可能来源：#!$gbbf_linebreak_normal$·#bold 文化多数派运动#!的[concept_political_movement_support]\n·#bold 宗教多数派运动#!的[concept_political_movement_support]"
 turkfm_islamism: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc 伊斯兰主义#!#!#!"
