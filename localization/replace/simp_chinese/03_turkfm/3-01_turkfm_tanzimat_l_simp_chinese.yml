 je_turkfm_tanzimat_young_ottomans: "新奥斯曼人"
 je_turkfm_tanzimat_young_ottomans_reason: "随着[ROOT.GetCountry.GetRuler.GetFirstName]登上帝位，成为[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，$turkfm_tanzimat$的理想受到了威胁。这位[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]非但没有为了帝国的利益而进行公民改革，反而试图巩固权力并将改革引向威权主义。作为回应，$turkfm_ottomanist$运动内部的秘密社团$turkfm_young_ottomans$组织起来，寻求废黜[ROOT.GetCountry.GetRuler.GetFirstName]，并将具有改革思想的兄弟[SCOPE.sCharacter('turkfm_murad_scope').GetFirstName]推上王位。$gbbf_linebreak_normal$#white 目前，$turkfm_young_ottoman$的阴谋拥有[GetPlayer.MakeScope.Var('turkfm_young_ottomans_var').GetValue]点强度。预计将变动#greece #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_turkfm_tanzimat_young_ottomans_breakdown [GetPlayer.MakeScope.Var('turkfm_young_ottomans_progress_var').GetValue]#!#!。#!\n\n@warning!#red #bold #italic 如果$turkfm_young_ottoman$的阴谋强度达到#v 100#!，他们将#bold 废黜#![ROOT.GetCountry.GetRuler.GetFirstName]！#!#!#!"
