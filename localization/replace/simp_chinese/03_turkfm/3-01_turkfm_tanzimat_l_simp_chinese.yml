 turkfm_tanzimat_desc: "@gbbf_tanzimat!#header 坦齐马特#!$gbbf_linebreak_normal$#bold 坦齐马特#!在土耳其语中意为#italic “整顿”#!，指的是在#v 奥斯曼帝国#!日益受到重视的一系列广泛自由主义改革。自本世纪初以来，帝国国内外观察者都承认帝国面临着严重的结构性问题，包括治理不善、军事实践落后以及经济停滞。\n\n作为回应，自$gbbf_bio_selim_iii$以来的历任苏丹便开始推行一系列谨慎的改革。然而，随着帝国开始显得愈发脆弱，$turkfm_porte$在尝试对帝国体制进行激进改革方面的动力日益增强。这些改革一直充满风险，因为既得利益集团会采取行动保护自己的特权。\n\n坦齐马特大致由两股主要的暗流交织而成。其一是内部行政机构中$turkfm_reformist$与$turkfm_conservatist$派系之间关于任何改革实施的斗争。其二是$turkfm_ottomanist$与$turkfm_islamist$派系之间的角力，他们对于如何将这个摇摇欲坠的帝国重新凝聚在一起的最终解决方案，持有深度对立的政见。"
 turkfm_tanzimat_reforms: "@gbbf_tanzimat!#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc 坦齐马特#!#!"
 turkfm_identity: "@gbbf_identity!#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc 认同#!#!"
 turkfm_identity_desc: "@gbbf_identity!#header 帝国认同#!$gbbf_linebreak_normal$自最初扩张以来，奥斯曼帝国便将诸多治理职责下放给基于宗教的自治社团——即所谓的#italic “米勒特”#!。然而，西方列强对帝国日益加深的干涉，让民众接触到了[GetTechnology('nationalism').GetName]思想，如今这一思潮正威胁着要将整个帝国撕裂。\n\n为了挽救危局，由$turkfm_porte$发起的$turkfm_reformist$运动应运而生。但对于究竟是靠$turkfm_ottomanism$还是$turkfm_islamism$才能解救帝国的沉疴，改革派内部依旧分歧重重。与此同时，根深蒂固的$turkfm_conservatist$运动也在极力反对他们，这股由各地军阀和总督结成的广泛同盟，正因$turkfm_tanzimat$的推行而感到自身的权威受到了严重威胁。"
 turkfm_identities: "@gbbf_identity!#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc 身份#!#!"
