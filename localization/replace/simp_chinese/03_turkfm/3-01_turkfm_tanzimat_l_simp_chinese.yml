 notification_turkfm_tanzimat_started_name: "#yellow 奥斯曼帝国#!宣布实施#bold $turkfm_tanzimat$#!"
 notification_turkfm_tanzimat_started_desc: "乘着#yellow 塞利姆三世#!发起的改革浪潮，#yellow 奥斯曼帝国#!的苏丹宣布了一项雄心勃勃的计划，以“重组”并实现奥斯曼国家的现代化。"
