 turkfm_tanzimat_reform_agenda: "$turkfm_tanzimat$#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc 改革议程#!#!"
 turkfm_tanzimat_reform_agenda_desc: "一项#bold $turkfm_tanzimat$改革议程#!，代表了$turkfm_ottomanists$在推动帝国近代化转型过程中所确立的阶段性目标。完成这些议程不仅能彻底消除与其相关的全部负面惩罚，更能大幅提振整场坦齐马特的总体进度，从而全面助推帝国迈向$turkfm_reformist$的最终结局。"
