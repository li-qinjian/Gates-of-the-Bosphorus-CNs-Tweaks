 je_turkfm_tanzimat_young_turks_reason: "随着自由主义和民族主义思想渗透到[ROOT.GetCountry.GetName]，反对派运动在一种心态下团结起来：单靠$turkfm_tanzimat$不足以拯救帝国。青年土耳其党汇集了$gbbf_intelligentsia$各派意识形态，旨在迫使$turkfm_porte$接受改革，而不计对国家造成的后果。"
 je_turkfm_tanzimat_main_lobby: "$gbbf_journal_lobby$\n几十年来，奥斯曼帝国一直在稳步衰退，欧洲列强蚕食着它的边界，动乱在少数民族中蔓延。面对这些威胁，苏丹#bold 马哈茂德二世#!倡导了一个改革时代，旨在建立一个真正中央集权的官僚机构来统治和统一帝国。"
