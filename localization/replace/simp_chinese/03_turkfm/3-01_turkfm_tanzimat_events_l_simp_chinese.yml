l_simp_chinese:
 turkfm_tanzimat.001.t: "衰落中的帝国"
 turkfm_tanzimat.001.d: "[ROOT.GetCountry.GetName]汲取波斯和拜占庭政治家的政治智慧，不断发展并使其统治合法化，因此屹立了四个世纪。然而，曾经深厚的行政实力如​​今已开始枯竭，$turkfm_porte$要想在工业时代生存下去，就必须发掘新的活力。"
 turkfm_tanzimat.001.f: "[ROOT.GetCountry.GetName] 一直处于紧张状态，其混合传统与伊朗绝对王权以及突厥准神权君主制的理念相冲突，前两者都植根于前伊斯兰时代，并且与公认的哈里发统治的伊斯兰教义相冲突。"
 turkfm_tanzimat.001.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须保持至高无上的地位。"
 turkfm_tanzimat.002.t: "《花厅御诏》"
 turkfm_tanzimat.002.d: "在[SCOPE.sCharacter('turkfm_reshid_scope').GetFullName]的极力促成下，[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]颁布了《帝国改革敕令》。该敕令由一系列复杂的宣言和指令组成，旨在保障生活水平、规范税收制度，并承认$turkfm_porte$臣民享有的基本人权。"
 turkfm_tanzimat.002.f: "“……鉴于似乎有必要……从今往后建立新的法律，以实现我们崇高国度及受保护各省的良好管理……”——1839年《花厅御诏》"
 turkfm_tanzimat.002.a: "今天标志着[ROOT.GetCountry.GetName]迈向了一个新的时代。"
 turkfm_tanzimat.003.t: "坦齐马特诸臣"
 turkfm_tanzimat.003.d: "随着改革理想在[ROOT.GetCountry.GetName]生根发芽，数位政治家已崭露头角，他们自荐为引领帝国冲向现代化的理想人选。"
 turkfm_tanzimat.003.f: "“国家无贤臣则不立，\n然贤臣无财则不支。”\n——尤素福·纳比，《哈伊里叶》，1889年"
 turkfm_tanzimat.003.a: "这些贤达将成为推动我们进步的中坚力量。"
 turkfm_tanzimat.003.b: "我们要依靠这些旧时代的守望者。"
 turkfm_tanzimat.004.t: "#todo $turkfm_tanzimat.004.t$#!"
 turkfm_tanzimat.004.d: "#todo $turkfm_tanzimat.004.d$#!"
 turkfm_tanzimat.004.f: "#todo $turkfm_tanzimat.004.f$#!"
 turkfm_tanzimat.004.a: "#todo $turkfm_tanzimat.004.a$#!"
 turkfm_tanzimat.005.t: "帝国的身份"
 turkfm_tanzimat.005.d: "通过$turkfm_tanzimat$数代人非凡的努力，西方改革的理想已深深融入帝国之中。"
 turkfm_tanzimat.005.f: "“彻底改变和革新一个国家的法律比重新建立一个国家更为困难。” ——艾哈迈德·杰夫代特·帕夏，《历史》"
 turkfm_tanzimat.005.a: "[GetIdeology('ideology_gbbf_ottomanist_leader').GetName]$turkfm_identity$将引领我们走向未来！"
 turkfm_tanzimat.006.t: "衰落中的帝国"
 turkfm_tanzimat.006.d: "[ROOT.GetCountry.GetName]未能实现现代化并重新屹立于世界舞台。随着其末日临近，食腐的秃鹫已开始在周围盘旋。"
 turkfm_tanzimat.006.f: "“从1838年到1908年，奥斯曼帝国进行了最后一场但又注定失败的斗争。坦齐马特对西方进步与伊斯兰传统的双重效忠，使其同时疏远了改革派和保守派，加速了自身的解体。” ——泽伊内普·切利克，1986年"
 turkfm_tanzimat.006.a: "[ROOT.GetCountry.GetName]必须寻得自己的出路……"
 turkfm_tanzimat.007.t: "三帕夏"
 turkfm_tanzimat.007.d: "苏丹内廷的权威已经土崩瓦解。在这权力真空之中，“#bold 三帕夏#!”昂首步入殿堂，直接向苏丹发出了不容置疑的通牒。"
 turkfm_tanzimat.007.f: "在青年土耳其党人的武力支持下，[SCOPE.sCharacter('turkfm_talat_mehmed_scope').GetFullName]、[SCOPE.sCharacter('turkfm_enver_ismail_scope').GetFullName]与[SCOPE.sCharacter('turkfm_djemal_ahmed_scope').GetFullName]向苏丹发出了最后的通牒：要么彻底改革，要么被推翻。"
 turkfm_tanzimat.007.a: "土耳其祖国必将重生。"
 turkfm_tanzimat.008.t: "永恒的哈里发国"
 turkfm_tanzimat.008.d: "在$gbbf_devout$信众们的簇拥下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]庄严宣告：永恒的[ROOT.GetCountry.GetAdjectiveNoFlag]哈里发国正式建立。从多瑙河畔到黎凡特大地，先知的箴言将成为至高无上的准则。"
 turkfm_tanzimat.008.f: "随着$turkfm_ottomanist$运动的彻底破产，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已别无选择，只能将伊斯兰教确立为[ROOT.GetCountry.GetName]唯一且不可动摇的根基。"
 turkfm_tanzimat.008.a: "真主至大！"
 turkfm_tanzimat.009.t: "奥斯曼祖国"
 turkfm_tanzimat.009.d: "经过近两个世纪的徘徊与挫败，[ROOT.GetCountry.GetName]终于从坦齐马特的阵痛中破茧而出，以全新的身份认同和行政伟力重塑了自身。如今，它已不再仅仅是一个在旧日余晖中摇摇欲坠的帝国，[ROOT.GetCountry.GetGovernment.GetName]成为了一座灯塔，向所有愿意宣誓效忠 $turkfm_porte$的人敞开怀抱。"
 turkfm_tanzimat.009.f: "“……国家实行宪政的时机现已成熟；因此，朕之圣谕已经下达……朕特此宣告，宪法的施行绝不容许受到任何形式的干预。” ——苏丹阿卜杜勒·哈米德二世致大维齐尔赛义德帕夏，1908年。"
 turkfm_tanzimat.009.a: "[ROOT.GetCountry.GetName]的新时代已经到来！"
 turkfm_tanzimat.010.t: "现代化农业"
 turkfm_tanzimat.010.d: "尽管数百年来农业耕作方式停滞不前，但[ROOT.GetCountry.GetName]现已采纳了一系列农业改革措施，这将使帝国能够支撑其不断增长的人口。"
 turkfm_tanzimat.010.f: "尽管最终成果显现尚需时日，但农民们已经开始真切地体会到直接拥有土地及其产出的益处。"
 turkfm_tanzimat.010.a: "真是个好消息。"
 turkfm_tanzimat.011.t: "不可战胜的军队"
 turkfm_tanzimat.011.d: "自耶尼切里被取缔以来，数十年的改革终于迎来了巅峰：[ROOT.GetCountry.GetAdjective]$gbbf_armed_forces$现已被公认为一支现代化且威武的战斗力量。"
 turkfm_tanzimat.011.f: "在“吉祥事件”的混乱与同俄国人的连年战争中，帝国寻得动力，组建了一支足以与西方列强正面抗衡的军队。"
 turkfm_tanzimat.011.a: "我们的实力不容置疑。"
 turkfm_tanzimat.012.t: "文官官僚"
 turkfm_tanzimat.012.d: "通过对帝国行政本质进行广泛且根本性的重组，一个全新的[GetPopType('bureaucrats').GetName]阶层已经崛起。随着他们的关注点从传统的文牍辞令转向现代化的行政事务，[ROOT.GetCountry.GetName]已准备好对其臣民实施更为直接的控制。"
 turkfm_tanzimat.012.f: "“……书吏之职，乃艺术中最高贵、最古老者。”\n——大维齐尔圣谕，1824年"
 turkfm_tanzimat.012.a: "这些人将成为改革的引擎。"
 turkfm_tanzimat.013.t: "经济振兴"
 turkfm_tanzimat.013.d: "[ROOT.GetCountry.GetName]已经推进了深层的经济变革，正式启动了将这个[ROOT.GetCountry.GetAdjectiveNoFormatting]国家整顿为工业化国家的进程。"
 turkfm_tanzimat.013.f: "虽然与西方相比仍显落后，但这些变革预示着[ROOT.GetCountry.GetNameNoFormatting]封建统治的终结。"
 turkfm_tanzimat.013.a: "好日子还在后头呢！"
 turkfm_tanzimat.014.t: "受教育的民众"
 turkfm_tanzimat.014.d: "国会推动的教育改革，使[ROOT.GetCountry.GetAdjectiveNoFlag]人民从封建社会过渡到能与西方做生意。"
 turkfm_tanzimat.014.f: "通过提高农民的生活水平，帝国将为繁荣奠定基础。"
 turkfm_tanzimat.014.a: "全体国民都将受益。"
 turkfm_tanzimat.015.t: "法律面前，人人平等"
 turkfm_tanzimat.015.d: "在改革米勒特和限制其教派团体的权利方面，$turkfm_porte$将世俗法置于宗教法方面取得了重大进展"
 turkfm_tanzimat.015.f: "确保帝国统一的唯一方法是确保法律可以平等、公正地实施。"
 turkfm_tanzimat.015.a: "这才是公平的。"
 turkfm_tanzimat.016.t: "乡村安全"
 turkfm_tanzimat.016.d: "在国家坚定果断的领导下，肆虐我国农村的土匪们放下了武器，走上了工作岗位，成为社会的有用之才。"
 turkfm_tanzimat.016.f: "确保国内同胞的安全固然是最基本、最平凡的事情，但也是使国家合法化的重要一步。"
 turkfm_tanzimat.016.a: "干得漂亮。"
 turkfm_tanzimat.017.t: "废除奴隶制"
 turkfm_tanzimat.017.d: "随着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetHerHis]在废除奴隶制的文件上签字，帝国各地的驻军纷纷关闭奴隶市场并驱逐奴隶贩子。"
 turkfm_tanzimat.017.f: "放弃古老的奴隶制，是与西方关系正常化之一的一步。"
 turkfm_tanzimat.017.a: "干得漂亮。"
 turkfm_tanzimat.018.t: "切尔克西亚奴隶贸易被镇压"
 turkfm_tanzimat.018.d: ""
 turkfm_tanzimat.018.f: ""
 turkfm_tanzimat.018.a: ""
 turkfm_tanzimat.020.t: "莫斯塔尔的苏丹"
 turkfm_tanzimat.020.d: "几位帕夏对黑塞哥维那维齐尔[SCOPE.sCharacter('ali_pasha_scope').GetFirstName]#yellow 帕夏#![SCOPE.sCharacter('ali_pasha_scope').GetLastName]的突然崛起感到担忧。他试图在鲁米利亚建立权力的传言逐渐传开，[SCOPE.sCharacter('omer_pasha_scope').GetFullName]已表示愿意为该地区带来秩序。"
 turkfm_tanzimat.020.f: "[SCOPE.sCountry('bosnia_scope').GetName]的维齐尔，#yellow 帕夏#![SCOPE.sCharacter('ali_pasha_scope').GetFirstName][SCOPE.sCharacter('ali_pasha_scope').GetLastName]，胆大妄为地挑衅苏丹的权威。在醉酒中，他自封为“莫斯塔尔苏丹”，以示对君士坦丁堡的蔑视。"
 turkfm_tanzimat.020.a: "$turkfm_porte$不能容忍此种行为。"
 turkfm_tanzimat.020.b: "这与苏丹无关。"
 turkfm_tanzimat.021.t: "阿里帕夏被拘留"
 turkfm_tanzimat.021.d: "根据[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的指示，叛国者[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullName]已被逮捕并被剥夺总督职务。我们的将军[SCOPE.sCharacter('omer_pasha_scope').GetFullName]正在等待[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的命令。"
 turkfm_tanzimat.021.f: "“你为何如此折磨我？你是瓦拉几人，自称瓦拉几人之子！你凭什么这么迫害我？就算我亲自拿起武器对抗苏丹，你也没资格把我当成战俘对待，就算你三次被俘也无权，你这不洁的瓦拉几人！不如把我送到我的帕迪沙那里去，让他审判我，别在我老了的时候再来烦我！”——阿里帕夏对奥马尔帕夏说"
 turkfm_tanzimat.021.a: "砍掉他的头！"
 turkfm_tanzimat.021.b: "让他烂在监狱里吧。"
 turkfm_tanzimat.005.a.tt: "[ROOT.GetCountry.GetName]将采用[GetCulture('ottoman').GetName]作为其核心认同。"
 turkfm_tanzimat.005.b: "[GetIdeology('ideology_gbbf_islamist_leader').GetName]$turkfm_identity$$是唯一道德的选择！"
 turkfm_tanzimat.005.b.tt: "[ROOT.GetCountry.GetName]将采用[GetReligion('sunni').GetName]伊斯兰教作为其核心认同。"
 turkfm_tanzimat.005.c: "任何决定都不合时宜。"
 turkfm_tanzimat.100.t: "新奥斯曼人"
 turkfm_tanzimat.100.d: "面对一位[GetIdeology('ideology_authoritarian').GetName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的上台，一群坚定的$turkfm_reformist$[GetPopType('bureaucrats').GetName]策划了一场密谋，以确保$turkfm_tanzimat$的成功。他们自称$turkfm_young_ottomans$，其计划的关键在于废黜[ROOT.GetCountry.GetRuler.GetFirstName]，拥立[SCOPE.sCharacter('turkfm_murad_scope').GetFirstName]统治[ROOT.GetCountry.GetName]。"
 turkfm_tanzimat.100.f: "围绕[SCOPE.sCharacter('left_icon').GetFullName]松散组织起来的新奥斯曼人越来越担心苏丹打算拒绝进一步的改革努力。凭借与$gbbf_armed_forces$的联系，他们对苏丹构成了切实存在的威胁。"
 turkfm_tanzimat.100.a: "这是对[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的冒犯！"
 turkfm_tanzimat.101.t: "学生走上街头"
 turkfm_tanzimat.101.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]宗教学校的数十名学生走上街头抗议专制主义。受$turkfm_young_ottomans$刊物的鼓动，这些抗议活动已导致首都各地交通中断。"
 turkfm_tanzimat.101.f: "受$turkfm_tanzimat$理想的鼓舞并受到西方抗议活动的启发，宗教学生公然的反抗令[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]震惊不已。"
 turkfm_tanzimat.101.a: "这点小事不值得[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]关注。"
 turkfm_tanzimat.101.b: "下令关闭这些报社。"
 turkfm_tanzimat.101.c: "出动当地驻军。"
 turkfm_tanzimat.107.t: "坦齐马特运动未受争议"
 turkfm_tanzimat.107.d: "迅速遵从$turkfm_young_ottomans$的意愿，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]颁布了一部基本宪法，至少允许进行名义上的选举。"
 turkfm_tanzimat.107.f: "“众议院全体议员代表的是整个奥斯曼民族，而非仅代表选举他们的地区。”——1876年《奥斯曼帝国宪法》第72条"
 turkfm_tanzimat.107.a: "这确实是[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的明智之举。"
 turkfm_tanzimat.108.t: "新奥斯曼人被中立化"
 turkfm_tanzimat.108.d: "通过坚定的意志和稳健的手腕，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]挫败了$turkfm_young_ottoman$的阴谋。随着他们政治影响力的瓦解，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的维齐尔们已准备好处置这些阴谋者。"
 turkfm_tanzimat.108.f: "由于激进的改革计划受挫，许多密谋者已主动自我流放至西方国家。"
 turkfm_tanzimat.108.a: "帝国需要强有力的领导。"
 turkfm_tanzimat.109.t: "“不流血”政变"
 turkfm_tanzimat.109.d: "[ROOT.GetCountry.GetRuler.GetFirstName]驾崩了。这位前[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]在被告知废黜消息后，被软禁于#bold 费里耶宫#!。在索要剪刀修剪胡须后不久，这位君主双腕大量出血而亡。"
 turkfm_tanzimat.109.f: "这场政变既平稳又未流血。军事学院学生冲进[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的宫廷宣布废黜。在伊斯兰教长许可下，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]被带离多尔玛巴赫切宫，乘船远离了他的宫廷。"
 turkfm_tanzimat.109.a: "[SCOPE.sCharacter('turkfm_murad_scope').GetFirstName]终于可以大展身手了。"
 turkfm_tanzimat.110.t: "颓丧的苏丹"
 turkfm_tanzimat.110.d: "尽管人们最初对其统治寄予厚望，但事实证明阿卜杜勒阿齐兹的意外离世使[ROOT.GetCountry.GetRuler.GetFirstName]深受打击。这位[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]逐渐淡出公众视野，诸多政务遭到荒废。"
 turkfm_tanzimat.110.f: "焦虑与绝望攫住了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的心神。一方面害怕被指控为阿卜杜勒阿齐兹之死的幕后黑手，一方面又承受着适应皇位的重重压力，这位君主一直饱受突发性疾病和情绪失控的困扰。"
 turkfm_tanzimat.110.a: "何其悲惨的结局。"
 turkfm_tanzimat.111.t: "重振声势"
 turkfm_tanzimat.111.d: "尽管最初有人对新[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的心理承受力存有疑虑，但他已经逐渐适应了新角色。帝国上下也逐渐承认[ROOT.GetCountry.GetRuler.GetFirstName]是[ROOT.GetCountry.GetName]的真正统治者。"
 turkfm_tanzimat.111.f: "头脑清醒且得到大臣们支持的新任君主，抓住了帝国新未来的希望。"
 turkfm_tanzimat.111.a: "向着进步前进！"
 turkfm_tanzimat.112.t: "废黜失能君主"
 turkfm_tanzimat.112.d: "尽管大臣们心存希望，[ROOT.GetCountry.GetRuler.GetFirstName]却仍陷入偏执与消沉。西方医师的探诊不过证实了人尽皆知的事实：苏丹已经无力治国。在伊斯兰教长的支持下，这位[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]再遭废黜，并被幽禁于彻拉安宫。[SCOPE.sCharacter('turkfm_abdulhamid_scope').GetFirstName]即将继位登基。"
 turkfm_tanzimat.112.f: "“我曾误以为，只要效仿先父$Abdulmecid$，通过说服民众与建立自由制度来推行改革，就可以安治国家。从今往后，朕将追随祖父$Mahmud$$Sultan$的脚步。与他一样，朕如今明白：若要驱使真主托付于朕庇护的臣民，除武力外别无他法。”——$Abdul_Hamid$$Sultan$，1878年"
 turkfm_tanzimat.112.a: "帝国需要一位强有力的统治者。"
 turkfm_tanzimat.014.b: "帝国将因此繁荣。"
 turkfm_tanzimat.018.b: ""
 turkfm_tanzimat.200.t: "统一与进步委员会"
 turkfm_tanzimat.200.d: "晴朗的天空与宜人的天气迎来了“统一与进步委员会”的第一次会议。这场伪装成[SCOPE.sCharacter('young_turk_leader_scope').GetFullName]在[ROOT.GetCountry.GetCapital.GetCityHubName]郊区举办的宴会，团结了持不同政见的知识分子和政治家，共同讨论他们对[ROOT.GetCountry.GetAdjectiveNoFlag]政权的不满。"
