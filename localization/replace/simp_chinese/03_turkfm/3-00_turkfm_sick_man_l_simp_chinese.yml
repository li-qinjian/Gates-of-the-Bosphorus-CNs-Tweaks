 je_turkfm_sick_man_kurdistan_reason: "自从突厥人首次入侵安纳托利亚以来，[GetCulture('kurdish').GetName]人民就一直在反抗高门的统治。为了集中$turkfm_porte$的权力，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]决心确保帝国东部边境的安全。"
