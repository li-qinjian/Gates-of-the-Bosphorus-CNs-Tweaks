 je_turkfm_sick_man_main_lobby: "$gbbf_journal_lobby$\n奥斯曼帝国荣光不再。希腊和塞尔维亚的革命动摇了国本，埃及叛乱更是使其元气大伤，$turkfm_sublime_porte$的权威正受到质疑。《哈德良堡条约》与《屈塔希亚公约》使帝国受尽屈辱，许多人都预测苏丹国即将分崩离析。"
