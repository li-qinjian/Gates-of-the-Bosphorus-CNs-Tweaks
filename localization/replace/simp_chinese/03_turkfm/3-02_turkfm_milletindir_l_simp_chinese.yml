 turkfm_kemalism: "@gbbf_identity!#yellow #tooltip:[GetPlayer.GetTooltipTag],turkfm_kemalism_desc 凯末尔主义#!#!"
 turkfm_kemalism_desc: "#bold 凯末尔主义#!，由穆斯塔法·凯末尔所倡导，它将“土耳其性”确立为由国家制度定义的“公民民族”。在此种模式下，[GetCulture('turkish').GetName]认同即是国家本身的认同，国内的所有其他文化都应当从属于此。通过这种方式，奥斯曼君主制、哈里发制以及贵族阶层在新国家中被全盘否定。"
 turkfm_kemalist: "@gbbf_identity!#yellow #tooltip:[GetPlayer.GetTooltipTag],turkfm_kemalism_desc 凯末尔主义#!#!"
 turkfm_kemalist_ideologies: "\n•[GetIdeology('ideology_ethno_nationalist').GetName]\n•[GetIdeology('ideology_modernizer_leader').GetName]\n•[GetIdeology('ideology_corporatist_leader').GetName]\n•[GetIdeology('ideology_gbbf_kemalist_leader').GetName]"
 turkfm_turanism: "@gbbf_identity!#greece #tooltip:[GetPlayer.GetTooltipTag],turkfm_turanism_desc 图兰主义#!#!"
 turkfm_turanism_desc: "#bold 图兰主义#!，由齐亚·格卡尔普领衔，主张土耳其国家只是一个更庞大的突厥整体中的小小碎片。在此种模式下，[GetCulture('turkish').GetName]认同被赋予了联合所有突厥民族的神圣使命。"
 turkfm_turanist: "@gbbf_identity!#greece #tooltip:[GetPlayer.GetTooltipTag],turkfm_turanism_desc 图兰主义#!#!"
 turkfm_turanist_ideologies: "\n•[GetIdeology('ideology_jingoist_leader').GetName]\n•[GetIdeology('ideology_fascist').GetName]"
 turkfm_anatolianism: "@gbbf_identity!#purple #tooltip:[GetPlayer.GetTooltipTag],turkfm_anatolianism_desc 安纳托利亚主义#!#!"
 turkfm_anatolianism_desc: "#bold 安纳托利亚主义#!，由希尔米·齐亚·于尔肯等知识分子提出，它全盘否定了$turkfm_tanzimat$所尝试的社会政治改革。在此种模式下，[GetCulture('turkish').GetName]认同既不依附于苏丹，也不皈依于伊斯兰教，而是千百年来居住在安纳托利亚土地上衍生出的一种自给自足的新兴文明。"
 turkfm_anatolianist: "@gbbf_identity!#purple #tooltip:[GetPlayer.GetTooltipTag],turkfm_anatolianism_desc 安纳托利亚主义#!#!"
 turkfm_anatolianist_ideologies: "\n•[GetIdeology('ideology_liberal_leader').GetName]\n•[GetIdeology('ideology_humanitarian').GetName]\n•[GetIdeology('ideology_humanitarian_royalist').GetName]"
 turkfm_kemalism_factors: "以下因素将影响$turkfm_kemalist$$turkfm_foundation$：\n•已制定[GetLawType('law_parliamentary_republic').GetName]或[GetLawType('law_presidential_republic').GetName]\n•[ROOT.GetCountry.GetNameNoFlag]的[GetLawGroup('lawgroup_citizenship').GetName]法律之$gbbf_restrictiveness$\n•[concept_institution]的$gbbf_investment_levels$总额\n•平均[concept_sol]相对于平均[concept_expected_sol]的水平\n•已制定[GetLawType('law_total_separation').GetName]\n•[concept_innovation]\n•#bold 文化多数派#!$gbbf_movement$的[political_movement_support]\n•[GetGeographicRegion('geographic_region_anatolia').GetName]中启用[GetDecreeType('decree_promote_national_values').GetName]法令的$gbbf_states$数量\n•[ROOT.GetCountry.GetNameNoFlag]的[GetLawGroup('lawgroup_citizenship').GetName]法律之$gbbf_restrictiveness$"
 turkfm_turanism_factors: "以下因素将影响$turkfm_turanist$$turkfm_foundation$：\n•$gbbf_fully_owning$非[GetCulture('turkish').GetName]的$turkfm_turkic_culture$[concept_homeland]$gbbf_states$\n•[concept_prestige]\n•[concept_army_power_projection]\n•[GetGeographicRegion('geographic_region_anatolia').GetName]中启用[GetDecreeType('decree_enlistment_efforts').GetName]法令的$gbbf_states$数量"
 turkfm_anatolianism_factors: "以下因素将影响$turkfm_anatolianist$$turkfm_foundation$：\n•[GetCulture('turkish').GetName]$gbbf_pops$的平均[concept_literacy]\n•$gbbf_fully_owning$[GetCulture('turkish').GetName][concept_homeland]$gbbf_states$\n•[GetGeographicRegion('geographic_region_anatolia').GetName]内[GetBuildingType('building_university').GetName]的$gbbf_building_levels$\n•[GetGeographicRegion('geographic_region_anatolia').GetName]中启用[GetDecreeType('decree_promote_social_mobility').GetName]法令的$gbbf_states$数量"
