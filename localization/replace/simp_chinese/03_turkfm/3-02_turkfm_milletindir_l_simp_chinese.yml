 turkfm_endorse_pogroms_desc: "对于任何了解局势的人来说，这都很清楚：绝不可能将坦齐马特改革失败的责任归咎于单一文化。然而，这确实是转移我们政治困境注意力的绝佳手段。"
 turkfm_halt_deportations_name: "停止驱逐[GetCulture('armenian').GetName]人"
 turkfm_halt_deportations_desc: "施加在[GetCulture('armenian').GetName]人民身上的暴力程度完全是一场暴行。尽管这充满了引发政治动荡的风险，但我们必须强行终止这场人间悲剧。"
 turkfm_cook_the_books_name: "瞒报虚报数据"
 turkfm_cook_the_books_desc: "受[GetCulture('armenian').GetName]人局势影响的人数之多令人难以置信。通过采用一些“创造性”的汇报方式，应该有可能掩盖这桩暴行的规模。"
 turkfm_shoot_the_press_name: "打压新闻报道"
 turkfm_shoot_the_press_desc: "欧洲媒体第一时间利用[GetCulture('armenian').GetName]人的局势将我国描绘成野蛮之邦。国家应当动用权威来扼杀这些“不实”报道。"
