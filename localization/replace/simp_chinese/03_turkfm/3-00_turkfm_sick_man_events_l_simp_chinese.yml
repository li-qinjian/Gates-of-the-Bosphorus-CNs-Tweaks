l_simp_chinese:
 turkfm_sick_man.001.t: "欧洲病夫"
 turkfm_sick_man.001.d: "放眼整个欧洲，[ROOT.GetCountry.GetName]的衰落已成为公认的不争事实。随着不满情绪在整个[ROOT.GetCountry.GetPowerBloc.GetName]蔓延，坐镇[ROOT.GetCountry.GetCapital.GetCityHubName]的政府正疲于应对其广袤领地内四起的冲突与分裂主义浪潮。面对桀骜不驯的臣民、落后的基础设施以及低效的官僚机构，这座帝国宛若一座摇摇欲坠的纸牌屋，只待最后一阵狂风便会轰然崩塌。"
 turkfm_sick_man.001.f: "每年，欧洲人的目光都愈发投向[concept_eastern_question]。犹如嗅到腐尸气息的秃鹫，列强已开始在[GetStrategicRegion('region_balkans').GetName]及其周边地区强加其图谋，全然不顾当地民众的意愿。[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]始终保持着不屈的姿态，而我们需要倾尽所有，才能在欧洲帝国的野心面前屹立不倒。"
 turkfm_sick_man.001.a: "[ROOT.GetCountry.GetName]必须寻得自己的出路。"
 turkfm_sick_man.005.t: "失去对[SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName]的控制权"
 turkfm_sick_man.005.d: "在[SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName][concept_strategic_region]遇错后，我们进一步丢失主导地位，这将加剧“病夫”的论调。"
 turkfm_sick_man.005.f: "“我们手上有一个病得很严重的病人，如果有一天他从我们手中溜走，那将是一个巨大的不幸，尤其是在必要的安排还没有做好之前。”——$GBR_ADJ$大使乔治·汉密尔顿·西摩爵士"
 turkfm_sick_man.005.a: "是可忍孰不可忍"
 turkfm_sick_man.006.t: "对[SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName]的控制已得到保障"
 turkfm_sick_man.006.d: "我们在[SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName][concept_strategic_region]的进展已恢复了我们对该地区的主导地位，西方应该会关注我们的崛起。"
 turkfm_sick_man.006.f: "“正义应当强大，强者应当正义。”——阿卜杜勒·阿齐兹一世"
 turkfm_sick_man.006.a: "好消息！"
 turkfm_sick_man.007.t: "帝国瓦解"
 turkfm_sick_man.007.d: "[SCOPE.sCountry('ottoman_scope').GetName]未能实现现代化，在世界舞台上重新站稳跟脚。秃鹰开始盘旋，帝国的末日近了。在这场混乱中，[ROOT.GetCountry.GetName]必须做出选择：我们是留在帝国还是摆脱苏丹的控制？"
 turkfm_sick_man.007.f: "$turkfm_sublime_porte$陷入了沉寂。在承认坦齐马特失败后，[SCOPE.sCharacter('ottoman_ruler_scope').GetPrimaryRoleTitle]心灰意冷，闭门不出。正如[SCOPE.sCharacter('ottoman_ruler_scope').GetHerHis]挚爱的帝国一样，[SCOPE.sCharacter('ottoman_ruler_scope').GetPrimaryRoleTitle]长期以来饱受病痛的折磨，最终使得[SCOPE.sCharacter('ottoman_ruler_scope').GetHerHim]无法承受国之头巾的重量。"
 turkfm_sick_man.007.a: "我们必须联合才能生存于世。"
 turkfm_sick_man.007.b: "[ROOT.GetCountry.GetName]将塑造自己的命运。"
 turkfm_sick_man.008.t: "欧洲卒夫"
 turkfm_sick_man.008.d: ""
 turkfm_sick_man.008.f: "$turkfm_sublime_porte$陷入了沉寂。几天来，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]闭门不出。对边境传来的噩耗毫不在意，现在病夫已死，不会再有复兴。"
 turkfm_sick_man.008.a: "我们确是真主所有的，我们必定只归依他。"
 turkfm_sick_man.009.t: "欧洲健夫"
 turkfm_sick_man.009.d: "[ROOT.GetCountry.GetName]面对民族主义浪潮和西方工业强权的冲击，不仅幸存下来，甚至焕发出勃勃生机，奥斯曼帝国顽疾已去，将永垂不朽。"
 turkfm_sick_man.009.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]高举奥斯曼之剑，宣告了一个新的黄金时代到来，承诺为所有 [ROOT.GetCountry.GetAdjectiveNoFormatting]公民带来启蒙和繁荣。"
 turkfm_sick_man.009.a: "承蒙真主恩典，我们终将胜利。"
 turkfm_sick_man.018.t: "瘟疫"
 turkfm_sick_man.018.d: "数周以来，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]的病情和虚弱迹象日益加重。经检查，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]被诊断患有[GetCharacterTrait('gbbf_trait_tuberculosis').GetName]。"
 turkfm_sick_man.018.f: "肺结核是城市过度拥挤而出现的瘟疫，它徘徊在帝国的土地上，夺走贵族和农民的生命。"
 turkfm_sick_man.018.a: "真不幸。"
 turkfm_sick_man.019.t: "[SCOPE.sCharacter('turkfm_heir_scope').GetFirstName]的崛起"
 turkfm_sick_man.019.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]被发现死于寝宫，其身体因疾病而消瘦，就在[SCOPE.sCharacter('turkfm_heir_scope').GetFirstName]准备登基之际，各大臣之间已经开始了争夺权力的角逐。"
 turkfm_sick_man.019.f: "帝国继承权的最大危险来自宫廷的阴谋，贵族、文士和将领都想将新的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]控制在自己的手中。"
 turkfm_sick_man.019.a: "悲惨的境遇。"
 turkfm_sick_man.019.b: "是时候进行真正的改革了。"