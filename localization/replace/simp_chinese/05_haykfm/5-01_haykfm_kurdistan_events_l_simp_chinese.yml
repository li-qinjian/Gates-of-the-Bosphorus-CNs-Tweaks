l_simp_chinese:
 haykfm_kurdistan.001.t: "库尔德斯坦的部落"
 haykfm_kurdistan.001.d: "[ROOT.GetCountry.GetName]世代向[ROOT.GetCountry.GetOverlord.GetName]象征性纳贡，以地方自治权换取波斯边境的安全保障。近来，[ROOT.GetCountry.GetRuler.GetFullName]埃米尔发现苏丹的使节愈发专横，对部落主权的容忍度越来越低。"
 haykfm_kurdistan.001.f: "[GetCulture('kurdish').GetName]世代以库尔德斯坦为家。尽管这片土地历经多次易主，库尔德人凭借信仰与语言紧密团结。然而高门近期加强了对库尔德斯坦的直接统治，威胁到了库尔德部落的自治权。"
 haykfm_kurdistan.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 haykfm_kurdistan.002.t: "中央集权国家"
 haykfm_kurdistan.002.d: "尽管缺乏中央权威的传统，[ROOT.GetCountry.GetName]已建立起首批本土机构。随着政府逐渐中央集权，摆脱帝国统治的未来似乎越来越有可能。"
 haykfm_kurdistan.002.f: "#italic “倘若我们拥有一位国王，  \n蒙神赐予冠冕，  \n并授予宝座，  \n那我们的命运便将崛起。\n我们的国王将戴上王冠，  \n我们将赢得尊严与荣耀。”  #!\n——#italic 《梅姆与津》#!节选"
 haykfm_kurdistan.002.a: "[GetCulture('kurdish').GetName]人民的未来依然光明！"
 haykfm_kurdistan.003.t: "米尔米兰"
 haykfm_kurdistan.003.d: "在[ROOT.GetCountry.GetCapital.GetCityHubName]的宫廷举行的一场激动人心的仪式上，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]自号#italic 米尔米兰#!，向高门表明了其统治[GetCulture('kurdish').GetName]人民的意图。"
 haykfm_kurdistan.003.f: "#italic “若我们拥有一位常胜的领袖，  \n既慷慨又善言辞，  \n我们便会有自己的铸币，  \n不再贬值且令人怀疑。\n土耳其人无法统治我们，  \n我们的国家也不会沦为废墟。” ——库尔德诗人哈尼"
 haykfm_kurdistan.003.a: "伟大的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]万岁！"
 haykfm_kurdistan.004.t: "库尔德斯坦行省"
 haykfm_kurdistan.004.d: "面对日益高涨的[GetTechnology('nationalism').GetName]浪潮，苏丹已批准设立[SCOPE.sCountry('haykfm_kurdistan_scope').GetName]。通过将治理权移交地方总督，此举将使$turkfm_porte$得以将注意力转向其他事务。"
 haykfm_kurdistan.004.f: "“我恳求诸位，务必公正行事，竭尽全力对所有附属国施行正义，并以仁慈之心待人。你们应当尊重学者、虔诚信徒、长者及王公贵族。简而言之，你们需认清自我，避免破坏我们社会，我们家族历经数百年教训，以尊严与荣耀建立起的基业。遵守社会规范，行善与作恶皆由人之所为及其行动所生。”——巴班酋长阿卜杜勒拉赫曼·帕夏遗嘱（1789至1813年）"
 haykfm_kurdistan.004.a: "这将为我们的边疆带来秩序。"
 haykfm_kurdistan.005.t: "库尔德斯坦行省"
 haykfm_kurdistan.005.d: "[GetCulture('kurdish').GetName][GetTechnology('nationalism').GetName]终于结出硕果——[ROOT.GetCountry.GetName]宣告诞生。然而前路依然艰辛：部落山区地势崎岖且未开发，民众仍处于贫困与蒙昧之中。"
 haykfm_kurdistan.005.f: "“我恳求诸位，务必公正行事，竭尽全力对所有附属国施行正义，并以仁慈之心待人。你们应当尊重学者、虔诚信徒、长者及王公贵族。简而言之，你们需认清自我，避免破坏我们社会，我们家族历经数百年教训，以尊严与荣耀建立起的基业。遵守社会规范，行善与作恶皆由人之所为及其行动所生。”——巴班酋长阿卜杜勒拉赫曼·帕夏遗嘱（1789至1813年）"
 haykfm_kurdistan.005.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 haykfm_kurdistan.200.t: "团结库尔德人民"
 haykfm_kurdistan.200.d: "$gbbf_journal_lobby[GetCulture('kurdish').GetName]人民已经在这片土地上生活了无数世纪。随着[GetTechnology('nationalism').GetName]思想在各部落间传播，一个事实变得愈发清晰：库尔德人唯一的未来就是团结在统一的库尔德斯坦之下！"
 haykfm_kurdistan.200.f: "#italic “我们不惧你的士兵，\n我们不畏大不里士的统治者，\n我们的勇士永不后退。”#! ——节选自#italic 《迪姆迪姆》#!"
 haykfm_kurdistan.200.a: "[ROOT.GetCountry.GetName]必将团结[GetCulture('kurdish').GetName]人民！"
 haykfm_kurdistan.201.t: "库尔德斯坦的诞生"
 haykfm_kurdistan.201.d: "在[ROOT.GetCountry.GetName]勇士的英勇和外交官的智慧推动下，[GetCulture('kurdish').GetName]民族国家首次出现在历史中。[ROOT.GetCountry.GetCapital.GetCityHubName]民众为库尔德民族的崭新未来而欢呼。"
 haykfm_kurdistan.201.f: "“我们应当像勇士一样团结一致，牧人、农夫与君主之间不应有区别。”\n——库尔德诗人哈吉·卡迪尔"
 haykfm_kurdistan.201.a: "[GetCulture('kurdish').GetName]将创造自己的未来！"
 haykfm_kurdistan.202.t: "大库尔德斯坦之地"
 haykfm_kurdistan.202.d: ""
 haykfm_kurdistan.202.f: ""
 haykfm_kurdistan.202.a: "这片土地自古以来就属于我们。"