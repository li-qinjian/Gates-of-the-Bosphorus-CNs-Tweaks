 je_haykfm_kur_tribes_lobby: "$gbbf_journal_lobby$\n[GetCulture('kurdish').GetName]人一直以来都处于相对隔绝的状态，远离西方的中央集权力量。然而面对君士坦丁堡日益加大的压力，库尔德人唯有摆脱部族制度才能找到出路。"
