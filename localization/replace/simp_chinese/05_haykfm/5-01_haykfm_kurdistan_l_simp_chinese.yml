 haykfm_claim_miri_miran_desc: "[GetCulture('kurdish').GetName]人民分散在数十个小型部落领地中，未曾服从于任何统一的强权。随着新时代的曙光照耀世界，各部族首领的野心也随之觉醒，纷纷渴望被承认为库尔德斯坦的主宰。"
