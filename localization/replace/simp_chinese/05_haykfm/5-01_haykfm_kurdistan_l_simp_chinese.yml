 haykfm_organize_kurdistan_desc: "几个世纪以来，$turkfm_porte$一直试图对[GetCulture('kurdish').GetName]部落施加统治。由于难以直接统治，一些大臣建议将库尔德斯坦置于一位地方总督的管辖下，以此逐步削弱各部落的自治权。"