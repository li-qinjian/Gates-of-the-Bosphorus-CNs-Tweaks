l_simp_chinese:
 je_haykfm_kur_tribes: "库尔德斯坦的部落"
 je_haykfm_kur_tribes_reason: "[GetCulture('kurdish').GetName]人民长期以来相对独立，未受西方中央集权势力的强力介入。然而，随着来自君士坦丁堡的压力日益增强，[ROOT.GetCountry.GetNameNoFlag]已清楚认识到，唯有摆脱部族制度，方能迎向未来。"
 je_haykfm_kur_unification: "库尔德斯坦统一"
 je_haykfm_kur_unification_reason: "$gbbf_journal_lobby[GetCulture('kurdish').GetName]人民已经在这片土地上生活了无数世纪。随着[GetTechnology('nationalism').GetName]思想在各部落间传播，一个事实变得愈发清晰：库尔德人唯一的未来就是团结在统一的库尔德斯坦之下！"
