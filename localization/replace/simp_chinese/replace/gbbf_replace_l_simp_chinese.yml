 je_sick_man_syria: "病夫：收复叙利亚"
 je_sick_man_syria_reason: "僭越的埃及赫迪夫穆罕默德·阿里公然从奥斯曼帝国窃取了叙利亚和黎凡特地区。我们必须纠正这一冒犯苏丹权威的行径。"
 je_sick_man_egypt: "病夫：收复埃及"
 je_sick_man_egypt_reason: "几个世纪以来，埃及一直是哈里发国不可分割的一部分。现在是时候将埃及重新置于苏丹的直属统治之下了。"
 concept_bavarocratic_ire_desc: "$concept_bavarocratic_ire_short$代表希腊人民对$grefm_bavarocracy$的反对。高$concept_bavarocratic_ire_short$可能导致奥托国王和他的巴伐利亚支持者被赶下台。\n\n以下条件会#bold 增加#!$concept_bavarocratic_ire_short$：\n•维持#bold 巴伐利亚辅助军团#!\n•[GetCulture('south_german').GetName]$gbbf_commanders$或$gbbf_characters$[concept_in_government]\n•#bold 没有#![GetReligion('orthodox').GetName][concept_ruler]\n•[concept_ruler]#bold 没有#![concept_heir]\n•[concept_ruler]未婚\n•#bold 没有#!$gbbf_voting_rights$\n•$gbbf_battalions$数量少于#v 10#!\n•治下[GetCulture('greek').GetName][concept_homeland]$gbbf_states$的$gbbf_radicals$\n•宣布[concept_bankruptcy]或处于[concept_default]\n•近期#r 输过#![concept_war]\n•事件或按钮选择\n\n以下条件会#bold 减少#!$concept_bavarocratic_ire_short$：\n•拥有[GetCulture('greek').GetName][concept_homeland]$gbbf_states$\n•治下[GetCulture('greek').GetName][concept_homeland]$gbbf_states$的$gbbf_loyalists$\n•近期#g 赢过#![concept_war]\n•在[GetCulture('greek').GetName][concept_homeland][concept_state]拥有至少一座[GetBuildingType('building_university').GetName]\n•$gbbf_battalions$数量大于#v 20#!\n•正在建造[GetBuildingType('gbbf_building_palaia_anaktora').GetName]\n•解散#bold 巴伐利亚辅助军团#!\n•释放#bold 尼基塔拉斯#!\n•事件或按钮选择"
 je_greek_nationalism: "伟大理想"
 je_greek_nationalism_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\n从古希腊城邦时代到多民族的罗马与奥斯曼帝国时期，希腊人从未见过一个能让他们超越自己家乡村庄和地区认同的国家实体。在启蒙思想的引领下，两种对立运动应运而生，都试图将希腊人民凝聚在真正共同的身份认同之下。"
