l_simp_chinese:
 GRE_FLAVOR_TEXT: "希腊浴血苦战多年，终于挣脱奥斯曼帝国的枷锁，实现了独立。这个新生的国家，却被不得人心的巴伐利亚政权所统治着，希腊到底能不能稳住政局并拓展疆域呢？"
 ION_FLAVOR_TEXT: "这些岛屿在近30年来先后易主，从奥斯曼到$RUS_ADJ$，再到$FRA_ADJ$，最后归属于$GBR_ADJ$管辖。岛民们能否与新建立的希腊国家实现合并，还是将在$GBR_ADJ$引导下寻求新的发展道路？"
 BYZ: "希腊帝国"
 MON_FLAVOR_TEXT: "尽管被奥斯曼帝国包围数个世纪，黑山依旧延续至今。黑山以其土地的严酷和人民的骄傲而闻名，它能走出黑色山脉的阴影，并昂首向前吗？"
 SER_FLAVOR_TEXT: "塞尔维亚为自身的独立曾努力奋战，而且必然要继续斗争来维护独立。楔子一般塞在列强之间的塞尔维亚会成为欧洲火药桶吗？"
 MOL_FLAVOR_TEXT: "罗马尼亚领土统一和政治独立的呼声导致地区政治复杂万分，只因俄罗斯与奥斯曼都希望保持现状。罗马尼亚能赢得自由吗？"
 WAL_FLAVOR_TEXT: "罗马尼亚领土统一和政治独立的呼声导致地区政治复杂万分，只因俄罗斯与奥斯曼都希望保持现状。罗马尼亚能赢得自由吗？"
 TUR_FLAVOR_TEXT: "奥斯曼帝国正深陷危机。外有工业革命与帝国主义扩张之患，内有民族主义与停滞不前之忧。当苏丹试图将帝国改革重塑，使之能应对新时代挑战之际，举世目光皆聚焦于君士坦丁堡。奥斯曼帝国会成功实现其伟大重整，还是注定会重蹈拜占庭的覆辙？"
 TRI_FLAVOR_TEXT: "在经历长期事实独立后，的黎波里塔尼亚再度落入奥斯曼统治。沙漠中酝酿着不满，贝伊能否建立中央权威？"
 TUN_FLAVOR_TEXT: "突尼斯被迫停止庇护海盗劫掠，经济一落千丈。贝伊能重获繁荣吗？"