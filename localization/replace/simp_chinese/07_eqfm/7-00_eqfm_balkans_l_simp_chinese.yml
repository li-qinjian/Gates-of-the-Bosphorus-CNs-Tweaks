 eqfm_declare_loyalty_name: "宣誓效忠$turkfm_porte$"
 eqfm_declare_loyalty_desc: "[ROOT.GetCountry.GetName]在奥斯曼的统治下或许未能繁荣昌盛，但许多人心里都很清楚：与帝国决裂，极有可能在国家迎来繁荣之前，就先将其推向毁灭的深渊。"
