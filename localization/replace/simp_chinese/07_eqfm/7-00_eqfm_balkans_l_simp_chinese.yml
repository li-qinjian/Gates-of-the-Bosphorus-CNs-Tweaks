 eqfm_deescalation_factors: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_deescalation_factors_desc')] 升级因素#!#!"
 eqfm_deescalation_factors_desc: "#white #bold 每月来源：#!#!\n•#bold #green +1#!：#!基础每月进度\n•#bold #green +0.1x#!：#!$eqfm_balkan_cultures$的平均[concept_loyalist]$gbbf_pops$（最多+8）\n•#bold #green +0.1#!：#!奥斯曼政府[concept_legitimacy]高于70（最多+3）\n•#bold #green +1x#!：#!正在#bold 缓和紧张局势#!的$gbbf_great_powers$数量\n•#bold #green +1x#!：#!资助一个位于[GetStrategicRegion('region_balkans').GetName]的[concept_subject]（每月）\n#white #bold 即时来源：#!#!\n•#bold #green +3#!：#!作为奥斯曼对一个非[concept_great_power]强制执行[concept_war_goal]\n•#bold #green +5#!：#!作为奥斯曼对一个[concept_great_power]强制执行[concept_war_goal]\n•#bold #green +10#!：#!提高一个[GetStrategicRegion('region_balkans').GetName][concept_subject]的[concept_autonomy]\n•#bold #green +10#!：#!作为一个[concept_great_power]与奥斯曼缔结[concept_alliance]\n•#bold #green +10#!：#!提高一个[GetStrategicRegion('region_balkans').GetName][concept_subject]的[concept_autonomy]\n•#bold #green +25#!：#!给予一个[GetStrategicRegion('region_balkans').GetName]附属国独立"
