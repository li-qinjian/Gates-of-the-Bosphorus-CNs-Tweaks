 eqfm_balkan_situation_desc: "#header @gbbf_nationalism!巴尔干局势#!$gbbf_linebreak_normal$#bold 巴尔干局势#!代表着$turkfm_porte$在[GetStrategicRegion('region_balkans').GetName]面临着[GetTechnology('nationalism').GetName]浪潮的冲击，为守住领土持续进行的斗争。\n\n#lore 人们普遍认为，曾经辉煌的#bold 奥斯曼帝国#!已经衰落。希腊和塞尔维亚的革命和埃及起义的冲击，令$turkfm_sublime_porte$的权威备受质疑。屈辱的《亚德里亚堡和约》和《屈塔希亚公约》使奥斯曼帝国蒙受耻辱，许多人预感到苏丹国即将瓦解。奥斯曼帝国中央正努力抵御列强的进攻，而其#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干附属国#!#!则伺机摆脱奥斯曼帝国的统治。#!"
