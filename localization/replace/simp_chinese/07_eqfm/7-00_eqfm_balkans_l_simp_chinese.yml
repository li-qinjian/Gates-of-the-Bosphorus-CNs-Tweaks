 je_eqfm_balkan_powder_keg_flavor_base: "随着[GetTechnology('nationalism').GetName]的理念在帝国全境扎根，[GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag]的臣民变得日益反叛。帝国已因$GRE$和$SER$的反叛而动摇，且$RUS_ADJ$帝国已在$ROM_ADJ$公国确立了主导地位。如今，所有人的目光都转向$turkfm_porte$，看其能否驯服其[GetReligion('orthodox').GetName]臣民。\n$gbbf_delimiter_normal$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_escalation_progress_type')][GetPlayer.GetCustom('eqfm_balkan_powder_keg_deescalation_progress_type')]"
 je_eqfm_balkan_powder_keg_flavor_crisis: "一场$eqfm_crisis$正在$gbbf_georegion_rumelia$酝酿，$gbbf_secessionists$正在危及帝国的统治，这迫使$eqfm_outsider$列强必须确立对鲁米利亚的权威。\n\n@information![concept_ottoman_integrity]目前为#v [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_crisis_var')).GetValue]/[GetPlayer.MakeScope.ScriptValue('eqfm_balkan_powder_keg_crisis_max_value')]#!。预计下个月将改变#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_balkan_powder_keg_crisis_breakdown [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_crisis_progress_var')).GetValue|+=]#!。"
