 eqfm_interloper_desc: "一个[concept_country]若满足以下任一条件，即被视为$eqfm_balkan_situation$中的#bold 局外干涉者#!：\n•未被归为$eqfm_involved$\n•在[GetStrategicRegion('region_balkans').GetName]拥有的[concept_interest_tier]达到[GetInterestTierType('interest_tier_observant').GetName]或更高\n\n@information!#italic 不同的介入程度将赋予您采取不同行动的权限。#!"
 eqfm_uninvolved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_uninvolved_desc')] 无关方#!#!"
 eqfm_uninvolved_desc: "一个#bold 未介入#!的[concept_country]在$eqfm_balkan_situation$的结局中没有任何利益交织。\n\n一个国家可以通过以下方式成为$eqfm_interloper$：\n•在[GetStrategicRegion('region_balkans').GetName]拥有的[concept_interest_tier]达到[GetInterestTierType('interest_tier_observant').GetName]或更高\n\n一个国家可以通过以下方式成为$eqfm_involved$：\n•是#bold 奥斯曼帝国#!的[concept_subject]\n•在[GetStrategicRegion('region_balkans').GetName]拥有的[concept_interest_tier]达到[GetInterestTierType('interest_tier_engaged').GetName]或更高\n@information!#italic 基于局势本身，#bold 奥斯曼帝国#!始终处于介入状态#!\n\n@information!#italic 不同的介入程度将赋予您采取不同行动的权限。#!"
 eqfm_balkan_cultures: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干文化#!#!"
 eqfm_balkan_cultures_desc: "#header 巴尔干文化：#!$gbbf_linebreak_normal$•[GetCulture('greek').GetName]\n•[GetCulture('rhomaios').GetName]\n•[GetCulture('serb').GetName]\n•[GetCulture('bulgarian').GetName]\n•[GetCulture('romanian').GetName]\n•[GetCulture('albanian').GetName]\n•[GetCulture('bosniak').GetName]\n•[GetCulture('croat').GetName]\n•[GetCulture('slovene').GetName]\n•[GetCulture('romanyotim').GetName]"
 eqfm_balkan_culture: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干文化#!#!"
 eqfm_balkan_native: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干原住民#!#!"
 eqfm_balkan_natives: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干原住民#!#!"
 eqfm_balkan_subjects: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] 巴尔干附属国#!#!"
 eqfm_stable: "@gbbf_stable!#bold #green #tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] 稳定#!#!#!"
 eqfm_stable_desc: "@gbbf_stable!#bold #green 稳定#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的一个阶段。\n\n在$eqfm_deconfliction$阶段化解了剑拔弩张的冲突之后，两地民众却又在时间的推移中，逐渐回想起最初究竟是为何而大打出手。长此往复，层出不穷的摩擦与误解终将导致局势再度升级，从而不可避免地滑向$eqfm_unrest$阶段。$gbbf_linebreak_normal$该阶段将提供以下效果：\n[GetStaticModifier('modifier_eqfm_stable_phase').GetDesc]"
 eqfm_unrest: "@gbbf_unrest!#bold #yellow #tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] 动荡#!#!#!"
 eqfm_unrest_desc: "@gbbf_unrest!#bold #yellow 动荡#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的一个阶段。\n\n恐惧与偏执再次蔓延，驱使着[GetStrategicRegion('region_balkans').GetName]的各族民众与他们的[GetCulture('turkish').GetName]统治者爆发冲突。随着歧视与欺瞒在市井街巷中大行其道，任何风吹草动都将导致局势再度升级，从而滑向$eqfm_hostility$阶段。$gbbf_linebreak_normal$该阶段将提供以下效果：\n[GetStaticModifier('modifier_eqfm_unrest_phase').GetDesc]"
 eqfm_hostility: "@gbbf_hostility!#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] 敌对#!#!#!"
 eqfm_hostility_desc: "@gbbf_hostility!#bold #red 敌对#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的一个阶段。\n\n随着对奥斯曼统治的普遍抵触彻底根深蒂固，流血暴力在[GetStrategicRegion('region_balkans').GetName]境内已成家常便饭。倘若[GetTechnology('nationalism').GetName]已在帝国全境生根发芽，且$turkfm_porte$仍旧未能恢复秩序，局势便极有可能进一步激化，从而升级至$eqfm_crisis$阶段。反之，若这些剑拔弩张的紧张对峙最终未能爆发，它们也终将逐渐平息，从而降级回$eqfm_deconfliction$阶段。$gbbf_linebreak_normal$该阶段将提供以下效果：\n[GetStaticModifier('modifier_eqfm_hostility_phase').GetDesc][GetPlayer.GetCustom('eqfm_crisis_ip3_type')]"
 eqfm_deconfliction: "@gbbf_deconfliction!#bold #greece #tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] 缓和#!#!#!"
 eqfm_deconfliction_desc: "@gbbf_deconfliction!#bold #greece 缓和#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的一个阶段。\n\n在席卷各地的流血暴力过后，积压已久的紧张局势最终在城镇与乡野的混乱与毁灭中宣泄殆尽。随着贵族与平民纷纷回归往常的生计，许多人开始反思，局势究竟是如何一步步恶化到如此失控的地步。然而，这种痛定思痛的缓和情绪绝非长久之计，随着时间推移，局势终将自然回升至$eqfm_stable$阶段。$gbbf_linebreak_normal$该阶段将提供以下效果：\n[GetStaticModifier('modifier_eqfm_deconfliction_phase').GetDesc]"
 eqfm_crisis: "@gbbf_crisis!#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] 危机#!#!#!"
 eqfm_crisis_desc: "@gbbf_crisis!#bold #red 危机#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的一个阶段。\n\n历经数年的层层积怨，紧张局势终于彻底失控爆发，[GetReligion('orthodox').GetName]与[GetReligion('jewish').GetName]臣民正试图不惜一切代价，彻底推翻$turkfm_porte$的统治。随着国际社会的目光悉数聚焦于[GetStrategicRegion('region_balkans').GetName]，奥斯曼帝国在鲁米利亚的本土正面临着民间各阶层风起云涌的强烈反抗。此时，$gbbf_great_powers$将获得干预此地局势的绝佳契机，无论是选择撑腰合谋还是横加阻挠。反之，若这些剑拔弩张的紧张对峙最终未能爆发，它们也终将逐渐平息，从而降级回$eqfm_deconfliction$阶段。$gbbf_linebreak_normal$该阶段将提供以下效果：\n[GetStaticModifier('modifier_eqfm_crisis_phase').GetDesc]\n\n#italic 如果#bold 危机进度#!达到#bold 100#!，战争将全面爆发。#![GetPlayer.GetCustom('eqfm_crisis_ip3_type')]"
