 je_eqfm_balkan_situation_flavor_base: "#lore 随着[GetTechnology('nationalism').GetName]的理念在整个帝国扎根，[GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag]的附属国正变得越来越叛逆。帝国已经因$GRE$和$SER$的叛乱而动摇，$RUS_ADJ$帝国也已在$ROM_ADJ$诸公国确立了其宗主地位。如今，所有人的目光都转向$turkfm_porte$，且看其如何让那些桀骜不驯[GetReligion('orthodox').GetName]附属国俯首听命。#!"
 je_eqfm_balkan_situation_details_base: "#bold #white 当前阶段#!：#![GetPlayer.GetCustom('eqfm_balkans_phase_details_type')]\n\n[GetPlayer.GetCustom('eqfm_balkans_next_phase_progress_type')]$gbbf_linebreak_normal$[GetPlayer.GetCustom('eqfm_balkans_next_phase_factors_type')]"
 je_eqfm_journal_body_crisis: "$je_eqfm_balkan_situation_flavor_crisis$$gbbf_linebreak_normal$$je_eqfm_balkan_situation_details_crisis$"
 je_eqfm_balkan_situation_flavor_crisis: "#lore 一场$eqfm_crisis$正在[GetStrategicRegion('region_balkans').GetName]酝酿，[GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag]必须重申其对鲁米利亚的权威，因为$gbbf_secessionists$正危及[GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetAdjectiveNoFormatting]的统治。骚乱必须在蔓延至整个地区乃至帝国全境之前得到平息。#!"
 je_eqfm_balkan_situation_details_crisis: "#bold #white 当前阶段#!：#![GetPlayer.GetCustom('eqfm_balkans_phase_details_type')]\n\n@information![concept_ottoman_integrity]为#v [GetGlobalVariable('eqfm_balkan_situation').Var('eqfm_crisis_var').GetValue]／250#!。预计下月将变化#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_balkan_situation_crisis_breakdown [GetGlobalVariable('eqfm_balkan_situation').Var('eqfm_crisis_progress_var').GetValue|+=]#!。\n\n[GetPlayer.GetCustom('eqfm_balkans_next_phase_progress_type')]$gbbf_linebreak_normal$[GetPlayer.GetCustom('eqfm_balkans_next_phase_factors_type')]"
 je_eqfm_balkan_situation_lobby: "$gbbf_journal_lobby$\n随着[GetTechnology('nationalism').GetName]的理念在整个帝国扎根，奥斯曼帝国的附属国正变得越来越叛逆。帝国已经因希腊和塞尔维亚的叛乱而动摇，$RUS_ADJ$帝国也已在罗马尼亚诸公国确立了其宗主地位。如今，所有人的目光都转向#bold 苏丹#!，且看其如何让那些桀骜不驯[GetReligion('orthodox').GetName]附属国俯首听命。"
