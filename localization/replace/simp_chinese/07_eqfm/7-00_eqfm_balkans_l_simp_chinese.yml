 eqfm_balkan_situation: "@gbbf_nationalism!#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] $je_eqfm_balkan_powder_keg$#!#!"
 eqfm_balkan_situation_desc: "#header @gbbf_nationalism!$je_eqfm_balkan_powder_keg$#!$gbbf_linebreak_normal$#bold $je_eqfm_balkan_powder_keg$#!代表着在[GetTechnology('nationalism').GetName]浪潮冲击下，$eqfm_outsider$政权为保留其在$gbbf_georegion_rumelia$的领地而持续进行的斗争。\n\n#lore 普遍认为，#bold 奥斯曼帝国#!已经失势。帝国受到希腊和塞尔维亚革命的冲击，又在埃及起义中摇摇欲坠，$turkfm_sublime_porte$的权威受到了质疑。随着帝国在《阿德里安堡条约》与《屈塔希亚协定》中备受侮辱，许多人预计苏丹国即将解体。中央政府在面对列强时难以组织起有效防御，而其#o #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] 巴尔干附庸#!#!则伺机挣脱帝国的枷锁。#!"
 eqfm_balkan_situation_no_icon: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] $je_eqfm_balkan_powder_keg$#!#!"
 eqfm_involved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_involved_desc')] 参与者#!#!"
 eqfm_involved_desc: "在$eqfm_balkan_situation$中的一种$gbbf_balkans_involvement$程度。#bold 参与#!的$gbbf_countries$因其自身处境自然而然地卷入了这场动荡的$com_situation$中。这些参与者受$gbbf_georegion_rumelia$发生的事件影响最大，也最能够直接影响局势的发展进程。$com_ttdl$某[concept_country]若满足以下任一条件即可成为#bold 参与#!者：$com_bp$在$gbbf_georegion_rumelia$拥有[concept_state]$com_bp$是$gbbf_georegion_rumelia$内某[concept_country]的[concept_overlord]$com_bp$在$gbbf_strat_region_balkans$拥有#v 5级或以上#!的[concept_interest_tier]\n@information!#italic 根据你的参与程度，可用的行动将有所不同。#!"
 eqfm_interloper: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_interloper_desc')] 干涉者#!#!"
 eqfm_interloper_desc: "在$eqfm_balkan_situation$中的一种$gbbf_balkans_involvement$程度。#bold 干涉者#!$gbbf_countries$部分卷入了这场$com_situation$，但对事件发展几乎没有直接影响力。这些参与者通常不受$gbbf_georegion_rumelia$局势发展的影响，但可能会因政治巧合而被牵扯进来。$com_ttdl$某[concept_country]若满足以下条件即可成为#bold 干涉者#!：$com_bp$在$gbbf_strat_region_balkans$拥有#v 3级或以上#!的[concept_interest_tier]且并非$eqfm_involved$\n@information!#italic 根据你的参与程度，可用的行动将有所不同。#!"
 eqfm_uninvolved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_uninvolved_desc')] 未参与#!#!"
 eqfm_uninvolved_desc: "在$eqfm_balkan_situation$中的一种$gbbf_balkans_involvement$程度。一个#bold 未参与#!的[concept_country]与$eqfm_balkan_situation$的结果没有任何利益关联。这些国家不受$gbbf_georegion_rumelia$事件的影响。\n\n@information!#italic 根据你的参与程度，可用的行动将有所不同。#!"
 eqfm_stable: "@gbbf_stable!#bold #green #tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] 稳定#!#!#!"
 eqfm_stable_desc: "@gbbf_stable! #bold #green 稳定#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的阶段之一。\n\n在$eqfm_deconfliction$阶段修复了受损的关系之后，人们开始慢慢想起最初是什么让他们大打出手的。最终，争端与误解将导致局势升级至$eqfm_unrest$阶段。$gbbf_linebreak_normal$$eqfm_stable_effects$"
 eqfm_unrest: "@gbbf_unrest!#bold #yellow #tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] 动荡#!#!#!"
 eqfm_unrest_desc: "@gbbf_unrest!#bold #yellow 动荡#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的阶段之一。\n\n恐惧与偏执再次使$gbbf_georegion_rumelia$的人民与其[GetCulture('turkish').GetName]统治者发生冲突。随着歧视与欺瞒在街头蔓延，进一步的侮辱将导致局势升级至$eqfm_hostility$阶段。$gbbf_linebreak_normal$$eqfm_unrest_effects$"
 eqfm_hostility: "@gbbf_hostility!#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] 敌对#!#!#!"
 eqfm_hostility_desc: "@gbbf_hostility!#bold #red 敌对#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的阶段之一。\n\n随着对奥斯曼统治的普遍排斥扎根，暴力活动在$gbbf_georegion_rumelia$全境已成为常态。如果[GetTechnology('nationalism').GetName]已在帝国扎根，且$eqfm_outsider$$gbbf_great_powers$未能恢复秩序，这可能会导致局势升级至$eqfm_crisis$阶段。如果这些紧张局势未能得到解决，它们最终将逐渐平息，从而降级至$eqfm_deconfliction$阶段。$gbbf_linebreak_normal$$eqfm_hostility_effects$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_crisis_ip3_dependency_type')]"
 eqfm_deconfliction: "@gbbf_deconfliction!#bold #greece #tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] 缓和#!#!#!"
 eqfm_deconfliction_desc: "@gbbf_deconfliction!#bold #greece 缓和#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的阶段之一。\n\n在广泛的暴力事件之后，紧张局势通过城市和乡村的混乱与破坏得到了宣泄。当贵族和平民都回归日常生活时，许多人都在质问局势何以发展到如此不可收拾的地步。这些和解的情绪不会永远持续下去，最终将自然升级至$eqfm_stable$阶段。$gbbf_linebreak_normal$$eqfm_deconfliction_effects$"
 eqfm_crisis: "@gbbf_crisis!#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] 危机#!#!#!"
 eqfm_crisis_desc: "@gbbf_crisis!#bold #red 危机#!#!$gbbf_linebreak_normal$$eqfm_balkan_situation$的阶段之一。\n\n经过多年的积聚，紧张局势终于彻底爆发，[GetReligion('orthodox').GetName]与[GetReligion('jewish').GetName]人口试图不惜一切代价推翻$turkfm_porte$的统治。随着国际社会将目光聚焦于$gbbf_georegion_rumelia$，奥斯曼帝国正面临着鲁米利亚臣民普遍的不满。$gbbf_great_powers$将有机会支持或阻碍这些运动。如果这些紧张局势得不到解决，它们最终将逐渐熄灭，从而降级至$eqfm_deconfliction$阶段。$gbbf_linebreak_normal$$eqfm_crisis_effects$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_crisis_ip3_dependency_type')]"
 eqfm_crisis_defender: "[ROOT.GetCountry.GetNameNoFlag]#o #tooltip:[GetRawTextTooltipTag('eqfm_crisis_defender_tt')] 支持#!#!奥斯曼"
 eqfm_crisis_defender_tt: "如果#bold 危机进度#!达到#bold 100#!，[ROOT.GetCountry.GetNameNoFlag]将加入战争支持奥斯曼。"
 eqfm_crisis_attacker: "[ROOT.GetCountry.GetNameNoFlag]#o #tooltip:[GetRawTextTooltipTag('eqfm_crisis_attacker_tt')] 反对#!#!奥斯曼"
 eqfm_crisis_attacker_tt: "如果#bold 危机进度#!达到#bold 100#!，[ROOT.GetCountry.GetNameNoFlag]将加入战争反对奥斯曼。由于我们在所有参战国中不具有最高的[concept_prestige]，我们不会成为[concept_diplomatic_play]领袖。"
