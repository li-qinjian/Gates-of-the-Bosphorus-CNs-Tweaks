 eqfm_accelerate_tensions_name: "#o #tooltip:[GetRawTextTooltipTag('gbbf_accelerate_tensions_desc')] $gbbf_accelerate_tensions$#!#!"
 eqfm_accelerate_tensions_desc: "巴尔干地区民族矛盾尖锐，当地各民族在反抗奥斯曼统治的过程中确立自身认同。为支持我们对抗奥斯曼人的事业，可投入资源资助这些分裂运动。"
 eqfm_decelerate_tensions_name: "#o #tooltip:[GetRawTextTooltipTag('gbbf_decelerate_tensions_desc')] $gbbf_decelerate_tensions$#!#!"
 eqfm_decelerate_tensions_desc: "巴尔干各地频发的冲突，既威胁着国际秩序，也危及这片土地上人民的繁荣。若要向奥斯曼帝国提供切实有效的支持，我们就应当投入资源，遏制这些分离主义思潮。"
 eqfm_tension_effect: "#red [ROOT.GetCountry.GetName]两年内无法改变其激化或缓和的立场！#!"
 eqfm_declare_disloyalty_name: "宣誓叛离$turkfm_porte$"
