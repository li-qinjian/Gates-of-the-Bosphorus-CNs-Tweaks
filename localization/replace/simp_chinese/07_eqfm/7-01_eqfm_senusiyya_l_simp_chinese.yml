 notification_eqfm_senusiyya_spreads_to_country_desc: "与$eqfm_senusiyya_movement$相关的游方修士已在[SCOPE.sCountry('eqfm_senusiyya_country_scope').GetNameNoFlag]政府内外定居下来。"
 notification_eqfm_senusiyya_spreads_to_state_region_name: "$eqfm_senusiyya_movement$蔓延至[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]。"
 notification_eqfm_senusiyya_spreads_to_state_region_desc: "效忠$eqfm_senusiyya_movement$的玛拉布已开始在[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]传播他们的教义。他们受到了当地游牧民的热烈欢迎。"
 notification_eqfm_senusiyya_yearly_progress_name: "$eqfm_senusiyya_expedition$取得进展"
 notification_eqfm_senusiyya_yearly_progress_desc: "尽管沙漠环境恶劣，但$eqfm_senusiyya_expedition$还是获得了#bold #green 1#!#!$eqfm_expedition_progress$。"
 eqfm_broker_power_deal_name: "与部落达成交易"
 eqfm_broker_power_deal_desc: "西部沙漠是[GetCulture('bedouin').GetName]游牧民族的家园。没有他们的合作，任何殖民或中央集权的企图都注定会失败。然而，他们的顺从往往需要付出代价。"
 eqfm_adopt_welcoming_stance_name: "@green_checkmark!认可$eqfm_senusiyya_no_icon$"
 eqfm_adopt_welcoming_stance_desc: "$eqfm_senusiyya_movement$代表了抵抗西方列强殖民威胁的有组织力量。赋予阿萨努西的信徒权力可能就是我们生存下去的最大机会。"
 eqfm_adopt_welcoming_stance_effect_1: "任何来自[concept_legitimacy]的每月进度都将被计入#bold 支持#![ROOT.GetCountry.GetNameNoFlag]$eqfm_senusiyya_influence$的一方"
 eqfm_adopt_welcoming_stance_effect_2: "[ROOT.GetCountry.GetNameNoFlag]可能会遇到更多#bold 增加#！$eqfm_senusiyya_influence_short$和$eqfm_senusiyya_entrenchment_short$的事件"
 eqfm_adopt_aloof_stance_name: "@politically_unaligned!无视$eqfm_senusiyya_no_icon$"
 eqfm_adopt_aloof_stance_desc: "尽管他们言辞激烈，但国家不应在$eqfm_senusiyya_movement$的问题上采取任何立场。"
 eqfm_adopt_aloof_stance_effect_1: "任何来自[concept_legitimacy]的每月进度都#bold 不会被计入#![ROOT.GetCountry.GetNameNoFlag]的$eqfm_senusiyya_influence$增长中"
 eqfm_adopt_hostile_stance_name: "@red_cross!反对$eqfm_senusiyya_no_icon$"
 eqfm_adopt_hostile_stance_desc: "鉴于其对正统伊斯兰教的排斥，$eqfm_senusiyya_movement$对国家稳定构成了严重威胁。我们应当采取果断行动限制其影响力。"
 eqfm_adopt_hostile_stance_effect_1: "任何来自[concept_legitimacy]的每月进度都将被计入#bold 反对#![ROOT.GetCountry.GetNameNoFlag]$eqfm_senusiyya_influence$的一方"
 eqfm_adopt_hostile_stance_effect_2: "[ROOT.GetCountry.GetNameNoFlag]可能会遇到更多#bold 减少#！$eqfm_senusiyya_influence_short$和$eqfm_senusiyya_entrenchment_short$的事件"
