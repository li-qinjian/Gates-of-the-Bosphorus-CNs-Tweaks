 je_eqfm_senusiyya_lobby: "$gbbf_journal_lobby$\n与阿拉伯世界的许多地方一样，利比亚的精神生活由乌理玛主导。然而在广袤的[GetStateRegion('STATE_LIBYAN_DESERT').GetName]，精神生活通常以[GetCharacterTrait('gbbf_trait_marabout').GetName]为中心。在$turkfm_porte$日益增加的压力下，$eqfm_senusiyya_movement$在[GetCulture('bedouin').GetName]人中获得了吸引力。"
