 je_eqfm_senusiyya_expedition_reason: "[ROOT.GetCountry.GetNameNoFlag]已部署一支$eqfm_expedition$，以镇压并驱逐$eqfm_senusiyya_entrenched$的$eqfm_senusiyya_movement$信徒。"
