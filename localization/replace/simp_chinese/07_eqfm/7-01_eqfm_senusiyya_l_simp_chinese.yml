 je_eqfm_senusiyya_flavor: "与阿拉伯世界的许多地方一样，北非大部分地区的精神生活都由乌理玛主导。然而在[GetGeographicRegion('geographic_region_senusiyya').GetName][concept_georegion]，精神生活通常以被称为[GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow 们#!的游方修士为中心。在$turkfm_porte$日益增加的压力下，$eqfm_senusiyya_movement$在[GetCulture('bedouin').GetName]人中获得了吸引力，并沿着玛拉布的足迹不断蔓延。"
 je_eqfm_senusiyya_influence: "$gbbf_linebreak_normal$$eqfm_senusiyya_movement$对[ROOT.GetCountry.GetCapital.GetCityHubName]的政府拥有[GetPlayer.MakeScope.Var('eqfm_senusiyya_influence_var').GetValue]的影响力。预计下个月将变动[GetPlayer.MakeScope.Var('eqfm_senusiyya_influence_progress_var').GetValue|+-]。\n\n@information!当$eqfm_senusiyya_influence_short$达到最大值时，$eqfm_senusiyya_movement$将提供以下效果：\n[GetStaticModifier('modifier_eqfm_senussi_nationalism').GetDesc]"
 je_eqfm_senusiyya_pressure: "$gbbf_linebreak_normal$#white 在[GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]的领导下，$eqfm_senusiyya_movement$正在施加[GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senusiyya_pressure_var').GetValue]$eqfm_senusiyya_pressure_short$。预计下个月将变动#tooltippable;tooltip:[GetPlayer.GetTooltipTag],eqfm_senusiyya_pressure_progress_breakdown [GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senusiyya_pressure_progress_var').GetValue]#!。#!\n\n@information!当$eqfm_senusiyya_pressure_short$达到最大值时，$eqfm_senusiyya_movement$将提供以下效果：\n[GetStaticModifier('modifier_eqfm_senusiyya_movement').GetDesc]"
 je_eqfm_senusiyya_entrenchment: "$gbbf_linebreak_normal$$eqfm_senusiyya_movement$在整个[GetGeographicRegion('geographic_region_senusiyya').GetName][concept_georegion]拥有以下$eqfm_senusiyya_entrenchment_short$：\n•[GetPlayer.GetCustom('eqfm_senusiyya_libya_type')]\n•[GetPlayer.GetCustom('eqfm_senusiyya_libyan_desert_type')]\n•[GetPlayer.GetCustom('eqfm_senusiyya_tripoli_type')]\n•[GetPlayer.GetCustom('eqfm_senusiyya_egyptian_desert_type')]\n•[GetPlayer.GetCustom('eqfm_senusiyya_matruh_type')]\n•[GetPlayer.GetCustom('eqfm_senusiyya_chad_type')]"
