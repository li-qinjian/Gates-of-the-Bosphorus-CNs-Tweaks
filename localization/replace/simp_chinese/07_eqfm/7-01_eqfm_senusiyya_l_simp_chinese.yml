 eqfm_expell_senusiyya_desc: "$eqfm_senusiyya_movement$已被赶出我们的城市，逃入沙漠深处。剩下要做的就是围捕他们最后的支持者，查封他们最后的修道院，彻底消灭这些激进分子。"
 eqfm_sweep_senusiyya_possible: "$eqfm_senusiyya_movement$在[ROOT.GetCountry.GetNameNoFlag]拥有#bold 0或更少#!的$eqfm_senusiyya_influence_short$"
