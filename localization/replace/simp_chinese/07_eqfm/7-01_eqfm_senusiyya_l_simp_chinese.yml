 eqfm_adopt_stance_effect: "[ROOT.GetCountry.GetNameNoFlag]将在#v 1年#!内无法改变其对$eqfm_senusiyya$的立场"
 eqfm_embrace_senusiyya_name: "在[ROOT.GetCountry.GetName]拥抱$eqfm_senusiyya$"
 eqfm_embrace_senusiyya_desc: "$eqfm_senusiyya_movement$已渗透进[ROOT.GetCountry.GetAdjectiveNoFlag]社会的方方面面。摆脱土耳其统治的传统，拥抱[ROOT.GetCountry.GetNameNoFormatting]新未来的时刻已然到来。"
 eqfm_embrace_senusiyya_possible: "对$eqfm_senusiyya$的支持已达到#bold 最高值#！"
