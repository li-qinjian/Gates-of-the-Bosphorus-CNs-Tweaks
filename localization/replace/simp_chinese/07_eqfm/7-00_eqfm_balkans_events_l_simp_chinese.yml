l_simp_chinese:
 eqfm_balkans.001.t: "帝国子民"
 eqfm_balkans.001.d: "[ROOT.GetCountry.GetName]陷入动乱，其 [GetCulture('turkish').GetName]统治阶级与其众多[GetReligion('orthodox').GetName]和[GetReligion('jewish').GetName]人口之间出现了深深的裂痕。"
 eqfm_balkans.001.f: "随着[GetTechnology('nationalism').GetName]理念在[GetStrategicRegion('region_balkans').GetName]传播，许多民族开始憧憬自主决定自己命运的未来，不再受[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和[ROOT.GetCountry.GetRuler.GetHerHis]宫廷控制的未来，摇摇欲坠的帝国官僚机构需要竭尽全力，才能贯彻国家和[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的意志。\n\n#white [ROOT.GetCountry.GetNameNoFlag]正以[SCOPE.GetRootScope.GetCountry.GetCustom('eqfm_tension_involvement_type')]的身份介入$eqfm_balkan_situation$。#!\n\n目前[GetStrategicRegion('region_balkans').GetName]正处于$eqfm_tension_status_short$阶段。\n\n#italic [ROOT.GetCountry.GetAdjectiveNoFlag]的行动与其他参与方的行为将决定冲突的后续阶段及其最终结局。#!"
 eqfm_balkans.001.a: "我们将在我们的时代迎来和平。"
 eqfm_balkans.002.t: "民族主义的兴起"
 eqfm_balkans.002.d: "一股[GetTechnology('nationalism').GetName]的浪潮席卷了[GetStrategicRegion('region_balkans').GetName]，而我们几乎无法将其驱除。"
 eqfm_balkans.002.f: "动荡消息在宫廷中不断涌现，苏丹的核心圈子一致认为，阻止动荡浪潮的唯一方法就是证明奥斯曼帝国是一个更好的选择。"
 eqfm_balkans.002.a: "真是令人不安……"
 eqfm_balkans.003.t: "民族主义运动愈演愈烈"
 eqfm_balkans.003.d: "随[GetTechnology('nationalism').GetName]的兴起，无数的[GetTechnology('pan-nationalism').GetName]浪潮开始汇聚。各地总督们纷纷表示担忧，认为遏制异议变得越来越困难。"
 eqfm_balkans.003.f: "日复一日，[GetStrategicRegion('region_balkans').GetName]人民发现是因彼此之间共同点而团结在一起，而不是因为$turkfm_porte$。"
 eqfm_balkans.003.a: "我们必须维持秩序。"
 eqfm_balkans.005.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的暴动"
 eqfm_balkans.005.d: "[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]爆发了暴乱。与以往的骚乱不同，这次当地人已经开始在全城竖起路障。"
 eqfm_balkans.005.f: "虽然自神圣同盟战败后，针对奥斯曼帝国统治的起义就层出不穷，但最近起义却带有更强烈的民族主义色彩。"
 eqfm_balkans.005.a: "派遣正规军"
 eqfm_balkans.005.tt: "如果#bold 民族主义叛乱#![concept_journal_entry]进度条达到#bold 200#!，叛军将拿起武器反抗[ROOT.GetCountry.GetAdjectiveNoFlag]的统治。"
 eqfm_balkans.006.t: "[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjective]叛乱"
 eqfm_balkans.006.d: "我们在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetName]的驻军已经崩溃。[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjectiveNoFlag]人民在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetCityHubName]升起国旗，感染宣布从[ROOT.GetCountry.GetName]独立。"
 eqfm_balkans.006.f: "我们的军队被彻底驱逐，动摇了[ROOT.GetCountry.GetAdjective]对巴尔干地区统治权的信心。如果我们要确保继续统治鲁米利亚，就必须采取果断行动。"
 eqfm_balkans.006.a: "我们将粉碎这些叛军！"
 eqfm_balkans.006.b: "[SCOPE.sCountry('eqfm_rebellion_scope').GetName]应当自治。"
 eqfm_balkans.007.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的叛乱已被镇压"
 eqfm_balkans.007.d: "[SCOPE.sState('eqfm_riot_state_scope').GetName]好消息传来，驻军指挥官报告称已成功平息[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的最后一批激进分子。"
 eqfm_balkans.007.f: "叛乱组织者被我们关押后，对他们的审判将成为极好的公开素材，从而宣传我们在巴尔干地区的权威。"
 eqfm_balkans.007.a: "干得漂亮"
 eqfm_balkans.008.t: "丢失鲁米利亚"
 eqfm_balkans.008.d: "随着我们权威的瓦解，整个鲁梅利亚的国家政府也随之解体。巴尔干诸国摆脱了我们的控制，像鬣狗一样在黑暗中叫嚣。"
 eqfm_balkans.008.f: "没有奥斯曼帝国干预，也没有奥地利和$RUS_ADJ$使节的影响，巴尔干地区已经从东方解脱，希望重新加入欧洲行列。"
 eqfm_balkans.008.a: "我们的任何希望都寄托在真主身上。"
 eqfm_balkans.009.t: "鲁米利亚的统治"
 eqfm_balkans.009.d: "尽管$turkfm_porte$面临着巨大的挑战，不过[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的军队还是成功遏制了分裂主义，而且还将#yellow [ROOT.GetCountry.GetAdjective]#!推举为巴尔干半岛的最高力量"
 eqfm_balkans.009.f: "尽管几个世纪[ROOT.GetCountry.GetName]都面临西方的挑战，不过仍将巴尔干地区确立为真正的奥斯曼领土。"
 eqfm_balkans.009.a: "哈里发是永恒的！"
 eqfm_balkans.011.t: "东方问题"
 eqfm_balkans.011.d: "整个欧洲都确信[SCOPE.sCountry('ottoman_scope').GetName]正在衰落。随着不满情绪在整个帝国蔓延，[SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName]的政府正苦苦应对其领土各处频发的冲突与分裂主义活动。"
 eqfm_balkans.011.f: "随着[GetTechnology('nationalism').GetName]理念在[GetStrategicRegion('region_balkans').GetName]传播，许多民族开始憧憬自主决定自己命运的未来，不再受[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]和[ROOT.GetCountry.GetRuler.GetHerHis]宫廷控制的未来，摇摇欲坠的帝国官僚机构需要竭尽全力，才能贯彻国家和[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的意志。\n\n#white [ROOT.GetCountry.GetNameNoFlag]正以[SCOPE.GetRootScope.GetCountry.GetCustom('eqfm_tension_involvement_type')]的身份介入$eqfm_balkan_situation$。#!\n\n目前[GetStrategicRegion('region_balkans').GetName]正处于$eqfm_tension_status_short$阶段。\n\n#italic [ROOT.GetCountry.GetAdjectiveNoFlag]的行动与其他参与方的行为将决定冲突的后续阶段及其最终结局。#!"
 eqfm_balkans.011.a: "我们将在我们的时代迎来和平。"
 eqfm_balkans.020.t: "鲁米利亚危机"
 eqfm_balkans.020.d: "城市骚乱已在我们位于[GetStrategicRegion('region_balkans').GetName]的各个领地凝结成有组织的反抗。鲁米利亚各地的民族主义运动抓住机会摆脱土耳其统治，并正在寻求外国支持。"
 eqfm_balkans.020.f: "尽管缺乏统一的运动，[GetStrategicRegion('region_balkans').GetName]各国仍将目光投向西方，希望列强的进一步干预能帮助他们摆脱高门的统治。"
 eqfm_balkans.020.a: "$turkfm_porte$必须坚强起来。"
 eqfm_balkans.021.t: "鲁米利亚危机"
 eqfm_balkans.021.d: "奥斯曼帝国在[GetStrategicRegion('region_balkans').GetName]的领地突然爆发骚乱。鲁米利亚各地的民族主义运动抓住机会摆脱土耳其统治，并已开始寻求外国支持。"
 eqfm_balkans.021.f: "尽管缺乏统一的运动，[GetStrategicRegion('region_balkans').GetName]各国仍将目光投向西方，希望列强的进一步干预能帮助他们摆脱高门的统治。"
 eqfm_balkans.021.a: "这可能是一个机会……"
 eqfm_balkans.022.t: "东方危机"
 eqfm_balkans.022.d: "整个[GetStrategicRegion('region_balkans').GetName]地区爆发的骚乱已扰乱[SCOPE.sCountry('ottoman_scope').GetName]的统治，并可能升级为公开战争。$turkfm_porte$呼吁所有未卷入国家保持中立。"
 eqfm_balkans.022.f: "[GetStrategicRegion('region_balkans').GetName]在奥斯曼帝国征服拜占庭帝国后对西方封闭了四个多世纪。随着奥斯曼帝国持续衰落，列强趁机谋取外交利益。然而许多人担心帝国的解体可能引发经济动荡。"
 eqfm_balkans.022.a: "这些与我们无关。"
 eqfm_balkans.028.t: "鲁米利亚陷入混乱"
 eqfm_balkans.028.d: "曾经强大的[SCOPE.sCountry('ottoman_scope').GetName]未能遏制[GetStrategicRegion('region_balkans').GetName]日益加剧的动荡，骚乱可能持续蔓延。"
 eqfm_balkans.028.f: "伊斯梅尔手指发着抖，领着一众大臣穿过水烟弥漫的大厅走向咖啡馆后间。\n\n“小子，什么事把你吓成这样？”年长者大笑道，“我知道帝国现在有些不济，但它几百年都这么过来了，将来也……”维齐尔话未说完便戛然而止，只见几个身材魁梧的人从烟雾缭绕的角落里走了出来。\n\n伊斯梅尔锁上了门。“有人不这么认为，帕夏，他们坚持要见你。”"
 eqfm_balkans.028.a: "这次失败威胁着[SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting]统治的未来。"
 eqfm_balkans.029.t: "鲁米利亚恢复秩序"
 eqfm_balkans.029.d: "凭借强大的[concept_ottoman_integrity]，[SCOPE.sCountry('ottoman_scope').GetName]成功遏制了在[GetStrategicRegion('region_balkans').GetName]日益高涨的危机。"
 eqfm_balkans.029.f: "大臣们齐聚于咖啡馆中。那位最年轻的率先开口：“这里正是我们当初发现分离主义者的巢穴。在如此险恶之地举行庆祝，是不有些鲁莽了？”\n\n“伊斯梅尔，你多虑了，”年长的大臣淡然说道。“纵然外面仍有残余势力蠢蠢欲动，但大局已定。你瞧，我们如今已洞悉他们的藏身之所，正可将计就计。”\n\n“话虽如此，\"伊斯梅尔压低了声音，目光闪烁，“或许在某些时刻，所谓的反抗，才是真正的忠诚所在……”"
 eqfm_balkans.029.a: "[SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting]的统治不容轻视。"
 eqfm_balkans.100.t: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的严苛税制"
 eqfm_balkans.100.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的一位地方贝伊被指控向我们非穆斯林臣民征收过重赋税，其辩称这只是行使国家征收吉兹亚税的权力。"
 eqfm_balkans.100.f: "吉兹亚税是穆斯林帝国向非穆斯林征收的一种税，从而换取保护非穆斯林和免于服兵役。东正教徒普遍谴责这种做法不公平、不道德。"
 eqfm_balkans.100.a: "苏丹站在他的帕夏身后！"
 eqfm_balkans.100.b: "帕夏已经越界。"
 eqfm_balkans.101.t: "[SCOPE.sState('eqfm_tension_state_scope').GetName]爆发鼠疫"
 eqfm_balkans.101.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]爆发了瘟疫。当地人将矛头指向最近驻扎在[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的奥斯曼驻军。"
 eqfm_balkans.101.f: "虽然鼠疫在西方很快就成为了遥远的记忆，但整个奥斯曼帝国缺乏发达的医疗和卫生设施，导致鼠疫时常发生。"
 eqfm_balkans.101.a: "这不关我们的事。"
 eqfm_balkans.101.b: "实施隔离。"
 eqfm_balkans.102.t: "普世牧首要求提供保护"
 eqfm_balkans.102.d: "在[GetReligion('orthodox').GetName]发生针对[SCOPE.sState('eqfm_tension_state_scope').GetName]信徒的暴力事件后，普世牧首首直接联系苏丹，要求加强对信徒的保护。"
 eqfm_balkans.102.f: "君士坦丁堡陷落后，普世牧首被公认为东正教“独立法庭”的首领。在此后的几个世纪中，这种权力不断被削弱，以至于在帝国中经常出现针对东正教居民的暴力行为。"
 eqfm_balkans.102.a: "牧首高估了自己的权威。"
 eqfm_balkans.102.b: "提供象征性的驻军。"
 eqfm_balkans.103.t: "文书语言"
 eqfm_balkans.103.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的[SCOPE.sPop('eqfm_tension_pop_scope').GetReligion.GetName]社区的成员已向当地政府请愿，要求授权以他们的母语出版法律文件。"
 eqfm_balkans.103.f: "自帝国成立以来，主流一直使用土耳其语或阿拉伯语。将我们的行政系统调整为当地语言需要巨大的官僚点数来推动。"
 eqfm_balkans.103.a: "这完全是一个地方事务。"
 eqfm_balkans.103.b: "派遣翻译服务代表团。"
 eqfm_balkans.104.t: "[SCOPE.sState('eqfm_tension_state_scope').GetName]食物短缺"
 eqfm_balkans.104.d: "#todo eqfm_balkans.104.d#!"
 eqfm_balkans.104.f: "#todo eqfm_balkans.104.f#!"
 eqfm_balkans.104.a: "#todo eqfm_balkans.104.a#!"
 eqfm_balkans.104.b: "#todo eqfm_balkans.104.b#!"
 eqfm_balkans.105.t: "[SCOPE.sState('eqfm_tension_state_scope').GetName]农民示威"
 eqfm_balkans.105.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的信使报告，[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的农民以减税的名义发起了持续的抗议。"
 eqfm_balkans.105.f: "对齐米们征收重税一直是维系中央宫廷的主要手段。但部分总督强势管理和滥用职权，导致成为一种敲诈勒索行为。"
 eqfm_balkans.105.a: "这些抗议是对苏丹的侮辱。"
 eqfm_balkans.105.b: "让他们抱怨去吧。我们不会改变。"
 eqfm_balkans.106.t: "本地贝伊僭越"
 eqfm_balkans.106.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]总督被指控向非[GetReligion('sunni').GetName]人征收不合理的税款，远远超出了我们对齐米社区所能承受的平均生平。"
 eqfm_balkans.106.f: "虽然在奥斯曼帝国统治下的大部分时间里，齐米社区的生活条件勉强让人接受，但回随着历任苏丹的政策而时好时坏。"
 eqfm_balkans.106.a: "他只是在行使他的权力。"
 eqfm_balkans.106.b: "将其召回宫廷。"
 eqfm_balkans.107.t: "教堂礼拜遭到扰乱"
 eqfm_balkans.107.d: "一群[GetReligion('sunni').GetName]暴徒扰乱了[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的宗教仪式并破坏了多座教堂。"
 eqfm_balkans.107.f: "虽然预计服务将很快恢复，但[SCOPE.sState('eqfm_tension_state_scope').GetName]的东正教社区要求对肇事者绳之以法。"
 eqfm_balkans.107.a: "宗教仪式必须不受干扰。"
 eqfm_balkans.107.b: "这听起来像是一个地方性问题。"
 eqfm_balkans.108.t: "村庄要求学校"
 eqfm_balkans.108.d: "在[SCOPE.sState('eqfm_tension_state_scope').GetName]的[SCOPE.sCulture('eqfm_tension_culture_scope').GetName][GetReligion('orthodox').GetName][GetPopType('academics').GetName]已与[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的政府部门取得联系，请求对内陆地区的教育工作提供支持。"
 eqfm_balkans.108.f: "几个世纪以来，伊斯兰学校为帝国的许多民族服务，但随着西方思想的到来，许多社区开始组织独立于伊斯兰体系的教育方法。"
 eqfm_balkans.108.a: "这个要求是不恰当的。"
 eqfm_balkans.108.b: "$turkfm_porte$将提供资金。"
 eqfm_balkans.109.t: "复兴派出版物"
 eqfm_balkans.109.d: "[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的独立出版商刊登了一系列报纸文章，呼吁复兴一个独立于$turkfm_sublime_porte$的[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]国家，地方总督正征求意见。"
 eqfm_balkans.109.f: ""
 eqfm_balkans.109.a: "我们绝不容忍任何异议，关了它！"
 eqfm_balkans.109.b: "这些出版物就像它们所说的一样空洞。"
 eqfm_balkans.110.t: "店面被洗劫"
 eqfm_balkans.110.d: "一系列煽动性文章激怒了愤怒的民众，他们涌入[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]在[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的店面。虽然驻军已疏散人群，但受影响的少数族裔所遭受的损失仍令人担忧。"
 eqfm_balkans.110.f: "随着西方工业化，奥斯曼商人发现自己在海外市场上逐渐被淘汰。帝国各地日益盛行的趋势则将这些失败归咎于少数族裔的阴谋。"
 eqfm_balkans.110.a: "这听起来像是地方事务。"
 eqfm_balkans.110.b: "提供赔偿。"
 eqfm_balkans.111.t: "少数族群拒绝分类"
 eqfm_balkans.111.d: "[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName][SCOPE.sCulture('eqfm_tension_culture_scope').GetName]的居民强烈抗议被纳入[GetReligion('orthodox').GetName]米勒特。社区领导人要求在文化事务方面增加独立性。"
 eqfm_balkans.111.f: "随着改革和标准化的尝试不断增多，地方社区开始寻找方法来保留其独特的特权，同时口头上主张平等理念。"
 eqfm_balkans.111.a: "我们的行政管理不能分裂。"
 eqfm_balkans.111.b: "总督目前可以对此视而不见。"
 eqfm_balkans.112.t: "航运商户受阻"
 eqfm_balkans.112.d: "由[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]领导的海盗团伙在亚得里亚海拦截了我们的商船。"
 eqfm_balkans.112.f: "“拿走你们能拿走的！”\n“还给我！”"
 eqfm_balkans.112.a: "我们不能容忍这些事。"
 eqfm_balkans.113.t: "人群聚集在城市中心"
 eqfm_balkans.113.d: "[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]]地区的[GetReligion('orthodox').GetName]和[GetReligion('sunni').GetName]教派之间的争端愈演愈烈，[GetReligion('orthodox').GetName]人群聚集在市中心，地方当局担心冲突即将爆发。"
 eqfm_balkans.113.f: "尽管少数民族和逊尼派多数派之间经常存在分歧，但总督们对任何真正冲突的威胁都会迅速做出反应。"
 eqfm_balkans.113.a: "让警察驱散人群。"
 eqfm_balkans.113.b: "让他们互撕吧！"
 eqfm_balkans.113.c: "让驻军解决他们。"
 eqfm_balkans.114.t: "语言禁令"
 eqfm_balkans.114.d: "当地总督已下令禁止在任何官方场合使用非[GetCulture('turkish').GetName]语言导致[SCOPE.sState('eqfm_tension_state_scope').GetName]引发了强烈抗议"
 eqfm_balkans.114.f: "尽管官方语言是土耳其语，但奥斯曼帝国政府几个世纪以来一直接受在[ROOT.GetCountry.GetCapital.GetCityHubName]的宫廷之外使用其他语言。任何改变这一现状的行为都有可能颠覆数百年来的传统。"
 eqfm_balkans.114.a: "这是职权范围之内。"
 eqfm_balkans.114.b: "命令撤销禁令。"
 eqfm_balkans.114.c: "好主意。把它推广到整个帝国。"
 eqfm_balkans.115.t: "拦截军火走私犯"
 eqfm_balkans.115.d: "为分裂组织提供武器的走私犯在[SCOPE.sState('eqfm_tension_state_scope').GetName]]被逮捕，调查显示，他们受到[SCOPE.sCountry('eqfm_tension_country_scope').GetNameNoFlag]的资助。"
 eqfm_balkans.115.f: "帝国与邻国之间的边界是通过条约精心划定的。但实际上边界区分却完全是另一回事。"
 eqfm_balkans.115.a: "我们将直接在[SCOPE.sCountry('eqfm_tension_country_scope').GetAdjectiveNoFormatting]省份解决这个问题"
 eqfm_balkans.115.b: "我们不能冒险，释放这些人。"
 eqfm_balkans.116.t: "拦截军火走私犯"
 eqfm_balkans.116.d: "为分裂组织提供武器的走私犯在[SCOPE.sState('eqfm_tension_state_scope').GetName]]被逮捕，调查显示，他们受到[SCOPE.sCountry('eqfm_tension_country_scope').GetNameNoFlag]的资助。"
 eqfm_balkans.116.f: "帝国与邻国之间的边界是通过条约精心划定的。但实际上边界区分却完全是另一回事。"
 eqfm_balkans.116.a: "我们将直接在[SCOPE.sCountry('eqfm_tension_country_scope').GetAdjectiveNoFormatting]省份解决这个问题"
 eqfm_balkans.116.b: "我们不能冒险，释放这些人。"
 eqfm_balkans.117.t: "行省海盗"
 eqfm_balkans.117.d: "在过去一周，我们在亚得里亚海的船队遭到[concept_albanian_piracy]的围攻。在[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]带领的暴徒令我们的商船惊恐不已。"
 eqfm_balkans.117.f: "“有谁看到了吗？”"
 eqfm_balkans.117.a: "这完全不可接受！"
 eqfm_balkans.117.b: "让我们的舰队将他们赶走。"
 eqfm_balkans.118.t: "省份乡村民流离失所"
 eqfm_balkans.118.d: "在[SCOPE.sState('eqfm_tension_state_scope').GetName]，因[GetCulture('turkish').GetName]人在[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]历史上居住过的土地上定居而引发了冲突。当地人声称他们是被迫迁出的，而新来的人则声称他们正在迁入被遗弃和废弃的土地。"
 eqfm_balkans.118.f: "自奥斯曼帝国征服以来的几个世纪里，基督教和伊斯兰教居民很容易融合在一起，各自信奉自己的教派。随着[GetReligion('sunni').GetName]居民越来越极端，这种共存开始瓦解。"
 eqfm_balkans.118.a: "这些事由地方总督处理。"
 eqfm_balkans.118.b: "限制新移民，直到愤怒平息为止。"
 eqfm_balkans.118.c: "我们应该鼓励建立新定居点。"
 eqfm_balkans.119.t: "强盗越境"
 eqfm_balkans.119.d: "[SCOPE.sCountry('eqfm_tension_country_scope').GetNameNoFlag]缺乏中央控制导致匪徒已经越过[SCOPE.sCountry('eqfm_tension_country_scope').GetAdjectiveNoFormatting]边境撤退到[ROOT.GetCountry.GetAdjectiveNoFlag]境内，只留下残垣断壁。"
 eqfm_balkans.119.f: "失望的民兵抓住了政府控制薄弱和警察腐败的机会，对工人和贵族进行劫掠。地方首领们在迅速撤退后发现，多个村庄已被洗劫一空并付之一炬。"
 eqfm_balkans.119.a: "我们必须补救！"
 eqfm_balkans.119.b: "也许我们可以在这个问题上进行合作。"
 eqfm_balkans.120.t: "在[SCOPE.sState('eqfm_tension_state_scope').GetName]中烧毁的教堂"
 eqfm_balkans.120.d: "几天前[SCOPE.sState('eqfm_tension_state_scope').GetName]的一场争端升级为暴乱。当骚乱者被平息时，几座[GetReligion('orthodox').GetName]教堂已被付之一炬，主教们呼吁$turkfm_porte$进行赔偿。"
 eqfm_balkans.120.f: "随着民族主义在穆斯林和东正教中的盛行，街头的公然对抗越来越频繁。顾问们警告说，若不果断行动可能会危及苏丹权力的合法性。"
 eqfm_balkans.120.a: "他们可以自己处理。"
 eqfm_balkans.120.b: "我们要纠正这种行为。"
 eqfm_balkans.121.t: "知名演讲者在[SCOPE.sState('eqfm_tension_state_scope').GetName]遭私刑处决"
 eqfm_balkans.121.d: "z1[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]的[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]示威活动中，人群发生冲突，期间[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的一名领导人被抓住并遭到殴打，线人告诉我们，其可能重伤身亡。"
 eqfm_balkans.121.f: "“谋杀！杀手！畜生！”"
 eqfm_balkans.121.a: "逮捕肇事者"
 eqfm_balkans.121.b: "给予她们参会的权利。"
 eqfm_balkans.122.t: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的土匪"
 eqfm_balkans.122.d: "盗匪袭击了[SCOPE.sState('eqfm_tension_state_scope').GetName]的农村地区，再次引发了要求当局采取行动的呼声。"
 eqfm_balkans.122.f: "幻想破灭的非正规军利用政府低效的控制和警察腐败，对劳工和贵族进行抢劫和掠夺，如今几个村庄遭到了袭击和焚烧。"
 eqfm_balkans.122.a: "这不关我们的事。"
 eqfm_balkans.122.b: "在当地部署驻军。"
 eqfm_balkans.123.t: "行省港口被烧毁"
 eqfm_balkans.123.d: "[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的驻军已失去对港口的控制。在随后的混乱中，分离主义者焚烧了大量港口基础设施，当地管理人员仍在统计损失。"
 eqfm_balkans.123.f: "“渡轮被烧毁……仓库被烧毁……他们甚至烧毁了我最喜欢的鱼铺！”"
 eqfm_balkans.123.a: "逮捕这些疯子。"
 eqfm_balkans.123.b: "我们目前没有空余的资源。"
 eqfm_balkans.123.c: "重点重建港口。"
 eqfm_balkans.124.t: "血祭诽谤"
 eqfm_balkans.124.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]上流传着不祥的传言，指责[SCOPE.sCulture('eqfm_tension_culture_scope').GetName][SCOPE.sReligion('eqfm_tension_religion_scope').GetName]大多数人犯下了丧心病狂的罪行。有报道称，暴徒挨家挨户游荡，恐吓他们发现的任何[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]人。"
 eqfm_balkans.124.f: "由于乡村的封闭性，误解很快就会演变成谣言，而谣言往往会演变成暴力事件。"
 eqfm_balkans.124.a: "或许他们的担心是有根据的。"
 eqfm_balkans.124.b: "命令总督维持秩序。"
 eqfm_balkans.125.t: "政府被洗劫一空"
 eqfm_balkans.125.d: "一群愤怒的暴民洗劫了[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的行政办公室。虽然损失不大，但这可能会损害我们对[SCOPE.sState('eqfm_tension_state_scope').GetName]的治理。"
 eqfm_balkans.125.f: "满满一屋子的土地和商业文件都乱成一团。要把所有东西整理好，需要几个月的时间。"
 eqfm_balkans.125.a: "等等，警卫在哪儿？"
 eqfm_balkans.125.b: "派遣驻军"
 eqfm_balkans.126.t: "军队遭袭击"
 eqfm_balkans.126.d: "一个小团伙在[SCOPE.sState('eqfm_tension_state_scope').GetName]腹地伏击了一支巡逻队。目击者很快将责任归咎于当地[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]社区。"
 eqfm_balkans.126.f: "当地劫匪的突然袭击并非闻所未闻，但这并没有阻止心怀不满的社区将矛头指向当地少数族裔"
 eqfm_balkans.126.a: "让军队逮捕嫌疑人。"
 eqfm_balkans.126.b: "限制在这些区域的巡逻。"
 eqfm_balkans.127.t: "穆斯林民兵被动员"
 eqfm_balkans.127.d: "经过数周激烈的布道，[SCOPE.sState('eqfm_tension_state_scope').GetName]的一位[GetReligion('sunni').GetName]伊玛目以“护法”的名义组织了一支非正式民兵。当地探子警告称，暴力事件即将发生。"
 eqfm_balkans.127.f: "“他们这些异教徒玷污我们的街道！勾搭我们的女人！”"
 eqfm_balkans.127.a: "我们应该赞扬他的虔诚。"
 eqfm_balkans.127.b: "命令这些民兵解散。"
 eqfm_balkans.128.t: "当地驻军向人群开枪"
 eqfm_balkans.128.d: "[SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]已经持续的发生抗议活动，在[GetReligion('sunni').GetName]和[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]抗议者发生冲突后，一支未经训练且紧张的驻军开枪走火，目前伤亡人数已达数十人，且仍在不断增加。"
 eqfm_balkans.128.f: "“这座城镇已被洗劫一空……遇难人数难以估算。尸体散落在街道上。星期五，我出门时，不得不小心翼翼地在死尸之间穿行，以免踩到他们。”——赫伯特·吉本斯牧师"
 eqfm_balkans.128.a: "召回驻军"
 eqfm_balkans.128.b: "让驻军按照他们认为合适的方式维持秩序。"
 eqfm_balkans.129.t: "地区铁路被炸毁"
 eqfm_balkans.129.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的激进分子炸毁了一条通往 [SCOPE.sState('eqfm_tension_state_scope').GetCityHubName]的主要铁路线。虽然伤亡有限，但这动摇了人们对$turkfm_porte$的信心。"
 eqfm_balkans.129.f: "修复工作会很快完成，但公众对我们保证安全能力的信心却受到了重大打击。"
 eqfm_balkans.129.a: "这完全不可接受！"
 eqfm_balkans.129.b: "发放资金援助修复。"
 eqfm_balkans.130.t: "通译官缓解紧张局势"
 eqfm_balkans.130.d: "昨天，[SCOPE.sState('eqfm_tension_state_scope').GetName]维齐尔和当地[GetReligion('orthodox').GetName]领袖之间的会议差点演变成一场混乱。幸好有一位译员在场调解，并澄清完全是由于文化误解造成的。"
 eqfm_balkans.130.f: "“他们是说话的喉舌，聆听的耳朵，观察的眼睛，施与的双手，行动的灵魂，每一次谈判的成败生死都取决于他们。”——威尼斯大使如此评价通译官"
 eqfm_balkans.130.a: "干得漂亮"
 eqfm_balkans.131.t: "跨宗教对话"
 eqfm_balkans.131.d: "为解决[SCOPE.sState('eqfm_tension_state_scope').GetName]的[GetReligion('sunni').GetName]和[GetReligion('orthodox').GetName]社区之间的争端而举行的会议比预期的更有成效，双方都感觉他们的担忧得到了妥善解决。"
 eqfm_balkans.131.f: "米勒特之间的会晤充满了误解，但有时冷静的头脑可以占上风。"
 eqfm_balkans.131.a: "确实令人惊讶。"
 eqfm_balkans.132.t: "[SCOPE.sCountry('eqfm_tension_country_scope').GetName]调解当地冲突"
 eqfm_balkans.132.d: "#todo eqfm_balkans.132.d#!"
 eqfm_balkans.132.f: "#todo eqfm_balkans.132.f#!"
 eqfm_balkans.132.a: "#todo eqfm_balkans.132.a#!"
 eqfm_balkans.132.b: "#todo eqfm_balkans.132.b#!"
 eqfm_balkans.133.t: "在[SCOPE.sState('eqfm_tension_state_scope').GetName]发现间谍网"
 eqfm_balkans.133.d: "[SCOPE.sState('eqfm_tension_state_scope').GetName]的安全部门发现了一个根深蒂固的[SCOPE.sCulture('eqfm_tension_culture_scope').GetName]异见网络。经过数周的观察，他们报告称已准备好对这些潜在的叛乱分子采取行动。"
 eqfm_balkans.133.f: "“我以真理与正义之名，在至高存在面前起誓，将不惜牺牲生命、忍受艰辛，守护奥秘。无论被问及何事，我都将以真相应答。”\n——加入#italic 友谊社#!时的入会誓言！"
 eqfm_balkans.133.a: "把领头的抓起来。剩下的就会服从。"
 eqfm_balkans.133.b: "让我们密切关注他们"
 eqfm_balkans.140.t: "在[SCOPE.sState('eqfm_riot_state_scope').GetName]被围困的驻军"
 eqfm_balkans.140.d: "一份[SCOPE.sState('eqfm_riot_state_scope').GetName]的令人震惊报告传来：[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的行省驻军已被大批暴徒包围。数名信使成功突破包围，向$turkfm_porte$带来绝望的请求。"
 eqfm_balkans.140.f: "暴民手持农具、自制步枪阻止驻军采取任何行动。"
 eqfm_balkans.140.a: "命令驻军就地避难。"
 eqfm_balkans.140.b: "让出堡垒并让驻军前往安全地带。"
 eqfm_balkans.141.t: "群众焚烧[SCOPE.sState('eqfm_riot_state_scope').GetName]宫殿"
 eqfm_balkans.141.d: "一群暴徒冲进了[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的首府，并纵火焚烧了宫殿。总督虽然逃脱，但宫殿已化为焦土。"
 eqfm_balkans.141.f: "没有一张桌子被翻动过，也没有一张纸屑被烧过，一个完全无政府的场景。"
 eqfm_balkans.141.a: "卫兵们去哪了？"
 eqfm_balkans.141.b: "派遣军队！"
 eqfm_balkans.142.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]站在少数族裔一边"
 eqfm_balkans.142.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]打破政治常规，公开宣布支持暴徒，这引发了轩然大波。"
 eqfm_balkans.142.f: "“在国土上存在如此野蛮的行为时，我们就不能自称是文明人！”"
 eqfm_balkans.142.a: "逮捕这些叛徒。"
 eqfm_balkans.142.b: "破坏[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]的信誉。"
 eqfm_balkans.143.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]动员信徒"
 eqfm_balkans.143.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]举办了一场不间断的布道活动，号召[SCOPE.sState('eqfm_riot_state_scope').GetName]的[GetReligion('sunni').GetName]信徒阻止暴徒。"
 eqfm_balkans.143.f: "“这些异教徒是我们土地上的祸害！决不能再让他们逍遥法外！”"
 eqfm_balkans.143.a: "我们应当相信他那正确的判断。"
 eqfm_balkans.143.b: "在事情弄糟之前让他闭嘴！"
 eqfm_balkans.144.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]请求干预"
 eqfm_balkans.144.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]请求允许镇压[SCOPE.sState('eqfm_riot_state_scope').GetName]叛乱。"
 eqfm_balkans.144.f: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]急于在奥斯曼帝国宫廷中彰显其影响力，已经集结了一支部队准备立即采取行动。"
 eqfm_balkans.144.a: "批准。"
 eqfm_balkans.144.b: "命令退下！"
 eqfm_balkans.147.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的暴力冲突加剧"
 eqfm_balkans.147.d: "尽管当地驻军努力平息[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的骚乱，但暴乱已开始蔓延到[SCOPE.sState('eqfm_riot_state_scope').GetName]各地。"
 eqfm_balkans.147.f: "随着暴力从城市蔓延到农村，当地人开始伏击和骚扰土耳其军民。"
 eqfm_balkans.147.a: "这是地方政府要处理的。"
 eqfm_balkans.147.a.tt: "你的行动可能会使事态升级。"
 eqfm_balkans.147.b: "我们必须保持克制。"
 eqfm_balkans.147.b.tt: "你的不作为很可能会使事态升级。"
 eqfm_balkans.147.c: "集结军队，立即介入。"
 eqfm_balkans.147.c.tt: "你的行动很可能会避免事态升级。"
 eqfm_balkans.148.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]大屠杀！"
 eqfm_balkans.148.d: "自[SCOPE.sState('eqfm_riot_state_scope').GetName]的噩耗传来，在[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]长达数周的对峙之后，当地驻军向数百名抗议者开火，虽然人数在统计，但死亡人数可能达到数百人。"
 eqfm_balkans.148.f: "“一连三天，居民们都沉浸在痛苦中。男女老少无一幸免被处死，甚至还要遭受酷刑。屠杀如此惨烈，以至于科洛科特罗尼斯自己都说，从城门到城堡，他的马蹄从未沾过地面。他的胜利之路铺满了尸体。两天后，大约有两千人残余的穆斯林们被集中起来，不分年龄和性别，被带到附近山上的一个峡谷，在那里像牲畜一样被屠杀。”"
 eqfm_balkans.148.a: "我们必须维持秩序！"
 eqfm_balkans.148.b: "避免事态进一步升级。"
 eqfm_balkans.149.t: "在[SCOPE.sState('eqfm_riot_state_scope').GetName]的人群疏散"
