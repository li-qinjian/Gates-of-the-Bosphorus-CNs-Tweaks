 eqfm_balkans.300.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]教堂被焚"
 eqfm_balkans.300.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的一场争端于数天前演变为公开暴乱。在暴徒被平息时，数座[GetReligion('orthodox').GetName]教堂已被付之一炬。宗教领袖已向$turkfm_porte$请求赔偿。"
 eqfm_balkans.300.f: "随着民族主义同时席卷穆斯林和正教徒，街头上的正面对抗正变得日益频繁。顾问们警告称，缺乏果断行动可能会危及苏丹权威的合法性。"
 eqfm_balkans.300.a: "让他们自己处理自己的事务。"
 eqfm_balkans.300.b: "我们要纠正这种暴行。"
 eqfm_balkans.301.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]知名演说家遭到私刑"
 eqfm_balkans.301.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]示威活动期间爆发了人群冲突。在一次对抗中，其中一位[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]领袖被抓并遭到殴打。线人告诉我们，他不太可能在伤势中幸存。"
 eqfm_balkans.301.f: "“谋杀犯！凶手！畜生！”"
 eqfm_balkans.301.a: "逮捕行凶者。"
 eqfm_balkans.301.b: "罪有应得。"
 eqfm_balkans.302.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]匪患滋生"
 eqfm_balkans.302.d: "土匪洗劫了[SCOPE.sState('eqfm_balkan_state_scope').GetName]的乡村，引发了要求当局采取行动的呼声。"
 eqfm_balkans.302.f: "幻灭的非正规军利用弱势的政府控制和警察腐败，对劳动者和绅士阶层大肆劫掠。他们来去如风，当地贝伊发现数个村庄遭到了袭击和焚毁。"
 eqfm_balkans.302.a: "这不值得我们关注。"
 eqfm_balkans.302.b: "调动当地驻军。"
 eqfm_balkans.303.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetPortHubName]港口被焚"
 eqfm_balkans.303.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的驻军失去了对城市港口暴徒的控制。在随后的狂乱中，分裂分子将大量港口设施付之一炬。当地官员仍在统计损失。"
 eqfm_balkans.303.f: "烧毁的渡轮……他们烧毁了仓库……他们甚至把我最喜欢的鱼饭馆也烧了！"
 eqfm_balkans.303.a: "逮捕这些狂徒。"
 eqfm_balkans.303.b: "我们抽不出任何资源。"
 eqfm_balkans.303.c: "重点重建港口。"
 eqfm_balkans.304.t: "血祭诽谤"
 eqfm_balkans.304.d: "险恶的谣言在[SCOPE.sState('eqfm_balkan_state_scope').GetName]蔓延，指责[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName][SCOPE.sReligion('eqfm_balkan_religion_scope').GetName]社群对[GetReligion('sunni').GetName]多数群体犯下了疯狂的罪行。据报道，暴徒在山村里挨家挨户搜寻，恐吓他们找到的任何[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]人。"
 eqfm_balkans.304.f: "鉴于山村的封闭性质，误解会迅速演变为谣言，并常常失控演变成暴力事件。"
 eqfm_balkans.304.a: "也许他们的担忧不无道理。"
 eqfm_balkans.304.b: "命令总督维持秩序。"
 eqfm_balkans.305.t: "行政办公室被洗劫"
 eqfm_balkans.305.d: "愤怒的暴徒洗劫了[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的行政办公室。尽管破坏较轻，但这威胁到了我们对[SCOPE.sState('eqfm_balkan_state_scope').GetName]的治理。"
 eqfm_balkans.305.f: "整间整间的土地与商业档案大厅变得一片狼藉。需要数月时间才能将所有物品重新整理至可用状态。"
 eqfm_balkans.305.a: "等等，卫兵去哪儿了？"
 eqfm_balkans.305.b: "派驻军进去。"
 eqfm_balkans.306.t: "军纵队遭袭"
 eqfm_balkans.306.d: "一小股匪徒在[SCOPE.sState('eqfm_balkan_state_scope').GetName]的偏远地区伏击了一支巡逻队。目击者迅速将矛头指向当地的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]社群。"
 eqfm_balkans.306.f: "当地路匪的突袭并非罕见，但这并没有阻止不满的民众将矛头指向当地的少数族裔。"
 eqfm_balkans.306.a: "让军方围捕嫌疑人。"
 eqfm_balkans.306.b: "限制穿过这些地区的巡逻。"
 eqfm_balkans.307.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]组织穆斯林民兵"
 eqfm_balkans.307.d: "在经历了数周充满激情的讲道后，[SCOPE.sState('eqfm_balkan_state_scope').GetName]的一位[GetReligion('sunni').GetName]伊玛目以“捍卫教法”的名义组建了一支非正式民兵。当地密探警告可能即将爆发暴力事件。"
 eqfm_balkans.307.f: "“他们玷污我们的街道！他们诱惑我们的妇女！他们不过是一群异教徒罢了！”"
 eqfm_balkans.307.a: "我们应当赞扬他的虔诚。"
 eqfm_balkans.307.b: "下令解散这些非正规军。"
 eqfm_balkans.308.t: "当地驻军向人群开枪"
 eqfm_balkans.308.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的抗议活动陷入失控。在[GetReligion('sunni').GetName]与[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]抗议者爆发冲突后，一支未经训练且神经紧张的驻军向人群开了枪。伤亡人数目前已有数十人，且还在增加。"
 eqfm_balkans.308.f: "“这座城镇已被洗劫一空、摧毁殆尽……遇害者人数根本无法估算。尸体横七竖八地散落在街道各处。星期五我出门时，不得不小心翼翼地在死者遗体之间穿行，以防踩到他们。”——赫伯特·吉本斯牧师"
 eqfm_balkans.308.a: "召回驻军。"
 eqfm_balkans.308.b: "由驻军自行决定如何维持秩序。"
 eqfm_balkans.309.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]铁路遭炸弹袭击"
 eqfm_balkans.309.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的激进分子炸毁了一条通往[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的主要铁路线。尽管伤亡有限，但这动摇了人们对$turkfm_porte$在帝国全境保障安全能力的信心。"
 eqfm_balkans.309.f: "修复工作将会很快完成，但公众对我们保障其安全能力的信任受到了重创。"
 eqfm_balkans.309.a: "这是不可接受的。"
 eqfm_balkans.309.b: "拨款协助修复。"
 eqfm_balkans.310.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的部长被扣为人质"
 eqfm_balkans.310.d: "A"
 eqfm_balkans.310.f: ""
 eqfm_balkans.310.a: "谈判要求立即释放他。"
 eqfm_balkans.310.b: "[ROOT.GetCountry.GetCapital.GetCityName]绝不接受敲诈。"
 eqfm_balkans.310.c: "派我们的安全部队进去。"
