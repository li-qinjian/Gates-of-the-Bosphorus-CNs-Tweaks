 eqfm_balkans.400.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]驻军被围"
 eqfm_balkans.400.d: "来自[SCOPE.sState('eqfm_riot_state_scope').GetName]的一份令人担忧的报告传来：驻扎在[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]堡垒中的省驻军已被成群结队的暴徒包围。几名信使成功突围，带来了请求$turkfm_porte$下达指令的绝望求助。"
 eqfm_balkans.400.f: "靠着农具、简陋步枪以及据传有外国供应商的援助，人群阻碍了驻军采取任何有实质意义的行动。"
 eqfm_balkans.400.a: "下令驻军就地坚守。"
 eqfm_balkans.400.b: "放弃堡垒，让驻军撤往安全地带。"
 eqfm_balkans.401.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]暴徒焚毁总督府"
 eqfm_balkans.401.d: "失控的暴徒冲进了[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的省总督府并放火焚烧了官邸。尽管总督侥幸逃脱，但总督府已沦为一片废墟。"
 eqfm_balkans.401.f: "没有一张桌子未被翻倒，也没有一张纸片未被烧毁。那是一幅彻底无政府状态的景象。"
 eqfm_balkans.401.a: "卫兵们都干什么去了？"
 eqfm_balkans.401.b: "派省驻军进去！"
 eqfm_balkans.402.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]倒向少数族裔"
 eqfm_balkans.402.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]打破政治惯例，公开声明支持暴徒。这在中央引起了轩然大波。"
 eqfm_balkans.402.f: "“当边界内存在如此野蛮的行径时，我们怎敢自称文明！”"
 eqfm_balkans.402.a: "围捕这些叛徒。"
 eqfm_balkans.402.b: "破坏[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]的信誉。"
 eqfm_balkans.403.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]动员信徒"
 eqfm_balkans.403.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]主持了一连串布道，号召[SCOPE.sState('eqfm_riot_state_scope').GetName]的[GetReligion('sunni').GetName]信徒抵抗暴徒。"
 eqfm_balkans.403.f: "“这些异教徒是我们土地上的祸害！绝不能再让他们为所欲为了！”"
 eqfm_balkans.403.a: "我们必须信任他的教法考量。"
 eqfm_balkans.403.b: "在他把事情搞得更糟之前让他闭嘴！"
 eqfm_balkans.404.t: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]请求干预"
 eqfm_balkans.404.d: "[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetName]请求获得授权以平定[SCOPE.sState('eqfm_riot_state_scope').GetName]的叛乱。"
 eqfm_balkans.404.f: "急于在奥斯曼朝廷彰显自身重要性的[SCOPE.gsInterestGroup('eqfm_riot_ig_scope').GetLeader.GetFullName]已经组建了一支军队，准备立即采取行动。"
 eqfm_balkans.404.a: "准许其请。"
 eqfm_balkans.404.b: "命令他退下。"
 eqfm_balkans.407.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的暴力事件恶化"
 eqfm_balkans.407.d: "尽管当地驻军努力镇压[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的动荡，但暴力活动已开始蔓延至整个[SCOPE.sState('eqfm_riot_state_scope').GetName]。"
 eqfm_balkans.407.f: "随着暴力活动从城市蔓延到乡村，当地人开始伏击和骚扰土耳其士兵和平民。"
 eqfm_balkans.407.a: "这应交由当地总督处理。"
 eqfm_balkans.407.a.tt: "你的行动可能会导致形势升级。"
 eqfm_balkans.407.b: "我们必须保持克制。"
 eqfm_balkans.407.b.tt: "你的不作为很可能会导致形势升级。"
 eqfm_balkans.407.c: "召集军队，立即干预。"
 eqfm_balkans.407.c.tt: "你的行动很可能会防止形势进一步升级。"
 eqfm_balkans.408.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]发生大屠杀！"
 eqfm_balkans.408.d: "来自[SCOPE.sState('eqfm_riot_state_scope').GetName]的灾难性消息传来。在[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]经历数周对峙后，隶属于当地驻军的部队向数百名和平抗议者开枪。尽管数字仍有待统计，但死亡人数可能多达数百人。"
 eqfm_balkans.408.f: "“三天的光景里，可怜的居民被交给了野蛮暴徒的淫欲与残酷。无论男女老少皆未能幸免。妇女和儿童在被处死前遭受酷刑。屠杀是如此惨烈，以至于科洛科特罗尼斯本人称，从城门到堡垒，他的马蹄从未踩到地面。他凯旋的道路铺满了尸体。两天后，惨存的大约两千名穆斯林，不论男女老少（主要是妇女和儿童），被刻意收集起来，带到附近山区的峡谷中，像牲口一样遭到屠宰。”——赫伯特·吉本斯牧师"
 eqfm_balkans.408.a: "我们必须维护秩序！"
 eqfm_balkans.408.b: "避免进一步激化形势。"
 eqfm_balkans.409.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的人群被驱散"
 eqfm_balkans.409.d: "在[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]经历了数天的暴力与施暴后，[SCOPE.sState('eqfm_riot_state_scope').GetName]的联合驻军已将几人群从公共中心驱散。在统计总数的同时，传来了数十名当地领袖被捕的消息。"
 eqfm_balkans.409.f: "“你们当中有些人以政府行政滥权为借口发起叛乱，另一些人则打着保卫哈里发辖区的旗号。”——迪亚巴克尔独立法庭，1925年6月28日"
 eqfm_balkans.409.a: "正义得到了伸张。"
