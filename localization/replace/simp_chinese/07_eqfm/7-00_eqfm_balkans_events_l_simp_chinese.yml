l_simp_chinese:
 eqfm_balkans.001.t: "欧洲火药桶"
 eqfm_balkans.001.d: "$gbbf_georegion_rumelia$局势风云变幻，其[GetCulture('turkish').GetName]与[GetCulture('south_german').GetName]统治阶级与各类$eqfm_rumelian_cultures$之间的鸿沟日益加深。"
 eqfm_balkans.001.f: "随着[GetTechnology('nationalism').GetName]的思想在[GetStrategicRegion('region_balkans').GetName]传播，许多民族开始憧憬一个不由外国领主与将领凌虐、自决命运的未来。这需要病入膏肓的帝国官僚机构竭尽全力，才能继续维持对$gbbf_georegion_rumelia$的控制。\n\n#white [ROOT.GetCountry.GetNameNoFlag]在$eqfm_balkan_situation$中的$gbbf_balkans_involvement$等级为[SCOPE.GetRootScope.GetCountry.GetCustom('eqfm_balkan_powder_keg_involvement_type')]。#!\n\n$eqfm_balkans_current_phase_long$\n\n#italic [ROOT.GetCountry.GetAdjectiveNoFlag]与其他参与者的行动将决定这场冲突的后续阶段及其最终结局。#!"
 eqfm_balkans.001.a: "我们将在我们的时代迎来和平。"
 eqfm_balkans.002.t: "$gbbf_georegion_rumelia$已被控制"
 eqfm_balkans.002.d: "尽管$turkfm_porte$面临着巨大的挑战，但[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的军队不仅成功遏制了分裂主义，还将#yellow 崇高#!的[ROOT.GetCountry.GetAdjective]#yellow 帝国#!确立为巴尔干地区的至高力量。"
 eqfm_balkans.002.f: "尽管数百年来面临西方的挑战，[ROOT.GetCountry.GetName]仍成功巩固了巴尔干地区，使其成为名副其实的土耳其领土。"
 eqfm_balkans.002.a: "我们将恢复$gbbf_georegion_rumelia$的秩序。"
 eqfm_balkans.003.t: "$gbbf_georegion_rumelia$四分五裂"
 eqfm_balkans.003.d: "随着我们权威的崩塌，鲁米利亚各地的国家机器也随之瓦解。巴尔干诸国纷纷挣脱了我们的掌控，一个个如同暗处鬣狗般狞笑不止。"
 eqfm_balkans.003.f: "没有奥斯曼干预的压力，且奥地利与$RUS_ADJ$使节的影响力如今不受制约，巴尔干各国已脱离东方，期望重新融入欧洲共同体。"
 eqfm_balkans.003.a: "$gbbf_georegion_rumelia$难道无法治理吗？"
 eqfm_balkans.005.t: "民族主义运动愈演愈烈"
 eqfm_balkans.005.d: "随着[GetTechnology('pan-nationalism').GetName]的兴起，[GetTechnology('nationalism').GetName]的无数浪潮已开始汇聚。各地总督纷纷表示担忧，认为控制异议正变得越来越困难。"
 eqfm_balkans.005.f: "日复一日，[GetStrategicRegion('region_balkans').GetName]各族人民因彼此间的共同点而日益紧密团结，这与他们同$turkfm_porte$之间的隔阂形成了鲜明对比。"
 eqfm_balkans.005.a: "我们必须维持秩序。"
 eqfm_balkans.006.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的暴动"
 eqfm_balkans.006.d: "[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]爆发了暴乱。与以往的骚乱不同，这次当地人已经开始在全城竖起路障。"
 eqfm_balkans.006.f: "虽然自败于神圣联盟之手以来，反对奥斯曼统治的动荡一直持续不断，但最近的这些抗议活动却呈现出更强烈的民族主义色彩。"
 eqfm_balkans.006.a: "派遣正规军。"
 eqfm_balkans.007.t: "[SCOPE.sState('eqfm_riot_state_scope').GetName]的叛乱已被镇压"
 eqfm_balkans.007.d: "[SCOPE.sState('eqfm_riot_state_scope').GetName]好消息传来，驻军指挥官报告称已成功平息[SCOPE.sState('eqfm_riot_state_scope').GetCityHubName]的最后一批激进分子。"
 eqfm_balkans.007.f: "叛乱组织者被我们关押后，对他们的审判将成为极好的公开素材，从而宣传我们在巴尔干地区的权威。"
 eqfm_balkans.007.a: "干得漂亮"
 eqfm_balkans.008.t: "[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjective]叛乱"
 eqfm_balkans.008.d: "[SCOPE.sCountry('eqfm_post_origin_scope').GetAdjectiveNoFlag]在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetName]的驻军已经崩溃。[SCOPE.sCountry('eqfm_rebellion_scope').GetAdjectiveNoFlag]人民在[SCOPE.sCountry('eqfm_rebellion_scope').GetCapital.GetCityHubName]升起国旗，宣布脱离[SCOPE.sCountry('eqfm_post_origin_scope').GetName]独立。"
 eqfm_balkans.008.f: "驻军的彻底驱逐动摇了人们对[SCOPE.sCountry('eqfm_post_origin_scope').GetAdjectiveNoFlag]国家统治巴尔干的权利的信心。若想确保我们继续统治$gbbf_georegion_rumelia$，他们就必须果断行动。"
 eqfm_balkans.008.a: "我们将粉碎这些叛军！"
 eqfm_balkans.009.t: "鲁米利亚危机"
 eqfm_balkans.009.d: "突发的城市暴乱已演变为席卷$gbbf_georegion_rumelia$的有组织叛乱。亲$eqfm_rumelian$势力趁机起事，企图摆脱帝国统治，当地驻军面对汹涌的人群与民兵武装，已然无力招架。"
 eqfm_balkans.009.f: "尽管缺乏统一的运动，$gbbf_georegion_rumelia$各国仍将目光投向了西方，寄望于帝国主义列强的进一步干预能为其带来自由与自治。然而，许多人担忧中央控制的瓦解或将引发经济与政治的混乱。"
 eqfm_balkans.009.a: "$turkfm_porte$必须屹立不倒。"
 eqfm_balkans.011.t: "鲁米利亚重归秩序"
 eqfm_balkans.011.d: "凭借强大的[concept_ottoman_integrity]，[SCOPE.sCountry('ottoman_scope').GetName]成功遏制了[GetStrategicRegion('region_balkans').GetName]日益加剧的危机。"
 eqfm_balkans.011.f: "维齐尔们齐聚咖啡馆。最年轻的一位感慨道：“这种地方，过去正是分离主义者出没之所。在狮子窝里庆贺，当真明智吗？”\n\n“伊斯梅尔，你太多虑了，”年长者开口道，“外面固然仍有猛狮盘踞，但危机已然度过。如今你看，我们已深知该在何处布下陷阱。”\n\n“话虽如此，”伊斯梅尔喃喃低语，“或许在某些情势之下，起兵反叛反倒是一种忠诚……”"
 eqfm_balkans.011.a: "[SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting]的统治不容小觑。"
 eqfm_balkans.100.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的苛捐杂税"
 eqfm_balkans.100.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的一位地方贝伊被指控对我国非穆斯林附属国征收过重的税赋。他辩称，这不过是国家行使征收吉兹亚税的正当权力罢了。"
 eqfm_balkans.100.f: "吉兹亚税是穆斯林帝国向非穆斯林征收的一种税，从而换取保护非穆斯林和免于服兵役。东正教徒普遍谴责这种做法不公平、不道德。"
 eqfm_balkans.100.a: "苏丹站在他的帕夏身后！"
 eqfm_balkans.100.b: "帕夏已经越界。"
 eqfm_balkans.101.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]爆发鼠疫"
 eqfm_balkans.101.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]爆发了瘟疫。当地民众将矛头指向了最近驻扎在[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的奥斯曼驻军。"
 eqfm_balkans.101.f: "虽然鼠疫在西方很快就成为了遥远的记忆，但整个奥斯曼帝国缺乏发达的医疗和卫生设施，导致鼠疫时常发生。"
 eqfm_balkans.101.a: "这不关我们的事。"
 eqfm_balkans.101.b: "实施隔离。"
 eqfm_balkans.102.t: "普世牧首要求提供保护"
 eqfm_balkans.102.d: "在[GetReligion('orthodox').GetName]发生针对[SCOPE.sState('eqfm_balkan_state_scope').GetName]信徒的暴力事件后，普世牧首首直接联系苏丹，要求加强对信徒的保护。"
 eqfm_balkans.102.f: "君士坦丁堡陷落后，普世牧首被公认为东正教“独立法庭”的首领。在此后的几个世纪中，这种权力不断被削弱，以至于在帝国中经常出现针对东正教居民的暴力行为。"
 eqfm_balkans.102.a: "牧首高估了自己的权威。"
 eqfm_balkans.102.b: "提供象征性的驻军。"
 eqfm_balkans.103.t: "文书语言"
 eqfm_balkans.103.d: "[SCOPE.sPop('eqfm_balkan_pop_scope').GetReligion.GetName]的[SCOPE.sState('eqfm_balkan_state_scope').GetName]社区的成员已向当地政府请愿，要求授权以他们的母语出版法律文件。"
 eqfm_balkans.103.f: "自帝国成立以来，主流一直使用土耳其语或阿拉伯语。将我们的行政系统调整为当地语言需要巨大的官僚点数来推动。"
 eqfm_balkans.103.a: "这完全是一个地方事务。"
 eqfm_balkans.103.b: "派遣翻译服务代表团。"
 eqfm_balkans.104.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]食物短缺"
 eqfm_balkans.104.d: "#todo eqfm_balkans.104.d#!"
 eqfm_balkans.104.f: "#todo eqfm_balkans.104.f#!"
 eqfm_balkans.104.a: "#todo eqfm_balkans.104.a#!"
 eqfm_balkans.104.b: "#todo eqfm_balkans.104.b#!"
 eqfm_balkans.105.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]农民示威"
 eqfm_balkans.105.d: "来自[SCOPE.sState('eqfm_balkan_state_scope').GetName]的信使报告称，[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的农民以减税为名发起了非正式但持续不断的抗议。"
 eqfm_balkans.105.f: "对齐米们征收重税一直是维系中央宫廷的主要手段。但部分总督强势管理和滥用职权，导致成为一种敲诈勒索行为。"
 eqfm_balkans.105.a: "这些抗议是对苏丹的侮辱。"
 eqfm_balkans.105.b: "让他们抱怨去吧。我们不会改变。"
 eqfm_balkans.106.t: "本地贝伊僭越"
 eqfm_balkans.106.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的总督被指控向非[GetReligion('sunni').GetName]人口征收不合理的税赋，远超历史上向齐米社群征收的吉兹亚税额。"
 eqfm_balkans.106.f: "虽然齐米社群在奥斯曼统治下的大部分时间里享有尚可忍受的生活条件，但这随着历代苏丹政策的变化而起伏不定。"
 eqfm_balkans.106.a: "他只是在行使他的权力。"
 eqfm_balkans.106.b: "将其召回宫廷。"
 eqfm_balkans.107.t: "教堂礼拜遭到扰乱"
 eqfm_balkans.107.d: "一群[GetReligion('sunni').GetName]暴徒扰乱了[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的宗教仪式，并捣毁了几座教堂。"
 eqfm_balkans.107.f: "尽管仪式预计很快会恢复，但[SCOPE.sState('eqfm_balkan_state_scope').GetName]的正教社群要求惩治行凶者。"
 eqfm_balkans.107.a: "宗教仪式必须不受干扰。"
 eqfm_balkans.107.b: "这听起来像是一个地方性问题。"
 eqfm_balkans.108.t: "村庄请求设立学校"
 eqfm_balkans.108.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName][GetReligion('orthodox').GetName][GetPopType('academics').GetName]已接触[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的行政机关，请求对偏远地区的教育事业提供支持。"
 eqfm_balkans.108.f: "几百年来，伊斯兰学校非正式地服务着帝国的各个民族，但随着西方思想的传入，许多社群开始组织独立于伊斯兰体系之外的自办教育。"
 eqfm_balkans.108.a: "这项请求是不妥的。"
 eqfm_balkans.108.b: "$turkfm_porte$将提供资金。"
 eqfm_balkans.109.t: "复兴主义出版物"
 eqfm_balkans.109.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的独立出版商发表了一系列报纸文章，呼吁复兴一个脱离$turkfm_sublime_porte$自治的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]国家。当地总督要求就如何应对此事的进展给予指示。"
 eqfm_balkans.109.f: ""
 eqfm_balkans.109.a: "我们绝不容忍异见。查封它。"
 eqfm_balkans.109.b: "这些出版物就像其言词一样空洞无物。"
 eqfm_balkans.110.t: "通译官缓解紧张局势"
 eqfm_balkans.110.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的维齐尔与当地[GetReligion('orthodox').GetName]领袖昨日的会面差点陷入混乱。所幸通译部门的一名通译官在场斡旋，并澄清这场冲突完全是跨文化误解所致。"
 eqfm_balkans.110.f: "“他们是说话的舌，倾听的耳，观察的眼，施予的手，行动的灵；每一场谈判的成败与存亡，皆可能系于其一身。”——威尼斯大使论通译官"
 eqfm_balkans.110.a: "传达嘉许之意。"
 eqfm_balkans.110.b: "嘉奖这位忠信的仆人。"
 eqfm_balkans.111.t: "跨宗教对话"
 eqfm_balkans.111.d: "旨在解决[SCOPE.sState('eqfm_balkan_state_scope').GetName][GetReligion('sunni').GetName]与[GetReligion('orthodox').GetName]社群之间争端的一场会晤取得了超出预期的成效，双方在离场时均认为各自关切得到了恰当回应。"
 eqfm_balkans.111.f: "米勒特大牧首之间的会晤充满误解与升级的风险，但有时，理智依然能够占据上风。"
 eqfm_balkans.111.a: "确实令人意外。"
 eqfm_balkans.112.t: "法律体系冲突"
 eqfm_balkans.112.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的当地总督已向[ROOT.GetCountry.GetCapital.GetCityHubName]求助，请求协助解决臣民之间的法律纠纷。原告要求适用沙里亚教法，而被告则要求按照其米勒特的法律接受审判。"
 eqfm_balkans.112.f: "借数个世纪积累的判例与法令，帝国维持着一套复杂的二元法律框架。沙里亚教法、坎农与米勒特法律体系之间的碰撞不仅十分常见，而且经常被滥用来逃避正义。"
 eqfm_balkans.112.a: "[GetLawType('law_millet_system').GetName]的存在自有其道理。"
 eqfm_balkans.113.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]破获间谍网络"
 eqfm_balkans.113.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的安全部队发现了一个根深蒂固的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]异见分子网络。经过数周的监视，他们报告称已准备对预谋起义者采取行动。"
 eqfm_balkans.113.f: "“我以真理与正义之名，在至高主宰面前发誓，愿牺牲生命、承受最严苛的苦难，以守护即向我揭示的秘密；无论被问及何事，必以实言相告。——#italic 友谊社#!入会誓词”"
 eqfm_balkans.113.a: "逮捕首恶。其余人等依法处置。"
 eqfm_balkans.113.b: "密切监视他们的一举一动……"
 eqfm_balkans.114.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的昂贵租金"
 eqfm_balkans.114.d: "[GetCulture('turkish').GetName][GetPopType('aristocrats').GetName]被指控串通抬高[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的租金，损害了该城[SCOPE.sPop('eqfm_balkan_pop_scope').GetCulture.GetName]居民的利益。他们的族长已请求[ROOT.GetCountry.GetCapital.GetCityHubName]介入。"
 eqfm_balkans.114.f: ""
 eqfm_balkans.114.a: "这是地方事务。"
 eqfm_balkans.114.b: "命我方总督遏制这些乱象。"
 eqfm_balkans.115.t: "[SCOPE.sPop('eqfm_balkan_pop_scope').GetCulture.GetName]人拒交[GetAmendmentType('amendment_gbbf_cizye_tax').GetName]"
 eqfm_balkans.115.d: "我们在[SCOPE.sState('eqfm_balkan_state_scope').GetName]的[SCOPE.sPop('eqfm_balkan_pop_scope').GetCulture.GetName]臣民拒绝缴纳年度[GetAmendmentType('amendment_gbbf_cizye_tax').GetName]。有些人甚至威胁到了当地税吏的家人。"
 eqfm_balkans.115.f: "自奥斯曼征服以来，吉兹亚税一直面向非穆斯林征收。它被理解为为换取保护与自治而缴纳的税金，对它的拒绝即是对苏丹权威的拒绝。"
 eqfm_balkans.115.a: "[GetAmendmentType('amendment_gbbf_cizye_tax').GetName]必须作为法律强制执行。"
 eqfm_balkans.115.b: "也许可以通融一次特例……"
 eqfm_balkans.116.t: "走私军火商袭击[SCOPE.sState('eqfm_balkan_state_scope').GetName]"
 eqfm_balkans.116.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的分裂分子从乡村发起了一系列激进的袭击。初步调查表明，他们的补给来自[SCOPE.sCountry('eqfm_balkan_country_scope').GetNameNoFlag]的走私者。"
 eqfm_balkans.116.f: "帝国与邻国之间的边界已通过一份又一份条约进行了精心的划定。然而真正去贯彻这些边界就是完全另一回事了。"
 eqfm_balkans.116.a: "不敬上帝的懦夫！"
 eqfm_balkans.117.t: "在[SCOPE.sState('eqfm_balkan_state_scope').GetName]截获走私军火商"
 eqfm_balkans.117.d: "向分离主义组织提供武器的走私贩在[SCOPE.sState('eqfm_balkan_state_scope').GetName]被截获。迅速开展的调查表明，他们得到了[SCOPE.sCountry('eqfm_balkan_country_scope').GetNameNoFlag]的资助。"
 eqfm_balkans.117.f: "帝国与邻国之间的边界已通过一份又一份条约进行了精心的划定。然而真正去贯彻这些边界就是完全另一回事了。"
 eqfm_balkans.117.a: "我们将直接向[SCOPE.sCountry('eqfm_balkan_country_scope').GetAdjectiveNoFormatting]政府交涉。"
 eqfm_balkans.117.b: "我们不能冒引发外交事件的风险。放了这些人。"
 eqfm_balkans.002.b: "$gbbf_georegion_rumelia$已被征服。"
 eqfm_balkans.003.b: "$gbbf_georegion_rumelia$终将获得自由。"
 eqfm_balkans.004.t: "民族主义兴起"
 eqfm_balkans.004.d: "一轮复兴热潮席卷了[GetStrategicRegion('region_balkans').GetName]。毋庸置疑：[GetTechnology('nationalism').GetName]已经降临，我们几乎无法将其从臣民心中根除。"
 eqfm_balkans.004.f: "随着叛乱的低语充斥朝堂，苏丹的核心圈子达成一致：遏制复兴浪潮的唯一途径，就是证明奥斯曼帝国是一个更有能力的替代选项。"
 eqfm_balkans.004.a: "这令人担忧。"
 eqfm_balkans.006.tt: "如果#bold 民族主义起义#![concept_journal_entry]进度条达到#bold 200#!，叛军将拿起武器反抗[ROOT.GetCountry.GetAdjectiveNoFlag]统治。"
 eqfm_balkans.008.b: "[SCOPE.sCountry('eqfm_rebellion_scope').GetName]将获得自治。"
 eqfm_balkans.010.t: "鲁米利亚危机"
 eqfm_balkans.010.d: "昔日强大的[SCOPE.sCountry('ottoman_scope').GetName]已无力遏制[GetStrategicRegion('region_balkans').GetName]日益高涨的动荡。动乱可能会继续蔓延。"
 eqfm_balkans.010.f: "伊斯梅尔带领其他维齐尔穿过水烟的袅袅烟雾，走进咖啡馆后方的房间时，仍在瑟瑟发抖。\n\n“你在害怕什么，小伙子？”最年长的维齐尔笑道。“我知道我们的帝国似乎陷入了困境，但它已经延续了数个世纪，而且还将……”随着魁梧的身影从烟雾缭绕的角落里走出，维齐尔的话音戛然而止。\n\n伊斯梅尔门上了栓。“有些人可不这么想，帕夏，他们坚持要见你。”"
 eqfm_balkans.010.a: "这一失败威胁到了[SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting]统治的未来。"
 eqfm_balkans.112.b: "鲁米利亚恢复秩序"
 eqfm_balkans.115.c: "看来他们得改成每两年征收一次了。"
 eqfm_balkans.200.t: "店铺被洗劫"
 eqfm_balkans.200.d: "一系列煽动性文章激怒了愤怒的民众，他们涌入[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]在[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的店面。虽然驻军已疏散人群，但受影响的少数族裔所遭受的损失仍令人担忧。"
 eqfm_balkans.200.f: "随着西方工业主义的兴起，奥斯曼商人逐渐在海外市场失去了竞争力。帝国内部日益盛行一种倾向，即将这些商业失败归咎于少数族裔所谓的阴谋活动。"
 eqfm_balkans.200.a: "这是地方事务。"
 eqfm_balkans.200.b: "规定战争赔款。"
 eqfm_balkans.201.t: "少数群体拒绝被分类"
 eqfm_balkans.201.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]人口对其被纳入更广泛的[GetReligion('orthodox').GetName]米勒特表达了强烈不满。社区领袖已要求在文化事务上享有更大的自主权。"
 eqfm_balkans.201.f: "随着改革与规范化的尝试日益增多，地方社群开始寻求方法，在口头上对普遍平等的理念表示赞同的同时，保留自身独特的特权。"
 eqfm_balkans.201.a: "我们不能让行政体系陷入分裂。"
 eqfm_balkans.201.b: "总督目前可以睁一只眼闭一只眼。"
 eqfm_balkans.202.t: "航运商人遭到侵扰"
 eqfm_balkans.202.d: "由[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]率领的海盗团伙在亚得里亚海劫掠了我们的商船队。"
 eqfm_balkans.202.f: "“能抢多少抢多少！”\n“绝不归还分毫！”"
 eqfm_balkans.202.a: "我们不能容忍这样。"
 eqfm_balkans.203.t: "人群聚集于城市中心"
 eqfm_balkans.203.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的[GetReligion('orthodox').GetName]与[GetReligion('sunni').GetName]社群之间的争端再度升级，[GetReligion('orthodox').GetName]民众已在市中心聚集。地方当局表示担忧，冲突恐一触即发。"
 eqfm_balkans.203.f: "尽管少数族群与逊尼派多数群体之间常有分歧，但各地总督对任何可能引发真正冲突的威胁都会迅速作出反应。"
 eqfm_balkans.203.a: "让警察驱散人群。"
 eqfm_balkans.203.b: "让他们互相叫嚣去吧。"
 eqfm_balkans.203.c: "让驻军把他们镇压下去。"
 eqfm_balkans.204.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的语言禁令"
 eqfm_balkans.204.d: "当地总督已下令禁止在任何官方场合使用非[GetCulture('turkish').GetName]语言导致[SCOPE.sState('eqfm_balkan_state_scope').GetName]引发了强烈抗议"
 eqfm_balkans.204.f: "尽管奥斯曼帝国名义上是土耳其人的帝国，但数百年来，其行政当局一直默许在[ROOT.GetCountry.GetCapital.GetCityHubName]宫廷之外使用各地本土语言。任何对这一现状的改变，都可能颠覆延续数个世纪的传统。"
 eqfm_balkans.204.a: "这在他的职权范围内。"
 eqfm_balkans.204.b: "命令他撤销禁令。"
 eqfm_balkans.204.c: "绝妙的主意，将此推广至整个帝国。"
 eqfm_balkans.205.t: "地方主教向总督请愿"
 eqfm_balkans.205.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的[GetReligion('orthodox').GetName]长老们谴责当地[ROOT.GetCountry.GetAdjectiveNoFlag]官员歧视行为日益增多，并要求[ROOT.GetCountry.GetCapital.GetCityHubName]直接介入。"
 eqfm_balkans.205.f: "我们缴纳更多的税赋，土地被不断侵占，而针对我们的罪行却无人追究。我们究竟是附属还是奴隶？"
 eqfm_balkans.205.a: "这个要求太荒谬了。"
 eqfm_balkans.205.b: "公共秩序必须放在首位。"
 eqfm_balkans.206.t: "[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]领袖被捕"
 eqfm_balkans.206.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的一位知名活动人士已被当地当局拘留，并被指控组织分裂活动。在已对其施加恶劣拘押条件的情况下，当局已向[ROOT.GetCountry.GetAdjectiveNoFlag]总督请示进一步指示。"
 eqfm_balkans.206.f: "自他被捕之日起，人群便包围了总督在[SCOPE.sState('eqfm_balkan_state_scope').GetCityHubName]的官邸，要求立即释放他并给予赔偿。"
 eqfm_balkans.206.a: "他是帝国权威的罪犯。"
 eqfm_balkans.206.b: "我们不能冒险激化形势。"
 eqfm_balkans.207.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]的海盗活动"
 eqfm_balkans.207.d: "过去一周，我们在亚得里亚海的船队屡遭[concept_albanian_piracy]袭扰。在[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]的率领下，这群匪徒令我们的商船队闻风丧胆。"
 eqfm_balkans.207.f: "“有人看到了吗？因为我是不会再做一次了！”"
 eqfm_balkans.207.a: "这是不可接受的。"
 eqfm_balkans.207.b: "让我们的远征舰队将他们赶走。"
 eqfm_balkans.208.t: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]村民流离失所"
 eqfm_balkans.208.d: "[SCOPE.sState('eqfm_balkan_state_scope').GetName]因[GetCulture('turkish').GetName]人在历史上由[SCOPE.sCulture('eqfm_balkan_culture_scope').GetName]社群居住的土地上定居而引发情绪激化。当地人声称他们正在被驱逐，而新来者则声称他们定居的是废弃无人的土地。"
 eqfm_balkans.208.f: "在奥斯曼征服后的几个世纪里，基督教与伊斯兰教人口相处融洽，各自保留着本教派的社群。随着偏执情绪笼罩[GetReligion('sunni').GetName]人口，这种共存关系开始破裂。"
 eqfm_balkans.208.a: "这些事情应由地方总督处理。"
 eqfm_balkans.208.b: "在情绪平息之前，遏制新的定居活动。"
 eqfm_balkans.208.c: "我们应当鼓励这些新的定居点。"
 eqfm_balkans.209.t: "土匪越境"
 eqfm_balkans.209.d: "[SCOPE.sCountry('eqfm_balkan_country_scope').GetNameNoFlag]公然缺乏中央控制的问题再次达到顶峰。土匪跨越[SCOPE.sCountry('eqfm_balkan_country_scope').GetAdjectiveNoFormatting]边境窜入[ROOT.GetCountry.GetAdjectiveNoFlag]境内，一路留下了更多破坏。"
 eqfm_balkans.209.f: "幻灭的非正规军利用弱势的政府控制和警察腐败，对劳动者和绅士阶层大肆劫掠。他们来去如风，当地头领发现数个村庄遭到了袭击和焚毁。"
 eqfm_balkans.209.a: "我们必须讨回公道。"
 eqfm_balkans.209.b: "也许我们可以在此问题上开展合作。"
