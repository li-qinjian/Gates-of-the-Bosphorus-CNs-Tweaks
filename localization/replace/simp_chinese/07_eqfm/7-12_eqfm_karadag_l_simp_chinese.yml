 notification_eqfm_expeditionary_force_arrives_name: "奥斯曼远征军抵达边境"
 notification_eqfm_expeditionary_force_arrives_desc: "奥斯曼帝国已部署了一支$eqfm_karadag_expedition$以打击[concept_raiding]。"
 notification_eqfm_expeditionary_force_withdraws_name: "奥斯曼远征军从边境撤离"
 notification_eqfm_expeditionary_force_withdraws_desc: "土耳其的$eqfm_karadag_expedition$已撤回以舔舐伤口。"
 notification_eqfm_noble_released_name: "奥斯曼贵族被释放"
 notification_eqfm_noble_released_desc: "黑山劫掠者最近在一次黑山边境劫掠中俘获了一名小贵族。出人意料的是，他们大发慈悲，允许他返回奥斯曼领土。"
 notification_eqfm_noble_captured_name: "奥斯曼贵族遭俘获"
 notification_eqfm_noble_captured_desc: "黑山劫掠者在一次黑山边境劫掠中抓住了一名小贵族。这是这场冲突中令人尴尬的挫折。"
 notification_eqfm_folk_hero_killed_name: "黑山民间英雄阵亡"
 notification_eqfm_folk_hero_killed_desc: "奥斯曼士兵击毙了一位著名的#yellow 黑山#!战争领袖。这不仅增加了奥斯曼在黑山边境的影响力，也进一步激发了黑山人民反抗$turkfm_porte$的怒火。"
 notification_eqfm_village_skirmish_name: "$eqfm_tribal_skirmish$升级"
 notification_eqfm_village_skirmish_desc: "消息传来，在[GetStateRegion('STATE_MONTENEGRO').GetName]的一个边境村庄，冲突正在升级。双方民兵已深挖战壕，准备进行一场持久战。"
 notification_eqfm_villages_burned_name: "村庄外围被焚"
 notification_eqfm_villages_burned_desc: "村庄外围的几座建筑被付之一炬。这使我们在$eqfm_tribal_skirmish$中损失了#v 1#!点进度。"
 notification_eqfm_noble_beheaded_name: "奥斯曼贵族被斩首"
 notification_eqfm_noble_beheaded_desc: "在我们拒绝为失踪的指挥官支付赎金后，$MON$已将他们的俘虏斩首处决。他的头颅现在成了$MON_ADJ$王宫防御工事上的装饰品。"
 eqfm_renounce_headtaking_name: "废止猎首习俗"
 eqfm_renounce_headtaking_desc: "猎首是[GetStateRegion('STATE_MONTENEGRO').GetName]部落历史上一种奇异而野蛮的残存习俗。尽管此前试图通过谈判将其废除的努力均告失败，但随着与西方接触的增加，终结这种习俗又获得了新的支持。"
 eqfm_renounce_headtaking_possible: "在过去#bold 5#!年内未曾进行过关于#bold 猎首#!的谈判"
 eqfm_renounce_headtaking_effect: "参与者将决定是否压制猎首行为"
 eqfm_increase_raiding_name: "“给我带来更多首级！”"
 eqfm_increase_raiding_desc: "鼓励部落更频繁地劫掠，从而提高[concept_raiding_frequency]。这将增加我们的收入，但会损害我们与#v $RUS$#!，尤其是与#v 奥斯曼帝国#!的[concept_relations]。"
 eqfm_decrease_raiding_name: "限制劫掠"
 eqfm_decrease_raiding_desc: "强迫部落限制他们的劫掠行为，从而降低[concept_raiding_frequency]。$RUS$#!会赞赏我们向#v 奥斯曼帝国#!展现文明开化的这一举措。"
 eqfm_appoint_tribal_chief_name: "任命部落首领"
 eqfm_appoint_tribal_chief_desc: "[concept_raiding]在[GetStateRegion('STATE_MONTENEGRO').GetName]是一种普遍现象，且大多是自发无序的。通过指派一名部落首领来协调劫掠，我们便能截留他们的战利品，并将更大份额的收益直接纳入国库。"
 eqfm_dismiss_tribal_chief_name: "罢免部落首领"
 eqfm_dismiss_tribal_chief_desc: "部落首领在忠诚时是很有用的。若其一旦心生反骨，除了将其“处理”掉之外，也就别无他法了。"
 eqfm_ransom_captives_name: "通过奥斯曼贵族勒索赎金"
 eqfm_ransom_captives_desc: "虽然我们俘获的贵族是一件强有力的政治宣传工具，但除了在囚禁中苦苦煎熬外，他们对我们的事业并无多大实质贡献。奥斯曼宫廷或许会为了挽回颜面而愿意支付一笔赎金。"
 eqfm_ransom_captives_possible: "我们至少有#bold 1#!名被俘的贵族"
 eqfm_negotiate_kotor_name: "关于亚得里亚海出海口的谈判"
 eqfm_negotiate_kotor_desc: "科托尔及其周边土地长期以来一直是黑山人民的家园，却因数个世纪以来的帝国图谋而被不公地与他们的同胞强行割裂。然而，只要我们更紧密地倒向维也纳的帝国，那位皇帝或许会愿意听取我们的诉求。"
 eqfm_abandon_karadag_name: "放弃对黑山的图谋"
 eqfm_abandon_karadag_desc: "征服[GetStateRegion('STATE_MONTENEGRO').GetName]高地被许多人视为白日做梦。虽然这很痛苦，但让黑山这头猛兽在一旁沉睡，能让我们腾出精力去推行其他计划……"
 eqfm_start_scheming_name: "密谋对付#v $Smail$-阿加#!"
 eqfm_start_scheming_desc: "#v $Smail$-阿加#!曾是核心圈子里备受信任的一员，如今却成为了[ROOT.GetCountry.GetRuler.GetLastName]帕夏在[ROOT.GetCountry.GetNameNoFlag]统治的威胁。我们理应先发制人，赶在这个暴发户阿加有时间向君士坦丁堡献媚之前重拳出击。"
 eqfm_assign_border_guard_name: "部署$eqfm_karadag_expedition$"
 eqfm_assign_border_guard_desc: "黑山与奥斯曼帝国之间的边界模糊不清，人们随意越境已是司空见惯之事。只要齐心协力，[ROOT.GetCountry.GetNameNoFlag]就能将其影响力扩展至黑山边境。然而，当地的部落首领可未必会乐见他们的土地遭到破坏。"
 eqfm_recall_karadag_expedition_name: "召回$eqfm_karadag_expedition$"
 eqfm_recall_karadag_expedition_desc: "$eqfm_recall_expedition_desc$"
 eqfm_arrest_ali_pasha_name: "扣押阿里帕夏"
 eqfm_arrest_ali_pasha_desc: "阿里帕夏·里兹万贝戈维奇是对苏丹正统性与权威的直接威胁。只要他还逍遥法外，$turkfm_porte$就不能自欺欺人地认为其统治安如泰山。"
 eqfm_value_from_raiding_intensity: "当前的[concept_raiding_frequency]"
 eqfm_value_from_practicing_headtaking: "实行猎首习俗"
 eqfm_value_from_no_raid_leader: "缺乏#bold 劫掠领袖#!的惩罚"
 eqfm_value_from_skirmish: "正在进行的$eqfm_tribal_skirmish$的惩罚"
