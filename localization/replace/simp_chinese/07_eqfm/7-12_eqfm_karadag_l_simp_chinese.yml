 eqfm_raiding_more_than_min: "[concept_raiding_frequency]大于#bold 0#!"
 eqfm_has_tribal_chief_cooldown_NOT: "[ROOT.GetCountry.GetNameNoFlag]在过去的一年内未曾指定过#bold 部落首领#!"
 eqfm_has_captive_nobles: "[ROOT.GetCountry.GetNameNoFlag]关押有奥斯曼将军俘虏"
 eqfm_ali_rizvanbegovic_waxed: "#bold 阿里帕夏#!与其子#bold 穆罕默德#!均不再统治#v $dyn_c_bosnia_eyalet$#!"
 eqfm_ottomans_top_overlord_of_montenegro: "#bold $dyn_c_ottoman_empire$#!是[GetStateRegion('STATE_MONTENEGRO').GetName]所有$gbbf_states$的最高级拥有者或[concept_overlord]"
 eqfm_karadag_expedition: "@gbbf_expedition_karadag! #yellow #tooltip:[GetRawTextTooltipTag('eqfm_karadag_expedition_desc')] 黑山远征#!#!"
 eqfm_karadag_expedition_desc: "#bold 黑山边疆#!因其崎岖的地形和缺乏发展的综合因素，一直与更广阔世界的影响相隔绝。随着奥斯曼帝国在垂死挣扎中四处出击，$turkfm_porte$已下定决心要彻底征服黑山部落。"
 eqfm_dismiss_tribal_chief: "这将使我们获得的[concept_raiding]收入减少#v #red 75%#!#!，直到我们任命一位新的部落首领"
