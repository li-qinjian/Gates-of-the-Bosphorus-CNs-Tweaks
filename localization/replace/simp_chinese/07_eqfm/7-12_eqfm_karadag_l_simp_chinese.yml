 eqfm_tribal_skirmish: "#bold #tooltip:[GetRawTextTooltipTag('eqfm_tribal_skirmish_desc')] 部落冲突#!#!"
 eqfm_tribal_skirmish_desc: "当黑山与奥斯曼军队在一个边境村庄周围深挖战壕对峙时，就会发生#bold 部落冲突#!。在战斗平息之前，双方都无法安全撤出。"
