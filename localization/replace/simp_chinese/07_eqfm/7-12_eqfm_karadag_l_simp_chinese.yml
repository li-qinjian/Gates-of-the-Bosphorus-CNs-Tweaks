 je_eqfm_karadag_flavor: "[GetPlayer.GetCustom('eqfm_karadag_flavor_type')]"
 je_eqfm_karadag_flavor_generic: "在许多方面，[GetStateRegion('STATE_MONTENEGRO').GetName]险恶的边疆保留了许多中世纪之前的冲突与部落统治习俗。从抓捕奴隶到猎取人头，这片腹地向外部世界展现了一种奇异的、残存的部落行为。随着奥斯曼帝国努力维护其主权，它期望最终能让黑山人屈服。"
 je_eqfm_karadag_flavor_montenegro: "$je_eqfm_karadag_flavor_generic$"
 je_eqfm_karadag_flavor_bosnia: "#bold 阿里帕夏·里兹万贝戈维奇#!被任命为黑塞哥维那维齐尔，作为他对$turkfm_porte$效劳的奖赏。在此后的数年里，他一直密谋将波斯尼亚作为私人领地来统治，并屡次拒绝$turkfm_porte$推行现代化的命令。"
 je_eqfm_karadag_flavor_ottoman: "$je_eqfm_karadag_flavor_generic$"
 je_eqfm_karadag_details: "[GetPlayer.GetCustom('eqfm_karadag_raiding_type')][GetPlayer.GetCustom('eqfm_karadag_ali_pasha_type')]"
 je_eqfm_karadag_raiding: "$gbbf_linebreak_normal$[ROOT.GetCountry.GetNameNoFlag]当前的[concept_raiding_frequency]为[GetPlayer.MakeScope.Var('raiding_intensity').GetValue]。这使得每周可从[concept_raiding]中获得#g @money! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_karadag_raiding_breakdown [GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue|+=0]#!#!（最高为#v 5000#!）的收入。[GetPlayer.GetCustom('eqfm_karadag_raiding_organizer_type')][GetPlayer.GetCustom('eqfm_karadag_captives_type')]"
 je_eqfm_karadag_raiding_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_raiding_income_value')]"
 je_eqfm_karadag_raiding_amount: "\n[concept_raiding]正在为我们赚取#g @money!+[GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue]#!"
 je_eqfm_karadag_raiding_amount_max: "\n[concept_raiding]正在为我们赚取#g @money!+[GetPlayer.MakeScope.ScriptValue('eqfm_max_raiding_income_value')]#!（最大值）"
 je_eqfm_karadag_wrath_of_ali_pasha: "$gbbf_linebreak_normal$@warning!#v 黑山#!遭到了黑塞哥维那维齐尔#bold 阿里帕夏·里兹万贝戈维奇#!的袭击。为了提升自己在高门眼中的影响力，阿里帕夏已下定决心，要最终将黑山彻底纳入#v 奥斯曼帝国#!的版图。"
 je_eqfm_karadag_ambitions_of_ali_pasha: "$gbbf_linebreak_normal$@information!如果[ROOT.GetCountry.GetName]失去对[GetStateRegion('STATE_MONTENEGRO').GetName]的[concept_claim]，它将从#bold $je_eqfm_karadag$#![concept_journal_entry]中被移除。"
