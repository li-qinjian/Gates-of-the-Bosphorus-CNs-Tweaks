l_simp_chinese:
 eqfm_libyan_desert.001.t: "一片未驯服的边疆"
 eqfm_libyan_desert.001.d: "随着[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]执掌[ROOT.GetCountry.GetName]，也带来了必须扩展[ROOT.GetCountry.GetOverlord.GetName]权威的使命。"
 eqfm_libyan_desert.001.f: "[ROOT.GetCountry.GetAdjectiveNoFlag]政府名义上宣称对[GetStateRegion('STATE_LIBYAN_DESERT').GetName]拥有主权，但除主要城市外，中央权威在该地区只是虚有其表。在更远的沙漠地带，[GetCulture('bedouin').GetName]部落始终遵循着自己的法律。"
 eqfm_libyan_desert.001.a: "我们将征服沙漠。"
 eqfm_libyan_desert.001.b: "不惜一切代价。"
 eqfm_libyan_desert.005.t: "掌控沙漠"
 eqfm_libyan_desert.005.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]以授权$eqfm_expedition$以确保[ROOT.GetCountry.GetNameNoFlag]对[GetStateRegion('STATE_LIBYAN_DESERT').GetName]的控制。现仅剩选定领袖一事。"
 eqfm_libyan_desert.005.f: "“不守纪律…不守时…不整洁。精通多种语言。懂得音乐…懂得文学…懂得…懂得……你是个有趣的人，毫无疑问。”"
 eqfm_libyan_desert.005.a: "也许现在还不是时候。"
 eqfm_libyan_desert.005.b: "[SCOPE.sCharacter('expedition_leader_1').GetFullName]完全胜任。"
 eqfm_libyan_desert.005.c: "[SCOPE.sCharacter('expedition_leader_2').GetFullName]有潜力。"
 eqfm_libyan_desert.005.e: "[SCOPE.sCharacter('expedition_leader_1').GetFullName]是个不错的选择。"
 eqfm_libyan_desert.006.t: "探险队出发进入沙漠"
 eqfm_libyan_desert.006.d: "经过数周集结与物资筹备，[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName]已从[ROOT.GetCountry.GetCapital.GetCityHubName]出发进入[GetStateRegion('STATE_LIBYAN_DESERT').GetName]，以支援我们掌控这片荒漠。"
 eqfm_libyan_desert.006.f: "“那就是沙漠，从这里开始，直到我们抵达另一端，除了随身携带的水源之外再无滴水。至于骆驼，则完全得不到饮水。如果骆驼死去，我们也活不成。二十天后，它们将开始陆续倒下。”"
 eqfm_libyan_desert.006.a: "祝好运……"
 eqfm_libyan_desert.007.t: "沙漠探险队归来"
 eqfm_libyan_desert.007.d: "由于补给匮乏且损失惨重，[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName]已从[GetStateRegion('STATE_LIBYAN_DESERT').GetName]返回。"
 eqfm_libyan_desert.007.f: "“我祈祷我再也不要见到那片沙漠。神啊，请听我的祈求。”"
 eqfm_libyan_desert.007.a: "至少他们活着回来了。"
 eqfm_libyan_desert.008.t: "探险队长已去世！"
 eqfm_libyan_desert.008.d: "我们的$eqfm_desert_expedition$在[GetStateRegion('STATE_LIBYAN_DESERT').GetName]的消息返回来，是关于[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName]遇难的悲惨消息。"
 eqfm_libyan_desert.008.f: "“我祈祷我再也不要见到那片沙漠。神啊，请听我的祈求。”"
 eqfm_libyan_desert.008.a: "悲惨境遇"
 eqfm_libyan_desert.009.t: "利比亚沙漠"
 eqfm_libyan_desert.009.d: "通过共同努力，[ROOT.GetCountry.GetAdjective]政府成功征服[GetStateRegion('STATE_LIBYAN_DESERT').GetName]的边疆地区，并将这条通往南方的重要纽带置于国家控制之下。"
 eqfm_libyan_desert.009.f: "虽然欧洲人常将沙漠视为荒地，这些沙漠自古以来是游牧民族交流网络。"
 eqfm_libyan_desert.009.a: "这些土地属于[ROOT.GetCountry.GetName]"
 eqfm_libyan_desert.010.t: "伊斯兰隐士传播异端教义"
 eqfm_libyan_desert.010.d: "几位#yellow [GetCharacterTrait('gbbf_trait_marabout').GetName]#!被举报传播违背乌理玛教义的学说。据报已有小型学校在[SCOPE.sState('eqfm_senussi_marabout_state').GetName]扎根。"
 eqfm_libyan_desert.010.f: "由于没有中央权威可以回应，教士们从一个村庄游历到另一个村庄，传播他们对伊斯兰法学的独特解释。"
 eqfm_libyan_desert.010.a: "随他们去吧。"
 eqfm_libyan_desert.010.b: "在这些事态扩大之前，关闭这些学校，"
 eqfm_libyan_desert.011.t: "不安全沙漠路线"
 eqfm_libyan_desert.011.d: "南方的商人警告说，穿越沙漠的贸易路线因[GetCulture('bedouin').GetName]部落间的冲突而中断。"
 eqfm_libyan_desert.011.f: "“只要阿拉伯人部落之间互相争斗，他们就永远是一个渺小的民族，一个愚蠢、贪婪、野蛮且残忍的民族……”"
 eqfm_libyan_desert.011.a: "他们的争执与我们无关。"
 eqfm_libyan_desert.011.b: "我们应该促成和平。"
 eqfm_libyan_desert.011.c: "让我们的$eqfm_desert_expedition$确保道路安全。"
 eqfm_libyan_desert.012.t: "税收问题"
 eqfm_libyan_desert.012.d: "当地贝伊与[GetCulture('bedouin').GetName]部族首领在[SCOPE.sState('eqfm_desert_event_state').GetName]就税收政策实施问题爆发争执。部族首领坚称他们有权获得部分税收收入，而贝伊则试图将所有税收纳入其管辖范围。"
 eqfm_libyan_desert.012.f: "“这里没有战士，我们只做交易，这是老人的活，毕竟年轻人渴望发动战争，而战争也属于年轻人，尘埃落定之后，老年人负责缔造和平。”"
 eqfm_libyan_desert.012.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的法律将是唯一的法律。"
 eqfm_libyan_desert.012.b: "他们可以保留这项权利。"
 eqfm_libyan_desert.020.t: "沙尘暴"
 eqfm_libyan_desert.020.d: "$eqfm_desert_expedition$已被一场猛烈的沙尘暴笼罩，且毫无短期内减弱的迹象。"
 eqfm_libyan_desert.020.f: "“劳伦斯，只有两种生灵能在沙漠中找到乐趣：贝都因人和神祇，而你两者都不是。听我一句劝，对普通人而言，这里就是座燃烧的烈焰熔炉。”"
 eqfm_libyan_desert.020.a: "“大家快找掩护！”"
 eqfm_libyan_desert.021.t: "沙子，沙子，还是沙子"
 eqfm_libyan_desert.021.d: "$eqfm_desert_expedition$在缺乏明显地标的沙漠区域迷失了方向。"
 eqfm_libyan_desert.021.f: "“大人，我认为……您的书上的「沙漠是一片无桨可渡的海洋，而在这片海洋上，贝都因人随心所至，随处出击」说的很对。”"
 eqfm_libyan_desert.021.a: "“我以为他们知道怎么用指南针呢……”"
 eqfm_libyan_desert.021.b: "“幸好，[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName]认得路。”"
 eqfm_libyan_desert.022.t: "令人欣慰的喘息时刻"
 eqfm_libyan_desert.022.d: "“是，长官！就在正前方！”\n$eqfm_desert_expedition$队员们听到前方侦察兵确认疑似水源实为绿洲后，集体松了口气。他们灌满水袋、让骆驼歇息后，正等待着进一步的指示。"
 eqfm_libyan_desert.022.f: "“他渴望故土，怀念萨里郡的哥特式小屋，不是吗？他已经在想象中钓鳟鱼，从事着英国绅士的一切活动。”"
 eqfm_libyan_desert.022.a: "“我们不该耽搁太久，沙漠正等着我们。”"
 eqfm_libyan_desert.022.b: "“让我们在此歇息吧，前方的路途或许还很漫长……”"
 eqfm_libyan_desert.022.c: "“安营扎寨。请求补给。”"
 eqfm_libyan_desert.023.t: "沙漠外交"
 eqfm_libyan_desert.023.d: "$eqfm_desert_expedition$预计将在一天内经过一个主要沙漠聚居地。[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]的顾问们认为这可能是改善与当地部落关系的良机。"
 eqfm_libyan_desert.023.f: "“盗亦有道，但政客无耻。”"
 eqfm_libyan_desert.023.a: "“传信当地酋长，我们将设宴相待。”"
 eqfm_libyan_desert.023.b: "“停下来补给，仅此而已。”"
 eqfm_libyan_desert.023.c: "“这纯粹是在浪费时间。”"
 eqfm_libyan_desert.024.t: "绘制沙漠地图"
 eqfm_libyan_desert.024.d: "几名骑手已从$eqfm_desert_expedition$侦察任务中归来。这让[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]对行动方向有了清晰的规划。"
 eqfm_libyan_desert.024.f: "“没有阿拉伯人热爱沙漠。我们热爱水和绿树。沙漠里一无所有，而人不需要一无所有。”"
 eqfm_libyan_desert.024.a: "“稳步前行。”"
 eqfm_libyan_desert.024.b: "“让我们再推进一步。”"
 eqfm_libyan_desert.025.t: "骆驼背上的冲突"
 eqfm_libyan_desert.025.d: "一支[GetCulture('bedouin').GetName]游牧民将盯上了$eqfm_desert_expedition$。随着太阳升起，沙丘之上，他们的攻击意图昭然若揭。指挥应对的重任落在了[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]肩上。"
 eqfm_libyan_desert.025.f: "“在这个国家，本特利先生，在战斗中取得胜利的人比其他人都更受重视......”"
 eqfm_libyan_desert.025.a: "“排成一列……在那儿——沙丘顶上。”"
 eqfm_libyan_desert.025.b: "“不留俘虏！不留俘虏！”"
 eqfm_libyan_desert.025.c: "“抛下你必须抛下的东西！”"
 eqfm_libyan_desert.026.t: "部落司法"
 eqfm_libyan_desert.026.d: "附近部落的骑手们带着一个奇怪的困境来到$eqfm_desert_expedition$——他们希望调解部落间的争端，却因担心引发血仇而未能选出合适的调解人。他们提议由[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]担任中立仲裁者。"
 eqfm_libyan_desert.026.f: "“那么我将执行律法。我没有部落，也不会冒犯任何人。”"
 eqfm_libyan_desert.026.a: "“让我们顺从他们的请求。”"
 eqfm_libyan_desert.026.b: "“这有失我们的身份。”"
 eqfm_libyan_desert.027.t: "欢迎之雨"
 eqfm_libyan_desert.027.d: "起初，地平线上只出现了一道纤细的阴影，转眼化作一场突如其来的暴雨，这很可能是今年唯一一场雨。在找到安全地点后，$eqfm_desert_expedition$趁机补充了饮用水并清洗了设备。"
 eqfm_libyan_desert.027.f: "“没有阿拉伯人热爱沙漠。我们热爱水和绿树。沙漠里一无所有，而人不需要一无所有。”"
 eqfm_libyan_desert.027.a: "真是个奇迹！"
 eqfm_libyan_desert.028.t: "安全通道绘制完成"
 eqfm_libyan_desert.028.d: "经过数日细致的侦察，$eqfm_desert_expedition$已绘制出穿越[GetStateRegion('STATE_LIBYAN_DESERT').GetName]沙丘的数条安全通道图。一支团队正准备将这些情报送往[ROOT.GetCountry.GetCapital.GetCityHubName]，以协助我们的殖民工作。"
 eqfm_libyan_desert.028.f: "沙漠中几乎没有像样的基础设施，穿越沙海的最佳路线只有贝都因人知道。"
 eqfm_libyan_desert.028.a: "干得漂亮。"
 eqfm_libyan_desert.028.b: "让我们把调查范围再扩大一点。"
 eqfm_libyan_desert.029.t: "意外的招募"
 eqfm_libyan_desert.029.d: "过去一周，$eqfm_expedition$一直与一支[GetCulture('bedouin').GetName]部落队伍同行。当队伍准备在某处定居点外围分道扬镳时，部落成员中的一人主动接近[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]，表示愿意加入我们的行动。"
 eqfm_libyan_desert.029.f: "“一千个阿拉伯人意味着一千把刀，无论白天黑夜都能送到任何地方。这意味着一千头骆驼。这意味着一千包高爆炸药和一千支精良步枪。”"
 eqfm_libyan_desert.029.a: "远征队必须保持专注。"
 eqfm_libyan_desert.029.b: "欢迎他们在[SCOPE.sState('eqfm_desert_event_state').GetName]定居。"
 eqfm_libyan_desert.029.c: "如果[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]相信他们，那么他将领导他们。"
 eqfm_libyan_desert.029.e: "[SCOPE.sCharacter('eqfm_desert_event_tribal_character').GetFullName]将成为一名出色的战役。"