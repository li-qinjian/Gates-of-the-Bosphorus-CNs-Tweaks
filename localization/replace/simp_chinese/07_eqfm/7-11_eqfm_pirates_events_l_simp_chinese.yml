l_simp_chinese:
 eqfm_pirates.001.t: "亚得里亚海的海盗"
 eqfm_pirates.001.d: "几个世纪以来，以[GetGeographicRegion('geographic_region_adriatic_sea').GetName]东岸为基地的[GetCulture('albanian').GetName]海盗一直在袭击欧洲船只。这些被意大利人称为“乌尔齐尼海狼”的专业海盗长期以来为$turkfm_porte$服务。"
 eqfm_pirates.001.f: "“杜尔奇尼奥海盗曾是意大利和亚得里亚海的恐怖分子；他们的海员曾备受高门追捧，其中不止一人成为了船长帕夏。”——艾米丽·安妮·博福特·斯迈思子爵夫人，1863年"
 eqfm_pirates.001.a: "这些是未开发的水域。"
 eqfm_pirates.001.tt: "只要[concept_albanian_piracy]依然根深蒂固，[GetGeographicRegion('geographic_region_adriatic_sea').GetName]沿岸国家就将面临#bold 海盗事件#!的风险。"
 eqfm_pirates.002.t: "平定亚得里亚海"
 eqfm_pirates.002.d: "海军部奉命保卫我们在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]的利益，必须为这支仓促组建的海军部队选出一位领导者。几位颇有潜力的候选人脱颖而出。"
 eqfm_pirates.002.f: "“攻击授权？我以为海盗已经少很多了……”"
 eqfm_pirates.002.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName]是一位经验丰富的海军指挥官。"
 eqfm_pirates.002.b: "[SCOPE.sCharacter('expedition_leader_2').GetFullName]会为我们好好服务的。"
 eqfm_pirates.002.c: "[SCOPE.sCharacter('expedition_leader_3').GetFullName]以前从未让我们失望。"
 eqfm_pirates.002.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName]准备得最充分。"
 eqfm_pirates.003.t: "[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]抵达[GetGeographicRegion('geographic_region_adriatic_sea').GetName]"
 eqfm_pirates.003.d: "经过数周的准备和跋涉，[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]率领的远征队已穿越奥特朗托海峡。从这里开始，他们将开始追踪[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]及其海盗的任务。"
 eqfm_pirates.003.f: "“[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]大人很快就会让这些卑鄙的海盗逃走。”"
 eqfm_pirates.003.a: "先生，我们船帆正顺风。"
 eqfm_pirates.004.t: "[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]撤出[GetGeographicRegion('geographic_region_adriatic_sea').GetName]"
 eqfm_pirates.004.d: "面对日益减少的补给和低落的士气，[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]已通知海军部，他唯一的行动方案就是返航。"
 eqfm_pirates.004.f: "“我们会回来的。”"
 eqfm_pirates.004.a: "怎么会这样……"
 eqfm_pirates.005.t: "远征领袖死亡！"
 eqfm_pirates.005.d: "前往[GetGeographicRegion('geographic_region_adriatic_sea').GetName]的远征队遭遇不幸，队长在完成任务之前就去世了。"
 eqfm_pirates.005.f: "由于我们的远征队群龙无首、组织混乱，该下令他们返航了。"
 eqfm_pirates.005.a: "多么悲惨……"
 eqfm_pirates.006.t: "海盗藏身处被摧毁"
 eqfm_pirates.006.d: "在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]搜寻了数周后，[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]船长在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]发现了一处海盗据点。他随时准备攻破防御工事，摧毁据点。"
 eqfm_pirates.006.f: "“兄弟会知道将被剿灭。剩下的就是要决定在哪里进行最后的抵抗。”"
 eqfm_pirates.006.a: "让他们承受[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的正义审判。"
 eqfm_pirates.007.t: "海盗舰队被摧毁"
 eqfm_pirates.007.d: "在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]搜寻了数周之后，[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]船长果断地与[SCOPE.sState('eqfm_piracy_state_scope').GetName]沿海海盗交战并将其摧毁，烧毁了船只并将所有幸存者用锁链锁住。"
 eqfm_pirates.007.f: "“奉劝你们的兄弟们，你们可以战斗，但你们所有人都会死，或者你们投降，这样部分人会活下来。”"
 eqfm_pirates.007.a: "给予她们参会的权利。"
 eqfm_pirates.008.t: "[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]被逮捕"
 eqfm_pirates.008.d: "凯旋的消息传到了[ROOT.GetCountry.GetCapital.GetCityHubName]。[ROOT.GetCountry.GetAdjectiveNoFlag]海军凭借力量和勇气，[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]俘获了卑鄙的[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]。"
 eqfm_pirates.008.f: "“你凭什么权力逮捕这个人？”\n“凭王室权力。”\n"
 eqfm_pirates.008.a: "他将因其罪行而在牢房里腐烂。"
 eqfm_pirates.008.b: "送上绞刑架！"
 eqfm_pirates.008.c: "我能想到更好地利用他才能的方法……"
 eqfm_pirates.009.t: "[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]的终结"
 eqfm_pirates.009.d: "在进入[GetGeographicRegion('geographic_region_adriatic_sea').GetName]之后，[SCOPE.sCountry('eqfm_piracy_country_scope').GetName]抓获了邪恶的海盗[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]，并结束了海盗在亚得里亚海的恐怖统治。"
 eqfm_pirates.009.f: "“我们见证了海盗的终结，也见证了[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]的终结。还有比这更辉煌的一天吗！”"
 eqfm_pirates.009.a: "亚得里亚海最终将迎来和平。"
 eqfm_pirates.010.t: "沿海村庄遭到袭击！"
 eqfm_pirates.010.d: "海盗袭击了[SCOPE.sState('eqfm_piracy_state_scope').GetName]的沿海村庄，洗劫当地，并将数十名公民卖为奴隶。"
 eqfm_pirates.010.f: "“奴隶贸易确实不是什么令人愉快的生意，但它利润丰厚。这是一门非常好的生意。现在人们可……太挑剔了。”"
 eqfm_pirates.010.a: "这就是沿海地区的危险。"
 eqfm_pirates.010.b: "我们应该提供救济方案。"
 eqfm_pirates.010.c: "让[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]提供物资。"
 eqfm_pirates.011.t: "商船遭袭击！"
 eqfm_pirates.011.d: "据悉我国数艘商船在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]遭海盗劫持。这些事件中展现出的暴力行为令商船队不寒而栗。"
 eqfm_pirates.011.f: "“征用！我们要征用那艘船！（航海术语）”"
 eqfm_pirates.011.a: "这太野蛮了。"
 eqfm_pirates.012.t: "贵族被劫持"
 eqfm_pirates.012.d: "海盗劫持[ROOT.GetCountry.GetNameNoFlag][GetPopType('aristocrats').GetName]的船只，并扣押他索要赎金，我们没时间采取行动了。"
 eqfm_pirates.012.f: "“现在……在我把他们交给我之前，我有一两个条件。”"
 eqfm_pirates.012.a: "传达我们会付款的消息。"
 eqfm_pirates.012.b: "我们不与恐怖分子谈判。"
 eqfm_pirates.012.c: "让[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]进行救援。"
 eqfm_pirates.013.t: "海盗的战利品"
 eqfm_pirates.013.d: "[SCOPE.sState('eqfm_piracy_state_scope').GetName]的海岸巡逻队查获了一艘疑似废弃的海盗船。指挥官报告称，船舱内藏有大量属于[SCOPE.sCountry('eqfm_piracy_country_scope').GetName]的被盗财产。"
 eqfm_pirates.013.f: "“又出事了！海盗的船老被人偷，这些人怎么会老老实实赚钱呢？”"
 eqfm_pirates.013.a: "将战利品归还给其合法所有者。"
 eqfm_pirates.013.b: "这是对[ROOT.GetCountry.GetNameNoFlag]的合法持有。"
 eqfm_pirates.014.t: "外交公报被截获"
 eqfm_pirates.014.d: "[ROOT.GetCountry.GetNameNoFormatting]外交部门带来消息称，一艘载有[ROOT.GetCountry.GetNameNoFlag]和[SCOPE.sCountry('eqfm_piracy_country_scope').GetNameNoFlag]之间敏感通信的船只在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]遭到海盗拦截。"
 eqfm_pirates.014.f: "“我在听……我正在认真听。”"
 eqfm_pirates.014.a: "为这艘船支付赎金。"
 eqfm_pirates.014.b: "最坏又能怎么样呢？"
 eqfm_pirates.014.c: "让[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]来“纠正”这种情况。"
 eqfm_pirates.015.t: "拦截奴隶贩子"
 eqfm_pirates.015.d: "[SCOPE.sState('eqfm_piracy_state_scope').GetName]的海岸巡逻队扣留了一艘从[SCOPE.sCountry('eqfm_piracy_country_scope').GetName]前往[SCOPE.sCountry('ottoman_scope').GetName]的贩奴船。"
 eqfm_pirates.015.f: "“我很荣幸能够见到这位几乎打破三角贸易纪录的船长。”"
 eqfm_pirates.015.a: "逮捕船员并释放奴隶。"
 eqfm_pirates.015.b: "“奴隶贩子？什么奴隶贩子？”"
 eqfm_pirates.015.c: "向船员索要赎金。"
 eqfm_pirates.015.e: "让这些灵魂在[ROOT.GetCountry.GetNameNoFlag]得到庇护。"
 eqfm_pirates.016.t: "新天地"
 eqfm_pirates.016.d: "[SCOPE.sState('eqfm_piracy_state_scope').GetName]繁荣的谣言广为流传，海盗们不再袭击沿海社区，而是开始将[SCOPE.sState('eqfm_piracy_state_scope').GetPortHubName]视为理想的退休之地。"
 eqfm_pirates.016.f: "“并非所有的宝藏都是金银，伙计。"
 eqfm_pirates.016.a: "有意思……"
 eqfm_pirates.017.t: "[SCOPE.sGoods('eqfm_piracy_goods_scope').GetName]走私者"
 eqfm_pirates.017.d: "[SCOPE.sState('eqfm_piracy_state_scope').GetName]的不法商人将大量[SCOPE.sGoods('eqfm_piracy_goods_scope').GetName]运往该地区。结果，许多当地人陷入昏迷，甚至死亡。"
 eqfm_pirates.017.f: "“上次，私酒走私者把这座岛当作藏匿处，他们路过这里，我帮他们弄了船票。现在看来他们早就歇业了。”"
 eqfm_pirates.017.a: "让守卫准备逮捕他们。"
 eqfm_pirates.017.b: "穷人做什么与我们无关。"
 eqfm_pirates.017.c: "拓展社会服务。"
 eqfm_pirates.018.t: "平民海盗"
 eqfm_pirates.018.d: "[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]一直是[SCOPE.sState('eqfm_piracy_state_scope').GetName]沿海村庄的赞扬对象。显然，这位海盗头目一直在将他的不义之财“重新分配”给农民。"
 eqfm_pirates.018.f: "“恐怕货币就是我们的货币。”"
 eqfm_pirates.018.a: "真是奇怪的习惯。"
 eqfm_pirates.018.b: "命令没收。"
 eqfm_pirates.020.t: "当地线人"
 eqfm_pirates.020.d: "[SCOPE.sState('eqfm_piracy_state_scope').GetName]的渔民向我们提供了近期海盗船队动向的详细信息。"
 eqfm_pirates.020.f: "“我们会打死你们的船长，直到他说出他们要去哪里。”"
 eqfm_pirates.020.a: "他们真慷慨啊"
 eqfm_pirates.020.b: "也许我们可以从他们那里得到更多帮助。"
 eqfm_pirates.021.t: "可疑的入口"
 eqfm_pirates.021.d: "斥候跟踪[SCOPE.sState('eqfm_piracy_state_scope').GetName]的线索，报告称在[SCOPE.sState('eqfm_piracy_state_scope').GetPortHubName]附近的一处海湾发现可疑活动，其指挥官已请求允许进行调查。"
 eqfm_pirates.021.f: "“那不是船，先生。那是一艘沉船。”"
 eqfm_pirates.021.a: "进行粗略检查。"
 eqfm_pirates.021.b: "我们应该让事情保持原样……"
 eqfm_pirates.021.c: "派遣一艘战舰协助搜索。"
 eqfm_pirates.022.t: "逃亡者"
 eqfm_pirates.022.d: "我们的远征舰队收到一艘海盗船的投降信号。该船受损严重，船长称他与海盗同伙“发生争执”后被迫逃走。海盗船员已承诺加入远征舰队，并承诺为他们提供安全港湾。"
 eqfm_pirates.022.f: "“谈谈谈谈谈谈谈谈谈……谈……怕！”\n“谈判？”\n“对对对，谈判！”"
 eqfm_pirates.022.a: "欢迎登船！"
 eqfm_pirates.022.b: "一日海盗，终身海盗，把他们丢进海底。"
 eqfm_pirates.023.t: "食物变质"
 eqfm_pirates.023.d: "海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]获悉，旗舰上的船员发现数吨食物因海水入侵而变质，这无疑将影响远征队的续航能力。"
 eqfm_pirates.023.f: "“……可是朗姆酒为什么没了呢？”"
 eqfm_pirates.023.a: "我们很快就要开始实行配给制了。"
 eqfm_pirates.023.b: "幸好我们有盈余。"
 eqfm_pirates.024.t: "迷失海上"
 eqfm_pirates.024.d: "导航人员报告称，海军上将的[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]旗舰上的六分仪严重失准。肇事者已被鞭笞，其他舰长也因未报告偏离计划方位的情况而受到严厉批评。这无助于挽救舰队的航行进度。"
 eqfm_pirates.024.f: "“伙计，你已经超出地图边缘了。那有怪物！”"
 eqfm_pirates.024.a: "所以我们迷路了？"
 eqfm_pirates.024.b: "“这个方位，相信我。”"
 eqfm_pirates.025.t: "[GetGeographicRegion('geographic_region_adriatic_sea').GetName]的风暴"
 eqfm_pirates.025.d: "远征队在[GetGeographicRegion('geographic_region_adriatic_sea').GetName]遭遇了猛烈的风暴。海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]下令所有船只卷起船帆，以尽量减少桅杆受损。"
 eqfm_pirates.025.f: "“你不能只是坐在那里等着暴风雨过去，你必须学会​​在雨中跳舞。”"
 eqfm_pirates.025.a: "希望暴风雨能暂时停止。"
 eqfm_pirates.025.b: "海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]经历了更严重的风暴。"
 eqfm_pirates.026.t: "迷宫"
 eqfm_pirates.026.d: "在追踪[SCOPE.sState('eqfm_piracy_state_scope').GetName]线索时，远征舰队意外误入一片由浅滩和暗礁组成的迷宫。可能需要数天时间才能完全离开。"
 eqfm_pirates.026.f: "“你有没有注意到，外面还下着雨？！”"
 eqfm_pirates.026.a: "谨慎行事。"
 eqfm_pirates.026.b: "我们不能承受任何延误。"
 eqfm_pirates.026.c: "海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]的经验将为我们提供帮助。"
 eqfm_pirates.027.t: "斥候获得线索"
 eqfm_pirates.027.d: "斥候获得了附近海盗的详细活动信息，几位渔民也证实了这一信息。"
 eqfm_pirates.027.f: "“所以你看，每个人都有一个他愿意接受的价格。即使是他希望永远不卖的东西。”"
 eqfm_pirates.027.a: "让我们好好活用吧。"
 eqfm_pirates.027.b: "也许当地人可以被“说服”来详细说明。"
 eqfm_pirates.028.t: "紧急维修"
 eqfm_pirates.028.d: "我们的一艘探险船被发现甲板下有损坏。由于船身倾斜，船长已通知海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]，他们应该进港进行维修。"
 eqfm_pirates.028.f: "“船长，有两个弹孔——其中一个穿过了后桅杆。”"
 eqfm_pirates.028.a: "前往最近的港口。"
 eqfm_pirates.028.b: "快速修复，我们不能浪费时间。"
 eqfm_pirates.028.c: "海军上将的专业知识在这里将会派上用场。"
 eqfm_pirates.029.t: "停靠港"
 eqfm_pirates.029.d: "远征舰队已停泊在[SCOPE.sState('eqfm_piracy_state_scope').GetPortHubName]的港口进行补给。海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]预计补给时间不会太长。"
 eqfm_pirates.029.f: "“等等！停泊费是一先令？我需要知道你的名字。”"
 eqfm_pirates.029.a: "只承担我们需要的东西。"
 eqfm_pirates.029.b: "我们应该装载额外的补给。"
 eqfm_pirates.030.t: "发现海盗！"
 eqfm_pirates.030.d: "我们远征队在地平线上发现了一艘海盗船。海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]已命令舰队追击。"
 eqfm_pirates.030.f: "“扬帆，收拾残局。”"
 eqfm_pirates.030.a: "我们要把他们打入深渊！"
 eqfm_pirates.031.t: "落水"
 eqfm_pirates.031.d: "随着“有人落水”的呼喊从一艘船上响起，波涛汹涌的海水吞没了远征队。海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]勉强辨认出波涛中一个人影。我们或许可以救他，但我们面临着失去海盗舰队的风险。"
 eqfm_pirates.031.f: "“大海就像女人。你可以爱她，但统治她？这不可能。她的海浪太汹涌，她的狂风太猛烈。”"
 eqfm_pirates.031.a: "我们不抛弃任何人。"
 eqfm_pirates.031.b: "专注于海盗。"
 eqfm_pirates.032.t: "觉醒"
 eqfm_pirates.032.d: "此前报道的疑似海盗据点，实际上是一个沿海村庄，最近遭到海盗舰队袭击并焚烧。可以看到几名村民试图向舰队发出求救信号。"
 eqfm_pirates.032.f: "“我的故事。和你的故事一模一样，只是少了一章。我追捕一个人，跨越了七大洋。这场追捕让我失去了我的船员、我的佣金，甚至我的性命。”"
 eqfm_pirates.032.a: "我们不能允许任何干扰。"
 eqfm_pirates.032.b: "派遣一艘船去提供援助。"
 eqfm_pirates.034.t: "无影无踪"
 eqfm_pirates.034.d: "早上收到一条消息，海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]已失去海盗舰队的踪迹。"
 eqfm_pirates.034.f: "“先生们，女士们，你们会永远记住这一天，因为在这一天你们差点就抓住[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]船长！”"
 eqfm_pirates.034.a: "下次我们会逮住他们的。"
 eqfm_pirates.035.t: "优势"
 eqfm_pirates.035.d: "海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]的舰队继续缩短与海盗舰队的距离。"
 eqfm_pirates.035.f: "“降下你们的旗帜，你们这些臭蟑螂！抓钩手，准备登船！”"
 eqfm_pirates.035.a: "坚持下去！"
 eqfm_pirates.035.b: "采取更积极的策略。"
 eqfm_pirates.036.t: "撤退战"
 eqfm_pirates.036.d: "海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]落入陷阱。清晨的雾气刚散，他就发现自己的舰队两侧都被海盗包围，参谋建议撤退重整舰队。"
 eqfm_pirates.036.f: "“尽管我很喜欢这个计划，但没有哪艘船能逃脱这艘破烂。”"
 eqfm_pirates.036.a: "撤退才是明智的选择。"
 eqfm_pirates.036.b: "杀出去！"
 eqfm_pirates.037.t: "沿海行动"
 eqfm_pirates.037.d: "在海军上将[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetLastName]的指挥下，远征舰队与数艘海盗船交火，还暴露了其他海盗舰队的位置。"
 eqfm_pirates.037.f: "“把枪拿出来！”"
 eqfm_pirates.037.a: "我们越来越接近了。"
 eqfm_pirates.038.t: "公海上的决斗"
 eqfm_pirates.038.d: "#filler eqfm_pirates.038.d#!"
 eqfm_pirates.038.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]收到紧急消息，由[SCOPE.sCharacter('eqfm_cutler_beckett_scope').GetFullName]率领舰队已追踪到[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]的旗舰，并打算与这名恶棍展开狗斗。\n$TOOLTIP_DELIMITER$@divider_decorative!$TOOLTIP_DELIMITER$\n#lore “舰队准备！”#!"
 eqfm_pirates.038.a: "给他们瞧瞧！"
 eqfm_pirates.038.b: "命令退下！"
 eqfm_pirates.039.t: "决战"
 eqfm_pirates.039.d: "经过一场交火，[SCOPE.sCharacter('eqfm_duel_victor_scope').GetFullName]的舰队取得了胜利。[SCOPE.sCharacter('eqfm_duel_loser_scope').GetFullName]命令他的舰队撤退以恢复元气。"
 eqfm_pirates.039.f: "“你可以杀了我，但你永远不可以侮辱我。我是谁？我是[SCOPE.sCharacter('eqfm_jack_sparrow_scope').GetFullName]船长，伙计！”"
 eqfm_pirates.039.a: "这是一种嘲弄！"
 eqfm_pirates.039.b: "真是好消息。"
 eqfm_pirates.080.t: "与海盗的交易"
 eqfm_pirates.080.d: "$turkfm_porte$的通译官已抵达[SCOPE.sState('eqfm_piracy_state_scope').GetPortHubName]码头，为[ROOT.GetCountry.GetAdjectiveNoFlag]海军招募新兵。各种雄心勃勃的年轻人和退役老兵都愿意效命，以换取一条更好的道路。"
 eqfm_pirates.080.f: "“你看起来糟透了，你到底来这里干什么？”\n“标准太松了，我一下就进来了，我也没办法。而且你身上有股怪味。”\n"
 eqfm_pirates.080.a: "向身体健全的水手发出征召"
 eqfm_pirates.080.b: "[SCOPE.sCharacter('eqfm_hector_barbossa_scope').GetFirstName]船长将会为我们带来好结果。"
 eqfm_pirates.080.c: "这是在浪费时间"
 eqfm_pirates.002.g: "这是在浪费资源。"