l_simp_chinese:
 eqfm_senusiyya.001.t: "塞努西教团"
 eqfm_senusiyya.001.d: "一位其貌不扬的[GetReligion('sunni').GetName]学者，[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]，抵达了[ROOT.GetCountry.GetNameNoFlag]。他主张改革[GetReligion('sunni').GetName]伊斯兰教并从[ROOT.GetCountry.GetOverlord.GetName]的统治中独立，这使他在沙漠的[GetCulture('bedouin').GetName]部落中声名鹊起。"
 eqfm_senusiyya.001.f: "在主要定居点之外，沙漠中人们的精神生活很少受到$gbbf_devout$的指导，而更多地由被称为[GetCharacterTrait('gbbf_trait_marabout').GetName]的游方修士所引领。这些人物通常充当部落调解人，以及国家当局与部落首领之间的中间人。"
 eqfm_senusiyya.001.a: "这可能会是个麻烦。"
 eqfm_senusiyya.001.a.tt: "如果$eqfm_senusiyya_movement$在一个[concept_country]中占据主导地位，其[GetCulture('bedouin').GetName]$gbbf_pops$将更加抗拒中央集权统治。"
 eqfm_senusiyya.002.t: "大塞努西"
 eqfm_senusiyya.002.d: "#yellow 穆罕默德·伊本·阿里#!已然离世。他的儿子[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]继任成为$eqfm_senusiyya$教团的首领。他被尊称为“马赫迪”或“伟大者”，准备带领教团走向更具影响力的未来。"
 eqfm_senusiyya.002.f: "虽然[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]拒绝接受“马赫迪”的头衔，但这丝毫未能阻止教团信徒将他奉为在世圣人。"
 eqfm_senusiyya.002.a: "绝对是个大麻烦。"
 eqfm_senusiyya.002.a.tt: "在#bold 大塞努西#!的掌舵下，$eqfm_senusiyya_movement$将开始在[GetGeographicRegion('geographic_region_senusiyya').GetName][concept_georegion]蔓延。"
 eqfm_senusiyya.003.t: "塞努西退入沙漠"
 eqfm_senusiyya.003.d: "作为对[ROOT.GetCountry.GetNameNoFlag]日益严密的监视的回应，[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]已将他的活动中心转移到[SCOPE.sCountry('eqfm_senusiyya_tribal_scope').GetNameNoFlag]的沙漠深处，希望能借此躲避我们的巡逻。"
 eqfm_senusiyya.003.f: "尽管那里的环境比城市和绿洲恶劣得多，但沙漠却提供了充足的藏身之处，得以避开国家的视线。"
 eqfm_senusiyya.003.a: "他们活该。"
 eqfm_senusiyya.004.t: "武装外交"
 eqfm_senusiyya.004.d: "我们的武装代表团已抵达[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFirstName]位于[SCOPE.sState('eqfm_senusiyya_tribal_scope').GetName]的活动基地。在与[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]进行了一番紧张的交涉后，双方达成了一项名义上的协议，以尽量减少对[ROOT.GetCountry.GetAdjectiveNoFlag]政府行政管理的干扰。"
 eqfm_senusiyya.004.f: "尽管讨论过程十分客气，但[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]似乎很清楚我们此行的真实意图。然而顾问们很快警告说，我们其实并没有什么实质手段来强制执行任何协议。"
 eqfm_senusiyya.004.a: "权当是一个警告吧。"
 eqfm_senusiyya.005.t: "国中之国"
 eqfm_senusiyya.005.d: "随着$eqfm_senusiyya_movement$在[ROOT.GetCountry.GetNameNoFlag]的影响力持续增长，[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]提议将他的信徒及其修道院组织成一个“国中之国”。"
 eqfm_senusiyya.005.f: "大塞努西的举动虽包裹在保护信徒的崇高借口之下，却实实在在地威胁到了苏丹在国家和社会事务上的最高权威。"
 eqfm_senusiyya.005.a: "这令人担忧。"
 eqfm_senusiyya.006.t: "大塞努西斡旋和平"
 eqfm_senusiyya.006.d: "来自利比亚边境的商人报告了部落间发生的一件大事：为了提高自己在沙漠中的地位，[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]在长期交战的[SCOPE.sCountry('zuwayya_scope').GetName]部落与[SCOPE.sCountry('concussion_scope').GetName]部落之间促成了和平。"
 eqfm_senusiyya.006.f: "“祖瓦亚部落的人来到我们这里，请求宽恕，并要求我们在特齐尔建造一座扎维亚（修道院）。我们想成为你们的邻居，教导你们和你们的孩子学习安拉的真言。我们希望通过《古兰经》——它要求穆斯林之间和睦相处——让你们与过去经常袭击你们、抢走你们钱财和孩子的祖瓦亚人达成和解。”——大塞努西致图布部落的信"
 eqfm_senusiyya.006.a: "所以他现在只当个普通的调停者了？"
 eqfm_senusiyya.008.t: "$eqfm_senusiyya_movement$的未来"
 eqfm_senusiyya.008.d: ""
 eqfm_senusiyya.008.f: ""
 eqfm_senusiyya.008.a: ""
 eqfm_senusiyya.008.b: ""
 eqfm_senusiyya.009.t: "$eqfm_senusiyya_movement$覆灭"
 eqfm_senusiyya.009.d: "遵照$turkfm_porte$的命令，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]击退了$eqfm_senusiyya_movement$的信徒，并确保了其思想流派的彻底覆灭。"
 eqfm_senusiyya.009.f: "通过肃清塞努西信徒对国家的威胁，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]同时也确保了[GetCulture('turkish').GetName]对[ROOT.GetCountry.GetName]的主导影响力。"
 eqfm_senusiyya.009.a: "$gbbf_devout$将指引[ROOT.GetCountry.GetName]。"
 eqfm_senusiyya.100.t: "#filler 塞努西根基喷洒装置#!"
 eqfm_senusiyya.100.d: "#filler [eqfm_senusiyya.100.d]#!"
 eqfm_senusiyya.100.f: "#filler [eqfm_senusiyya.100.f]#!"
 eqfm_senusiyya.100.a: "#filler [eqfm_senusiyya.100.a]#!"
 eqfm_senusiyya.101.t: "$eqfm_senusiyya$蔓延至[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]"
 eqfm_senusiyya.101.d: "对自己的影响力感到满意的[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]已经向[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]的沙漠地区派遣了传教士，以传播$eqfm_senusiyya$的教义。"
 eqfm_senusiyya.101.f: "通过在沙漠深处活动，塞努西的信徒们能够避开中央集权。对他们来说，国界不过是形同虚设。"
 eqfm_senusiyya.101.a: "随它去吧。"
 eqfm_senusiyya.110.t: "[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]的奥利亚"
 eqfm_senusiyya.110.d: "[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]的地方官员发现了一个庞大的神龛网络，专门供奉当地类似圣人的先知。$gbbf_devout$迅速谴责了这种违背正统教义的做法。"
 eqfm_senusiyya.110.f: "大多数部落民和农民信仰一种民间伊斯兰教。他们自称信仰圣徒或“奥利亚”，经常参拜当地神龛，祈求祝福、治愈和庇护。"
 eqfm_senusiyya.110.a: "我们必须阻止这种做法。"
 eqfm_senusiyya.110.b: "这是一种落后但无害的习俗。"
 eqfm_senusiyya.110.c: "推倒这些神龛。烧毁这些偶像。"
 eqfm_senusiyya.111.t: "苏菲派蔓延至[SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]"
 eqfm_senusiyya.111.d: "随着$eqfm_senusiyya$传教士在沙漠中的散布，部落间掀起了新一轮的苏菲派浪潮。虽然并没有公然反抗国家权威，但神秘主义的教义威胁到了$gbbf_devout$对精神事务的控制。"
 eqfm_senusiyya.111.f: "通过为部落民简化伊斯兰教抽象难懂的典籍，[GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow 们#!使经文研读变得平民化，这威胁到了[SCOPE.gsInterestGroup('devout_scope').GetName]的地位。"
 eqfm_senusiyya.111.a: "拘捕这些异见分子，并驳斥他们的异端邪说。"
 eqfm_senusiyya.111.b: "他们的教义或许奇特，但不足为虑。"
 eqfm_senusiyya.111.c: "让我们拿这些人杀一儆百。送他们上绞刑架！"
 eqfm_senusiyya.200.t: "$eqfm_senusiyya$蔓延至[SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_senusiyya.200.d: "$eqfm_senusiyya_movement$的传教士已抵达[SCOPE.sCountry('eqfm_senussi_target_country').GetCapital.GetCityHubName]的宫廷。尽管遭到正统乌理玛的强烈抗议，他们还是找到了愿意倾听的听众。"
 eqfm_senusiyya.200.f: "[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]抗议$turkfm_porte$腐败堕落的教义，引起了穆斯林同胞的强烈共鸣。"
 eqfm_senusiyya.200.a: "随它去吧。"
 eqfm_senusiyya.200.b: "国家绝不容忍这些神秘主义者。"
 eqfm_senusiyya.200.c: "我们将传播这一福音！"
 eqfm_senusiyya.201.t: "$eqfm_senusiyya$蔓延至[SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_senusiyya.201.d: ""
 eqfm_senusiyya.201.f: "[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]抗议$turkfm_porte$腐败堕落的教义，引起了穆斯林同胞的强烈共鸣。"
 eqfm_senusiyya.201.a: "这可能会是个麻烦。"
 eqfm_senusiyya.201.a.tt: "如果$eqfm_senusiyya_movement$在一个[concept_country]中占据主导地位，其[GetCulture('bedouin').GetName]$gbbf_pops$将更加抗拒中央集权统治。"
 eqfm_senusiyya.202.t: "$eqfm_senusiyya$蔓延至[SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_senusiyya.202.d: ""
 eqfm_senusiyya.202.f: "[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]抗议$turkfm_porte$腐败堕落的教义，引起了穆斯林同胞的强烈共鸣。"
 eqfm_senusiyya.202.a: "这可能会是个麻烦。"
 eqfm_senusiyya.202.a.tt: "如果$eqfm_senusiyya_movement$在[SCOPE.sCountry('eqfm_senussi_target_country').GetName]占据主导地位，[GetCulture('bedouin').GetName]$gbbf_pops$将更加抗拒我们的统治。"
 eqfm_senusiyya.208.t: "$eqfm_senusiyya_movement$被驱逐出[ROOT.GetCountry.GetName]"
 eqfm_senusiyya.208.d: ""
 eqfm_senusiyya.208.f: ""
 eqfm_senusiyya.208.a: ""
 eqfm_senusiyya.209.t: "[ROOT.GetCountry.GetName]的塞努西家族"
 eqfm_senusiyya.209.d: "在欢呼人群的簇拥下，[ROOT.GetCountry.GetNameNoFlag]$eqfm_senusiyya_movement$的领袖[SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName]登上了[ROOT.GetCountry.GetName]的王座。"
 eqfm_senusiyya.209.f: ""
 eqfm_senusiyya.209.a: "$eqfm_senusiyya_movement$将指引[ROOT.GetCountry.GetName]"
 eqfm_senusiyya.210.t: "伊玛目叛离[SCOPE.gsInterestGroup('devout_scope').GetName]"
 eqfm_senusiyya.210.d: "[ROOT.GetCountry.GetNameNoFlag]的[SCOPE.gsInterestGroup('devout_scope').GetName]高层已陷入混乱，几名高级成员公开宣布同情$eqfm_senusiyya_movement$。根深蒂固的宗教当权者已请求[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]恢复秩序。"
 eqfm_senusiyya.210.f: "“通向真主之路有千百条。”——穆罕默德·阿萨努西"
 eqfm_senusiyya.210.a: "逮捕并罢免这些叛徒。"
 eqfm_senusiyya.210.b: "这不是国家该管的事。"
 eqfm_senusiyya.211.t: "异见者在[SCOPE.sState('eqfm_senusiyya_state_scope').GetName]传教"
 eqfm_senusiyya.211.d: "$eqfm_senusiyya_movement$的信徒近期在[ROOT.GetCountry.GetNameNoFlag]各大城市内的活动日益频繁。"
 eqfm_senusiyya.211.f: "“鸟有心智吗？”\n“没有。”\n“然而，它却把蛋产在偏远的山顶上，让狐狸或狼无法触及。跳鼠有心智吗？”\n“没有。”\n“然而为了躲避毒蛇，它在地道里挖了许多出路。因此，要警惕那条向你逼近并指向东西方向的黑蛇。”——大塞努西在贾格布卜对信徒们的讲话"
 eqfm_senusiyya.211.a: "那又如何？他们根本不成气候。"
 eqfm_senusiyya.211.b: "让$gbbf_devout$去应对他们的异端邪说。"
 eqfm_senusiyya.212.t: "[SCOPE.sState('eqfm_senusiyya_state_scope').GetName]的苏菲派思想"
 eqfm_senusiyya.212.d: ""
 eqfm_senusiyya.212.f: "[GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow 们#!往往在部落社会中扮演着关键角色，他们教授《古兰经》、调解纠纷、主持宗教节日，并守护先知的神龛。作为教师、法官、医者和学者，他们备受尊敬。"
 eqfm_senusiyya.212.a: ""
 eqfm_senusiyya.300.t: "驱逐$eqfm_senusiyya$"
 eqfm_senusiyya.300.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已授权派遣一支$eqfm_expedition$前往[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]，以驱逐和镇压$eqfm_senusiyya_movement$。现在只需要任命一位领队。"
 eqfm_senusiyya.300.f: "“这便是沙漠。从这里直到我们抵达彼岸，除了我们随身携带的，再无一滴水。骆驼更是一滴水也没有。如果骆驼死了，我们也就完了。而二十天后，它们就会开始死去。”"
 eqfm_senusiyya.300.a: "[SCOPE.sCharacter('eqfm_senusiyya_leader_1').GetFullName]将平定这些激进分子。"
 eqfm_senusiyya.300.b: "我们将派遣[SCOPE.sCharacter('eqfm_senusiyya_leader_2').GetFullName]。"
 eqfm_senusiyya.300.c: "[SCOPE.sCharacter('eqfm_senusiyya_leader_3').GetFullName]定能不辱使命。"
 eqfm_senusiyya.300.e: "转念一想，还是算了吧。"
 eqfm_senusiyya.301.t: "$eqfm_senusiyya_expedition$抵达[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.301.d: "经过几周的集结和筹措物资，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName]已向[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]进发，以支持我们驱逐$eqfm_senusiyya$的行动。"
 eqfm_senusiyya.301.f: "“你们派来海军，要求我必须偿还债务，还要承担你们远征军的开销。但当你们把我的收入削减到只剩农业税，尤其是过去四年我们几乎没有降雨的时候，我拿什么来还债？”——尤素福帕夏对驻的黎波里英国领事的讲话，1831年"
 eqfm_senusiyya.301.a: "我们将为沙漠带来秩序。"
 eqfm_senusiyya.302.t: "$eqfm_senusiyya_expedition$领队遇难！"
 eqfm_senusiyya.302.d: "有人看到我们的$eqfm_desert_expedition$从[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]深处折返。他们带回了领队在荒原中遇难的悲惨消息。"
 eqfm_senusiyya.302.f: "“我祈求自己再也不要看到沙漠。听听我的祈祷吧，真主。”"
 eqfm_senusiyya.302.a: "悲剧发生。"
 eqfm_senusiyya.303.t: "$eqfm_senusiyya_expedition$从[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]撤退"
 eqfm_senusiyya.303.d: "由于物资匮乏且减员严重，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName]已从[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]深处撤退。"
 eqfm_senusiyya.303.f: "“我祈求自己再也不要看到沙漠。听听我的祈祷吧，真主。”"
 eqfm_senusiyya.303.a: "至少他们活着回来了。"
 eqfm_senusiyya.304.t: "$eqfm_senusiyya$被驱逐出[SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetName]"
 eqfm_senusiyya.304.d: "经过数周追踪，清除了[SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetName]最后的玛拉布之后，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]报告称，他们已成功赶走了所有$eqfm_senusiyya$教团的信徒。"
 eqfm_senusiyya.304.f: "“别再回来！”"
 eqfm_senusiyya.304.a: "大快人心。"
 eqfm_senusiyya.310.t: "发现$eqfm_senusiyya$修道院"
 eqfm_senusiyya.310.d: "斥候在[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]发现了一座$eqfm_senusiyya$活动的修道院。远征队正在等待[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]的命令。"
 eqfm_senusiyya.310.f: "尽管这些修道院是沙漠中的精神生活中心，但其中许多都毫不起眼，且很少集中分布，这使得它们极易避开我们特工的视线。"
 eqfm_senusiyya.310.a: "拘留这些神职人员并查封修道院。"
 eqfm_senusiyya.310.b: "把整个定居点烧为平地。"
 eqfm_senusiyya.311.t: "[GetCulture('bedouin').GetName]村民隐瞒情报"
 eqfm_senusiyya.311.d: "在对[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]一处定居点附近进行勘察时，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]察觉到当地村民隐瞒了有关该地区$eqfm_senusiyya$活动的关键信息。更糟的是，有理由怀疑他们故意误导了$eqfm_senusiyya_expedition$。"
 eqfm_senusiyya.311.f: "对于沙漠中的部落来说，城市的中央集权是一个极其陌生的概念。理所当然地，比起我们的税务官和驻军，许多人更喜欢他们所熟知的玛拉布。"
 eqfm_senusiyya.311.a: "向他们伸出橄榄枝以换取真相。"
 eqfm_senusiyya.311.b: "逮捕所有涉嫌欺骗的人。"
 eqfm_senusiyya.311.c: "把他们的首领统统处决。"
 eqfm_senusiyya.312.t: "邻近部落袭击$eqfm_expedition$"
 eqfm_senusiyya.312.d: "来自[SCOPE.sCountry('eqfm_senusiyya_expedition_neighbor_scope').GetName]的部落袭击者袭击了我们的$eqfm_senusiyya_expedition$。虽然伤亡有限，但这扰乱了我们的进度。[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]提议趁他们还未完全逃离该地区前进行反击。"
 eqfm_senusiyya.312.f: "由于远离我们已建立的权力中心运作，远征队发现自己只能任由部落势力摆布。"
 eqfm_senusiyya.312.a: "随他们去吧，我们还有更重要的任务。"
 eqfm_senusiyya.312.b: "让我们的斥候将他们全数歼灭。"
 eqfm_senusiyya.313.t: "$eqfm_senusiyya_expedition$遭遇沙尘暴！"
 eqfm_senusiyya.313.d: "[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]发现自己被困在了一场迅速加剧的沙尘暴中。由于附近没有任何可利用的地形，他下令$eqfm_expedition$利用手头物品搭建简易掩体以抵御风暴。"
 eqfm_senusiyya.313.f: "“呃，长官？那不是山脉……它正在向我们逼近。”"
 eqfm_senusiyya.313.a: "这简直是场灾难。"
 eqfm_senusiyya.313.b: "他们必须不惜一切代价寻找避难所！"
 eqfm_senusiyya.313.c: "我们必须相信[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]的直觉。"
 eqfm_senusiyya.314.t: "部落首领请求会面"
 eqfm_senusiyya.314.d: "[SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetName]的部落长老们向$eqfm_senusiyya_expedition$提出了一项提议：如果[ROOT.GetCountry.GetName]允许他们保留部分部落特权，他们将协助我们追捕[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]。"
 eqfm_senusiyya.314.f: "与地方首领进行权力交易长久以来都是沙漠中的生存法则。由于缺乏基础设施和恶劣的环境，部落才是整个撒哈拉地区真正的权威。"
 eqfm_senusiyya.314.a: "这是一笔公平的交易。"
 eqfm_senusiyya.314.b: "我们不与野蛮人做交易。"
 eqfm_senusiyya.314.c: "不，但我们一样会拿走情报。"
 eqfm_senusiyya.315.t: "$eqfm_senusiyya_expedition$遭到误导"
 eqfm_senusiyya.315.d: "在向广阔无垠的沙漠腹地挺进近三天后，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]意识到$eqfm_senusiyya_expedition$被[SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]误导了。可能需要好几天才能回到正轨。"
 eqfm_senusiyya.315.f: "“你老妈一定是和蝎子交配过……”"
 eqfm_senusiyya.315.a: "这可真是倒霉。"
 eqfm_senusiyya.315.b: "看来有必要进行一次急行军了。"
 eqfm_senusiyya.315.c: "[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]将鼓舞士气。"
 eqfm_senusiyya.316.t: "发现走私$eqfm_senusiyya$首脑的商队"
 eqfm_senusiyya.316.d: "接到[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]的警报后，驻守在[SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetCityHubName]的军队拦截了一支企图将多名$eqfm_senusiyya$虔诚分子偷渡出[ROOT.GetCountry.GetNameNoFlag]的商队。守军报告称缴获了干货和武器，这些物资很可能是要送往国外的修道院。"
 eqfm_senusiyya.316.f: "“一千个阿拉伯人意味着一千把刀，无论日夜，随时待命。这意味着一千头骆驼。这意味着一千包烈性炸药和一千支精锐步枪。”"
 eqfm_senusiyya.316.a: "将这些物资充公。"
 eqfm_senusiyya.316.b: "追踪这些物资到他们的村庄并实施逮捕。"
 eqfm_senusiyya.317.t: "$eqfm_senusiyya_expedition$遭遇突袭！"
 eqfm_senusiyya.317.d: "在[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]的沙漠中穿行时，$eqfm_senusiyya_expedition$遭到了伏击。"
 eqfm_senusiyya.317.f: "“我身中二十三处重伤，皆是在战斗中所受！我曾亲手在战场上斩杀七十五人！我击溃敌人，烧毁他们的帐篷！我夺走他们的羊群和牛群！”"
 eqfm_senusiyya.317.a: "他们必须坚守阵地。"
 eqfm_senusiyya.317.b: "也许有秩序地撤退才是上策……"
 eqfm_senusiyya.317.c: "[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]前去支援！"
 eqfm_senusiyya.318.t: "沙漠定居点拒绝我们进入"
 eqfm_senusiyya.318.d: "[GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]的一个定居点拒绝为$eqfm_senusiyya_expedition$提供住宿。作为一种公然挑衅，此举威胁到了[ROOT.GetCountry.GetNameNoFlag]在沙漠地区行使管辖权的合法性。"
 eqfm_senusiyya.318.f: "“那么我将执行法律。我不属于任何部落，也没有人被冒犯。”"
 eqfm_senusiyya.318.a: "继续前进，没有时间可以浪费了。"
 eqfm_senusiyya.318.b: "我们将维护[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权威。"
 eqfm_senusiyya.319.t: "$eqfm_senusiyya$传教士寻求庇护"
 eqfm_senusiyya.319.d: "一位衣衫褴褛、面容憔悴的传教士来到远征队面前，声称自己被$eqfm_senusiyya$赶了出来，希望能在[ROOT.GetCountry.GetNameNoFlag]寻求庇护。"
 eqfm_senusiyya.319.f: "“听着，长官，我们不能就这么袖手旁观。”\n“为什么不？这通常是最好的选择。”"
 eqfm_senusiyya.319.a: "他将在[ROOT.GetCountry.GetNameNoFlag]找到庇护所。"
 eqfm_senusiyya.319.b: "我们不能信任这些激进分子。"
 eqfm_senusiyya.320.t: "发现秘密藏匿处"
 eqfm_senusiyya.320.d: "在两个游牧营地之间穿行时，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]偶然发现了一个看似已被废弃很久的营地。经过仔细检查，发现这是$eqfm_senusiyya$设立的庞大藏匿点网络，里面储备了补给和武器。"
 eqfm_senusiyya.320.f: "“……这是一个肮脏、黑暗的小房间。”\n“没错。”\n“我们待在里面一点也不开心。”\n“我倒是挺开心。总比待在又脏又暗的战壕里强。”"
 eqfm_senusiyya.320.a: "收集我们能安全带走的东西。"
 eqfm_senusiyya.320.b: "进行彻底搜查。"
 eqfm_senusiyya.320.c: "我们应该把重点放在搜查上。"
 eqfm_senusiyya.321.t: "沙漠的好客之道"
 eqfm_senusiyya.321.d: "尽管大多数村庄和营地对远征队都充满敌意，但在今天的停歇点，[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]受到了[GetCulture('bedouin').GetName]游牧民族传统的热情款待。"
 eqfm_senusiyya.321.f: "“盗亦有道，但政客可没有。”"
 eqfm_senusiyya.321.a: "我们还是继续赶路吧。"
 eqfm_senusiyya.321.b: "我相信他们可以再提供“一点点”东西。"