l_simp_chinese:
 eqfm_karadag.001.t: "黑山之地"
 eqfm_karadag.001.d: "在坚定的领导与[ROOT.GetCountry.GetAdjectiveNoFormatting]人民不屈的精神下，[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]已将整个[GetStateRegion('STATE_MONTENEGRO').GetName]纳入[ROOT.GetCountry.GetName]的控制之下。"
 eqfm_karadag.001.f: "尽管历经数个世纪的入侵与帝国主义图谋，黑山依然如其人民一般坚不可摧。"
 eqfm_karadag.001.a: "黑山绝不屈服！"
 eqfm_karadag.001.b: "随它去吧。"
 eqfm_karadag.002.t: "黑山臣服"
 eqfm_karadag.002.d: "尽管历经数个世纪对入侵与帝国主义图谋的抵抗，[GetStateRegion('STATE_MONTENEGRO').GetName]最终还是被彻底征服了。"
 eqfm_karadag.002.f: "#italic 黑山的兄弟们，这一切究竟是为了什么？\n是谁煽动了这丑陋的不和之焰？\n想要改变我们信仰的这般不幸念头，\n究竟从何而来？\n尽管存有分歧，我们难道不是兄弟？\n我们难道没有并肩浴血奋战？\n我们如兄弟般有福同享，有难同当。\n难道土耳其与塞尔维亚少女的秀发，\n不都同样在阵亡英雄的坟墓上悲伤掩面？#!\n\n——彼得二世·彼得罗维奇-涅戈什，#italic 《山地花环》#!"
 eqfm_karadag.002.a: "黑山终于低下了头。"
 eqfm_karadag.002.b: "这是一场无法挽回的悲剧！"
 eqfm_karadag.002.c: "随它去吧。"
 eqfm_karadag.003.t: "窃取黑山！"
 eqfm_karadag.003.d: "不顾$turkfm_porte$的意志，[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]已宣布[GetStateRegion('STATE_MONTENEGRO').GetName]由[SCOPE.sCountry('bosnia_scope').GetNameNoFlag]控制。"
 eqfm_karadag.003.f: "“从今日起，任何人都不必再去君士坦丁堡觐见皇帝了。你们的君士坦丁堡就在莫斯塔尔，你们的皇帝就在这里。”——阿里帕夏·里兹万贝戈维奇，1833年"
 eqfm_karadag.003.a: "波斯尼亚人民的意志不容否决。"
 eqfm_karadag.003.b: "简直不可理喻！"
 eqfm_karadag.004.t: "失去黑山"
 eqfm_karadag.004.d: "在一场离奇的转折中，[GetStateRegion('STATE_MONTENEGRO').GetName]的土地已落入其各路争夺者的掌控之外。"
 eqfm_karadag.004.f: "欧洲列强一次又一次地重申对黑山的支持，希望在巴尔干地区站稳脚跟，但每当新的边界冲突有可能升级为公开战争时，他们就会撤回支持。"
 eqfm_karadag.004.a: "随它去吧。"
 eqfm_karadag.004.b: "这是一场无法挽回的悲剧！"
 eqfm_karadag.010.t: "关于猎首习俗的谈判"
 eqfm_karadag.010.d: "今天，[SCOPE.sCountry('montenegro_scope').GetName][SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle]派来的使者在奥斯曼宫廷中受到接待。双方商讨的细节中，包含在[GetStateRegion('STATE_MONTENEGRO').GetName]各部落间禁止猎头习俗的提议。"
 eqfm_karadag.010.f: "黑山缺乏发展与基础设施，致使许多传统得以保留，其中就包括猎首。这种令人毛骨悚然的炫耀行为，引来了西方的震惊与鄙夷。"
 eqfm_karadag.010.a: "荒唐的要求。砍掉他的脑袋！"
 eqfm_karadag.010.b: "这些习俗野蛮至极。我们应当听取西方的意见。"
 eqfm_karadag.011.t: "关于猎首习俗的谈判"
 eqfm_karadag.011.d1: "不出所料，[SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetNameNoFlag]拒绝了我们关于取缔猎首习俗的提议。"
 eqfm_karadag.011.d2: "出乎意料的是，我们的使节达成了一项协议，将限制整个[GetStateRegion('STATE_MONTENEGRO').GetName]的猎首习俗。现在只需通知各部落首领即可。"
 eqfm_karadag.011.f: "尽管过去也曾进行过关于废除猎首习俗的谈判，但每一次都因为担心对方背信弃义而宣告破裂。"
 eqfm_karadag.011.a: "既然他们不愿谈判，那我们也不必强求。"
 eqfm_karadag.011.b: "这位[SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetRuler.GetPrimaryRoleTitle]毫无荣誉可言。我们应该展现自己的荣耀。"
 eqfm_karadag.011.c: "绝佳的好消息。"
 eqfm_karadag.012.t: "卡塔罗谈判"
 eqfm_karadag.012.d: "一位来自[SCOPE.sCountry('montenegro_scope').GetName]的使节出现在[ROOT.GetCountry.GetAdjective]的宫廷，要求就将科托尔归还给黑山人民一事进行谈判。"
 eqfm_karadag.012.f: "自[GetCulture('serb').GetName]#yellow 人#!抵达[GetStrategicRegion('region_balkans').GetName]以来，科托尔便一直是黑山人的家园，但它却屡屡被外国势力所统治。这项协议最终旨在纠正这一历史性的错误。"
 eqfm_karadag.012.a: "给他们一个公平的交易。"
 eqfm_karadag.012.b: "科托尔属于帝国。"
 eqfm_karadag.013.t: "卡塔罗谈判"
 eqfm_karadag.013.d: "出于对作为我们的[concept_overlord]之稳固地位的满意，[SCOPE.sCountry('austria_scope').GetCapital.GetFarmHubName]的宫廷已经批准了我们获得通往亚得里亚海正当出海口的请求。"
 eqfm_karadag.013.f: "自[GetCulture('serb').GetName]#yellow 人#!抵达[GetStrategicRegion('region_balkans').GetName]以来，科托尔便一直是黑山人的家园，但它却屡屡被外国势力所统治。这项协议最终旨在纠正这一历史性的错误。"
 eqfm_karadag.013.a: "科托尔终于要回家了。"
 eqfm_karadag.013.b: "真是荒谬至极。"
 eqfm_karadag.014.t: "采蒂涅的牢房"
 eqfm_karadag.014.d: "我们在边境冲突中俘获的人正被关押在牢房中忍受煎熬。他们的命运全凭[ROOT.GetCountry.GetRuler.GetName]的心意。"
 eqfm_karadag.014.f: "尽管这些人算不上苏丹王室的成员，但他们作为俘虏依然具备一定的政治价值。"
 eqfm_karadag.014.a: "让我们看看[SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName]能值多少钱。"
 eqfm_karadag.014.a.tt: "[SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName]将被勒索赎金"
 eqfm_karadag.014.b: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName]看起来能换取一笔可观的赎金"
 eqfm_karadag.014.b.tt: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName]将被勒索赎金"
 eqfm_karadag.014.c: "只能将就一下了。把[SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName]送去吧。"
 eqfm_karadag.014.c.tt: "[SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName]将被勒索赎金"
 eqfm_karadag.014.e: "别管他们。"
 eqfm_karadag.015.t: "黑山提供赎金"
 eqfm_karadag.015.d: "一位来自[SCOPE.sCountry('montenegro_scope').GetName]的“大使”今晨获准觐见苏丹。他们提出要为一名被关押在采蒂涅的当地贵族支付赎金。"
 eqfm_karadag.015.f: "虽说苏丹的子民被俘是一件令人尴尬的事，但接受这样的交易可能会对我们的声誉造成更严重的损害。"
 eqfm_karadag.015.a: "“开个价吧。”"
 eqfm_karadag.015.b: "“不可接受。滚出去！”"
 eqfm_karadag.016.t: "$turkfm_porte$对赎金的答复"
 eqfm_karadag.016.d1: "几日之前，[ROOT.GetCountry.GetCapital.GetFarmHubName]的宫廷收到消息，$turkfm_porte$已同意了我们的赎金要求。今日，一队武装护卫来到宫殿，要求领回[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]。"
 eqfm_karadag.016.d2: "在一封直言不讳的公文中，$turkfm_porte$拒绝了任何勒索赎金的要求。[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]所剩的任何价值都交由[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]处置。"
 eqfm_karadag.016.f: "“去年那个时刻我已诅咒过上百次，\n那时土耳其人未能、也不愿杀我；\n现在，我决不会辜负我人民的期望。”——达尼洛主教在被赎回时的感想，摘自《山地花环》"
 eqfm_karadag.016.a: "很好，送他上路。"
 eqfm_karadag.016.a.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]将被释放。"
 eqfm_karadag.016.b: "那他就在地牢里腐烂吧。"
 eqfm_karadag.016.b.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]将重返大牢"
 eqfm_karadag.016.c: "让我们给他们传个口信。把他的头给我砍下来！"
 eqfm_karadag.020.t: "腹地劫掠"
 eqfm_karadag.020.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]召集了著名的部落首领开会，以指定一人来组织我们部落的行动。"
 eqfm_karadag.020.f: "长期以来，劫掠一直是部落与[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的稳定收入来源。如果没有一个领导者来集中调度，就很难确保收入的公平分配。"
 eqfm_karadag.020.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName]是一位值得信赖的领袖。"
 eqfm_karadag.020.b: "我们应倚仗[SCOPE.sCharacter('expedition_leader_2').GetFullName]的经验"
 eqfm_karadag.020.c: "给[SCOPE.sCharacter('expedition_leader_3').GetFullName]一个证明自己名号的机会。"
 eqfm_karadag.020.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName]是个出色的折中人选。"
 eqfm_karadag.021.t: "守卫腹地"
 eqfm_karadag.021.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]已委派[GetStateRegion('STATE_MONTENEGRO').GetName]的总督负责保卫边境，以防[SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag]部落民持续不断的[concept_raiding]。"
 eqfm_karadag.021.f: "“我们的抗争永不休止，\n直到我们或土耳其人彻底灭绝。”——摘自《山地花环》"
 eqfm_karadag.021.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName]深得[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的信任。"
 eqfm_karadag.021.b: "派出老将[SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 eqfm_karadag.021.c: "[SCOPE.sCharacter('expedition_leader_3').GetFullName]似乎相当急切。"
 eqfm_karadag.021.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName]是个稳妥的选择。"
 eqfm_karadag.022.t: "远征军抵达边境"
 eqfm_karadag.022.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName]已经抵达了[GetStateRegion('STATE_MONTENEGRO').GetName]的边缘地带。他的最新报告指出，他已为$eqfm_karadag_expedition$集结了部队，并将很快拔营进军。"
 eqfm_karadag.022.f: "黑山的偏远让以往所有试图将[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的意志强加于此的尝试都望而却步。也许这一次会有所不同。"
 eqfm_karadag.022.a: "愿他能给这些野蛮人带来正义。"
 eqfm_karadag.023.t: "远征军撤出腹地"
 eqfm_karadag.023.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName]带着他那支看起来越发疲惫的部队抵达了[GetStateRegion('STATE_MONTENEGRO').GetName]外的一座由土耳其人控制的堡垒。他的报告指出，由于缺乏补给，他在山区的阵地已然无法坚守。"
 eqfm_karadag.023.f: "尽管令人难堪，但这支远征军撤回友方领土的举动，恰恰凸显了黑山是何等的偏远难及。"
 eqfm_karadag.023.a: "我们会回来的。"
 eqfm_karadag.024.t1: "部落首领离世！"
 eqfm_karadag.024.t2: "远征军统帅阵亡！"
 eqfm_karadag.024.d: "我们在[GetStateRegion('STATE_MONTENEGRO').GetName]边境的统帅已经阵亡。我们的部队已从边境撤退，等待进一步的指示。"
 eqfm_karadag.024.f: "“我是风中的一片落叶……”"
 eqfm_karadag.024.a: "真是麻烦。"
 eqfm_karadag.026.t: "击退边境入侵"
 eqfm_karadag.026.d: "我们的部队击退了土耳其人对我们土地的入侵。当地人毫不迟疑地又恢复了他们的[concept_raiding]活动。"
 eqfm_karadag.026.f: "“别再来了！”"
 eqfm_karadag.026.a: "这些土地是我们的！"
 eqfm_karadag.027.t: "村庄冲突升级"
 eqfm_karadag.027.d: "边境一个村庄冲突升级的紧急消息传来了。当地民兵已经深挖战壕坚守了数日，并发出紧急求援。我们的顾问警告说，当地居民的生命安全正面临威胁。"
 eqfm_karadag.027.f: "鉴于山区的偏远和道路的恶劣，他们能撑到现在已经是个奇迹了。无法保证任何援助能及时赶到，但部落将会铭记我们的决定。"
 eqfm_karadag.027.a: "寸土不让！"
 eqfm_karadag.028.t: "冲突平息"
 eqfm_karadag.028.d: "经过数周未分胜负的零星冲突，双方首领都因为担心部队日益混乱，默默地从$eqfm_tribal_skirmish$中撤出了各自的人马。"
 eqfm_karadag.028.f: "“你杀了他？！可是我想亲手杀他啊！”"
 eqfm_karadag.028.a: "我们绝不能掉以轻心。"
 eqfm_karadag.029.t: "#filler 村庄冲突监控#!"
 eqfm_karadag.029.d: "#filler [eqfm_karadag.029.d]#!"
 eqfm_karadag.029.f: "#filler [eqfm_karadag.029.f]#!"
 eqfm_karadag.029.a: "#filler [eqfm_karadag.029.a]#!"
 eqfm_karadag.030.t: "逃税"
 eqfm_karadag.030.t2: "耀西涉嫌税务欺诈"
 eqfm_karadag.030.d: "部落懒得送到[ROOT.GetCountry.GetCapital.GetFarmHubName]的那丁点儿税收实际上只具有象征意义，无非就是几车谷物或肉类。然而，一个极为偏僻的部落再次公然藐视[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权威，他们杀死了一名税务官，并把他的头颅送回了宫廷。"
 eqfm_karadag.030.d2: "臭名昭著的自由意志主义者和反政府活动家耀西宣称收税就是抢劫，并拒绝纳税。谁会在意呢，毕竟他只是一只恐龙，连份正经工作都没有。"
 eqfm_karadag.030.f: "“听着，过去五代人我们一直只送一蒲式耳的小麦和五块腌肉。不，不——我不在乎他是不是刚养了条狗，他就只能拿这么多。”\n\n“等等，仔细想想……要是[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]实在饿得慌，他大可以把#bold #red 你#!#!吃了。”"
 eqfm_karadag.030.f2: "孩子们要记住，耀西因为从不交税，最后还是被联邦特工逮捕了。现在想象一下，如果达尼洛处在这种情况会怎么做。"
 eqfm_karadag.030.a: "也许我们应该推迟对部落的征派。"
 eqfm_karadag.030.a2: "把耀西关进大牢。"
 eqfm_karadag.030.b: "我们无法容忍对我们权威的这种侮辱。"
 eqfm_karadag.030.b2: "无罪释放耀西。"
 eqfm_karadag.031.t: "[SCOPE.sCountry('turkfm_hostage_nation').GetAdjective]贵族遭俘"
 eqfm_karadag.031.d: "一群部落民抓住了一家正在度假的[SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFlag]人，并扣押他们以勒索赎金。由于对这些部落缺乏直接的影响力，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须通过外交手段加以应对。"
 eqfm_karadag.031.f: "“那件外套肯定值不少钱。不如我们来看看你这颗[SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFormatting]脑袋能值多少？”"
 eqfm_karadag.031.a: "“#italic 唉#!，这次你们要多少？”"
 eqfm_karadag.031.b: "“人质？什么人质？”"
 eqfm_karadag.031.c: "“我们就是法律。”"
 eqfm_karadag.031.e: "“[SCOPE.sCharacter('eqfm_karadag_mon_leader').GetFirstName]，去把他们的首级给我带来。”"
 eqfm_karadag.032.t: "贵族在异国遭俘获"
 eqfm_karadag.032.d1: "[ROOT.GetCountry.GetAdjectiveNoFlag]的一个贵族家庭在途经[SCOPE.sCountry('montenegro_scope').GetName]乡间时遭到绑架。多亏了[SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle]的迅速干预，这家人不仅被解救，还在[SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFormatting]的宫廷受到了热烈款待，并获准安全返乡。"
 eqfm_karadag.032.d2: "[ROOT.GetCountry.GetAdjectiveNoFlag]的一个贵族家庭在途经[SCOPE.sCountry('montenegro_scope').GetName]乡间时遭到绑架。[SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle]却怠于作出任何实质性回应。如今，这家人已如同人间蒸发般杳无音信。"
 eqfm_karadag.032.f: "黑山的边疆充满了危险，同时也风景如画，许多人发现自己不仅沦为了此地的阶下囚，也沉迷于它的美丽。"
 eqfm_karadag.032.a: "绝佳的好消息。"
 eqfm_karadag.032.b: "真是荒谬至极。"
 eqfm_karadag.033.t: "边境山体滑坡"
 eqfm_karadag.033.d: "[GetStateRegion('STATE_MONTENEGRO').GetName]的暴雨引发了泥石流，阻断了村庄之间的交通。可怕的消息传来，在边境另一侧的[SCOPE.sState('ottoman_montenegro_state_scope').GetName]的村庄发生了一起严重的山体滑坡。我们的子民已开始越过那漏洞百出的边界，去援助他们远房的亲戚。"
 eqfm_karadag.033.f: "“可是边防军会开枪打我们的！”\n“去他的边防军，被困在那边的可是我的堂亲！”"
 eqfm_karadag.033.a: "这是部落自己的事。"
 eqfm_karadag.033.b: "国家将加入救援的队伍。"
 eqfm_karadag.033.c: "我们不能允许边界如此不设防。"
 eqfm_karadag.034.t: "袭击小队遭伏击"
 eqfm_karadag.040.t: "当地线人"
 eqfm_karadag.040.d: "有几个边境村庄的村民接触了我们的$eqfm_karadag_expedition$，他们似乎非常渴望分享关于劫掠小队动向的情报。这些信息已被如实呈递给[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName]将军。"
 eqfm_karadag.040.f: "“对，就是那边那个家伙。他杀了我兄弟，还玷污了我叔叔的名誉。”\n“不，这跟两年前他丢了五只羊还有他妹妹怀孕的事一点关系都没有。”"
 eqfm_karadag.040.a: "我们会好好利用这些情报的。"
 eqfm_karadag.040.b: "也许我们可以“劝说”他们分享更多信息……"
 eqfm_karadag.041.t: "发现熊迹"
 eqfm_karadag.041.d: "侦察兵向[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName]将军报告说，有一头熊在一直跟踪我们的部队。一些士兵表达了想要去狩猎一番的渴望。"
 eqfm_karadag.041.f: "“别瞎折腾了！”\n“但是长官，肉汤啊！”"
 eqfm_karadag.041.a: "随它去吧。"
 eqfm_karadag.041.b: "让士兵们活动活动筋骨。"
 eqfm_karadag.042.t: "腐败的口粮"
 eqfm_karadag.042.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName]将军被一个糟糕的消息惊醒：由于储存不当，大量口粮已经腐败变质。玩忽职守的士兵已遭到惩处，但这对于减轻珍贵粮草的损失而言无济于事。"
 eqfm_karadag.042.f: "“我们都吃了整整三天生蛆的面包了！”"
 eqfm_karadag.042.a: "我们不得不进一步削减口粮。"
 eqfm_karadag.042.b: "向最近的驻军请求补给。"
 eqfm_karadag.043.t: "辎重车队遭袭"
 eqfm_karadag.043.d: "黑山劫掠小队伏击并焚毁了数辆运往$eqfm_karadag_expedition$的补给马车。这极有可能会阻碍他们的行动。"
 eqfm_karadag.043.f: "“我们不能同室操戈。我们是劫掠者，我们有自己的规矩。——是啊，那规矩就是抢劫所有人。”"
 eqfm_karadag.043.a: "无神论的野蛮人！"
 eqfm_karadag.043.b: "派人去首都请求补给。"
 eqfm_karadag.044.t: "绕圈的探险队"
 eqfm_karadag.044.d: "$eqfm_karadag_expedition$在试图穿过[GetStateRegion('STATE_MONTENEGRO').GetName]的山道时迷失了方向。在第十次路过看似同一座山丘之后，他们才恍然大悟：他们彻底迷路了。"
 eqfm_karadag.044.f: "无数的道路纵横交错在群山之中，其中许多只有当地人才知晓。"
 eqfm_karadag.044.a: "这样下去没完没了。"
 eqfm_karadag.044.b: "“嘿兄弟们，也许是走这边。”"
 eqfm_karadag.045.t: "侦察告捷"
 eqfm_karadag.045.d: "$eqfm_karadag_expedition$的前锋侦察兵在追踪黑山劫掠小队的动向方面取得了重大进展。"
 eqfm_karadag.045.f: "“上尉，我的人盯上他们了！这边！”"
 eqfm_karadag.045.a: "干得好。"
 eqfm_karadag.045.b: "再逼他们一把。"
 eqfm_karadag.046.t: "巴尔干式好客"
 eqfm_karadag.046.d: "在途经一个村庄附近时，我们$eqfm_karadag_expedition$的侦察兵受到当地人邀请共进饮食。除了对我们在该地区维持和平的任务表达善意之外，村民们还送上了一些他们能匀出的微薄补给。"
 eqfm_karadag.046.f: "尽管[GetStateRegion('STATE_MONTENEGRO').GetName]的严酷环境阻碍了集约农业的发展，但同样的严酷也培养了其居民热情好客的深厚传统。"
 eqfm_karadag.046.a: "我们上路吧。"
 eqfm_karadag.046.b: "我敢肯定他们还能再提供“一点”。"
 eqfm_karadag.050.t: "僵持拉锯"
 eqfm_karadag.050.d: "[GetStateRegion('STATE_MONTENEGRO').GetName]的冲突仍在继续，双方均未取得多少进展。随着小规模伤亡的增加，战斗迟迟望不到尽头。"
 eqfm_karadag.050.f: "“继续挖！我们得在天黑前把这些掩体准备好。”"
 eqfm_karadag.050.a: "坚持住！"
 eqfm_karadag.051.t: "村庄外围被焚"
 eqfm_karadag.051.d: "一次试图侧翼包抄的行动最终演变成了村庄外围的混乱肉搏。在混乱的战斗中，数座房屋被点燃，里面的居民流离失所。"
 eqfm_karadag.051.f: "“我不管里面住的是什么人。把他们熏出来！”"
 eqfm_karadag.051.a: "我们现在不能放弃。"
 eqfm_karadag.052.t: "村庄惨遭屠戮"
 eqfm_karadag.052.d: "“令人担忧的消息断断续续传回了位于[GetStateRegion('STATE_MONTENEGRO').GetName]的边防哨所：那些名义上受我们控制的民兵洗劫了几座非[ROOT.GetCountry.GetStateReligion.GetName]的房屋，并造成了巨大的人员伤亡。”"
 eqfm_karadag.052.f: "崎岖的山地地形已经使得军事指挥变得十分复杂。再加上传统的暴力冲突，这就成为了滋生暴行的完美温床。"
 eqfm_karadag.052.a: "阻止这种疯狂的行径。"
 eqfm_karadag.052.b: "这与我们无关。"
 eqfm_karadag.053.t: "博拉风阻断行动"
 eqfm_karadag.053.d: "一股强烈的暴风从山上席卷而下。土耳其人被迫寻找掩护，而黑山人则趁机巩固了对村庄的控制。"
 eqfm_karadag.053.f: "“快，勇士们！风暴让土耳其人站不稳脚跟了！”"
 eqfm_karadag.053.a: "这肯定会让事情变得一团糟。"
 eqfm_karadag.055.t: "遭遇战"
 eqfm_karadag.055.d: "一次黑山侦察小队与奥斯曼巡逻队之间的偶遇演变成了一场持久战，因为双方指挥官都选择了增援自己的阵地。"
 eqfm_karadag.055.f: "尽管黑山人身手灵活且熟悉地形，但他们很难对编制严密的阵型造成大规模杀伤。"
 eqfm_karadag.055.a: "我们的人不会被吓倒的。"
 eqfm_karadag.055.b: "这些部落武装对我们构不成威胁。"
 eqfm_karadag.056.t: "突然突破"
 eqfm_karadag.056.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName]发起了一次出人意料的有组织的推进，突破了我们在村庄中心的防御，并占据了几座关键建筑。"
 eqfm_karadag.056.f: "“前进！为了苏丹！”"
 eqfm_karadag.056.a: "我们的勇士绝不会倒下！"
 eqfm_karadag.056.b: "让他们尝尝刀剑的滋味。"
 eqfm_karadag.058.t: "俘获奥斯曼指挥官"
 eqfm_karadag.058.d: "$eqfm_tribal_skirmish$以[SCOPE.sCharacter('eqfm_karadag_mon_leader').GetFullName]的彻底胜利而告终。奥斯曼$eqfm_karadag_expedition$已被击溃，[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName]也沦为了阶下囚。"
 eqfm_karadag.058.f: "由于缺乏能用来制衡奥斯曼帝国的手段，捕获具有政治敏感度的人质已经成为了黑山外交最核心的工具之一。"
 eqfm_karadag.058.a: "把他关进宫殿里。"
 eqfm_karadag.058.b: "放了他。"
 eqfm_karadag.058.c: "我们不留活口。"
 eqfm_karadag.058.e: "真是可耻的表现。"
 eqfm_karadag.058.g: "至少有人活着回家了。"
 eqfm_karadag.059.t: "黑山领袖阵亡"
 eqfm_karadag.059.d: "令人悲痛的消息传来，一位在[ROOT.GetCountry.GetAdjectiveNoFlag]高地上极负盛名的勇士不幸阵亡，[ROOT.GetCountry.GetCapital.GetFarmHubName]因此陷入了大规模的哀悼之中。"
 eqfm_karadag.059.f: "“哦，我的鸟儿，我亲爱的灰隼，\n翅膀被撕裂，你的感受如何？\n我感到自己的翅膀已被撕裂，\n就像兄弟失去了彼此的陪伴。”"
 eqfm_karadag.059.a: "我们将高唱颂歌歌颂他的荣耀！"
 eqfm_karadag.059.b: "罪有应得！"
 eqfm_karadag.100.t: "索取哈拉奇"
 eqfm_karadag.100.d: "一支来自[SCOPE.sCountry('bosnia_scope').GetName]的民兵部队逼近边境，要求[ROOT.GetCountry.GetName]向[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]缴纳#italic 哈拉奇#!。"
 eqfm_karadag.100.f: "哈拉奇，一种针对非穆斯林征收的税，自奥斯曼帝国征服巴尔干以来便一直在此征收。由于并非[SCOPE.sCountry('ottoman_scope').GetName]的臣民，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]及其宫廷几个世纪以来一直抗拒缴纳这项贡税。"
 eqfm_karadag.100.a: "[ROOT.GetCountry.GetNameNoFlag]绝不屈服于勒索。"
 eqfm_karadag.100.b: "我们无力抵抗[SCOPE.sCountry('bosnia_scope').GetNameNoFlag]"
 eqfm_karadag.101.t: "部落冲突"
 eqfm_karadag.101.d1: "一封公文送达，告知我们由我们信赖的军阀[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!率领的民兵部队，其索要哈拉奇的要求已遭到了[SCOPE.sCountry('montenegro_scope').GetName]的拒绝。"
 eqfm_karadag.101.d2: "令人震惊的是，一支原本前往[SCOPE.sCountry('montenegro_scope').GetName]索要贡品的民兵部队，却带回了不同的战利品：这个亲王主教国向[ROOT.GetCountry.GetName]臣服了。"
 eqfm_karadag.101.f: "[GetStrategicRegion('region_balkans').GetName]对部落暴力并不陌生。在内陆腹地，部落间的世仇和习俗往往凌驾于苏丹的律法之上。"
 eqfm_karadag.101.a: "这位亲王主教将会学到何谓谦卑。"
 eqfm_karadag.101.b: "他们会为我们效劳的。"
 eqfm_karadag.102.t: "胡马茨谈判"
 eqfm_karadag.102.d: "[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!发现，他对[GetStateRegion('STATE_MONTENEGRO').GetName]的图谋，因[SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle]固执地拒不放弃对乡村的防御而化为泡影。在[SCOPE.sCountry('balkfm_benefactor_scope').GetNameNoFlag]与[SCOPE.sCountry('ottoman_scope').GetNameNoFlag]的双重压力下，[SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle]与[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullName]（即[SCOPE.sCountry('bosnia_scope').GetNameNoFlag]的[SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle]）已在#bold 胡马茨#!村会面展开谈判。"
 eqfm_karadag.102.f: "拟议的条款如下：\n“1. 格拉霍沃流离失所的居民可以返回。\n 2. #yellow 雅科夫·达科维奇#!将成为格拉霍沃的领主。\n 3. 格拉霍沃将恢复向高门纳税。\n 4. 格拉霍沃的所有防御工事将被废弃。\n 5. 土耳其人与黑山人之间将保持‘永久的和平’。\n 6. 波斯尼亚维齐尔穆罕默德·帕夏与[ROOT.GetCountry.GetRuler.GetLastName]均将维护此协议。”"
 eqfm_karadag.102.a: "这个[SCOPE.sCountry('bosnia_scope').GetRuler.GetLastName]阴险毒辣如蛇蝎，但我们会与他谈判。"
 eqfm_karadag.102.b: "[SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle]终将复仇。"
 eqfm_karadag.102.tt: "#red #bold 真是个馊主意。#!#!"
 eqfm_karadag.102.c: "随它去吧。"
 eqfm_karadag.103.t: "格拉霍沃之战"
 eqfm_karadag.103.d: "[SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag]边境村庄格拉霍沃遭受了异常惨烈的劫掠。为了伸张其索要贡品的所谓权利，[SCOPE.sCountry('bosnia_scope').GetAdjectiveNoFlag]军阀[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!·[SCOPE.sCharacter('smail_aga_scope').GetLastName]洗劫了该村，几名平民在他的命令下惨遭杀害。\n\n尽管当地民兵奋力抵抗，村庄还是被付之一炬，当地领导人也被迫逃离。在阵亡者之中，有[SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle]的兄弟，[SCOPE.sCharacter('balkfm_joko_scope').GetFullName]。"
 eqfm_karadag.103.f: "“在格拉霍沃宽阔平坦的荒野之上，\n彼得罗维奇的子弟整整九人惨遭屠杀。\n倒在琴吉奇-阿加那闪烁寒光的刀剑下，\n这是黑山领主的奇耻大辱。”\n——1830年代记述格拉霍沃战役的流行诗篇"
 eqfm_karadag.103.a: "[ROOT.GetCountry.GetName]必须要求赔偿。"
 eqfm_karadag.103.b: "这些土地是苏丹名正言顺的领地。"
 eqfm_karadag.103.c: "[GetStateRegion('STATE_MONTENEGRO').GetName]应当归我们所有。"
 eqfm_karadag.104.t: "莫斯塔尔的苏丹"
 eqfm_karadag.104.d: "[SCOPE.sCountry('bosnia_scope').GetNameNoFlag]的[SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle]，[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullName]公然宣布他意图脱离$turkfm_porte$的控制，这是对他一生履职的彻底背叛。在莫斯塔尔的一场酒局上，这位帕夏竟胆敢自诩为苏丹。"
 eqfm_karadag.104.f: "“伊斯坦布尔有一位苏丹，而我则是莫斯塔尔的苏丹。”——阿里·帕夏，1841年"
 eqfm_karadag.104.a: "又一只将被碾死在脚底的老鼠。"
 eqfm_karadag.105.t: "扣押叛徒"
 eqfm_karadag.105.d: "在一次与顾问的简短会议中，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]同意了罢黜[SCOPE.sCountry('turkfm_pizzo_target').GetNameNoFlag]的叛乱统治者[SCOPE.sCountry('turkfm_pizzo_target').GetRuler.GetFullNameWithTitle]的计划。现在剩下的就是将这个任务委托给一位有能力的指挥官。"
 eqfm_karadag.105.f: "君士坦丁堡一个多世纪以来的软弱统治削弱了$turkfm_porte$的权威。如同秃鹫盘旋于尸体之上，将军们总是伺机从这垂死的帝国身上攫取他们能得到的一切。"
 eqfm_karadag.105.a: "我们将信任寄托于[SCOPE.sCharacter('').GetFullName]。"
 eqfm_karadag.105.b: "必须立即派遣[SCOPE.sCharacter('').GetFullName]。"
 eqfm_karadag.105.c: "让[SCOPE.sCharacter('').GetFullName]去降下苏丹的正义。"
 eqfm_karadag.105.e: "派一名初级指挥官去。"
 eqfm_karadag.110.t: "危险的竞争者"
 eqfm_karadag.110.d: "[ROOT.GetCountry.GetRuler.GetLastName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]收到了一条令人担忧的消息：几名间谍证实了[SCOPE.sCharacter('balkfm_cengic_smail').GetFirstName]#yellow -阿加#!已经开始密谋推翻[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。这两位曾经在战场上亲密无间的兄弟，如今在[ROOT.GetCountry.GetNameNoFlag]的未来走向上踏上了一条必然碰撞的道路。"
 eqfm_karadag.110.f: "部落关系主导着[GetGeographicRegion('geographic_region_balkan_highlands').GetName]的政治版图。在这一框架下，一名军阀今日最大的盟友，明日就可能成为其最大的宿敌。"
 eqfm_karadag.110.a: "这位阿加意味着麻烦。"
 eqfm_karadag.111.t: "密谋暗杀"
 eqfm_karadag.111.d: "在一次秘密会议中，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]·[ROOT.GetCountry.GetRuler.GetLastName]命令他的顾问们解决[SCOPE.sCharacter('balkfm_cengic_smail').GetFirstName]#yellow -阿加#!所带来的威胁。他们酝酿出了一个计划，利用部落间的血海深仇来杀死[SCOPE.sCharacter('balkfm_cengic_smail').GetFirstNameNoFormatting]，同时确保这种死法不太可能追溯到[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的身上。"
 eqfm_karadag.111.f: "[ROOT.GetCountry.GetNameNoFormatting]的贵族们发现自己的地位受到了斯迈尔-阿加崛起的威胁。鉴于斯迈尔-阿加在格拉霍沃落入奥斯曼帝国手中后制造了一系列大屠杀而臭名昭著，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的宫廷相信，当地部落首领将会乐于协助他们的计划。"
 eqfm_karadag.111.a: "让我们去接触[SCOPE.sCountry('serbia_scope').GetRuler.GetFullNameWithTitle]"
 eqfm_karadag.111.b: "也许那些[SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag]毒蛇能派上用场……"
 eqfm_karadag.112.t: "破坏性影响"
 eqfm_karadag.112.d1: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]发现自己陷入了僵局。今晨，他收到了一封封好火漆的信，寄信人正是[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]本人。信中，这位[SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle]邀请[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]参与一场暗杀波斯尼亚领主[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!·[SCOPE.sCharacter('smail_aga_scope').GetLastName]的阴谋，此人正是格拉霍沃无端暴行的肇事者之一。"
 eqfm_karadag.112.d2: "今早一份公报送达了[ROOT.GetCountry.GetCapital.GetCityHubName]，暗示奥斯曼贝伊[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!·[SCOPE.sCharacter('smail_aga_scope').GetLastName]正在密谋篡夺[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]作为黑塞哥维那维齐尔的地位。亲王的顾问们警告说，这可能会危及我们在[SCOPE.sCountry('montenegro_scope').GetName]的塞尔维亚表亲。"
 eqfm_karadag.112.f1: "[SCOPE.sCountry('serbia_scope').GetRuler.GetFullNameWithTitle]以及其他贝伊发现，他作为维齐尔的地位受到了斯迈尔-阿加崛起的威胁。在[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]证实了他的担忧之后，阿里开始在该地区寻找盟友。鉴于斯迈尔-阿加在格拉霍沃落入奥斯曼帝国手中后制造了一系列大屠杀而臭名昭著，密谋者们希望[ROOT.GetCountry.GetRuler.GetLastName]能够赞同他们的计划。"
 eqfm_karadag.112.f2: "#yellow 黑山#!的亲王主教发现自己遭受了高门政治阴谋的攻击，其边境也受到了#yellow 阿里·帕夏#!的威胁。虽然我们不能公开对奥斯曼帝国主子的其他臣民采取行动，但我们可以帮助[SCOPE.sCharacter('montenegro_ruler_scope').GetFullName]在他们内部制造混乱。"
 eqfm_karadag.112.a: "给帕夏回信。"
 eqfm_karadag.112.b: "也许我们能找到一个心甘情愿的帮凶……"
 eqfm_karadag.112.c: "我们不会协助这场血腥的世仇报复。"
 eqfm_karadag.112.e: "揭露这个卑劣的阴谋！"
 eqfm_karadag.113.t: "暗夜利刃"
 eqfm_karadag.113.d: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]发现自己陷入了僵局。今晨，他收到了一封封好火漆的信，寄信人正是[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]本人。信中，这位[SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle]邀请[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]参与一场暗杀波斯尼亚领主[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!·[SCOPE.sCharacter('smail_aga_scope').GetLastName]的阴谋，此人正是格拉霍沃无端暴行的肇事者之一。"
 eqfm_karadag.113.f: "[SCOPE.sCountry('serbia_scope').GetRuler.GetFullNameWithTitle]以及其他贝伊发现，他作为维齐尔的地位受到了斯迈尔-阿加崛起的威胁。在[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]证实了他的担忧之后，阿里开始在该地区寻找盟友。鉴于斯迈尔-阿加在格拉霍沃落入奥斯曼帝国手中后制造了一系列大屠杀而臭名昭著，密谋者们希望[ROOT.GetCountry.GetRuler.GetLastName]能够赞同他们的计划。"
 eqfm_karadag.113.a: "我们要为格拉霍沃复仇。"
 eqfm_karadag.113.b: "这种人不值得我们与之结交。"
 eqfm_karadag.114.t: "当地的合作者"
 eqfm_karadag.114.d: "经过数周的深思熟虑，顾问们建议招募一名当地人来执行这一行动，以避免牵连主教。他们看中了当地的沃伊沃达，[SCOPE.sCharacter('novica_cerovic_scope').GetFullName]。"
 eqfm_karadag.114.f: "斯迈尔-阿加的儿子鲁斯捷姆-贝伊激起了仍在奥斯曼帝国压迫之下的黑山人的怒火。他因酗酒且在领地内肆意凌辱非穆斯林妇女而臭名昭著。起初，部落首领们请求主教允许他们暗杀他，却被亲王主教回绝了。\n\n如同黑山各地的许多村民一样，居住在图希纳的采罗维奇因斯迈尔-阿加在格拉霍沃制造的暴行而对其怀恨在心。他与他的族人毫不犹豫地接下了这个差事，条件是允许他们顺手解决掉鲁斯捷姆-贝伊。"
 eqfm_karadag.114.a: "他看起来是个合适的人选。"
 eqfm_karadag.114.tt: "[SCOPE.sCharacter('novica_cerovic_scope').GetFullName]将执行这项令人毛骨悚然的任务"
 eqfm_karadag.115.t: "斯迈尔-阿加之死"
 eqfm_karadag.115.d: "得到了[SCOPE.sCountry('montenegro_scope').GetRuler.GetLastName]的首肯后，当地的一位沃伊沃达——诺维察·采罗维奇——通过拒绝进贡激怒了[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!。在前往严惩他的途中，这位奥斯曼领主遭到了该地区几名部落民的袭击。在将这名被杀的贵族斩首后，亲王主教收到了他的头颅，作为任务完成的证明。"
 eqfm_karadag.115.f: "“可怜的斯迈尔，所以你也落到我手里了！”——涅戈什，1840年"
 eqfm_karadag.115.a: "极好。我们要重赏采罗维奇。"
 eqfm_karadag.115.b: "死不足惜。"
 eqfm_karadag.115.c: "死不足惜。"
 eqfm_karadag.116.t: "血债血偿"
 eqfm_karadag.116.d: "斯迈尔-阿加的“猝然”遇害并未就此平息。[SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow 帕夏#!公开谴责了这起谋杀，并开始在边境沿线展开报复行动。[ROOT.GetCountry.GetName]再次陷入两难的境地。随着战争威胁的再次升级，[SCOPE.sCountry('russia_scope').GetName]与[SCOPE.sCountry('austria_scope').GetName]要求立即停止敌对行动。"
 eqfm_karadag.116.f: "阿里·帕夏趁着斯迈尔-阿加遇害造成的混乱大做文章。由于阴谋尚未败露，主教如果不想暴露阴谋的真相，他的选择将十分有限。"
 eqfm_karadag.116.a: "呼吁谈判。"
 eqfm_karadag.116.b: "揭露阴谋。"
 eqfm_karadag.117.t: "两面三刀的外交"
 eqfm_karadag.117.d: "在列强的要求下，[SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle]与[SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]之间达成了一项和平协议。然而，这位帕夏毫不犹豫地借机对黑山人民冷嘲热讽。"
 eqfm_karadag.117.f: "“我的大人，他把我们当猴耍！”\n当谈判结束后的事态消息传来时，这种情绪在黑山宫廷中引发了共鸣。傲慢地沉浸在外交胜利中的[SCOPE.sCountry('bosnia_scope').GetRuler.GetLastNameNoFormatting]帕夏，突然打开一袋金子，将几枚硬币扔到了地上。在随之而来的争抢中，我们代表团的几名成员扑倒在地，尽可能多地为自己抢夺金币。这种令人难堪的场面，赤裸裸地暴露了黑山相较于巴尔干其他地区是何等的贫困。"
 eqfm_karadag.117.a: "永远不要相信帕夏。"
 eqfm_karadag.118.t: "阴谋败露！"
 eqfm_karadag.118.d: "[SCOPE.sCountry('eqfm_karadag_whistleblower_scope').GetNameNoFlag]揭露了我们暗杀[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -阿加#!的计划！"
 eqfm_karadag.118.f: "“对，就是那个叫[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]的家伙？他付钱让我干的。老实交待！”"
 eqfm_karadag.118.a: "卑鄙的老鼠！"
 eqfm_karadag.119.t: "阴谋受挫"
 eqfm_karadag.119.d: "#todo [eqfm_karadag.119.d]#!"
