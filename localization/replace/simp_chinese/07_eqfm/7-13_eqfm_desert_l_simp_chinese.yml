 eqfm_deploy_desert_expedition_possible: "[ROOT.GetCountry.GetNameNoFlag]在[GetStateRegion('STATE_LIBYAN_DESERT').GetName]拥有一块[concept_colony]"
 eqfm_resupply_desert_expedition_possible: "$eqfm_desert_expedition$拥有#bold #red 3#!或更多#!$eqfm_expedition_peril$"
 eqfm_resupply_desert_expedition_effect: "这将使$eqfm_desert_expedition$的$eqfm_expedition_peril$减少#bold #green 3#!#!（最低降至0）"
 eqfm_desert_expedition: "@gbbf_expedition_desert!#yellow #tooltip:[GetRawTextTooltipTag('eqfm_desert_expedition_desc')] 沙漠远征#!#!"
 eqfm_desert_expedition_desc: "[GetStateRegion('STATE_LIBYAN_DESERT').GetName]从未真正受中央政权管辖，帝国控制仅限于沿海地区与主要定居点。但随着$turkfm_tanzimat$的推行，新一轮征服行动已然展开。"
 eqfm_desert_expedition_details: "只要$eqfm_expedition$$eqfm_expedition_progress$保持在#bold #green 8点#!#!以上，[GetPlayer.GetNameNoFlag]将获得[GetStaticModifier('modifier_eqfm_desert_scouting').GetName][concept_modifier]。若$eqfm_expedition$$eqfm_expedition_peril$达到#red #bold 5点#!#!，[GetPlayer.GetNameNoFlag]的远征队将被强制撤回。"
 notification_eqfm_desert_raids_halted_name: "沙漠劫掠已停止"
 notification_eqfm_desert_raids_halted_desc: "由于[GetPlayer.GetName]没有活跃的$eqfm_desert_expedition$，因此无法进行#bold 沙漠劫掠#!。"
 notification_eqfm_yearly_progress_name: "$eqfm_desert_expedition$取得了进度"
 notification_eqfm_yearly_progress_desc: "在一边抵御部落袭击、一边与各部落首领开展外交斡旋的同时，我们的$eqfm_expedition$在驯服[GetStateRegion('STATE_LIBYAN_DESERT').GetName]的进程中取得了新的进展。"
 eqfm_deploy_desert_expedition_name: "部署$eqfm_desert_expedition$"
 eqfm_deploy_desert_expedition_desc: "[ROOT.GetCountry.GetNameNoFlag]肩负着$turkfm_tanzimat$的敕令，旨在将国家权力延伸至城市与荒漠。我们可以通过部署$eqfm_desert_expedition$来协助我们建立控制的努力。"
 eqfm_cancel_desert_expedition_name: "召回$eqfm_desert_expedition$"
 eqfm_cancel_desert_expedition_desc: "$eqfm_recall_expedition_desc$"
 eqfm_resupply_desert_expedition_name: "补给$eqfm_desert_expedition$"
 eqfm_resupply_desert_expedition_desc: "[GetStateRegion('STATE_LIBYAN_DESERT').GetName]是一片自然条件恶劣且不适宜人类居住的土地。$eqfm_desert_expedition$需要我们提供所能给予的一切支持。"