l_simp_chinese:
 je_eqfm_libyan_desert: "利比亚沙漠"
 je_eqfm_libyan_desert_reason: "历经数千年臣服于外国统治者的岁月，[ROOT.GetCountry.GetNameNoFlag]对其南部沙漠地区仅维持着名义上的控制。列强正企图将触角伸向世界各地，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须迅速采取行动巩固南部边境。$gbbf_linebreak_normal$@information!只要我们保持 $eqfm_desert_expedition$的$eqfm_expedition_progress$超过#v 5#!，[GetStateRegion('STATE_LIBYAN_DESERT').GetName]地区就将获得#tooltippable #tooltip:[GetRawTextTooltipTag('je_eqfm_libyan_desert_modifier')] $modifier_eqfm_desert_scouting$#!#![concept_modifier]"
 je_eqfm_libyan_desert_status_default: "我们控制#bold 209个#!$gbbf_provinces$中的#v [GetPlayer.MakeScope.Var('eqfm_desert_provinces_var').GetValue]#!个"
 je_eqfm_libyan_desert_status_expedition: "[GetPlayer.MakeScope.Var('eqfm_desert_expedition_leader_var').GetCharacter.GetFullName]领导着$eqfm_expedition$\n$eqfm_expedition_progress$：#bold #green [GetPlayer.MakeScope.Var('eqfm_desert_expedition_progress_var').GetValue]#!/8#!$eqfm_expedition_peril$：#bold #red [GetPlayer.MakeScope.Var('eqfm_desert_expedition_peril_var').GetValue]#!/5#!"
 je_eqfm_libyan_desert_modifier: "[GetStaticModifier('modifier_eqfm_desert_scouting').GetDesc]"
