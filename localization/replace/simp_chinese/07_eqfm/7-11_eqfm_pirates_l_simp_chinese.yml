 eqfm_adriatic_expedition_desc: "[GetGeographicRegion('geographic_region_adriatic_sea').GetName]的海盗活动在罗马和中世纪时期曾基本受到遏制，尽管它当时仍是一个令人头疼的隐患。然而，随着奥斯曼帝国的到来与衰落，海盗活动已然卷土重来，同样招致了西方与土耳其商人的满腔怒火。"
 eqfm_adriatic_expedition_details: "若$eqfm_expedition$$eqfm_expedition_progress$达到#bold #green 8#!#!，[ROOT.GetCountry.GetNameNoFlag]将发现一处海盗巢穴。若$eqfm_expedition$$eqfm_expedition_peril$达到#red #bold 5#!#!，[ROOT.GetCountry.GetNameNoFlag]的任务将宣告失败。"
