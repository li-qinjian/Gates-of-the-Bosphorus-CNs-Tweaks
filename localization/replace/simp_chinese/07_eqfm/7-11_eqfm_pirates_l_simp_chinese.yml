 notification_eqfm_jack_sparrow_reincarnated_desc: "随着前任海盗军阀的离世，[GetGlobalVariable('je_eqfm_pirates_of_the_adriatic').Var('eqfm_jack_sparrow_var').GetCharacter.GetFullName]已脱颖而出，成为阿尔巴尼亚海盗的新任领袖。"
