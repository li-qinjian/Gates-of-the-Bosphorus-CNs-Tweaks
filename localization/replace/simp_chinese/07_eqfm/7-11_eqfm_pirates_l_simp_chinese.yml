 je_eqfm_pirates_of_the_adriatic_lobby: "这群以巴尔干大陆为据点的海盗，长期以来一直让亚得里亚海沿岸居民深恶痛绝。几个世纪以来，他们始终是苏丹政权向亚得里亚海延伸的触手。然而，随着中央权威的衰落，许多海盗开始肆无忌惮地进行袭扰与掠夺，既不效忠朝廷，亦无人能追其责。"
