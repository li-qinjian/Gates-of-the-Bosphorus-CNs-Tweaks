 notification_eqfm_adriatic_yearly_progress_desc: "[GetPlayer.MakeScope.Var('eqfm_cutler_beckett_var').GetCharacter.GetFullName]的部队已经掌握了[GetGeographicRegion('geographic_region_adriatic_sea').GetName]海盗活动的线索。"
 eqfm_hire_retired_pirates_name: "雇佣退役海盗"
 eqfm_hire_retired_pirates_desc: "[GetGeographicRegion('geographic_region_adriatic_sea').GetName]的沿岸不仅是活跃海盗的巢穴——这里还孕育着无数生计与海洋密不可分的完整社群。面对一份合法的雇佣邀约，许多经验丰富的老练水手显然很难拒绝。"
 eqfm_deploy_adriatic_expedition_name: "部署$eqfm_adriatic_expedition$"
 eqfm_deploy_adriatic_expedition_desc: "除非被迫收手，否则阿尔巴尼亚海盗绝不会停止他们的勾当。为此，我们应当部署一支$eqfm_expedition$来将他们悉数搜捕。"
 eqfm_cancel_adriatic_expedition_name: "召回$eqfm_adriatic_expedition$"
 eqfm_cancel_adriatic_expedition_desc: "$eqfm_recall_expedition_desc$"
 eqfm_resupply_adriatic_expedition_name: "补给$eqfm_adriatic_expedition$"
 eqfm_resupply_adriatic_expedition_desc: "[GetGeographicRegion('geographic_region_adriatic_sea').GetName]是一片凶险且变幻莫测的海域。$eqfm_adriatic_expedition$将需要我们所能提供的全方位支持。"
 eqfm_resupply_adriatic_expedition_possible_1: "$eqfm_adriatic_expedition$当前并未参与海上追击"
 eqfm_resupply_adriatic_expedition_possible_2: "$eqfm_adriatic_expedition$的$eqfm_expedition_peril$#bold #red 大于等于3#!#!"
 eqfm_resupply_adriatic_expedition_effect: "这将使$eqfm_adriatic_expedition$的$eqfm_expedition_peril$减少#bold #green 3#!#!（最低降至0）"