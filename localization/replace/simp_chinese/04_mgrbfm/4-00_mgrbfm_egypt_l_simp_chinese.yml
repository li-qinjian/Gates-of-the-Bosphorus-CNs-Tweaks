 je_mgrbfm_egypt_nationalism_on_complete_1: "如果[ROOT.GetCountry.GetNameNoFlag]确立[GetCulture('misri').GetName]$mgrbfm_identity$：\n•触发#white ——#!事件\n•[GetCulture('misri').GetName]将保留为[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$"
 je_mgrbfm_egypt_nationalism_on_complete_2: "如果[ROOT.GetCountry.GetName]确立#yellow 泛[GetCulture('arab').GetName]$mgrbfm_identity$：\n•触发#white ——#!事件\n•[GetCulture('arab').GetName]将成为[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$\n•[GetCulture('misri').GetName]将不再是[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$\n•[ROOT.GetCountry.GetNameNoFlag]境内的大多数[GetCulture('misri').GetName]$gbbf_pops$将同化为该文化"
 je_mgrbfm_egypt_nationalism_on_complete_3: "如果[ROOT.GetCountry.GetName]确立[GetCulture('misri').GetName]-[GetCulture('coptic').GetName]混合$mgrbfm_identity$：\n•触发#white ——#!事件\n•[GetCulture('misri').GetName]将保留为[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$\n•[GetCulture('coptic').GetName]将成为[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$"
 je_mgrbfm_egypt_nationalism_on_complete_4: "如果[ROOT.GetCountry.GetName]制定[GetLawType('law_ethnostate').GetName]：\n•触发#white ——#!事件\n•[GetCulture('misri').GetName]将保留为[ROOT.GetCountry.GetNameNoFlag]的$gbbf_primary_culture$"
 je_mgrbfm_egypt_imperialism: "埃及帝国"
 je_mgrbfm_egypt_imperialism_reason: "[ROOT.GetCountry.GetName]的未来完全取决于其是否能从奥斯曼帝国与欧洲列强的夹缝中求取生存。[ROOT.GetCountry.GetCapital.GetCityHubName]确保自身生机的唯一途径，便是在东方规划出一种全新的秩序。"
 je_mgrbfm_egypt_imperialism_complete: "在[GetGeographicRegion('geographic_region_greater_egypt').GetName]内，#bold 奥斯曼帝国#!、其任何$gbbf_subjects$或其[concept_power_bloc]的成员没有拥有任何$gbbf_states$"
 mgrbfm_egypt_imperialism_completed: "[ROOT.GetCountry.GetNameNoFlag]已完成了#bold $je_mgrbfm_egypt_muhammad_ali$#!或#bold $je_mgrbfm_egypt_imperialism$#![concept_journal_entry]"
 je_mgrbfm_egypt_arabia: "埃及哈里发国"
 je_mgrbfm_egypt_arabia_reason: "近千年来，定都开罗的历代王朝始终在争夺阿拉伯世界的霸权。随着[ROOT.GetCountry.GetAdjectiveNoFlag]帝国在东方的地位稳固，剩下的唯有通过将我们的影响力遍及整个阿拉伯世界，来重拾哈里发的名号。"
 je_mgrbfm_egypt_sudan: "征服苏丹"
 je_mgrbfm_egypt_sudan_reason: "#italic “你应当知晓，我们倾注如此心力与公帑，终极目的便是为了攫取黑奴。在此等头等要务上，务必展现出你的热忱，切实执行我的意志。”——$Muhammad_Ali$致穆罕默德·德弗特尔达尔，1823年9月23日#!\n\n在彻底肃清了马穆鲁克的残余势力后，$Muhammad_Ali$开始致力于扩张埃及的势力范围，力图摆脱奥斯曼帝国对埃及经济的桎梏。而在他的宏伟蓝图中，南方的苏丹领土是至关重要的一环——那里不仅蕴藏着丰富的自然矿藏，更有着足以支撑其野心的庞大“人力资源”。"
 je_mgrbfm_egypt_sudan_kordofan: "[GetStateRegion('STATE_KORDOFAN').GetName]是[concept_incorporated_state]且$gbbf_radicalism$在#v 25％#!#bold 以下#!"
 je_mgrbfm_egypt_sudan_blue_nile: "[GetStateRegion('STATE_BLUE_NILE').GetName]是[concept_incorporated_state]且$gbbf_radicalism$在#v 25％#!#bold 以下#!"
 je_mgrbfm_egypt_sudan_dongola: "[GetStateRegion('STATE_DONGOLA').GetName]是[concept_incorporated_state]且$gbbf_radicalism$在#v 25％#!#bold 以下#!"
 je_mgrbfm_egypt_ethiopia: "埃塞俄比亚边疆"
 je_mgrbfm_egypt_ethiopia_reason: "自$Muhammad_Ali$时代的首次南征起，历代军事统帅与赫迪夫们便始终萦绕着一个宏愿：将整个尼罗河流域尽数收入囊中。青尼罗河那奔腾不息的源头，正隐匿于埃塞俄比亚的高原群山之中。为了彻底掌握这条国家的生命线及其周边的丰饶资源，征服这片高地已成为[ROOT.GetCountry.GetNameNoFlag]维系其国运的必然选择。"
 je_mgrbfm_egypt_red_sea: "阿拉伯湾"
 je_mgrbfm_egypt_red_sea_reason: "伴随着$Muhammad_Ali$宏伟夙愿而来的，是摆脱奥斯曼土耳其人并确立经济与海权独立的迫切需求。只要将#v $strait_bab_el_mandeb$#!牢牢掌握在手中，[ROOT.GetCountry.GetNameNoFlag]便能开辟出一条直通远洋的商贸命脉，从而彻底终结在贸易中不得不仰$turkfm_porte$鼻息、受地中海列强掣肘的屈辱局面。"
 je_mgrbfm_egypt_red_sea_complete: "[ROOT.GetCountry.GetNameNoFlag]是#v $strait_bab_el_mandeb$#!的$gbbf_strait_controller$"
 je_mgrbfm_egypt_red_sea_fail: "[ROOT.GetCountry.GetNameNoFlag]在[GetGeographicRegion('geographic_region_red_sea').GetName]的亚洲一侧没有任何[concept_state]"
 je_mgrbfm_egypt_muhammad_ali_lobby: "凭藉卓越的军事才能与精明的政治手腕，$Muhammad_Ali$从阿尔巴尼亚乡村的一介草民，一跃成为了埃及无可置疑的统治者。正当$turkfm_porte$在风雨飘摇中挣扎求存之际，$Muhammad_Ali$正致力于将#bold $al-_Alawi$#!王朝确立为复兴后的埃及帝国之世袭统治者。"
 je_mgrbfm_egypt_modernization_lobby: "埃及长期以来一直在为脱离奥斯曼帝国的控制、实现自主地位而艰苦奋斗。在$Muhammad_Ali$的统治下，埃及国家必须在沦为欧洲列强势力范围之前，完成大刀阔斧的工业化改革。"
