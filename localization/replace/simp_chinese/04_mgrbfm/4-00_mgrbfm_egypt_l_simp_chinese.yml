 mgrbfm_identity_desc: "@gbbf_identity!#header 埃及认同#!$gbbf_linebreak_normal$被称为埃及的这片土地在从早期历史边缘到工业时代曾无数次易手。从古埃及、希腊到阿拉伯时代，埃及人民从未形成过一个超越村庄与部落的、被共同珍视的单一文化身份。受欧洲民族主义理想的启发，新生的埃及知识界开始构想一种超越国家和统治者的统一埃及身份。这一运动充满分歧，不同思想家在这一身份究竟应根植于民族、宗教还是领土历史的问题上产生激烈冲突。"
