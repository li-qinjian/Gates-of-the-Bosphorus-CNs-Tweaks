 je_mgrbfm_egypt_muhammad_ali: "穆罕默德·阿里的雄心"
 je_mgrbfm_egypt_muhammad_ali_reason: "“#italic 我深知奥斯曼帝国正日复一日地滑向毁灭。……我要在她的废墟上，建立一个地跨幼发拉底河与底格里斯河的庞大王国。”——穆罕默德·阿里#!\n\n通过过人的军事才能与政治机敏，$Muhammad_Ali$从[GetStateRegion('STATE_ALBANIA').GetName]的乡间一跃成为[ROOT.GetCountry.GetName]名副其实的统治者。趁着$turkfm_porte$政局动荡，$Muhammad_Ali$正谋求确立#bold $al-_Alawi$#!王朝的世袭地位，以实现重振埃及帝国的宏图大志。"
 je_mgrbfm_egypt_muhammad_ali_complete_1: "[ROOT.GetCountry.GetAdjectiveNoFlag]的[concept_army_power_projection]已超过[SCOPE.sCountry('ottoman_scope').GetNameNoFlag]（当前为#v [JournalEntry.MakeScope.Var('mgrbfm_egy_army_projection').GetValue|1]#!∶#v [JournalEntry.MakeScope.Var('mgrbfm_tur_army_projection').GetValue|1]#!）"
 je_mgrbfm_egypt_muhammad_ali_complete_2: "[ROOT.GetCountry.GetAdjectiveNoFlag]的[concept_naval_power_projection]已超过[SCOPE.sCountry('ottoman_scope').GetNameNoFlag]（当前为#v [JournalEntry.MakeScope.Var('mgrbfm_egy_navy_projection').GetValue|1]#!∶#v [JournalEntry.MakeScope.Var('mgrbfm_tur_navy_projection').GetValue|1]#!）"
 je_mgrbfm_egypt_muhammad_ali_complete_3: "[ROOT.GetCountry.GetNameNoFlag]在[GetStrategicRegion('region_nile_basin').GetName]$gbbf_fully_owns$#bold 4个或更多#!$gbbf_state_regions$"
 je_mgrbfm_egypt_muhammad_ali_complete_4: "[ROOT.GetCountry.GetNameNoFlag]在[GetGeographicRegion('geographic_region_levant').GetName]$gbbf_fully_owns$#bold 6个或更多#!$gbbf_state_regions$"
