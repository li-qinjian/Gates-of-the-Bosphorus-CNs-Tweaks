 notification_mgrbfm_red_sea_claimed_desc: "埃及国家公然无视国际秩序，宣布对[GetGeographicRegion('geographic_region_red_sea').GetName]沿岸所有地区拥有主权。"
 mgrbfm_broker_colonization_name: "寻求与[GetCulture('bedouin').GetName]人的协议"
 mgrbfm_broker_colonization_desc: "西部沙漠由复杂的部落关系网治理，这些关系往往凌驾于国家权威之上。穆罕默德·阿里在过去已被证明是处理这些部落制度的大师，许多顾问敦促他利用这一点来彻底平定我们的西部边境。"
 mgrbfm_repair_nilometers_name: "修复尼罗尺"
 mgrbfm_repair_nilometers_desc: "尽管数千年来尼罗尺的运作模式略显粗放，但它对于监测洪水强度和计算农业收成而言至关重要。如今，这些测量设施的荒废正动摇着国家的根基。"
