 notification_mgrbfm_floods_mitigated_name: "[GetGeographicRegion('geographic_region_lower_nile').GetName]洪水已得到控制。"
 notification_mgrbfm_floods_mitigated_desc: "在阿斯旺监测到读数上升后，预计将发生强于往年的年度洪水。两周后情况已明朗，现有的防洪系统足以避免灾情。"
