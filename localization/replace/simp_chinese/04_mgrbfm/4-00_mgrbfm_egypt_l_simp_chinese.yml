 je_mgrbfm_egypt_modernization: "新埃及的曙光"
 je_mgrbfm_egypt_modernization_reason: "自从[GetCulture('french').GetName]人被赶出[ROOT.GetCountry.GetName]后，我国便在现代化与工业化的道路上奋起直追。考虑到欧洲殖民者的威胁以及奥斯曼帝国的崩溃现状，埃及必须拥有独立支撑局势的能力。$gbbf_linebreak_normal$#bold 现代化事业#!进度已达到#v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#!。预计下月将变动#tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_modernization_breakdown [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_progress_var').GetValue|+=]#!$gbbf_linebreak_normal$$je_mgrbfm_egypt_modernization_factors$"
 je_mgrbfm_egypt_modernization_breakdown: "[Country.MakeScope.GetScriptValueDesc('mgrbfm_egypt_modernization_progress_value')]"
 je_mgrbfm_egypt_modernization_complete: "#bold 现代化事业#!进度已达到#v 100#!#bold 或更高#!（当前为#v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#!）"
 je_mgrbfm_egypt_modernization_factors: "以下因素会影响#bold 现代化事业#!进度条的变动\n•[ROOT.GetCountry.GetNameNoFlag]的[concept_prestige]\n•[ROOT.GetCountry.GetNameNoFlag]的平均[concept_literacy]\n•[concept_institution]$gbbf_investment_levels$总数量\n•[ROOT.GetCountry.GetNameNoFlag]是[concept_unrecognized_power]\n•[GetBuildingType('gbbf_building_nile_barrage').GetName]的$gbbf_buildings$数量\n•[GetCulture('misri').GetName][concept_homeland]修筑有[GetBuildingType('building_railway').GetName]$gbbf_states$的数量\n•$gbbf_country_monopolies$的总数量\n•[ROOT.GetCountry.GetNameNoFlag][GetCulture('misri').GetName][concept_homeland]$gbbf_states$的[concept_urbanization]程度\n•[ROOT.GetCountry.GetNameNoFlag][GetCulture('misri').GetName][concept_homeland]$gbbf_states$的平均$gbbf_radicalism$\n•[ROOT.GetCountry.GetNameNoFlag]平均[concept_sol]与平均[concept_expected_sol]对比之差"
 je_mgrbfm_egypt_nile_river: "驯服尼罗河"
 je_mgrbfm_egypt_nile_river_reason: "自史前时代起，[concept_nile_floods]便岁岁如期而至；数千年来，无数次试图掌控这股狂暴洪流的努力均以失败告终。穆罕默德·阿里热衷于利用埃及新兴的工业力量，已宣布以农业与稳定之名，再次尝试驯服这条伟大的“黑河”。[JournalEntry.GetCustom('mgrbfm_nile_flood_status_type')]"
 je_mgrbfm_egypt_nile_river_complete_status_1: "尼罗河控制不力（[GetGlobalVariable('je_mgrbfm_egypt_nile_river').Var('mgrbfm_nile_control_var').GetValue]/5）"
 je_mgrbfm_egypt_nile_river_complete_status_2: "尼罗河部分受控（[GetGlobalVariable('je_mgrbfm_egypt_nile_river').Var('mgrbfm_nile_control_var').GetValue]/5）"
 je_mgrbfm_egypt_nile_river_complete_status_3: "尼罗河大致受控（[GetGlobalVariable('je_mgrbfm_egypt_nile_river').Var('mgrbfm_nile_control_var').GetValue]/5）"
 je_mgrbfm_egypt_nile_river_information: "\n\n@information!只要[GetGeographicRegion('geographic_region_lower_nile').GetName]没有得到有效治理，我们的$gbbf_state_regions$将永远笼罩在[GetHarvestConditionType('flood').GetName][concept_harvest_condition]的阴影之下。"
 je_mgrbfm_egypt_nile_river_flood_warning: "\n\n@warning![GetGeographicRegion('geographic_region_lower_nile').GetName]地区当前正面临洪灾，受灾中心位于[GetGlobalVariable('je_mgrbfm_egypt_nile_river').Var('mgrbfm_flood_epicenter_var').GetStateRegion.GetName]。目前的洪灾烈度级别已达#bold [JournalEntry.MakeScope.Var('mgrbfm_flood_epicenter_area').GetHarvestConditionArea.GetIntensity]#!。"
 je_mgrbfm_egypt_nile_river_drought_warning: "\n\n@warning![GetGeographicRegion('geographic_region_lower_nile').GetName]遭遇了罕见的洪水缺位。目前的旱灾烈度级别已达#bold [JournalEntry.MakeScope.Var('mgrbfm_flood_epicenter_area').GetHarvestConditionArea.GetIntensity]#!。"
 je_mgrbfm_egypt_nationalism: "埃及民族主义"
 je_mgrbfm_egypt_nationalism_reason: "$je_mgrbfm_egypt_nationalism_flavor$$gbbf_linebreak_normal$$je_mgrbfm_egypt_nationalism_details$"
 je_mgrbfm_egypt_nationalism_flavor: "尽管尼罗河文明源远流长，其子民却始终缺乏一种共有的凝聚力。如今，在欧洲民族主义的影响下，各界名流与知识分子们正针锋相对，试图定义究竟什么才是埃及国家的$mgrbfm_national_identity$。"
 je_mgrbfm_egypt_nationalism_details: "#white •[GetCulture('misri').GetName]$mgrbfm_identity$拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_misri_breakdown [JournalEntry.MakeScope.Var('mgrbfm_misri_identity_var').GetValue]#!来自#bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_misri_factors')] 其因素#!#!#!的支持。\n•[GetCulture('arab').GetName]$mgrbfm_identity$拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_arab_breakdown [JournalEntry.MakeScope.Var('mgrbfm_arab_identity_var').GetValue]#!来自#bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_arab_factors')] 其因素#!#!#!的支持。•[GetCulture('misri').GetName]-[GetCulture('coptic').GetName]$mgrbfm_identity$拥有#tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_copt_breakdown [JournalEntry.MakeScope.Var('mgrbfm_copt_identity_var').GetValue]#!来自#bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_copt_factors')] 其因素#!#!#!的支持[GetPlayer.GetCustom('mgrbfm_artifact_contribution_type')]。"
