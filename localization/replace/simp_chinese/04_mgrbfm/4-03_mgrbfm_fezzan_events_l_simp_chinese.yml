l_simp_chinese:
 mgrbfm_fezzan.001.t: "锦禽之国"
 mgrbfm_fezzan.001.d: "[ROOT.GetCountry.GetName]的土地崎岖而荒凉。境内大多由逐水草而居的[GetCulture('bedouin').GetName]部落所占据，几乎不存在任何类似于中央集权的统治架构。"
 mgrbfm_fezzan.001.f: "[ROOT.GetCountry.GetNameNoFlag]曾是地区贸易中不可或缺的枢纽，让商品与思想得以跨越原本难以逾越的撒哈拉天险。凭借着对沙漠地形的深刻洞察，各部落领袖长期以来一直通过过往贸易攫取财富。然而，随着$turkfm_tanzimat$改革的阴云逼近，这片土地的旧秩序或许正走向终结。"
 mgrbfm_fezzan.001.a: "[ROOT.GetCountry.GetName]必须找到属于自己的出路。"
 mgrbfm_fezzan.001.tt: "#red #bold #italic [ROOT.GetCountry.GetNameNoFlag]正在与[SCOPE.sCountry('tripolitania_scope').GetNameNoFlag]进行[concept_war]！#!#!#!"
 mgrbfm_fezzan.002.t: "掌控[GetStateRegion('STATE_LIBYAN_DESERT').GetName]"
 mgrbfm_fezzan.002.d: "尽管苏丹的爪牙们费尽心机，[ROOT.GetCountry.GetName]依然屹立不倒。然而，这并未能减轻[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的忧虑——在他眼中，随着各大强权竞相角逐对[GetStrategicRegion('region_north_africa').GetName]的支配权，来自欧罗巴与亚细亚的双重威胁已然近在咫尺。"
 mgrbfm_fezzan.002.f: "“希拉里人阿布·扎伊德若连自家的田地都不肯耕耘，又怎会怜悯他方的沃土沦为荒漠？”——利比亚谚语"
 mgrbfm_fezzan.002.a: "我们必须稳固边疆。"
 mgrbfm_fezzan.009.t: "费赞人的国家"
 mgrbfm_fezzan.009.d: "[ROOT.GetCountry.GetName]已成功稳固了疆域，足以抵御外敌的染指。如今，费赞人的国家终于能够放眼世界，在工业时代的洪流中谋求一席之地。"
 mgrbfm_fezzan.009.f: "“你那些前任们的政策，从未想过要改良我们这片土地的生计，亦非为了捍卫先知穆罕默德的信仰；他们唯一的目的，不过是从我们身上搜刮贡赋罢了。”——古玛，内山起义领袖"
 mgrbfm_fezzan.009.a: "[ROOT.GetCountry.GetName]将誓死捍卫其未来。"