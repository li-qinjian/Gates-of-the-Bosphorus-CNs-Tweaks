l_simp_chinese:
 mgrbfm_tunis.001.t: "在海与沙之间"
 mgrbfm_tunis.001.d: "千百年来，[ROOT.GetCountry.GetName]始终是连接地中海碧波与撒哈拉黄沙的关键纽带。然而，随着$FRA_ADJ$的势力从西面步步蚕食，奥斯曼的影响自东面不断渗透，[ROOT.GetCountry.GetRuler.GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]发现自己正深陷重围，必须竭力抵御外强的干涉。"
 mgrbfm_tunis.001.f: "从布匿、罗马、希腊，到阿拉伯，乃至如今的土耳其宗主，[ROOT.GetCountry.GetNameNoFormatting]的子民在更迭不休的统治下坚韧地繁衍至今。然而，随着$FRA_ADJ$帝国的崛起，一个外族统治的新时代正威胁着这片土地，阴云已然笼罩。"
 mgrbfm_tunis.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 mgrbfm_tunis.002.t: "野心勃勃的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
 mgrbfm_tunis.002.d: "令朝野上下深感震惊的是，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]被发现于其寝宫中溘然长逝，死因为自然死亡。其子[SCOPE.sCharacter('turkfm_ahmad_scope').GetFullName]虽然缺乏从政经验，却受过极高水平的教育；他现已被从海外召回，以继承[ROOT.GetCountry.GetName]的最高治权。"
 mgrbfm_tunis.002.f: "尽管尚欠历练，这位年轻的君主早已深受西方发展成就的震撼，心中满怀实现突尼斯现代化的宏图大志。凭借远赴重洋求得的西式教育，他果断宣告：一个变革的时代就此开启。"
 mgrbfm_tunis.002.a: "为了[ROOT.GetCountry.GetName]，前进！"
 mgrbfm_tunis.003.t: "盛大的招待会"
 mgrbfm_tunis.003.d: "历经数日极尽奢华且隆重的外交典礼，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]对[SCOPE.sCountry('france_scope').GetName]的访问取得了圆满成功。在[SCOPE.sCountry('france_scope').GetCapital.GetCityHubName]受到东道主的悉心招待后，[ROOT.GetCountry.GetRuler.GetFirstName]带着对西方发展成就的深深敬畏与由衷赞叹回到了[ROOT.GetCountry.GetName]。如今，他已成竹在胸，誓要将这股文明启蒙的星火引向[ROOT.GetCountry.GetAdjectiveNoFormatting]人民。"
 mgrbfm_tunis.003.f: "[SCOPE.sCountry('france_scope').GetAdjectiveNoFormatting][SCOPE.sCountry('france_scope').GetRuler.GetPrimaryRoleTitle]以符合主权国家地位的最高礼遇接待了[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。此举极有可能引发$turkfm_porte$的强烈抗议。"
 mgrbfm_tunis.003.a: "[ROOT.GetCountry.GetName]绝不再甘于落后。"
 mgrbfm_tunis.008.t: "停滞不前的国家"
 mgrbfm_tunis.008.d: "尽管在改革与现代化的道路上多有尝试，但残酷的现实已然明了：[ROOT.GetCountry.GetName]终究无法实现那远大的抱负，更无力与西方的强权并驾齐驱。"
 mgrbfm_tunis.008.f: "尽管激进改革的尝试已告失败，但朝堂之上仍有许多人对维新理想念念不忘，不愿弃绝。"
 mgrbfm_tunis.008.a: "[ROOT.GetCountry.GetNameNoFormatting]注定要停滞不前吗？"
 mgrbfm_tunis.008.b: "我们绝不会放弃自己的抱负。"
 mgrbfm_tunis.009.t: "《突尼斯基本法》"
 mgrbfm_tunis.009.d: "历经一生的励精图治，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]亲手将[ROOT.GetCountry.GetName]从一盘散沙的原始状态，提振为一个真正具备现代体制的国家。"
 mgrbfm_tunis.009.f: "“我等不仅以自身之名，更以我等全体继任者之名郑重承诺：凡未曾宣誓遵守这些自由体制者，皆不得承袭大统。我等在此，于真主之神鉴下，向由列强之代表及我朝高级官员所组成的显赫集会严正起誓。”——1857年《突尼斯基本法》"
 mgrbfm_tunis.009.a: "这是[ROOT.GetCountry.GetName]值得铭记的一天！"