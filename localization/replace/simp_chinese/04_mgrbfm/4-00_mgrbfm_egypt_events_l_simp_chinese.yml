 mgrbfm_egypt.101.d: ""
 mgrbfm_egypt.101.f: ""
 mgrbfm_egypt.101.a: ""
 mgrbfm_egypt.101.b: ""
 mgrbfm_egypt.110.t: "洪水冲击[GetGeographicRegion('geographic_region_lower_nile').GetName]！"
 mgrbfm_egypt.110.d1: "来自上游的季节性降水径流已汇入干流，开启了[GetGeographicRegion('geographic_region_lower_nile').GetName]一年一度的汛期。然而，今年异常剧烈的降雨导致[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]爆发了大规模的失控洪灾。"
 mgrbfm_egypt.110.d2: "来自上游的季节性降水径流已汇入干流，开启了[GetGeographicRegion('geographic_region_lower_nile').GetName]一年一度的汛期。由于今年降雨异常剧烈，[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]遭遇了洪灾，但在现有的防灾措施下，灾情已得到了部分缓解。"
 mgrbfm_egypt.110.d3: "来自上游的季节性降水径流已汇入干流，开启了[GetGeographicRegion('geographic_region_lower_nile').GetName]一年一度的汛期。尽管今年[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]的降雨异常剧烈，但依靠[GetBuildingType('gbbf_building_nile_barrage').GetName]系统的调节，所有洪峰均已被彻底拦截与化解。"
 mgrbfm_egypt.110.f: "从阿斯旺附近的尼罗河河湾到开罗河岸，洪水如波浪般顺流而下。水位计显示，洪峰从阿斯旺抵达三角洲仅需九至十一天。一旦监测到异常洪水，留给后方加固堤坝的时间便已所剩无几。"
 mgrbfm_egypt.110.a: "警告$ig_mgrbfm_fellahin$们！"
 mgrbfm_egypt.110.b: "能保住一部分已是不幸中的万幸……"
 mgrbfm_egypt.110.c: "这真是大好消息。"
 mgrbfm_egypt.111.t: "[GetGeographicRegion('geographic_region_lower_nile').GetName]洪水失位！"
 mgrbfm_egypt.111.d1: "在[GetGeographicRegion('geographic_region_lower_nile').GetName]本该开启的汛期里，来自上游的季节性降水径流未能如期而至。失去了洪水的滋养，整个尼罗河流域都将遭受[GetHarvestConditionType('drought').GetName]的无情肆虐。"
 mgrbfm_egypt.111.d2: "在[GetGeographicRegion('geographic_region_lower_nile').GetName]本该开启的汛期里，来自上游的季节性降水径流未能如期而至。面对随之而来的[GetHarvestConditionType('drought').GetName]，各地政府已开始利用[GetBuildingType('gbbf_building_nile_barrage').GetName]系统进行有限的排灌，以缓解旱情。"
 mgrbfm_egypt.111.d3: "在[GetGeographicRegion('geographic_region_lower_nile').GetName]本该开启的汛期里，来自上游的季节性降水径流未能如期而至。然而，得益于[GetBuildingType('gbbf_building_nile_barrage').GetName]系统的卓越效能，各地农户的灌溉用水依然充沛，并未受到旱情的丝毫影响。"
 mgrbfm_egypt.111.f: "从阿斯旺附近的尼罗河河湾到开罗河岸，洪水如波浪般顺流而下。水位计显示，洪峰从阿斯旺抵达三角洲仅需九至十一天。一旦监测到异常洪水，留给后方加固堤坝的时间便已所剩无几。"
 mgrbfm_egypt.111.a: "这必将影响今秋的收成。"
 mgrbfm_egypt.111.b: "能保住一部分已是不幸中的万幸……"
 mgrbfm_egypt.111.c: "这正是我们未雨绸缪的原因。"
 mgrbfm_egypt.112.t: "[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]的尼罗尺已损毁"
 mgrbfm_egypt.112.d: "汹涌的尼罗河洪水摧毁了[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]的河岸。随后的视察显示，今年的洪水不仅冲刷了地基，更使位于[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetCityHubName]的尼罗河尺几近坍塌。"
 mgrbfm_egypt.112.f: "工程师们在黎明时尽职地报到工作以检查尼罗河尺刻度，却只发现原本矗立着尼罗河尺建筑群的地方现在是一堆坍塌的砖石。"
 mgrbfm_egypt.112.a: "我们必须进行修复。"
 mgrbfm_egypt.113.t: "[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]的铁路已受损"
 mgrbfm_egypt.113.d: "[SCOPE.sState('mgrbfm_nile_flood_state_scope').GetName]的几处堤坝已经破裂，使得尼罗河的洪水在漫滩上肆意蔓延。工程师们报告称，[GetBuildingType('building_railway').GetName]的关键路段已被部分淹没并发生位移。"
 mgrbfm_egypt.113.f: "铁路损毁并不严重，但目前仍被积水淹没。需待洪水退去后，方能开展轨道复位与线路校准工作。"
 mgrbfm_egypt.113.a: "可惜了，火车终究没法在水里开。"
 mgrbfm_egypt.200.t: "埃及帝国"
 mgrbfm_egypt.200.d: "[GetGeographicRegion('geographic_region_levant').GetName]长期以来一直处于埃及的影响范围之内。随着[GetTechnology('nationalism').GetName]狂热思想的渗入，政界领袖们纷纷叫嚣，要求重返那个由埃及主导的时代。"
 mgrbfm_egypt.200.f: "“这面战旗不仅象征着我们的胜利与荣耀，更是我们生命与信仰的寄托。只要尔等胸中尚存一息，便绝不可令其蒙尘倒下！倘若旗帜当真坠地——愿真主垂怜——那尔等便应以身许国，令其坠落之处，成为尔等埋骨之所。”——默罕默德·阿里，于新式军团阅兵式上的演说。"
 mgrbfm_egypt.200.a: "[ROOT.GetCountry.GetName]将锻造一个全新的帝国！"
 mgrbfm_egypt.200.b: "这种徒劳的尝试毫无意义。"
 mgrbfm_egypt.201.t: "从尼罗河到欧朗提斯河"
 mgrbfm_egypt.201.d: "随着疆域从肥沃的尼罗河谷一直延伸至美索不达米亚的边缘，埃及帝国的回归已是不争的事实。"
 mgrbfm_egypt.201.f: "“战争的胜负，固然离不开对真主的虔诚信仰与托付，但若无人类竭尽所能的奋战，胜利亦是空中楼阁。真主在圣经中昭示我们要勇于直面劲敌，倾其所有以求克敌制胜。但这并非盲目的狂热——唯有那些深谙战争艺术、精通兵法之道的统帅，方能真正践行神圣的旨意。”——$Muhammad_Ali$对纳吉布·埃芬迪的教诲，1827年。"
 mgrbfm_egypt.201.a: "[ROOT.GetCountry.GetName]的前程一片大好！"
 mgrbfm_egypt.202.t: "统一阿拉伯"
 mgrbfm_egypt.202.d: ""
 mgrbfm_egypt.202.f: ""
 mgrbfm_egypt.202.a: "[ROOT.GetCountry.GetName]将重新统一哈里发国。"
 mgrbfm_egypt.202.b: "这种徒劳的尝试毫无意义。"
 mgrbfm_egypt.210.t: "掌控苏丹"
 mgrbfm_egypt.210.d: ""
 mgrbfm_egypt.210.f: "“对于能为我军效命的奴隶，其价值实则比珠宝还要珍贵……为此，我现敕令你前去征集五千名精壮奴隶。”——$Muhammad_Ali$致其子$Ismail$，1818年"
