l_simp_chinese:
 mgrbfm_egypt.001.t: "要做赫迪夫的人"
 mgrbfm_egypt.001.d: "[ROOT.GetCountry.GetName]曾坐拥宏伟版图，却因[SCOPE.sCountry('ottoman_scope').GetName]的衰落而蒙尘。通过强化军事与推进工业化，[ROOT.GetCountry.GetRuler.GetFullName]——那个被称为“老蜘蛛”的人——巩固了身为[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权力。他现在决心挑战[SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName]的统治，谋求对[ROOT.GetCountry.GetNameNoFormatting]的世袭统治权。"
 mgrbfm_egypt.001.f: "“我们在那老蜘蛛的巢穴中拜访了他……他并未对麾下的臣民吐露半个字，但我观察到，他那对敏锐且狡黠的眸子正逐一审视着每一个人。屋内的光线尚不足以进行细致的观察，但我完全认同前任旅行者的说法：他的眼神表达极其生动。至于其余部分……任何试图描绘或构想他面容的念头，都是荒谬无益的。”——林赛勋爵，关于穆罕默德帕夏，1836年12月。"
 mgrbfm_egypt.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 mgrbfm_egypt.002.t: "阴云笼罩老蜘蛛"
 mgrbfm_egypt.002.d: "[ROOT.GetCountry.GetRuler.GetFirstName]向来有着一种奇特的偏执。然而，随着年事渐高，这位[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]变得愈发离群索居、行踪诡秘，他已开始逐渐丧失对国家的掌控。"
 mgrbfm_egypt.002.f: "[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]宫廷中的许多人都察觉到，他的注意力已开始涣散，而他的情绪也变得愈发反复无常。"
 mgrbfm_egypt.002.a: "悲剧性的境遇。"
 mgrbfm_egypt.003.t: "蜘蛛不再爬行"
 mgrbfm_egypt.003.d: "在经历多年被衰老与多疑折磨的岁月后，人们发现[ROOT.GetCountry.GetRuler.GetFirstName]已在其寝宫中驾崩。随后，一场简短的纪念仪式在[ROOT.GetCountry.GetCapital.GetCityHubName]举行。现在，[ROOT.GetCountry.GetHeir.GetFirstName]将接掌政权，统治[ROOT.GetCountry.GetName]。"
 mgrbfm_egypt.003.f1: "“……葬礼仪式极其简陋，甚至显得寒碜至极；领事馆未曾受邀，市井商铺与官署衙门亦照常运作，未见哀悼之意。坊间流传着一种普遍的论调：阿巴斯帕夏不仅任由其功勋卓著的祖父在如此草率的葬礼中入土，甚至拒绝亲临祭奠。这种对先辈遗泽的公然轻慢，实在是令人齿冷。”——英国领事，约翰·默里"
 mgrbfm_egypt.003.f2: "“……埃及各界志士百姓对穆罕默德·阿里其名的感念与尊崇，远比其继任者所能操办的任何葬礼都要隆重。老一辈尚在念叨着是他将这片土地从军阀混战与无政府的泥淖中拯救出来；而年轻人则在对比——一方是昔日如火如荼的铁腕励精图治，另一方则是如今昏庸反复、朝令夕改的继任政府。无论是土耳其裔还是阿拉伯裔，各阶层皆深以为然，甚至直言不讳：埃及的国运与繁荣，已随穆罕默德·阿里一同入土了。”——英国领事，约翰·默里"
 mgrbfm_egypt.003.a: "愿他于平静中安息。"
 mgrbfm_egypt.004.t: "噬骨之疾"
 mgrbfm_egypt.004.d: "在显露病兆之后，[SCOPE.sCharacter('mgrbfm_heir_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('mgrbfm_heir_scope').GetFirstName]已被确诊患有#bold 肺结核#!。尽管深受病痛折磨，他依然矢志不渝地致力于实现其父的理想——建立一个独立的埃及。"
 mgrbfm_egypt.004.f: "“我并非土耳其人。我尚在孩提之时便已来到埃及，从那时起，埃及的烈日便重塑了我的血脉，使我成为了一名纯粹的阿拉伯人。”——易卜拉欣帕夏"
 mgrbfm_egypt.004.a: "他的命数已尽……"
 mgrbfm_egypt.005.t: "虐政之终"
 mgrbfm_egypt.005.d: "[ROOT.GetCountry.GetRuler.GetFullName]已被发现死于其寝宫之内。当卫兵闯入时，两名奴隶正伫立在尸体旁，手中仍握着行凶的器物。两人对这桩弑主叛逆的暴行供认不讳，随即被府邸卫队投入大牢。随着这位统治者的暴毙，[ROOT.GetCountry.GetName]的权柄现已移交给[ROOT.GetCountry.GetHeir.GetFirstName]。"
 mgrbfm_egypt.005.f: "鉴于这位已故[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]生前那冷酷且傲慢的本性，其身边近臣很快便得出结论：正是他平日里那肆无忌惮的暴虐行径，最终为自己招致了这场杀身之祸。"
 mgrbfm_egypt.005.a: "速传[ROOT.GetCountry.GetHeir.GetFirstNameNoFormatting][ROOT.GetCountry.GetHeir.GetPrimaryRoleTitle]入宫！"
 mgrbfm_egypt.008.t: "老蛛残梦"
 mgrbfm_egypt.008.d: "随着$Muhammad_Ali$与$Ibrahim$相继辞世，$al-Alawi$王朝那曾令人畏惧的扩张势头已显颓势。在世人眼中，[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]似乎缺乏其先祖那种推行宏伟蓝图的坚毅果决。"
 mgrbfm_egypt.008.f: "世人皆认为[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]贪图享乐且为人残忍。倘若国家失去了有力的舵手，国家势必会沦为某个列强的附庸。"
 mgrbfm_egypt.008.a: "[ROOT.GetCountry.GetGovernment.GetName]必须保持强硬立场。"
 mgrbfm_egypt.009.t: "$al-_Alawi$家族的领地"
 mgrbfm_egypt.009.d: "通过权谋与武力的双重结合，#bold $al-_Alawi$#!王朝已确立了[ROOT.GetCountry.GetNameNoFlag]作为东方新兴强国的地位。随着$turkfm_porte$的屈服，[ROOT.GetCountry.GetAdjectiveNoFormatting]终于得以挣脱枷锁，自由地开创属于自己的未来。"
 mgrbfm_egypt.009.f: "“苏丹陛下圣谕：兹授予穆罕默德·阿里及其直系子嗣埃及省之世袭治理权；并额外恩准，在穆罕默德·阿里生平之内，由其本人兼领阿卡帕夏衔，统辖圣约翰阿卡要塞，并代为管治叙利亚南部疆域……”——摘自1840年《伦敦公约》"
 mgrbfm_egypt.009.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]万岁！"
 mgrbfm_egypt.009.b: "[ROOT.GetCountry.GetName]将亲手书写自己的未来！"
 mgrbfm_egypt.010.t: "尼罗河上的工业时代"
 mgrbfm_egypt.010.d: "工业与蒸汽的嘶鸣响彻[ROOT.GetCountry.GetCapital.GetCityHubName]。透过宫廷的露台，[ROOT.GetCountry.GetRuler.GetFullName]亲眼见证了[ROOT.GetCountry.GetNameNoFlag]翻天覆地的现代化改革。那个曾任由列强宰割的[ROOT.GetCountry.GetAdjectiveNoFormatting]旧时代已一去不返。"
 mgrbfm_egypt.010.f: "“我的国家不再只是非洲的一员，我们现在也是欧洲的一部分。因此，摒弃往昔的陈腐旧制，采用一套更符合我们当前社会条件的全新体系，乃是顺理成章之事。”——伊斯梅尔帕夏，1879年。"
 mgrbfm_egypt.010.a: "未来将由[ROOT.GetCountry.GetAdjectiveNoFlag]来主宰！"
 mgrbfm_egypt.011.t: "工业停滞"
 mgrbfm_egypt.011.d: "尽管经过了整整一代人的励精图治，[ROOT.GetCountry.GetAdjectiveNoFlag]终究还是没能踏入工业化世界的大门。[ROOT.GetCountry.GetRuler.GetFullName]在宫殿的长廊内步履沉重，此时此刻，对[ROOT.GetCountry.GetNameNoFlag]未来的浓重阴云与深深焦虑，正紧紧笼罩在他的心头。"
 mgrbfm_egypt.011.f: "“当我初抵埃及时，此地实乃蛮荒之所，满目皆是未开化的混沌。即便时至今日，其野蛮本质亦未全消。但我仍寄希望于此番呕心沥血，能令其境况较之往昔稍有起色。不过，若你发现这些国度尚未具备欧洲那般盛行的文明开化，倒也不必大惊小怪。”——帕默斯顿勋爵致霍奇斯上校，1840年"
 mgrbfm_egypt.011.a: "难道，被殖民便是我们无法逃脱的宿命吗？"
 mgrbfm_egypt.100.t: "以埃及之名而生"
 mgrbfm_egypt.100.d: "在寻求自治的过程中，穆罕默德·阿里点燃了“埃及人”身份认同的星星之火。通过强制征兵和连年征战，埃及统治下的各族人民开始产生一种集体感，使他们从穆斯林世界的其他部分中脱颖而出。为了在西方的威胁下求生存，开罗领导层试图利用这一发展，将[ROOT.GetCountry.GetGovernment.GetName]进一步凝聚在一起。然而，唯一能让所有人达成共识的，却只有这样一个问题：\n\n#italic “埃及人”到底是什么？$gbbf_linebreak_normal$"
 mgrbfm_egypt.100.f: "“若我非埃及人，我定当祈愿自己成为埃及人。”——穆斯塔法·卡米勒"
 mgrbfm_egypt.100.a: "我们不仅仅是供人奴役的阿拉伯人。"
