l_simp_chinese:
 mgrbfm_libya.001.t: "帝国边陲"
 mgrbfm_libya.001.d: "[ROOT.GetCountry.GetName]与其说是一个国家，倒不如说更像是一处帝国的边陲前哨。数个世纪以来，这片地中海沿岸的土地始终只是域外帝国权力的延伸。从[GetStateRegion('STATE_TRIPOLI').GetName]与[GetStateRegion('STATE_LIBYA').GetName]滨海的城镇枢纽，到广袤荒凉的[GetStateRegion('STATE_LIBYAN_DESERT').GetName]，当地人的生活在历史的洪流中几乎一成不变，沉寂如初。"
 mgrbfm_libya.001.f: "随着近期重新整合入[ROOT.GetCountry.GetPowerBloc.GetName]，身处[GetStateRegion('STATE_EASTERN_THRACE').GetCityHubName]的[ROOT.GetCountry.GetOverlord.GetRuler.GetFirstName][ROOT.GetCountry.GetOverlord.GetRuler.GetPrimaryRoleTitle]已向[ROOT.GetCountry.GetRuler.GetFirstName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]下达敕令：务必在[ROOT.GetCountry.GetNameNoFlag]建立起集权且高效的行政管理体系。而当务之急，便是整肃由[SCOPE.sCountry('fezzan_scope').GetRuler.GetFullName][SCOPE.sCountry('fezzan_scope').GetRuler.GetPrimaryRoleTitle]统治的[SCOPE.sCountry('fezzan_scope').GetName]。"
 mgrbfm_libya.001.a: "[ROOT.GetCountry.GetName]必将寻得属于它的道路。"
 mgrbfm_libya.001.tt: "#red #bold #italic [ROOT.GetCountry.GetNameNoFlag]正在与[SCOPE.sCountry('fezzan_scope').GetNameNoFlag]进行[concept_war]！#!#!#!"
 mgrbfm_libya.002.t: "大漠集权"
 mgrbfm_libya.002.d: "随着与费赞武装冲突的平息，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的幕僚们便迫不及待地提醒他关于[ROOT.GetCountry.GetNameNoFlag]的既定目标：即确立[GetCulture('turkish').GetName]势力对广袤利比亚沙漠的绝对控制。面对沿海地带零星散布的[GetCulture('mashriqi').GetName]定居点，以及南方依旧离心离德的[GetCulture('bedouin').GetName]部落，要彻底稳固利比亚的疆土，前路依然任重道远。"
 mgrbfm_libya.002.f: "“希拉里人阿布·扎伊德若连自家的田地都不肯耕耘，又怎会怜悯他方的沃土沦为荒漠？”——利比亚谚语"
 mgrbfm_libya.002.a: "他们将成为忠诚的臣民。"
 mgrbfm_libya.009.t: "中央集权国家"
 mgrbfm_libya.009.d: "在一场经过周密筹备的典礼上，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]隆重宣布了对[ROOT.GetCountry.GetName]的政体重组，并正式确立了国家法律高于部落法度的至高地位。"
 mgrbfm_libya.009.f: "部落首领们已逐一宣誓效忠，向身处[ROOT.GetCountry.GetCapital.GetCityHubName]的中央政权俯首称臣。有了他们的归顺，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的意志将能够穿透层层热浪，直抵大漠深处。"
 mgrbfm_libya.009.a: "这是[ROOT.GetCountry.GetName]伟大的一天！"