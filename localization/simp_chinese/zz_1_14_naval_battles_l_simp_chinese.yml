l_simp_chinese:
 ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_PLURAL: "[Concept('concept_fleet', '$concept_fleets$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_SINGULAR: "[Concept('concept_fleet', '$concept_fleet$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_ENTRY: "[MILITARY_FORMATION.GetCountry.GetFlagTextIcon] [MILITARY_FORMATION.GetUnitIcon]#v [MILITARY_FORMATION.GetNumCombatUnits]#! [MILITARY_FORMATION.GetName]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_PLURAL: "[Concept('concept_military_formation', '$concept_military_formations$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_SINGULAR: "[Concept('concept_military_formation', '$concept_military_formation$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_PROTECT_NO_RAIDERS: "此处没有敌方[Concept('concept_fleet', '$concept_fleets$')]在执行[GetNavalMissionType('naval_mission_type_raid_supply').GetName]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_PROTECT_PASSING_BREAKDOWN: "#header 受保护的[Concept('concept_supply_ship', '$concept_supply_ships$')]#!\n#v $VALUE$#! 艘[SelectLocalization(EqualTo_int32('(int32)$VALUE$', '(int32)1'), 'concept_supply_ship', 'concept_supply_ships')]途经该[Concept('concept_sea_node', '$concept_sea_region$')]\n$TOOLTIP_DELIMITER$\n$BREAKDOWN$"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_PROTECT_RAIDERS: "#title #v $OPPOSING$#! 支敌方[SelectLocalization(EqualTo_int32('(int32)$OPPOSING$', '(int32)1'), 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_SINGULAR', 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_PLURAL')]在此执行[GetNavalMissionType('naval_mission_type_raid_supply').GetName]：#!#indent_newline:3 \n$OPPOSING_BREAKDOWN$#!"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_PROTECT_SUPPLIED_BREAKDOWN: "#header 受保护的[Concept('concept_military_formation', '$concept_military_formations$')]#!\n#v $VALUE$#! 支[SelectLocalization(EqualTo_int32('(int32)$VALUE$', '(int32)1'), 'concept_military_formation', 'concept_military_formations')]经由该[Concept('concept_sea_node', '$concept_sea_region$')]获得补给\n$TOOLTIP_DELIMITER$\n$BREAKDOWN$"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_ATTEMPTS_LINE: "#v $ATTEMPTS$#! 次/天，袭击$concept_supply_ships$（为#v $RAIDABLE$#! 个敌方[SelectLocalization(EqualTo_int32('(int32)$RAIDABLE$', '(int32)1'), 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_SINGULAR', 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_PLURAL')]运输补给）"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_ATTEMPTS_LINE_MULTI: "#v $ATTEMPTS$#! 次/天，由你的#v $FLEETS$#! 支$concept_fleets$各发起，袭击$concept_supply_ships$（为#v $RAIDABLE$#! 个敌方[SelectLocalization(EqualTo_int32('(int32)$RAIDABLE$', '(int32)1'), 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_SINGULAR', 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FORMATION_NOUN_PLURAL')]运输补给）"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_CHANCE_BREAKDOWN: "#header 触发一场[Concept('concept_naval_battle', '$concept_naval_battle$')]的几率#!\n#v $VALUE|%1$#! /天\n$TOOLTIP_DELIMITER$\n#title 计算方式如下：#!#indent_newline:3 \n$DETECTION_LINE$[ConcatIfNeitherEmpty('\n', '$COMMANDER_DETECTION$')]\n乘以 #v $VISIBILITY|v0$#! 的[Concept('concept_visibility', '$concept_visibility$')]/每艘敌方[Concept('concept_supply_ship', '$concept_supply_ship$')]，并按同行数量缩放\n#v $BASE_CHANCE|%3$#! 基础几率，#v $SCALING|%2$#! 额外几率/双方每多一艘$concept_ship$[ConcatIfNeitherEmpty('\n', '$COMMANDER_CHANCE$')]$EFFICIENCY_PART$\n$ATTEMPTS_LINE$#!"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_COMMANDER_CHANCE: "#v $VALUE|%=1$#! 的每次尝试几率来自[Character.GetPrimaryRoleTitle]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_COMMANDER_DETECTION: "#v $VALUE|0=$#! 来自[Character.GetPrimaryRoleTitle]的加成"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_DETECTION_LINE: "#v $VALUE|v0$#! 平均[Concept('concept_detection', '$concept_detection$')]/每[Concept('concept_ship', '$concept_ship$')]（在你的[Concept('concept_fleet', '$concept_fleet$')]中）"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_DETECTION_LINE_RANGE: "#v $MIN|v0$#! – #v $MAX|v0$#! 平均[Concept('concept_detection', '$concept_detection$')]/每[Concept('concept_ship', '$concept_ship$')]（你的[Concept('concept_fleet', '$concept_fleets$')]中）"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_EFFICIENCY_BREAKDOWN: "#header [concept_mission_efficiency]在[Concept('concept_presence', '$concept_presence$')]全满时#!\n一经建立即达 #v $VALUE|%0$#!\n$TOOLTIP_DELIMITER$\n#title 计算方式如下：#!#indent_newline:3 \n$BREAKDOWN$#!"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_EFFICIENCY_LINE: "#tooltippable #tooltip:[GetRawTextTooltipTag('$EFFICIENCY_DESC$')] #v $VALUE|%0$#!#!#! [Concept('concept_mission_efficiency', '$concept_mission_efficiency$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_EFFICIENCY_LINE_RANGE: "#v $MIN|%0$#! – #v $MAX|%0$#! [Concept('concept_mission_efficiency', '$concept_mission_efficiency$')]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_EFFICIENCY_PART: "\n按 #v $VALUE|%0$#! 的[concept_mission_efficiency]缩放"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_EFFICIENCY_PART_RANGE: "\n按 #v $MIN|%0$#! – #v $MAX|%0$#! 的[concept_mission_efficiency]缩放"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_HINT_SEA_REGIONS: "\n\n@information![concept_mission_efficiency]会分摊到 #v $SEA_REGIONS$#! 个$concept_sea_regions$（本次$concept_naval_mission_short$所辖）——分派的海域越少，效率越高。"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_NO_PROTECTORS: "此处没有敌方[Concept('concept_fleet', '$concept_fleets$')]在执行[GetNavalMissionType('naval_mission_type_protect_supply').GetName]"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_PASSING_BREAKDOWN: "#header 可袭击的[Concept('concept_supply_ship', '$concept_supply_ships$')]#!\n@supply! #v $VALUE$#! 艘敌方[SelectLocalization(EqualTo_int32('(int32)$VALUE$', '(int32)1'), 'concept_supply_ship', 'concept_supply_ships')]途经该[Concept('concept_sea_node', '$concept_sea_region$')]\n$TOOLTIP_DELIMITER$\n$BREAKDOWN$"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_PROTECTORS: "#title #v $OPPOSING$#! 支敌方[SelectLocalization(EqualTo_int32('(int32)$OPPOSING$', '(int32)1'), 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_SINGULAR', 'ADD_SEA_REGION_TOOLTIP_SUPPLY_FLEET_NOUN_PLURAL')]在此执行[GetNavalMissionType('naval_mission_type_protect_supply').GetName]：#!#indent_newline:3 \n$OPPOSING_BREAKDOWN$#!"
 ADD_SEA_REGION_TOOLTIP_SUPPLY_RAID_SUPPLIED_BREAKDOWN: "#header 敌方[Concept('concept_military_formation', '$concept_military_formations$')]#!\n#v $VALUE$#! 支[SelectLocalization(EqualTo_int32('(int32)$VALUE$', '(int32)1'), 'concept_military_formation', 'concept_military_formations')]经由[STATE_REGION.GetName]获得补给\n$TOOLTIP_DELIMITER$\n$BREAKDOWN$"
