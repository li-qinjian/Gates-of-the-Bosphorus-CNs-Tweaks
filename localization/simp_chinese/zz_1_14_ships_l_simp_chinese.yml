l_simp_chinese:
 CREW_STATUS_LIMITED_BY_OCCUPANCY: "\n@warning! #n 在更多$concept_ship_crew$抵达前，我们的[GetBuildingType('building_naval_administration').GetName][Concept('concept_building', '$concept_buildings$')]必须雇用更多[concept_workforce]#!\n每个职位输送的[Concept('concept_sailor', '$concept_sailors$')]不会超过该$concept_building$雇用的数量，因此增加雇用会提升那里的$concept_ship_crew$，直至每艘$SHIP_CONCEPT$都$concept_ship_crew_past$。"
 CREW_STATUS_NEEDS_PORT: "\n@information! 在港口之外无法补充$concept_ship_crew$"
 CREW_STATUS_NOT_ENOUGH_SAILORS: "\n@warning!#n [Concept('concept_sailor', '$concept_sailors$')]不足，无法让每一艘$SHIP_CONCEPT$都完全$concept_ship_crew_present$#!\n你可以建造更多[GetBuildingType('building_naval_administration').GetName][Concept('concept_building', '$concept_buildings$')]，或扩建现有建筑，来增加可用的$concept_sailors$。"
 CREW_STATUS_REPLENISHING: "\n@crew! 每周补充 #v $COUNT|D=$#! 名$concept_ship_crew$"
 FILLED_SHIP_ASSIGNMENTS_TOOLTIP: "#header $SHIP_ASSIGNMENTS$#!\n#v [Building.GetNumShipAssignmentsFilled|0]#! / #maximum [Building.GetNumShipAssignmentsMax|0]#! 已占用\n@crew! 每个职位提供 #v [Building.GetCrewPerShipAssignment]#! 名[SelectLocalization(EqualTo_int32(Building.GetCrewPerShipAssignment, '(int32)1'), 'SAILOR_CONCEPT', 'SAILORS_CONCEPT')]，按 #v [Building.GetEmploymentPercentage|%0]#! 的劳动力[concept_occupancy]计算\n$TOOLTIP_DELIMITER$\n每个职位都是一次[Concept('concept_ship_crew', '$concept_ship_crew_verb$')]，对应一艘$SHIP_CONCEPT$。已分配的$concept_ship$所得$concept_sailors$不会超过该[concept_building]当前的雇用人数，因此增加雇用会提高这里每艘$concept_ship$的$concept_ship_crew$，直至全部$concept_ship_crew_past$。"
